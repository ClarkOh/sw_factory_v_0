- key: SWF-5
  type: epic
  title: '[UC-05] 기준 구현과 결과를 대조한다'
  description: '**액터** 개발자

    **사전조건** 기준 구현(tools/usage_server.py)과 이 도구가 같은 원천에 접근할 수 있다

    **사후조건** 같은 원천·기간에 대한 두 구현의 집계 차이가 보고되었다


    **주 흐름**

    - 1. 개발자가 기간을 지정해 이 도구와 기준 구현의 집계 대조를 요청한다  `[RUN_COMPARISON]`

    - 2. 시스템이 같은 원천·기간에 대해 두 구현의 총 토큰·비용을 나란히 제시한다


    **대안/예외 흐름**

    - 2a. 두 결과가 다르면 시스템은 어느 항목(토큰 종류·모델·기간)이 얼마나 다른지 보고한다

    - 2b. 기준 구현을 실행할 수 없으면 시스템은 대조 불가와 그 이유를 보고한다


    **인수 조건**

    - 대조 출력에 두 구현 각각의 총 토큰·비용 값이 존재한다

    - 두 결과가 다를 때 차이 항목이 0건이 아닌 목록으로 보고된다

    - 기준 구현 실행 실패 시 종료가 대조 성공으로 표기되지 않는다'
