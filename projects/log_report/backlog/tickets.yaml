- key: SWF-4
  type: epic
  title: '[UC-04] 깨진 저장소를 원천에서 재구축한다'
  description: '**액터** 운영자

    **사전조건** 저장소 파일이 깨져 있거나 없다

    **사후조건** 저장소가 원천의 현재 내용으로부터 다시 지어졌고 원천 파일은 변경되지 않았다


    **주 흐름**

    - 1. 운영자가 저장소 재구축을 요청한다  `[REQUEST_REBUILD]`

    - 2. 시스템이 원시 보존 기한(8일)을 넘긴 과거는 복구할 수 없음을 운영자에게 명시적으로 알린다

    - 3. 시스템이 원천 파일 전체를 처음부터 읽어 저장소를 다시 짓는다

    - 4. 시스템이 재구축 결과(적재 건수)를 장부에 남긴다


    **대안/예외 흐름**

    - 3a. 원천 디렉터리가 없으면 시스템은 오류로 처리하지 않고 빈 저장소로 시작한다

    - 3b. 원천 파일 하나를 읽지 못하면 시스템은 그 파일과 실패 이유를 장부에 남기고 나머지 파일로 재구축을 계속한다


    **인수 조건**

    - 재구축 출력에 8일을 넘긴 과거는 복구할 수 없다는 안내 문구가 포함된다

    - 재구축 후 저장소의 레코드 집합이 현재 원천을 처음부터 수집한 결과와 동일하다

    - 재구축 전후 모든 원천 파일의 내용·개수가 바이트 단위로 동일하다

    - 원천 디렉터리가 없을 때 재구축이 종료 코드 0으로 끝나고 빈 저장소가 존재한다'
