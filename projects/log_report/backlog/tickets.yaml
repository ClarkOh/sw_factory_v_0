- key: SWF-1
  type: epic
  title: '[UC-01] 사용량 로그를 수집하여 저장소에 적재한다'
  description: '**액터** 스케줄러

    **사전조건** 저장소·읽기 위치 상태 파일이 존재하거나 첫 실행이다

    **사후조건** 새로 붙은 원천 줄이 분류·적재되고 수집 결과가 장부 한 줄로 남아 있으며 원천 파일은 변경되지 않았다


    **주 흐름**

    - 1. 스케줄러가 수집 실행을 요청한다  `[RUN_COLLECTION]`

    - 2. 시스템이 `~/.claude/projects/**/*.jsonl` 원천 파일을 나열한다

    - 3. 시스템이 파일마다 기억한 읽기 위치 이후에 새로 붙은 줄만 읽는다

    - 4. 시스템이 각 줄을 JSON 레코드 하나로 해석하여 채택(`type`=`assistant`이고 `message.usage`에 토큰 수
    있음)·중복(같은 `requestId` 재출현)·무효(파싱 불가 또는 토큰 수 전부 0/없음, 이유 기록)·무관(그 외)으로 분류한다

    - 5. 시스템이 채택 레코드에서 시각(UTC)·모델 이름·세션 id·입력·출력·캐시읽기·캐시쓰기(5분/1시간 구분) 토큰·웹검색 횟수를 추출하여
    원천과 별개 파일인 저장소에 적재한다

    - 6. 시스템이 읽은 줄 수·채택·중복·무효·무관·보존 삭제 건수를 적재 장부 한 줄로 남긴다


    **대안/예외 흐름**

    - 1a. 같은 원천 상태에서 스케줄러가 수집을 다시 요청하면 시스템은 레코드를 복제하지 않고 저장소를 동일 상태로 유지한 채 장부 한 줄만
    남긴다  `[RUN_COLLECTION]`

    - 2a. 원천 디렉터리가 없으면 시스템은 오류로 처리하지 않고 빈 저장소 상태로 장부 한 줄을 남기고 정상 종료한다

    - 3a. 파일 크기가 기억한 읽기 위치보다 줄어들었으면 시스템은 그 파일을 처음부터 다시 읽는다

    - 3b. 원천 파일 하나를 읽지 못하면 시스템은 그 파일 경로와 실패 이유를 장부에 남기고 나머지 파일로 수집을 계속한다


    **인수 조건**

    - 장부의 모든 줄에서 읽은 줄 수 = 채택 + 중복 + 무효 + 무관이 성립한다

    - 수집 전후 모든 원천 파일의 내용·개수가 바이트 단위로 동일하다

    - 같은 원천 상태에서 수집을 2회 연속 실행하면 저장소의 레코드 집합이 동일하다

    - 같은 `requestId`를 가진 레코드는 저장소에 정확히 1건만 존재한다

    - 무효로 센 레코드마다 비어 있지 않은 무효 이유가 기록되어 있다

    - 채택된 저장소 레코드마다 시각(UTC)·모델 이름·세션 id·입력·출력·캐시읽기·캐시쓰기(5분/1시간)·웹검색 횟수 필드가 존재한다

    - 파일이 원래 크기보다 작아진 뒤 수집하면 그 파일의 처음부터의 줄들이 다시 읽혀 분류에 반영된다

    - 읽기 실패한 파일이 있어도 수집이 비정상 종료하지 않고 장부에 실패 파일과 이유 항목이 존재한다

    - 원천 디렉터리가 없을 때 수집이 종료 코드 0으로 끝나고 저장소가 빈 상태로 존재한다'
