- key: SWF-3
  type: epic
  title: '[UC-03] 사용량 리포트를 생성한다'
  description: '**액터** 사용자

    **사전조건** 저장소와 일 요약이 존재한다(비어 있어도 된다)

    **사후조건** 요청한 기간의 리포트가 근거(마지막 적재 시각·레코드 수)와 함께 제시되었고 저장소는 변경되지 않았다


    **주 흐름**

    - 1. 사용자가 기간(세션 칸 5시간·하루 24시간·주간 7일 중 하나)을 지정해 리포트를 요청한다  `[REQUEST_REPORT]`

    - 2. 시스템이 기간이 원시 레코드 보존 범위(8일) 안이면 원시 레코드로, 벗어나면 일 요약으로 집계한다

    - 3. 시스템이 모델별 단가표로 비용을 계산한다

    - 4. 시스템이 칸별 합계와 총계가 일치함을 확인한 뒤 모델별 분해(토큰 종류별·비용), 최근 30일 일별 추이, 근거(마지막 적재 시각·레코드
    수)를 포함한 리포트를 제시한다


    **대안/예외 흐름**

    - 2a. 일 요약으로도 답할 수 없는 기간이 포함되면 시스템은 그 구간을 0이 아니라 값 없음으로 표시한다

    - 3a. 단가표에 없는 모델이 있으면 시스템은 단가표에서 가장 비싼 단가로 계산하고 그 사실을 리포트에 표시한다

    - 4a. 칸별 합계가 총계와 다르면 시스템은 리포트를 생성하지 않고 사용자에게 실패와 사유를 알린다


    **인수 조건**

    - 세션 칸(5시간)·하루(24시간)·주간(7일) 세 기간 각각에 대해 리포트 요청이 처리된다

    - 리포트의 총 토큰이 저장소의 해당 기간 레코드 합과 같다

    - 같은 저장소 상태에서 리포트를 두 번 생성하면 두 결과물이 동일하다

    - 리포트에 모델별 토큰 종류별·비용 분해와 최근 30일 일별 추이와 마지막 적재 시각·레코드 수가 존재한다

    - 단가표에 없는 모델이 기간에 포함되면 그 비용은 단가표 최고 단가로 계산되고 리포트에 해당 표시가 존재한다

    - 데이터로 답할 수 없는 구간의 값이 0이 아닌 값 없음으로 표기된다

    - 칸별 합계가 총계와 다른 리포트 산출물은 존재하지 않는다'
