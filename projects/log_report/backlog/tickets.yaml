- key: SWF-2
  type: epic
  title: '[UC-02] 보존 기한이 지난 데이터를 정리한다'
  description: '**액터** 스케줄러

    **사전조건** 저장소·일 요약·적재 장부·읽기 위치 상태 파일이 존재한다

    **사후조건** 모든 파일이 기간·크기 상한 안에 있고, 삭제된 데이터의 내용·건수는 일 요약과 장부에 반영되어 있다


    **주 흐름**

    - 1. 스케줄러가 수집 실행을 요청한다  `[RUN_COLLECTION]`

    - 2. 시스템이 8일을 넘긴 원시 레코드 중 그 날의 일 요약에 반영된 것만 삭제한다

    - 3. 시스템이 언제 몇 건을 지웠는지 적재 장부에 남긴다

    - 4. 시스템이 35일을 넘긴 일 요약과 장부 줄 중 건수(채택·중복·무효·무관·보존 삭제)가 그 날의 일 요약에 반영된 것만 지운다

    - 5. 시스템이 사라진 원천 파일의 읽기 위치 항목을 읽기 위치 상태에서 정리한다


    **대안/예외 흐름**

    - 2a. 기한을 넘겼으나 일 요약에 아직 반영되지 않은 원시 레코드가 있으면 시스템은 그 레코드를 삭제하지 않고 요약에 반영한 뒤에만 삭제한다

    - 4a. 기한을 넘겼으나 건수가 일 요약에 반영되지 않은 장부 줄이 있으면 시스템은 그 줄을 지우지 않고 유지한다


    **인수 조건**

    - 삭제된 모든 원시 레코드의 날짜에 대해 해당 날짜의 일 요약 행이 삭제 이전에 존재한다

    - 원시 레코드 삭제가 발생한 실행의 장부 줄에 삭제 시각과 삭제 건수가 기록되어 있다

    - 정리 후 원시 레코드의 최고 나이가 8일 + 실행 주기 이내이고, 일 요약·장부 줄의 최고 나이가 35일 + 실행 주기 이내이다

    - 저장소·일 요약·적재 장부·읽기 위치 상태 각 파일이 정의된 기간 또는 크기 상한을 넘지 않는다

    - 정리 후 읽기 위치 상태의 모든 파일 경로가 실제로 존재하는 원천 파일을 가리킨다

    - 일 요약에 반영되지 않은 레코드·장부 줄은 기한 경과 후에도 삭제되지 않고 남아 있다'
