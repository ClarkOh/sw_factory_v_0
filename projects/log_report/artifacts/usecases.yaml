usecases:
- id: UC-01
  title: 사용량 로그를 수집하여 저장소에 적재한다
  actor: 스케줄러
  precondition: 저장소·읽기 위치 상태 파일이 존재하거나 첫 실행이다
  postcondition: 새로 붙은 원천 줄이 분류·적재되고 수집 결과가 장부 한 줄로 남아 있으며 원천 파일은 변경되지 않았다
  main_flow:
  - step: 1. 스케줄러가 수집 실행을 요청한다
    event: RUN_COLLECTION
  - step: 2. 시스템이 `~/.claude/projects/**/*.jsonl` 원천 파일을 나열한다
  - step: 3. 시스템이 파일마다 기억한 읽기 위치 이후에 새로 붙은 줄만 읽는다
  - step: 4. 시스템이 각 줄을 JSON 레코드 하나로 해석하여 채택(`type`=`assistant`이고 `message.usage`에
      토큰 수 있음)·중복(같은 `requestId` 재출현)·무효(파싱 불가 또는 토큰 수 전부 0/없음, 이유 기록)·무관(그 외)으로 분류한다
  - step: 5. 시스템이 채택 레코드에서 시각(UTC)·모델 이름·세션 id·입력·출력·캐시읽기·캐시쓰기(5분/1시간 구분) 토큰·웹검색 횟수를
      추출하여 원천과 별개 파일인 저장소에 적재한다
  - step: 6. 시스템이 읽은 줄 수·채택·중복·무효·무관·보존 삭제 건수를 적재 장부 한 줄로 남긴다
  alt_flows:
  - step: 1a. 같은 원천 상태에서 스케줄러가 수집을 다시 요청하면 시스템은 레코드를 복제하지 않고 저장소를 동일 상태로 유지한 채 장부
      한 줄만 남긴다
    event: RUN_COLLECTION
  - step: 2a. 원천 디렉터리가 없으면 시스템은 오류로 처리하지 않고 빈 저장소 상태로 장부 한 줄을 남기고 정상 종료한다
  - step: 3a. 파일 크기가 기억한 읽기 위치보다 줄어들었으면 시스템은 그 파일을 처음부터 다시 읽는다
  - step: 3b. 원천 파일 하나를 읽지 못하면 시스템은 그 파일 경로와 실패 이유를 장부에 남기고 나머지 파일로 수집을 계속한다
  acceptance:
  - 장부의 모든 줄에서 읽은 줄 수 = 채택 + 중복 + 무효 + 무관이 성립한다
  - 수집 전후 모든 원천 파일의 내용·개수가 바이트 단위로 동일하다
  - 같은 원천 상태에서 수집을 2회 연속 실행하면 저장소의 레코드 집합이 동일하다
  - 같은 `requestId`를 가진 레코드는 저장소에 정확히 1건만 존재한다
  - 무효로 센 레코드마다 비어 있지 않은 무효 이유가 기록되어 있다
  - 채택된 저장소 레코드마다 시각(UTC)·모델 이름·세션 id·입력·출력·캐시읽기·캐시쓰기(5분/1시간)·웹검색 횟수 필드가 존재한다
  - 파일이 원래 크기보다 작아진 뒤 수집하면 그 파일의 처음부터의 줄들이 다시 읽혀 분류에 반영된다
  - 읽기 실패한 파일이 있어도 수집이 비정상 종료하지 않고 장부에 실패 파일과 이유 항목이 존재한다
  - 원천 디렉터리가 없을 때 수집이 종료 코드 0으로 끝나고 저장소가 빈 상태로 존재한다
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-18
  - REQ-23
  - REQ-24
  - REQ-39
  - REQ-40
  - REQ-43
- id: UC-02
  title: 보존 기한이 지난 데이터를 정리한다
  actor: 스케줄러
  precondition: 저장소·일 요약·적재 장부·읽기 위치 상태 파일이 존재한다
  postcondition: 모든 파일이 기간·크기 상한 안에 있고, 삭제된 데이터의 내용·건수는 일 요약과 장부에 반영되어 있다
  main_flow:
  - step: 1. 스케줄러가 수집 실행을 요청한다
    event: RUN_COLLECTION
  - step: 2. 시스템이 8일을 넘긴 원시 레코드 중 그 날의 일 요약에 반영된 것만 삭제한다
  - step: 3. 시스템이 언제 몇 건을 지웠는지 적재 장부에 남긴다
  - step: 4. 시스템이 35일을 넘긴 일 요약과 장부 줄 중 건수(채택·중복·무효·무관·보존 삭제)가 그 날의 일 요약에 반영된 것만 지운다
  - step: 5. 시스템이 사라진 원천 파일의 읽기 위치 항목을 읽기 위치 상태에서 정리한다
  alt_flows:
  - step: 2a. 기한을 넘겼으나 일 요약에 아직 반영되지 않은 원시 레코드가 있으면 시스템은 그 레코드를 삭제하지 않고 요약에 반영한 뒤에만
      삭제한다
  - step: 4a. 기한을 넘겼으나 건수가 일 요약에 반영되지 않은 장부 줄이 있으면 시스템은 그 줄을 지우지 않고 유지한다
  acceptance:
  - 삭제된 모든 원시 레코드의 날짜에 대해 해당 날짜의 일 요약 행이 삭제 이전에 존재한다
  - 원시 레코드 삭제가 발생한 실행의 장부 줄에 삭제 시각과 삭제 건수가 기록되어 있다
  - 정리 후 원시 레코드의 최고 나이가 8일 + 실행 주기 이내이고, 일 요약·장부 줄의 최고 나이가 35일 + 실행 주기 이내이다
  - 저장소·일 요약·적재 장부·읽기 위치 상태 각 파일이 정의된 기간 또는 크기 상한을 넘지 않는다
  - 정리 후 읽기 위치 상태의 모든 파일 경로가 실제로 존재하는 원천 파일을 가리킨다
  - 일 요약에 반영되지 않은 레코드·장부 줄은 기한 경과 후에도 삭제되지 않고 남아 있다
  requirements:
  - REQ-19
  - REQ-20
  - REQ-21
  - REQ-22
  - REQ-25
  - REQ-26
  - REQ-27
  - REQ-28
- id: UC-03
  title: 사용량 리포트를 생성한다
  actor: 사용자
  precondition: 저장소와 일 요약이 존재한다(비어 있어도 된다)
  postcondition: 요청한 기간의 리포트가 근거(마지막 적재 시각·레코드 수)와 함께 제시되었고 저장소는 변경되지 않았다
  main_flow:
  - step: 1. 사용자가 기간(세션 칸 5시간·하루 24시간·주간 7일 중 하나)을 지정해 리포트를 요청한다
    event: REQUEST_REPORT
  - step: 2. 시스템이 기간이 원시 레코드 보존 범위(8일) 안이면 원시 레코드로, 벗어나면 일 요약으로 집계한다
  - step: 3. 시스템이 모델별 단가표로 비용을 계산한다
  - step: 4. 시스템이 칸별 합계와 총계가 일치함을 확인한 뒤 모델별 분해(토큰 종류별·비용), 최근 30일 일별 추이, 근거(마지막 적재
      시각·레코드 수)를 포함한 리포트를 제시한다
  alt_flows:
  - step: 2a. 일 요약으로도 답할 수 없는 기간이 포함되면 시스템은 그 구간을 0이 아니라 값 없음으로 표시한다
  - step: 3a. 단가표에 없는 모델이 있으면 시스템은 단가표에서 가장 비싼 단가로 계산하고 그 사실을 리포트에 표시한다
  - step: 4a. 칸별 합계가 총계와 다르면 시스템은 리포트를 생성하지 않고 사용자에게 실패와 사유를 알린다
  acceptance:
  - 세션 칸(5시간)·하루(24시간)·주간(7일) 세 기간 각각에 대해 리포트 요청이 처리된다
  - 리포트의 총 토큰이 저장소의 해당 기간 레코드 합과 같다
  - 같은 저장소 상태에서 리포트를 두 번 생성하면 두 결과물이 동일하다
  - 리포트에 모델별 토큰 종류별·비용 분해와 최근 30일 일별 추이와 마지막 적재 시각·레코드 수가 존재한다
  - 단가표에 없는 모델이 기간에 포함되면 그 비용은 단가표 최고 단가로 계산되고 리포트에 해당 표시가 존재한다
  - 데이터로 답할 수 없는 구간의 값이 0이 아닌 값 없음으로 표기된다
  - 칸별 합계가 총계와 다른 리포트 산출물은 존재하지 않는다
  requirements:
  - REQ-15
  - REQ-16
  - REQ-17
  - REQ-29
  - REQ-30
  - REQ-31
  - REQ-32
  - REQ-33
  - REQ-34
  - REQ-35
  - REQ-36
  - REQ-37
  - REQ-38
- id: UC-04
  title: 깨진 저장소를 원천에서 재구축한다
  actor: 운영자
  precondition: 저장소 파일이 깨져 있거나 없다
  postcondition: 저장소가 원천의 현재 내용으로부터 다시 지어졌고 원천 파일은 변경되지 않았다
  main_flow:
  - step: 1. 운영자가 저장소 재구축을 요청한다
    event: REQUEST_REBUILD
  - step: 2. 시스템이 원시 보존 기한(8일)을 넘긴 과거는 복구할 수 없음을 운영자에게 명시적으로 알린다
  - step: 3. 시스템이 원천 파일 전체를 처음부터 읽어 저장소를 다시 짓는다
  - step: 4. 시스템이 재구축 결과(적재 건수)를 장부에 남긴다
  alt_flows:
  - step: 3a. 원천 디렉터리가 없으면 시스템은 오류로 처리하지 않고 빈 저장소로 시작한다
  - step: 3b. 원천 파일 하나를 읽지 못하면 시스템은 그 파일과 실패 이유를 장부에 남기고 나머지 파일로 재구축을 계속한다
  acceptance:
  - 재구축 출력에 8일을 넘긴 과거는 복구할 수 없다는 안내 문구가 포함된다
  - 재구축 후 저장소의 레코드 집합이 현재 원천을 처음부터 수집한 결과와 동일하다
  - 재구축 전후 모든 원천 파일의 내용·개수가 바이트 단위로 동일하다
  - 원천 디렉터리가 없을 때 재구축이 종료 코드 0으로 끝나고 빈 저장소가 존재한다
  requirements:
  - REQ-03
  - REQ-39
  - REQ-40
  - REQ-41
  - REQ-42
  - REQ-43
- id: UC-05
  title: 기준 구현과 결과를 대조한다
  actor: 개발자
  precondition: 기준 구현(tools/usage_server.py)과 이 도구가 같은 원천에 접근할 수 있다
  postcondition: 같은 원천·기간에 대한 두 구현의 집계 차이가 보고되었다
  main_flow:
  - step: 1. 개발자가 기간을 지정해 이 도구와 기준 구현의 집계 대조를 요청한다
    event: RUN_COMPARISON
  - step: 2. 시스템이 같은 원천·기간에 대해 두 구현의 총 토큰·비용을 나란히 제시한다
  alt_flows:
  - step: 2a. 두 결과가 다르면 시스템은 어느 항목(토큰 종류·모델·기간)이 얼마나 다른지 보고한다
  - step: 2b. 기준 구현을 실행할 수 없으면 시스템은 대조 불가와 그 이유를 보고한다
  acceptance:
  - 대조 출력에 두 구현 각각의 총 토큰·비용 값이 존재한다
  - 두 결과가 다를 때 차이 항목이 0건이 아닌 목록으로 보고된다
  - 기준 구현 실행 실패 시 종료가 대조 성공으로 표기되지 않는다
  requirements:
  - REQ-44
