usecases:
- id: UC-01
  title: 로그 파일에서 기간별·서비스별 집계 리포트 생성
  actor: 운영자
  precondition: 텍스트 로그 파일이 최소 하나 존재하고 운영자가 그 경로를 알고 있다
  postcondition: 각 (기간, 서비스) 칸의 사건 수와 수준별 사건 수를 담은 표 형식 리포트가 요약과 함께 출력되어 있다
  main_flow:
  - step: 1. 운영자가 집계할 텍스트 로그 파일 경로를 도구에 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 지정된 파일을 한 줄씩 읽어 각 줄을 하나의 사건으로 해석한다.
  - step: 4. 시스템이 각 줄을 앞에서부터 시각, 수준, 서비스 이름, 메시지, 소요시간 순으로 파싱한다.
  - step: 5. 시스템이 유효한 사건을 (기간, 서비스) 칸으로 분류하고 칸마다 사건 수와 DEBUG/INFO/WARN/ERROR 수준별 사건
      수를 산출한다.
  - step: 6. 시스템이 대상 기간, 읽은 줄 수, 집계한 사건 수, 버린 줄 수, 서비스 수를 담은 요약을 리포트 최상단에 출력한다.
  - step: 7. 시스템이 사건이 하나 이상 있는 칸만 표 형식으로 출력한다.
  - step: 8. 운영자가 출력된 리포트를 확인한다.
  alt_flows:
  - step: 4a. 시각 필드가 UTC 기준 ISO 8601 형식이 아닌 경우 시스템은 그 줄을 집계에서 제외한다.
  - step: 4b. 수준 필드가 DEBUG, INFO, WARN, ERROR 중 하나가 아닌 경우 시스템은 그 줄을 집계에서 제외한다.
  - step: 4c. 필드가 공백 하나 이상으로 구분되지 않아 시각·수준·서비스 이름을 얻을 수 없는 경우 시스템은 그 줄을 집계에서 제외한다.
  - step: 4d. 메시지 필드 내부에 공백이 있는 경우 시스템은 그 공백을 필드 구분자로 보지 않고 하나의 메시지로 파싱한다.
  - step: 4e. 소요시간 필드가 없는 경우 시스템은 그 줄을 유효한 사건으로 인정하고 소요시간 없음으로 기록한다.
  - step: 4f. 소요시간 필드가 있으나 `ms` 접미사가 붙은 밀리초 단위 정수가 아닌 경우 시스템은 그 줄을 집계에서 제외한다.
  - step: 5a. 내용이 완전히 동일한 줄이 두 번 이상 나타난 경우 시스템은 중복 제거 없이 각각을 별개의 사건으로 계수한다.
  - step: 7a. 집계 가능한 사건이 하나도 없는 경우 시스템은 오류 없이 요약만 있는 빈 리포트를 출력한다.
  - step: 2a. 대상 기간의 산출 근거(입력 데이터에서 도출인지 운영자 지정인지)가 정의되지 않은 경우 시스템은 하나의 규칙을 문서화하고
      모든 실행에서 그 규칙을 동일하게 적용한다.
    event: RUN_REPORT
  acceptance:
  - 시각/수준/서비스 이름/메시지/소요시간 5개 필드를 공백 1개 이상으로 구분한 줄은 사건 1건으로 집계된다.
  - 필드 구분 공백이 2개 이상인 줄과 1개인 줄의 파싱 결과가 동일하다.
  - 메시지에 공백 n개가 포함된 줄에서 서비스 이름과 소요시간이 정확히 추출되고 메시지 전체가 하나의 값으로 파싱된다.
  - 수준이 DEBUG, INFO, WARN, ERROR 이외의 값인 줄은 집계 사건 수에 포함되지 않는다.
  - 소요시간 필드가 없는 줄이 해당 칸의 사건 수에 +1로 반영된다.
  - 동일 내용의 줄을 2회 입력하면 해당 칸의 사건 수가 2 증가한다.
  - 리포트의 모든 칸의 사건 수 합계 == 요약의 집계한 사건 수.
  - 각 칸에서 DEBUG 수 + INFO 수 + WARN 수 + ERROR 수 == 그 칸의 사건 수.
  - 집계 단위를 지정하지 않은 실행에서 기간 경계가 00:00:00Z 이상 다음 날 00:00:00Z 미만이다.
  - 23:59:59.999Z 사건은 해당일 칸에, 다음 날 00:00:00.000Z 사건은 다음 날 칸에 배치된다.
  - 사건 수가 0인 (기간, 서비스) 조합에 해당하는 행이 리포트에 존재하지 않는다.
  - 리포트 최상단에 대상 기간, 읽은 줄 수, 집계한 사건 수, 버린 줄 수, 서비스 수 5개 항목이 모두 존재한다.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-13
  - REQ-17
  - REQ-18
  - REQ-19
  - REQ-23
  - REQ-26
  - REQ-27
  - REQ-28
  - REQ-29
  - REQ-30
  - REQ-33
  - REQ-37
  - REQ-42
  - REQ-47
- id: UC-02
  title: 여러 입력 파일을 하나의 리포트로 집계
  actor: 운영자
  precondition: 두 개 이상의 텍스트 로그 파일이 존재한다
  postcondition: 여러 파일의 사건이 파일 경계와 무관하게 하나로 합쳐진 단일 리포트가 출력되어 있다
  main_flow:
  - step: 1. 운영자가 여러 개의 텍스트 로그 파일 경로를 도구에 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 지정된 모든 파일의 사건을 파일 구분 없이 동일한 (기간, 서비스) 칸으로 누적한다.
  - step: 4. 시스템이 단일 리포트를 출력한다.
  - step: 5. 운영자가 파일 나열 순서를 바꿔 다시 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 6. 시스템이 앞선 실행과 동일한 수치의 리포트를 출력한다.
  alt_flows:
  - step: 1a. 같은 파일을 두 번 지정한 경우 시스템은 그 파일의 사건을 두 번 계수한다.
    event: SPECIFY_INPUT_FILES
  - step: 3a. 어떤 파일에 유효한 사건이 하나도 없는 경우 시스템은 그 파일을 건너뛰고 나머지 파일로 집계를 계속한다.
  - step: 3b. 한 파일의 마지막 줄이 개행으로 끝나지 않은 경우 시스템은 그 줄을 다음 파일의 첫 줄과 이어붙이지 않고 독립된 사건으로
      해석한다.
  acceptance:
  - 파일 A와 B를 입력한 리포트의 모든 칸 수치가, A와 B를 이어붙인 단일 파일을 입력한 리포트의 수치와 일치한다.
  - 입력 순서 (A, B)로 만든 리포트와 (B, A)로 만든 리포트의 수치가 일치한다.
  - 리포트 어디에도 사건을 파일별로 나눈 수치가 존재하지 않는다.
  requirements:
  - REQ-02
  - REQ-14
  - REQ-15
- id: UC-03
  title: 집계 단위 지정
  actor: 운영자
  precondition: 집계 대상 로그 파일이 지정되어 있다
  postcondition: 지정한 시간/일/주 단위로 기간이 구분된 리포트가 출력되어 있거나, 잘못된 단위에 대한 오류가 알려져 있다
  main_flow:
  - step: 1. 운영자가 집계 단위로 시간, 일, 주 중 하나를 지정한다.
    event: SPECIFY_BUCKET_UNIT
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 지정된 단위의 반열림 구간(시작 시각 포함, 끝 시각 제외)으로 각 사건의 기간을 결정한다.
  - step: 4. 시스템이 해당 단위로 구분된 기간별 리포트를 출력한다.
  alt_flows:
  - step: 1a. 운영자가 집계 단위를 지정하지 않은 경우 시스템은 일 단위를 사용한다.
    event: RUN_REPORT
  - step: 1b. 운영자가 시간, 일, 주 중 어느 것도 아닌 값을 지정한 경우 시스템은 리포트를 만들지 않고 지정된 단위가 유효하지 않다는
      사실과 허용되는 값을 알린다.
    event: SPECIFY_BUCKET_UNIT
  - step: 3a. 주 단위의 시작 요일과 경계 기준이 정의되지 않은 경우 시스템은 하나의 기준을 문서화하고 모든 실행에서 그 기준을 동일하게
      적용한다.
  acceptance:
  - 집계 단위 `hour` 지정 시 각 기간의 길이가 정확히 1시간이고 경계가 정시(mm:ss = 00:00)이다.
  - 집계 단위 `day` 지정 시 각 기간의 시작이 00:00:00Z이다.
  - 집계 단위를 생략한 실행의 리포트가 `day`를 지정한 실행의 리포트와 동일하다.
  - 각 기간에 대해 시작 시각의 사건은 그 기간에, 끝 시각의 사건은 다음 기간에 배치된다.
  - 집계 단위로 `month` 등 허용되지 않는 값을 지정하면 리포트 파일/출력이 생성되지 않고 종료 코드가 0이 아니며 허용 값 목록이 메시지에
    포함된다.
  - 집계 단위 `week` 지정 시 각 기간의 시작 요일이 문서에 명시된 요일과 일치하고 모든 기간의 길이가 7일이다.
  requirements:
  - REQ-16
  - REQ-17
  - REQ-26
  - REQ-43
  - REQ-46
- id: UC-04
  title: 칸별 소요시간 통계 확인
  actor: 운영자
  precondition: 소요시간 필드가 있는 사건과 없는 사건이 섞인 로그 파일이 지정되어 있다
  postcondition: 각 칸에 평균·최댓값·95 백분위수 소요시간이, 또는 값 없음 표시가 출력되어 있다
  main_flow:
  - step: 1. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 2. 시스템이 각 칸에서 소요시간이 있는 사건만 골라 통계 대상 집합을 만든다.
  - step: 3. 시스템이 그 집합의 평균 소요시간, 최대 소요시간, 95 백분위수 소요시간을 산출한다.
  - step: 4. 시스템이 칸마다 세 통계값을 리포트에 출력한다.
  - step: 5. 운영자가 리포트의 소요시간 통계를 확인한다.
  alt_flows:
  - step: 2a. 칸의 모든 사건에 소요시간이 없는 경우 시스템은 세 통계값을 0이 아닌 값 없음 표시로 출력한다.
  - step: 2b. 칸에 소요시간이 있는 사건과 없는 사건이 섞인 경우 시스템은 없는 사건을 통계에서 제외하되 사건 수에는 유지한다.
  - step: 3a. 95 백분위수의 계산 방식(정렬 기준, 보간 여부)이 정의되지 않은 경우 시스템은 하나의 방식을 문서화하고 모든 실행·모든
      칸에 동일하게 적용한다.
  - step: 3b. 평균 소요시간의 반올림 및 표기 정밀도가 정의되지 않은 경우 시스템은 하나의 규칙을 문서화하고 모든 실행·모든 칸에 동일하게
      적용한다.
  acceptance:
  - 소요시간 [10ms, 20ms, 30ms]인 칸의 평균이 20, 최댓값이 30으로 출력된다.
  - 소요시간이 있는 사건 3건과 없는 사건 2건이 있는 칸의 사건 수는 5이고 통계는 3건만으로 계산된다.
  - 모든 사건에 소요시간이 없는 칸의 평균/최댓값/95 백분위수 출력값이 숫자 0이 아니며, JSON 형식에서는 null이다.
  - 동일한 소요시간 집합에 대해 반복 실행 시 95 백분위수 값이 항상 같은 값으로 출력된다.
  - 평균 출력값의 소수 자릿수가 모든 칸에서 동일하다.
  requirements:
  - REQ-20
  - REQ-21
  - REQ-22
  - REQ-24
  - REQ-25
  - REQ-45
  - REQ-49
- id: UC-05
  title: 형식에 맞지 않는 줄 제외 및 사유 보고
  actor: 운영자
  precondition: 형식에 맞는 줄과 맞지 않는 줄이 섞인 로그 파일이 지정되어 있다
  postcondition: 잘못된 줄이 집계에서 제외되고, 버린 줄 수와 사유가 리포트에 기록되어 있다
  main_flow:
  - step: 1. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 2. 시스템이 각 줄의 형식 적합성을 판정한다.
  - step: 3. 시스템이 형식에 맞지 않는 줄을 집계에서 제외한다.
  - step: 4. 시스템이 버린 줄의 개수와 사유를 리포트에 출력한다.
  - step: 5. 운영자가 버린 줄 수와 사유를 확인한다.
  alt_flows:
  - step: 2a. 줄이 비어 있거나 공백만 있는 경우 시스템은 그 줄을 버린 줄로 계수하고 사유를 기록한다.
  - step: 2b. 수준 값이 유효 목록에 없는 경우 시스템은 그 줄을 버리고 사유를 잘못된 수준으로 기록한다.
  - step: 2c. 소요시간이 `ms` 접미사가 없거나 정수가 아닌 경우 시스템은 그 줄을 버리고 사유를 잘못된 소요시간으로 기록한다.
  - step: 2d. 모든 줄이 형식에 맞지 않는 경우 시스템은 오류로 종료하지 않고 집계 사건 수 0과 버린 줄 수·사유가 담긴 리포트를 출력한다.
  acceptance:
  - 잘못된 줄이 n개인 입력에서 요약의 버린 줄 수가 n이다.
  - 요약의 읽은 줄 수 == 집계한 사건 수 + 버린 줄 수.
  - 리포트에 사유별 버린 줄 개수가 하나 이상의 항목으로 존재한다.
  - 버린 줄의 서비스 이름이 리포트의 어떤 칸에도 사건으로 나타나지 않는다.
  - 모든 줄이 잘못된 입력에서 종료 코드가 0이고 집계한 사건 수가 0이다.
  requirements:
  - REQ-08
  - REQ-09
  - REQ-11
  - REQ-12
- id: UC-06
  title: 리포트 행 정렬 확인
  actor: 운영자
  precondition: 두 개 이상의 기간과 두 개 이상의 서비스에 걸친 사건이 집계되어 있다
  postcondition: 리포트 행이 기간 오름차순, 같은 기간 내 서비스 이름 오름차순으로 정렬되어 출력되어 있다
  main_flow:
  - step: 1. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 2. 시스템이 리포트 행을 기간 오름차순으로 정렬한다.
  - step: 3. 시스템이 같은 기간 내의 행을 서비스 이름 오름차순으로 정렬한다.
  - step: 4. 시스템이 정렬된 행을 출력한다.
  - step: 5. 운영자가 정렬 순서를 확인한다.
  alt_flows:
  - step: 2a. 입력 파일에서 사건이 시각 역순으로 등장한 경우에도 시스템은 출력 행을 기간 오름차순으로 정렬한다.
  - step: 3a. 서비스 이름 오름차순의 비교 기준(바이트/코드포인트/로케일)이 정의되지 않은 경우 시스템은 하나의 기준을 문서화하고 모든
      실행에 동일하게 적용한다.
  acceptance:
  - 리포트 행을 순서대로 읽을 때 기간 값이 단조 비감소한다.
  - 같은 기간 값을 가진 연속 행들의 서비스 이름이 단조 비감소한다.
  - 입력 줄 순서를 임의로 섞어 다시 실행해도 출력 행 순서가 동일하다.
  - 대문자와 소문자가 섞인 서비스 이름 집합에 대해 반복 실행 시 정렬 결과가 항상 동일하다.
  requirements:
  - REQ-31
  - REQ-32
  - REQ-50
- id: UC-07
  title: 출력 형식 선택
  actor: 운영자
  precondition: 집계 대상 로그 파일이 지정되어 있다
  postcondition: 운영자가 선택한 표 형식 또는 JSON 형식의 리포트가 출력되어 있다
  main_flow:
  - step: 1. 운영자가 출력 형식으로 표 또는 JSON을 지정한다.
    event: SPECIFY_OUTPUT_FORMAT
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 집계 결과를 지정된 형식으로 출력한다.
  - step: 4. 운영자가 다른 형식을 지정해 동일 입력으로 다시 요청한다.
    event: SPECIFY_OUTPUT_FORMAT
  - step: 5. 시스템이 앞선 실행과 동일한 수치를 다른 형식으로 출력한다.
  alt_flows:
  - step: 1a. 운영자가 지원하지 않는 출력 형식을 지정한 경우 시스템은 리포트를 만들지 않고 지원되는 형식 목록을 알린다.
    event: SPECIFY_OUTPUT_FORMAT
  - step: 3a. 집계 가능한 사건이 하나도 없는 경우 시스템은 두 형식 모두에서 오류 없이 빈 결과 구조를 출력한다.
  acceptance:
  - 표 형식 출력과 JSON 형식 출력이 모두 생성 가능하다.
  - 동일 입력·동일 설정에서 JSON의 각 칸 사건 수·수준별 사건 수·평균·최댓값·95 백분위수 값이 표 형식의 대응 값과 일치한다.
  - JSON 출력이 유효한 JSON으로 파싱된다.
  - 두 형식의 행 개수와 행 순서가 일치한다.
  requirements:
  - REQ-37
  - REQ-38
- id: UC-08
  title: 리포트 재현성 및 입력 지문 확인
  actor: 운영자
  precondition: 동일한 입력 파일과 동일한 설정으로 두 번 실행할 수 있다
  postcondition: 두 실행의 리포트가 바이트 단위로 동일하고, 각 입력 파일의 이름·크기·내용 해시가 리포트에 기록되어 있다
  main_flow:
  - step: 1. 운영자가 입력 파일과 설정을 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 각 입력 파일의 이름, 크기, 내용 해시를 입력 지문으로 리포트에 기록한다.
  - step: 4. 시스템이 실행 시각·실행 소요 시간·임시 경로 등 실행마다 달라지는 값을 제외한 리포트를 출력한다.
  - step: 5. 운영자가 동일한 입력과 설정으로 다시 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 6. 시스템이 첫 실행과 바이트 단위로 동일한 리포트를 출력한다.
  - step: 7. 운영자가 두 리포트를 비교해 동일함을 확인한다.
  alt_flows:
  - step: 3a. 입력 파일의 내용이 두 실행 사이에 변경된 경우 시스템은 달라진 내용 해시를 기록하고 그에 맞는 리포트를 출력한다.
  - step: 3b. 사용할 해시 알고리즘이 정의되지 않은 경우 시스템은 하나의 알고리즘을 문서화하고 모든 실행에 동일하게 적용하며 리포트에 알고리즘
      이름을 표기한다.
  - step: 3c. 입력 파일을 열 수 없어 내용 해시를 계산할 수 없는 경우 시스템은 해시 대신 실패 사실을 지문 항목에 기록한다.
  acceptance:
  - 동일 입력·동일 설정의 두 실행 결과 파일의 바이트 단위 비교가 일치한다.
  - 리포트에 각 입력 파일마다 이름, 크기(바이트), 내용 해시 3개 항목이 존재한다.
  - 리포트 텍스트에 실행 시각, 실행 소요 시간, 임시 디렉터리 경로에 해당하는 값이 존재하지 않는다.
  - 입력 파일 1바이트를 변경하면 리포트의 해당 파일 내용 해시 값이 달라진다.
  - 리포트에 사용된 해시 알고리즘 이름이 명시되어 있다.
  requirements:
  - REQ-34
  - REQ-35
  - REQ-36
  - REQ-48
- id: UC-09
  title: 메모리보다 큰 입력 처리
  actor: 운영자
  precondition: 사용 가능한 메모리보다 큰 로그 파일이 존재한다
  postcondition: 전체 파일을 메모리에 적재하지 않고 정상적인 리포트가 출력되어 있다
  main_flow:
  - step: 1. 운영자가 매우 큰 로그 파일을 입력으로 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 파일을 처음부터 끝까지 순차적으로 읽으며 사건을 누적 집계한다.
  - step: 4. 시스템이 리포트를 출력한다.
  alt_flows:
  - step: 3a. 읽는 도중 읽기 오류가 발생한 경우 시스템은 그때까지 누적한 집계로 리포트를 출력하고 실패 사실을 기록한다.
  - step: 3b. 서비스 종류나 기간 수가 매우 많은 경우에도 시스템은 사건 원문을 보관하지 않고 집계 결과만 유지한다.
  acceptance:
  - 가용 메모리보다 큰 입력 파일에 대해 실행이 메모리 부족 오류 없이 종료 코드 0으로 완료된다.
  - 실행 중 최대 상주 메모리 사용량이 입력 파일 크기에 비례해 증가하지 않는다.
  - 큰 입력의 리포트 수치가 같은 내용을 작은 조각으로 나눠 처리한 결과와 일치한다.
  requirements:
  - REQ-39
- id: UC-10
  title: 파일 열기·읽기 실패 시 부분 리포트 생성
  actor: 운영자
  precondition: 지정된 입력 파일 중 하나 이상이 존재하지 않거나 읽을 수 없다
  postcondition: 읽을 수 있었던 내용으로 만든 리포트가 출력되고, 실패한 파일과 실패 내용이 리포트에 기록되어 있다
  main_flow:
  - step: 1. 운영자가 여러 입력 파일을 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 각 파일을 순서대로 열어 읽는다.
  - step: 4. 시스템이 열거나 읽는 데 실패한 파일에 대해 실패한 파일 이름과 실패 내용을 기록한다.
  - step: 5. 시스템이 읽는 데 성공한 내용만으로 집계 리포트를 출력한다.
  - step: 6. 운영자가 리포트에서 실패한 파일 목록을 확인한다.
  alt_flows:
  - step: 3a. 파일이 존재하지 않는 경우 시스템은 실행을 중단하지 않고 그 파일을 실패로 기록한 뒤 다음 파일을 처리한다.
  - step: 3b. 파일 접근 권한이 없는 경우 시스템은 실행을 중단하지 않고 그 파일을 실패로 기록한 뒤 다음 파일을 처리한다.
  - step: 3c. 파일을 읽던 도중 실패한 경우 시스템은 그 파일에서 이미 읽은 사건은 집계에 유지하고 실패 지점 이후는 포기한다.
  - step: 3d. 지정된 모든 파일이 실패한 경우 시스템은 오류로 중단하지 않고 실패 목록이 담긴 빈 리포트를 출력한다.
  acceptance:
  - 존재하지 않는 파일 1개와 정상 파일 1개를 함께 지정한 실행이 리포트를 출력하고 종료 코드가 0이다.
  - 그 리포트의 집계 사건 수가 정상 파일만 지정한 실행의 집계 사건 수와 같다.
  - 리포트에 실패한 파일의 이름과 실패 내용이 각각 존재한다.
  - 지정한 모든 파일이 읽기 실패인 실행도 리포트를 출력하며 실패 항목 수가 지정한 파일 수와 같다.
  requirements:
  - REQ-40
  - REQ-41
- id: UC-11
  title: 입력 파일 미지정 시 오류 통지
  actor: 운영자
  precondition: 도구를 실행할 수 있다
  postcondition: 리포트가 생성되지 않고 입력 파일이 없다는 사실이 운영자에게 알려져 있다
  main_flow:
  - step: 1. 운영자가 입력 파일을 하나도 지정하지 않은 채 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 2. 시스템이 입력 파일이 지정되지 않았음을 판정한다.
  - step: 3. 시스템이 리포트를 만들지 않고 무엇이 잘못됐는지 알린다.
  - step: 4. 운영자가 오류 내용을 확인한다.
  alt_flows:
  - step: 1a. 입력 파일이 없고 집계 단위도 잘못 지정된 경우 시스템은 리포트를 만들지 않고 잘못된 항목을 알린다.
    event: RUN_REPORT
  - step: 2a. 지정된 입력 목록이 빈 문자열뿐인 경우 시스템은 입력 파일이 지정되지 않은 것으로 처리한다.
  acceptance:
  - 입력 파일 인자 없이 실행하면 표준 출력·출력 파일 어디에도 리포트가 생성되지 않는다.
  - 종료 코드가 0이 아니다.
  - 출력 메시지에 입력 파일이 지정되지 않았다는 내용이 포함된다.
  requirements:
  - REQ-44
- id: UC-12
  title: 집계 가능한 사건이 없는 입력에 대한 빈 리포트 생성
  actor: 운영자
  precondition: 지정된 입력 파일에 집계 가능한 유효 사건이 하나도 없다
  postcondition: 오류 없이 요약만 포함된 빈 리포트가 출력되어 있다
  main_flow:
  - step: 1. 운영자가 유효 사건이 없는 파일을 입력으로 지정한다.
    event: SPECIFY_INPUT_FILES
  - step: 2. 운영자가 리포트 생성을 요청한다.
    event: RUN_REPORT
  - step: 3. 시스템이 집계 가능한 사건이 0건임을 판정한다.
  - step: 4. 시스템이 요약과 입력 지문을 포함한 빈 리포트를 출력한다.
  - step: 5. 운영자가 빈 리포트를 확인한다.
  alt_flows:
  - step: 3a. 입력 파일이 완전히 비어 있는 경우 시스템은 읽은 줄 수 0, 집계한 사건 수 0인 리포트를 출력한다.
  - step: 3b. 모든 줄이 형식에 맞지 않는 경우 시스템은 집계한 사건 수 0과 버린 줄 수·사유를 담은 리포트를 출력한다.
  - step: 3c. JSON 형식이 지정된 경우 시스템은 칸 목록이 빈 배열인 유효한 JSON을 출력한다.
  acceptance:
  - 유효 사건 0건 입력에 대해 종료 코드가 0이다.
  - 리포트에 (기간, 서비스) 데이터 행이 0개 존재한다.
  - 리포트에 요약 5개 항목이 존재하고 집계한 사건 수가 0이다.
  - JSON 형식 출력이 유효한 JSON으로 파싱되고 칸 목록 길이가 0이다.
  requirements:
  - REQ-42
