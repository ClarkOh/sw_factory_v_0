project: log_report
rules:
- id: R-001
  when: count(effective_input_paths) == 0 and bucket_unit_specified and bucket_unit
    not in {hour, day, week}
  then: abort_without_report(); exit_code != 0; report_faults([missing_input_files,
    invalid_bucket_unit])
  usecase: UC-11
  notes: ''
- id: R-002
  when: count(input_paths) == 0
  then: abort_without_report(); exit_code != 0; message contains '입력 파일이 지정되지 않았다'
  usecase: UC-11
  notes: ''
- id: R-003
  when: count(input_paths) > 0 and all(is_blank(p) for p in input_paths)
  then: '입력 미지정과 동일 처리: abort_without_report(); exit_code != 0; message contains ''입력
    파일이 지정되지 않았다'''
  usecase: UC-11
  notes: ''
- id: R-004
  when: bucket_unit_specified and bucket_unit not in {hour, day, week}
  then: 리포트 파일/출력 생성 없음; exit_code != 0; message contains 지정값이 유효하지 않다는 사실 + 허용 목록
    {hour, day, week}
  usecase: UC-03
  notes: ''
- id: R-005
  when: not bucket_unit_specified
  then: bucket_unit = day (이후 처리·출력이 day 명시 실행과 동일)
  usecase: UC-03
  notes: ''
- id: R-006
  when: output_format_specified and output_format not in {table, json}
  then: abort_without_report(); message contains 지원 형식 목록 {table, json}
  usecase: UC-07
  notes: ''
- id: R-007
  when: not output_format_specified
  then: output_format = table
  usecase: UC-01
  notes: ''
- id: R-008
  when: path가 입력 목록에 k(>1)번 나타남
  then: 그 파일을 k번 읽는다; 그 파일의 사건이 k번 계수됨 (경로 중복 제거 없음)
  usecase: UC-02
  notes: ''
- id: R-009
  when: '!exists(path)'
  then: file_failures += (name(path), not_found); 실행 중단 없이 다음 파일 계속; exit_code 영향
    없음
  usecase: UC-10
  notes: ''
- id: R-010
  when: exists(path) and !readable(path)
  then: file_failures += (name(path), permission_denied); 실행 중단 없이 다음 파일 계속
  usecase: UC-10
  notes: ''
- id: R-011
  when: 파일을 읽던 도중 read_error 발생
  then: 그 파일에서 이미 집계한 사건은 유지; file_failures += (name(path), read_error 내용); 실패 지점
    이후 포기; 다음 파일 계속
  usecase: UC-10
  notes: ''
- id: R-012
  when: open(path) 성공
  then: 처음부터 끝까지 한 줄씩 순차 읽기; 파일 전체를 메모리에 적재하지 않는다 (상주 메모리가 파일 크기에 비례 증가 금지)
  usecase: UC-09
  notes: ''
- id: R-013
  when: 집계 진행 중 (서비스·기간 수와 무관)
  then: 집계 결과(칸별 count, 수준별 count, 통계용 소요시간 값)만 유지; 사건 원문 줄은 보관하지 않는다
  usecase: UC-09
  notes: ''
- id: R-014
  when: 파일의 마지막 줄이 개행 없이 끝남
  then: 완결된 독립 줄로 해석; 다음 파일의 첫 줄과 이어붙이지 않는다
  usecase: UC-02
  notes: ''
- id: R-015
  when: 파일에서 유효 사건이 0건 나옴 (읽기는 성공)
  then: 실패 기록 없이 건너뛰고 나머지 파일로 집계 계속
  usecase: UC-02
  notes: ''
- id: R-016
  when: is_blank(line)
  then: read_lines += 1; dropped += 1; count_reason(drop_reasons, empty_line)
  usecase: UC-05
  notes: ''
- id: R-017
  when: 두 줄이 필드 구분 공백 개수(1개 vs 2개 이상)만 다름
  then: '파싱 결과 동일 (토큰화는 공백 run 단위: tokens = split_on_whitespace_runs(line))'
  usecase: UC-01
  notes: ''
- id: R-018
  when: count(tokens) < 3
  then: read_lines += 1; dropped += 1; count_reason(drop_reasons, missing_fields)
  usecase: UC-01
  notes: ''
- id: R-019
  when: '!valid_iso8601_utc(tokens[0])'
  then: read_lines += 1; dropped += 1; count_reason(drop_reasons, invalid_timestamp)
  usecase: UC-01
  notes: ''
- id: R-020
  when: tokens[1] not in {DEBUG, INFO, WARN, ERROR}
  then: read_lines += 1; dropped += 1; count_reason(drop_reasons, invalid_level)
  usecase: UC-05
  notes: ''
- id: R-021
  when: duration_field_present(tokens) and !matches(duration_field, '^[0-9]+ms$')
  then: read_lines += 1; dropped += 1; count_reason(drop_reasons, invalid_duration)
  usecase: UC-05
  notes: ''
- id: R-022
  when: 메시지 필드 내부에 공백 n(>=1)개 포함
  then: '내부 공백을 구분자로 보지 않는다: service = tokens[2], duration = 말미 duration 필드가 정확히 추출되고
    message는 하나의 값으로 파싱'
  usecase: UC-01
  notes: ''
- id: R-023
  when: line이 이미 계수된 줄과 내용 완전 동일
  then: '중복 제거 없음: 동일 규칙으로 독립 평가; 출현 1회당 해당 칸 count += 1'
  usecase: UC-01
  notes: ''
- id: R-024
  when: 시각·수준·서비스 유효 and duration 필드 없음
  then: read_lines += 1; events += 1; c = cell(bucket(ts), service); c.count += 1;
    c.levels[level] += 1; 소요시간은 '없음'으로 기록 (durations에 미추가)
  usecase: UC-01
  notes: ''
- id: R-025
  when: 시각·수준·서비스 유효 and duration_field == 'Nms'
  then: read_lines += 1; events += 1; c = cell(bucket(ts), service); c.count += 1;
    c.levels[level] += 1; c.durations += [N]
  usecase: UC-01
  notes: ''
- id: R-026
  when: ts가 어떤 기간의 경계 시각과 정확히 일치
  then: 끝나는 기간이 아니라 그 시각에 시작하는 기간에 배정 (시작 포함·끝 제외 반열림)
  usecase: UC-03
  notes: ''
- id: R-027
  when: bucket_unit == hour
  then: bucket = [truncate_to_hour(ts), +1시간) 반열림; 경계는 정시(mm:ss == 00:00)
  usecase: UC-03
  notes: ''
- id: R-028
  when: bucket_unit == day
  then: bucket = [당일 00:00:00Z, 다음 날 00:00:00Z) 반열림 (23:59:59.999Z → 당일, 00:00:00.000Z
    → 다음 날)
  usecase: UC-01
  notes: ''
- id: R-029
  when: bucket_unit == week
  then: bucket = [문서화된 시작 요일 00:00:00Z, +7일) 반열림; 시작 요일은 문서에 명시하고 모든 실행에 동일 적용
  usecase: UC-03
  notes: ''
- id: R-030
  when: cell.durations == []
  then: avg = max = p95 = '값 없음' 표시 (숫자 0 아님; JSON에서는 null)
  usecase: UC-04
  notes: ''
- id: R-031
  when: 칸에 소요시간 있는 사건과 없는 사건이 섞임
  then: 통계는 durations만으로 계산; 소요시간 없는 사건도 cell.count에는 그대로 포함
  usecase: UC-04
  notes: ''
- id: R-032
  when: cell.durations != []
  then: avg = mean(durations)를 문서화된 고정 소수 자릿수로 표기(모든 칸 동일); max = max(durations);
    p95 = 문서화된 단일 방식(정렬·보간 규칙 명시)으로 산출, 반복 실행 시 항상 동일 값
  usecase: UC-04
  notes: ''
- id: R-033
  when: 리포트를 생성함 (인자 오류로 중단되지 않은 모든 실행)
  then: '최상단 요약에 5개 항목: 대상 기간, read_lines, events, dropped, service_count; 불변식 read_lines
    == events + dropped, sum(모든 칸 count) == events, 각 칸 sum(levels) == count'
  usecase: UC-01
  notes: ''
- id: R-034
  when: 요약의 대상 기간을 산출함
  then: 문서화된 단일 규칙(입력 데이터 도출인지 운영자 지정인지 명시)에 따라 계산; 모든 실행에 동일 적용
  usecase: UC-01
  notes: ''
- id: R-035
  when: dropped > 0
  then: drop_reasons를 사유별 버린 줄 개수로 리포트에 출력 (버린 줄의 서비스 이름은 어떤 칸에도 나타나지 않음)
  usecase: UC-05
  notes: ''
- id: R-036
  when: cell.count >= 1
  then: 그 (기간, 서비스) 칸을 데이터 행으로 출력
  usecase: UC-01
  notes: ''
- id: R-037
  when: cell.count == 0인 (기간, 서비스) 조합
  then: 행을 만들지 않는다 (0 채움 행 금지)
  usecase: UC-01
  notes: ''
- id: R-038
  when: 출력 행을 배열함
  then: 기간 시작 오름차순, 동일 기간 내 서비스 이름 오름차순으로 정렬; 비교 기준은 문서화된 코드포인트 비교로 고정; 입력 줄·파일 순서와
    무관하게 항상 동일 순서
  usecase: UC-06
  notes: ''
- id: R-039
  when: 동일한 사건 다중집합을 다른 파일 분할·나열 순서로 입력
  then: 모든 칸 수치가 동일한 단일 리포트 출력; 파일별로 나눈 수치는 리포트 어디에도 없음
  usecase: UC-02
  notes: ''
- id: R-040
  when: events == 0 (빈 파일·전부 무효 줄 포함)
  then: exit_code == 0; 요약(events = 0)·drop_reasons·입력 지문이 담긴 빈 리포트 출력; 데이터 행 0개;
    JSON이면 칸 목록 == []인 유효한 JSON
  usecase: UC-12
  notes: ''
- id: R-041
  when: 지정된 모든 입력 파일이 열기/읽기 실패
  then: 오류 중단 없이 exit_code == 0; 실패 목록(항목 수 == 지정 파일 수)이 담긴 빈 리포트 출력
  usecase: UC-10
  notes: ''
- id: R-042
  when: output_format == table
  then: 집계 결과를 표 형식으로 렌더
  usecase: UC-07
  notes: ''
- id: R-043
  when: output_format == json
  then: 유효한 JSON으로 렌더; 칸별 count·수준별 count·avg/max/p95 값과 행 개수·행 순서가 동일 입력의 표 형식과 일치;
    '값 없음'은 null
  usecase: UC-07
  notes: ''
- id: R-044
  when: 리포트 작성 시 각 입력 파일에 대해
  then: 입력 지문(이름, 크기 바이트, 내용 해시) 3개 항목 기록; 해시 알고리즘은 문서화된 하나로 고정하고 알고리즘 이름을 리포트에 표기
  usecase: UC-08
  notes: ''
- id: R-045
  when: 파일을 열 수 없어 내용 해시 계산 불가
  then: 지문 항목에 해시 대신 실패 사실을 기록
  usecase: UC-08
  notes: ''
- id: R-046
  when: 리포트 본문을 씀
  then: 실행 시각·실행 소요 시간·임시 디렉터리 경로 등 실행마다 달라지는 값을 포함하지 않는다
  usecase: UC-08
  notes: ''
- id: R-047
  when: 동일 입력 파일·동일 설정으로 재실행
  then: 첫 실행과 바이트 단위로 동일한 리포트 출력
  usecase: UC-08
  notes: ''
- id: R-048
  when: 두 실행 사이에 입력 파일 내용이 1바이트라도 변경됨
  then: 리포트의 해당 파일 내용 해시가 달라지고 집계는 새 내용 기준으로 산출
  usecase: UC-08
  notes: ''
