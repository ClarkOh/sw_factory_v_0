project: log_report
rules:
- id: R-001
  when: event == RUN_COLLECTION and !exists(source_dir('~/.claude/projects'))
  then: 오류로 처리하지 않는다; 저장소를 빈 상태로 보장; append_ledger_line(read_lines=0, accepted=0,
    duplicates=0, invalid=0, unrelated=0, retention_deleted=0); exit_code == 0
  usecase: UC-01
  notes: ''
- id: R-002
  when: event == RUN_COLLECTION and exists(source_dir)
  then: files = glob('~/.claude/projects/**/*.jsonl'); 각 파일에 파일 규칙(R-003..R-006) 적용;
    원천은 읽기 전용으로만 연다 — 어떤 규칙도 원천에 쓰거나 지우지 않는다
  usecase: UC-01
  notes: ''
- id: R-003
  when: '!readable(file)  # 열기 또는 읽기 실패'
  then: ledger_file_failures += (path(file), failure_reason); 이 파일을 건너뛰고 다음 파일로 계속;
    실행은 비정상 종료하지 않는다
  usecase: UC-01
  notes: ''
- id: R-004
  when: 'path(file) not in offsets  # 처음 보는 파일'
  then: offset = 0 부터 전체 줄을 줄 규칙(R-008..R-012)으로 처리; 처리 후 offsets[path(file)] = size(file)
  usecase: UC-01
  notes: ''
- id: R-005
  when: 'size(file) < offsets[path(file)]  # 파일이 줄어듦(회전)'
  then: offset = 0 부터 처음의 줄들을 다시 읽어 줄 규칙으로 재분류; 처리 후 offsets[path(file)] = size(file)
  usecase: UC-01
  notes: ''
- id: R-006
  when: size(file) >= offsets[path(file)]
  then: offsets[path(file)] 이후 새로 붙은 줄만 줄 규칙으로 처리; 처리 후 offsets[path(file)] = size(file)
  usecase: UC-01
  notes: ''
- id: R-007
  when: '!parse_json(line)'
  then: read_lines += 1; invalid += 1; count_reason(invalid_reasons, parse_error)
  usecase: UC-01
  notes: ''
- id: R-008
  when: record.type != 'assistant' or !has(record.message.usage)
  then: read_lines += 1; unrelated += 1
  usecase: UC-01
  notes: ''
- id: R-009
  when: all_zero_or_missing(record.message.usage 의 토큰 수 전부)
  then: read_lines += 1; invalid += 1; count_reason(invalid_reasons, zero_or_missing_tokens)
  usecase: UC-01
  notes: ''
- id: R-010
  when: 'record.requestId in store.request_ids  # 같은 requestId 재출현'
  then: read_lines += 1; duplicates += 1; 저장소에 적재하지 않는다
  usecase: UC-01
  notes: ''
- id: R-011
  when: record.type == 'assistant' and has(record.message.usage) and any_token_nonzero(usage)
    and record.requestId not in store.request_ids
  then: 'read_lines += 1; accepted += 1; store.append(ts_utc, model, session_id, input_tokens,
    output_tokens, cache_read_tokens, cache_write_5m_tokens, cache_write_1h_tokens,
    web_search_count); store.request_ids += record.requestId  # 저장소는 원천과 별개 파일'
  usecase: UC-01
  notes: ''
- id: R-012
  when: '모든 파일의 줄 처리 완료  # 정상 마감'
  then: 'assert read_lines == accepted + duplicates + invalid + unrelated; append_ledger_line(read_lines,
    accepted, duplicates, invalid, unrelated, retention_deleted)  # 실행 1회 = 장부 한 줄'
  usecase: UC-01
  notes: ''
- id: R-013
  when: '같은 원천 상태에서 수집을 다시 실행함  # 재실행 불변식'
  then: 저장소 레코드 집합은 이전 실행과 동일(복제 0건); 변화는 장부 한 줄 추가뿐
  usecase: UC-01
  notes: ''
- id: R-014
  when: age(record) > 8일 and !reflected_in_daily_summary(record)
  then: 삭제하지 않는다; daily_summary[date(record)] 에 토큰·비용·건수를 먼저 반영한다 — 반영된 뒤에야 R-015
    의 대상이 된다
  usecase: UC-02
  notes: ''
- id: R-015
  when: age(record) > 8일 and reflected_in_daily_summary(record)
  then: store 에서 삭제; retention_deleted += 1
  usecase: UC-02
  notes: ''
- id: R-016
  when: 이번 실행에서 retention_deleted > 0
  then: 이번 실행 장부 줄에 삭제 시각(deleted_at)과 삭제 건수(retention_deleted)를 기록
  usecase: UC-02
  notes: ''
- id: R-017
  when: 'age(ledger_line) > 35일 and !counts_reflected_in_daily_summary(ledger_line)  #
    채택·중복·무효·무관·보존 삭제 건수'
  then: 지우지 않고 유지한다
  usecase: UC-02
  notes: ''
- id: R-018
  when: age(ledger_line) > 35일 and counts_reflected_in_daily_summary(ledger_line)
  then: 장부에서 그 줄을 삭제
  usecase: UC-02
  notes: ''
- id: R-019
  when: age(summary_row) > 35일
  then: 일 요약에서 그 행을 삭제
  usecase: UC-02
  notes: ''
- id: R-020
  when: '!exists(offsets 항목이 가리키는 원천 파일 경로)'
  then: '그 항목을 offsets 에서 제거  # 상태 파일도 유계여야 한다'
  usecase: UC-02
  notes: ''
- id: R-021
  when: '정리 단계 완료  # 상한 불변식'
  then: assert max_age(원시 레코드) <= 8일 + 실행 주기; assert max_age(일 요약·장부 줄) <= 35일 + 실행
    주기; assert 저장소·일 요약·장부·offsets 각 파일이 기간 또는 크기 상한 내
  usecase: UC-02
  notes: ''
- id: R-022
  when: event == REQUEST_REPORT and period in {session_5h, day_24h, week_7d}
  then: 집계 대상 구간 목록 = 요청 기간 + 최근 30일 추이의 각 날짜; 각 구간에 구간 규칙(R-023..R-025) 적용; 저장소·요약은
    읽기만 하고 변경하지 않는다
  usecase: UC-03
  notes: ''
- id: R-023
  when: 구간이 원시 레코드 보존 범위(8일) 안
  then: 그 구간은 원시 레코드로 집계
  usecase: UC-03
  notes: ''
- id: R-024
  when: 구간이 원시 보존 밖 and 일 요약 보존 범위(35일) 안
  then: 그 구간은 일 요약으로 집계
  usecase: UC-03
  notes: ''
- id: R-025
  when: 구간이 원시로도 일 요약으로도 답할 수 없음
  then: 그 구간 값 = '값 없음' 으로 표기 (숫자 0 금지)
  usecase: UC-03
  notes: ''
- id: R-026
  when: model in price_table
  then: cost(model) = Σ(토큰 종류별 수 × price_table[model][종류])
  usecase: UC-03
  notes: ''
- id: R-027
  when: model not in price_table
  then: cost(model) = Σ(토큰 종류별 수 × max_price(price_table)[종류]); 리포트에 '단가표 없음 — 최고
    단가 적용' 표시를 그 모델에 붙인다
  usecase: UC-03
  notes: ''
- id: R-028
  when: sum(칸별 합계) != 총계
  then: 리포트 산출물을 생성하지 않는다; 사용자에게 실패와 그 사유를 보고
  usecase: UC-03
  notes: ''
- id: R-029
  when: sum(칸별 합계) == 총계
  then: '리포트 제시: 모델별 분해(토큰 종류별·비용), 최근 30일 일별 추이, 근거(마지막 적재 시각, 저장소 레코드 수)'
  usecase: UC-03
  notes: ''
- id: R-030
  when: '같은 저장소 상태에서 리포트를 두 번 생성함  # 결정성 불변식'
  then: 두 결과물이 동일하다; 리포트의 총 토큰 == 저장소의 해당 기간 레코드 합
  usecase: UC-03
  notes: ''
- id: R-031
  when: event == REQUEST_REBUILD
  then: 다른 처리보다 먼저 '원시 보존 기한(8일)을 넘긴 과거는 복구할 수 없다' 안내를 출력한다
  usecase: UC-04
  notes: ''
- id: R-032
  when: event == REQUEST_REBUILD and !exists(source_dir)
  then: 오류로 처리하지 않는다; 빈 저장소를 생성; exit_code == 0
  usecase: UC-04
  notes: ''
- id: R-033
  when: event == REQUEST_REBUILD and exists(source_dir)
  then: 저장소와 offsets 를 비우고 원천 파일 전체를 처음부터 줄 규칙(R-007..R-011)으로 재분류·적재; 원천 파일은 바이트
    단위로 무변경
  usecase: UC-04
  notes: ''
- id: R-034
  when: 재구축 중 원천 파일 하나를 읽지 못함
  then: ledger_file_failures += (path(file), failure_reason); 나머지 파일로 재구축 계속
  usecase: UC-04
  notes: ''
- id: R-035
  when: 재구축 완료
  then: 'append_ledger_line(rebuild=true, accepted 적재 건수 포함)  # 재구축 결과도 장부 한 줄'
  usecase: UC-04
  notes: ''
- id: R-036
  when: event == RUN_COMPARISON and !runnable(tools/usage_server.py)
  then: '''대조 불가''와 실행 실패 이유를 보고; 종료를 대조 성공으로 표기하지 않는다'
  usecase: UC-05
  notes: ''
- id: R-037
  when: event == RUN_COMPARISON and runnable(tools/usage_server.py)
  then: 같은 원천·기간에 대해 이 도구와 기준 구현의 총 토큰·비용을 각각 산출해 나란히 제시
  usecase: UC-05
  notes: ''
- id: R-038
  when: 대조 결과 두 구현의 값이 다름
  then: 차이 항목(토큰 종류·모델·기간)과 차이 크기를 0건이 아닌 목록으로 보고
  usecase: UC-05
  notes: ''
