  notes: 요약과 입력 지문만 있는 빈 리포트를 오류 없이 출력한다. JSON 형식에서는 칸 목록이 빈 배열인 유효한 JSON을 출력한다 (UC-12
    3c). 모든 파일이 실패한 경우에도 실패 목록이 담긴 빈 리포트를 출력한다 (UC-10 3d)
