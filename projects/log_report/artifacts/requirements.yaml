requirements:
- id: REQ-01
  text: 수집 원천은 `~/.claude/projects/**/*.jsonl` 파일들이다.
  kind: constraint
  source: 원천은 `~/.claude/projects/**/*.jsonl` 파일들이다.
- id: REQ-02
  text: 원천 파일의 한 줄을 JSON 레코드 하나로 해석한다.
  kind: functional
  source: 한 줄이 JSON 레코드 하나다.
- id: REQ-03
  text: 어떤 경우에도 원천 파일을 수정하거나 삭제하지 않는다.
  kind: constraint
  source: 원천은 읽기 전용이다. 어떤 경우에도 원천 파일을 수정하거나 지우지 않는다.
- id: REQ-04
  text: 파일마다 지난번 읽은 위치를 기억하고 새로 붙은 부분만 읽는다.
  kind: functional
  source: 파일마다 지난번 읽은 위치를 기억하고 새로 붙은 부분만 읽는다.
- id: REQ-05
  text: 파일 크기가 기억한 읽기 위치보다 줄어들었으면 그 파일을 처음부터 다시 읽는다.
  kind: functional
  source: 파일이 줄어들었으면(회전) 처음부터 다시 읽는다.
- id: REQ-06
  text: 수집은 반복 실행된다. [모호 — 실행 주기가 문서에 명시되지 않음]
  kind: constraint
  source: 수집은 주기적으로 반복 실행된다.
- id: REQ-07
  text: 같은 원천 상태에서 수집을 몇 번 실행해도 저장소는 같은 상태이며 레코드가 복제되지 않는다.
  kind: nonfunctional
  source: 같은 원천 상태에서 몇 번을 돌려도 저장소는 같은 상태여야 한다 — 재실행이 레코드를 복제하면 안 된다.
- id: REQ-08
  text: '`type`이 `assistant`이고 `message.usage`에 토큰 수가 있는 레코드만 사용량 레코드로 채택한다.'
  kind: functional
  source: 사용량 레코드는 `type` 이 `assistant` 이고 `message.usage` 에 토큰 수가 있는 것이다.
- id: REQ-09
  text: 채택 조건에 해당하지 않는 줄(사용자 발화·첨부·시스템)은 무관 레코드로 센다.
  kind: functional
  source: 그 외의 줄(사용자 발화, 첨부, 시스템)은 조용히 지나가는 것이 아니라 무관 레코드로 센다.
- id: REQ-10
  text: '`requestId`가 같은 레코드들 중 하나만 채택한다.'
  kind: functional
  source: '`requestId` 가 같은 레코드는 하나만 채택하고'
- id: REQ-11
  text: '`requestId` 중복으로 채택되지 않은 레코드는 중복으로 센다.'
  kind: functional
  source: 나머지는 중복으로 센다.
- id: REQ-12
  text: JSON으로 파싱되지 않는 줄과, usage는 있으나 토큰 수가 전부 0이거나 없는 레코드는 무효로 센다.
  kind: functional
  source: JSON 으로 파싱되지 않는 줄, usage 는 있으나 토큰 수가 전부 0이거나 없는 레코드는 무효로 세고
- id: REQ-13
  text: 무효로 센 레코드마다 무효 이유를 남긴다.
  kind: functional
  source: 무효로 세고 이유를 남긴다.
- id: REQ-14
  text: 채택한 레코드에서 시각(UTC)·모델 이름·세션 id·입력·출력·캐시읽기·캐시쓰기(5분/1시간 구분) 토큰·웹검색 횟수를 추출한다.
  kind: functional
  source: '채택한 레코드에서 뽑는 값: 시각(UTC), 모델 이름, 세션 id, 입력·출력·캐시읽기·캐시쓰기(5분/1시간 구분) 토큰, 웹검색
    횟수.'
- id: REQ-15
  text: 비용은 모델별 단가표로 계산한다.
  kind: functional
  source: 비용은 모델별 단가표로 계산한다.
- id: REQ-16
  text: 단가표에 없는 모델의 비용은 단가표에서 가장 비싼 단가로 계산한다.
  kind: functional
  source: 단가표에 없는 모델은 가장 비싼 단가로 계산하고
- id: REQ-17
  text: 단가표에 없는 모델을 가장 비싼 단가로 계산했다는 사실을 리포트에 표시한다.
  kind: functional
  source: 그 사실을 리포트에 표시한다 — 비용을 낮게 보여주는 쪽으로 틀리면 안 된다.
- id: REQ-18
  text: 채택한 레코드는 원천과 별개 파일인 자체 저장소에 적재한다.
  kind: functional
  source: 채택한 레코드는 자체 저장소에 적재한다. 저장소는 원천과 별개 파일이다.
- id: REQ-19
  text: 원시 레코드는 8일 보존한다.
  kind: nonfunctional
  source: '원시 레코드: 8일 (주간 리포트 창 7일 + 여유 1일)'
- id: REQ-20
  text: 일 단위 요약(날짜·모델별 토큰·비용·채택/중복/무효 건수)은 35일 보존한다.
  kind: nonfunctional
  source: '일 단위 요약(날짜·모델별 토큰·비용·채택/중복/무효 건수): 35일'
- id: REQ-21
  text: 보존 기한을 넘긴 원시 레코드는 그 날의 일 요약에 반영된 뒤에만 삭제한다.
  kind: functional
  source: 삭제 전에 그 날의 일 요약에 반영되어 있어야 한다. 요약에 없는 레코드를 지우면 그 사용량은 영영 사라진다.
- id: REQ-22
  text: 원시 레코드 삭제 시 언제 몇 건을 지웠는지 적재 장부에 남긴다.
  kind: functional
  source: 삭제는 조용히 하지 않는다. 언제 몇 건을 지웠는지 적재 장부에 남는다.
- id: REQ-23
  text: 수집 1회마다 읽은 줄 수·채택·중복·무효·무관·보존 삭제 건수를 장부 한 줄로 남긴다.
  kind: functional
  source: '수집 1회의 결과는 장부 한 줄로 남는다: 읽은 줄 수, 채택, 중복, 무효, 무관, 보존 삭제 건수.'
- id: REQ-24
  text: 장부의 모든 줄에서 읽은 줄 수 = 채택 + 중복 + 무효 + 무관이 성립한다.
  kind: nonfunctional
  source: 읽은 줄 수 = 채택 + 중복 + 무효 + 무관 이 항상 성립한다.
- id: REQ-25
  text: 적재 장부 줄은 35일 보존한다.
  kind: nonfunctional
  source: 적재 장부 자신도 자라면 안 된다. 장부 줄은 35일 보존한다.
- id: REQ-26
  text: 보존 기한을 넘긴 장부 줄은 그 날의 일 요약에 건수(채택·중복·무효·무관·보존 삭제)가 반영된 뒤에만 지운다.
  kind: functional
  source: 지우기 전에 그 날의 일 요약에 건수(채택·중복·무효·무관·보존 삭제)가 반영되어 있어야 한다
- id: REQ-27
  text: 이 도구가 쓰는 모든 파일(저장소·일 요약·적재 장부·읽기 위치 상태)은 기간 또는 크기 상한을 갖는다.
  kind: nonfunctional
  source: 이 도구가 쓰는 모든 파일(저장소·일 요약·적재 장부·읽기 위치 상태)은 기간 또는 크기 상한을 갖는다.
- id: REQ-28
  text: 사라진 원천 파일의 읽기 위치 항목은 읽기 위치 상태에서 정리한다.
  kind: functional
  source: 사라진 원천 파일의 읽기 위치는 함께 정리한다.
- id: REQ-29
  text: 리포트 기간은 세션 칸(5시간)·하루(24시간)·주간(7일) 세 가지를 지원한다.
  kind: functional
  source: '리포트 기간은 셋이다: 세션 칸(5시간), 하루(24시간), 주간(7일).'
- id: REQ-30
  text: 리포트 기간이 원시 레코드 보존 범위 안이면 원시 레코드로 집계한다.
  kind: functional
  source: 기간이 원시 레코드 보존 범위 안이면 원시 레코드로
- id: REQ-31
  text: 리포트 기간이 원시 레코드 보존 범위를 벗어나면 일 요약으로 집계한다.
  kind: functional
  source: 벗어나면 일 요약으로 집계한다.
- id: REQ-32
  text: 일 요약으로도 답할 수 없는 기간은 0이 아니라 값 없음으로 표시한다.
  kind: functional
  source: 일 요약으로도 답할 수 없는 기간은 값 없음으로 표시한다. 0으로 적으면 "안 썼다"로 읽힌다.
- id: REQ-33
  text: 리포트에 모델별 분해(토큰 종류별, 비용)가 포함된다.
  kind: functional
  source: 리포트에는 모델별 분해(토큰 종류별, 비용)와
- id: REQ-34
  text: 리포트에 최근 30일의 일별 추이가 포함된다.
  kind: functional
  source: 일별 추이(최근 30일)가 들어간다.
- id: REQ-35
  text: 리포트에 그것이 나온 저장소 상태(마지막 적재 시각, 레코드 수)가 근거로 붙는다.
  kind: functional
  source: '리포트에는 근거가 붙는다: 어느 저장소 상태(마지막 적재 시각, 레코드 수)에서 나왔는지.'
- id: REQ-36
  text: 같은 저장소 상태에서 리포트를 두 번 만들면 같은 리포트가 나온다.
  kind: nonfunctional
  source: 같은 저장소 상태에서 두 번 만들면 같은 리포트가 나온다.
- id: REQ-37
  text: 리포트의 총 토큰은 저장소의 해당 기간 레코드 합과 같다.
  kind: nonfunctional
  source: 리포트의 총 토큰은 저장소의 해당 기간 레코드 합과 같아야 한다.
- id: REQ-38
  text: 칸별 합계가 총계와 다른 리포트는 생성하지 않는다.
  kind: functional
  source: 칸별 합계가 총계와 다른 리포트는 만들지 않는다.
- id: REQ-39
  text: 원천 파일 하나를 읽지 못해도 나머지 파일로 수집을 계속 진행한다.
  kind: functional
  source: 원천 파일 하나를 읽지 못해도 나머지로 진행한다.
- id: REQ-40
  text: 읽기에 실패한 원천 파일과 실패 이유를 장부에 남긴다.
  kind: functional
  source: 어느 파일이 왜 실패했는지 장부에 남긴다.
- id: REQ-41
  text: 저장소 파일이 깨져 있으면 원천에서 저장소를 다시 지을 수 있다.
  kind: functional
  source: 저장소 파일이 깨져 있으면 원천에서 다시 지을 수 있어야 한다.
- id: REQ-42
  text: 저장소 재구축 시 원시 보존 기한(8일)을 넘긴 과거는 복구할 수 없음을 명시적으로 알린다.
  kind: functional
  source: 원시 보존 기한(8일)을 넘긴 과거는 복구할 수 없다는 사실을 명시적으로 알린다.
- id: REQ-43
  text: 원천 디렉터리가 없으면 오류로 처리하지 않고 빈 저장소로 시작한다.
  kind: functional
  source: 원천 디렉터리가 없으면 빈 저장소로 시작한다. 오류가 아니다.
- id: REQ-44
  text: 기존 수제 구현(tools/usage_server.py)을 이 도구의 대조 기준으로 삼는다.
  kind: constraint
  source: 같은 일을 하는 수제 구현(tools/usage_server.py)이 이미 돌고 있고, 그것이 이 도구의 대조 기준이다.
