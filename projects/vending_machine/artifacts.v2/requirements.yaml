requirements:
- id: REQ-01
  text: 고객은 100원 코인을 투입할 수 있다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-02
  text: 고객은 500원 코인을 투입할 수 있다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-03
  text: 고객은 1000원 코인을 투입할 수 있다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-04
  text: 100원, 500원, 1000원이 아닌 금액의 코인이 투입되면 자판기는 그 코인을 즉시 반환한다.
  kind: functional
  source: 그 외 금액은 즉시 반환한다.
- id: REQ-05
  text: 투입된 코인의 금액은 기존 투입 금액에 누적된다.
  kind: functional
  source: 투입 금액은 누적된다.
- id: REQ-06
  text: 누적 투입 금액은 항상 화면에 표시된다.
  kind: functional
  source: 누적 금액은 항상 화면에 표시된다.
- id: REQ-07
  text: 자판기는 3종류의 음료를 취급한다.
  kind: functional
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-08
  text: 3종류 음료의 가격은 서로 다르다.
  kind: functional
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-09
  text: 재고는 음료 종류별로 개별 관리된다.
  kind: functional
  source: 재고는 종류별로 관리된다.
- id: REQ-10
  text: 누적 투입 금액이 해당 음료 가격 이상이고 해당 음료 재고가 1개 이상일 때 그 음료의 선택 버튼이 활성화된다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-11
  text: 누적 투입 금액이 해당 음료 가격 미만이거나 해당 음료 재고가 0이면 그 음료의 선택 버튼은 비활성 상태이다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-12
  text: 활성화된 선택 버튼이 눌리면 자판기는 해당 음료를 배출한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-13
  text: 음료 배출 시 누적 투입 금액이 음료 가격보다 크면 차액을 거스름돈으로 함께 반환한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-14
  text: 자판기는 거스름돈용 동전을 100원, 500원, 1000원 액면가별 개수로 보유한다.
  kind: functional
  source: 자판기는 거스름돈용 동전을 액면가(100원, 500원, 1000원)별 개수로 보유한다.
- id: REQ-15
  text: 동전 보유량은 명세된 규칙(수납, 지급, 보충) 이외의 경로로는 변경되지 않는다.
  kind: constraint
  source: 이 보유량은 아래 규칙에 따라서만 변한다.
- id: REQ-16
  text: 자판기가 코인을 받아들이면 해당 액면가의 보유 개수가 1 증가한다.
  kind: functional
  source: 자판기가 받아들인 코인은 그 액면가의 보유 개수에 1개 더해진다.
- id: REQ-17
  text: 거스름돈 또는 반환 금액 지급에 사용한 동전은 해당 액면가의 보유 개수에서 사용한 개수만큼 차감된다.
  kind: functional
  source: 자판기가 거스름돈이나 반환 금액을 내줄 때, 지급에 사용한 동전은 액면가별로 보유 개수에서 그만큼 뺀다.
- id: REQ-18
  text: 비액면가 코인은 보유량에 더해지지 않고 투입된 코인이 그대로 반환된다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(비액면가, ...)은 보유량에 더해지지 않는다. 들어온 그 코인이 그대로 나간다.
- id: REQ-19
  text: 인식에 실패한 코인은 보유량에 더해지지 않고 투입된 코인이 그대로 반환된다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(..., 인식 실패, ...)은 보유량에 더해지지 않는다. 들어온 그 코인이
    그대로 나간다.
- id: REQ-20
  text: 판매 중지 상태에서 투입된 코인은 보유량에 더해지지 않고 투입된 코인이 그대로 반환된다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(..., 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에 더해지지 않는다.
- id: REQ-21
  text: 관리 모드에서 투입된 코인은 보유량에 더해지지 않고 투입된 코인이 그대로 반환된다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(..., 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에 더해지지 않는다.
- id: REQ-22
  text: 어느 시점에나 동전 보유량 합계는 (초기 보유액 + 보충된 금액 + 판매된 음료 가격의 합)과 같다.
  kind: constraint
  source: 어느 시점에나 보유량 합계는 (초기 보유액 + 보충된 금액 + 판매된 음료 가격의 합)과 같다.
- id: REQ-23
  text: 보유 동전으로 거스름돈 금액을 구성할 수 없으면 자판기는 음료를 배출하지 않는다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-24
  text: 보유 동전으로 거스름돈 금액을 구성할 수 없으면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-25
  text: 고객이 반환 레버를 조작하면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 고객은 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다.
- id: REQ-26
  text: 3종류 음료의 재고가 모두 0이 되면 자판기는 판매 중지 상태로 전환된다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-27
  text: 판매 중지 상태에서 자판기는 투입된 코인을 받아들이지 않는다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-28
  text: 관리자는 전용 키를 사용해 관리 모드로 진입할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-29
  text: 관리 모드에서 관리자는 음료 재고를 보충할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-30
  text: 관리 모드에서 관리자는 동전 보유량을 보충할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-31
  text: 보충이 완료되면 자판기는 관리 모드에서 판매 상태로 전환된다.
  kind: functional
  source: 보충이 끝나면 판매 상태로 돌아간다.
- id: REQ-32
  text: 선택 버튼이 눌린 시점부터 음료 배출이 시작될 때까지의 시간은 2초를 초과하지 않는다.
  kind: nonfunctional
  source: 버튼을 누른 뒤 배출이 시작될 때까지 2초를 넘지 않는다.
- id: REQ-33
  text: 정전 후 재기동하면 누적 투입 금액은 0으로 초기화된다.
  kind: functional
  source: 정전 후 재기동 시 투입 중이던 금액은 반환된 것으로 간주하고 0에서 시작한다.
- id: REQ-34
  text: 정전 시점에 투입 중이던 금액은 반환된 것으로 간주한다. [모호] 실제 물리적 반환 동작 및 보유량 반영 여부는 문서에 명시되지 않음
  kind: constraint
  source: 정전 후 재기동 시 투입 중이던 금액은 반환된 것으로 간주하고 0에서 시작한다.
- id: REQ-35
  text: 제어 소프트웨어는 외부 네트워크에 연결하지 않는다.
  kind: constraint
  source: 외부 네트워크에 연결하지 않는다.
- id: REQ-36
  text: 모든 처리는 기기 내부에서 완결된다.
  kind: constraint
  source: 모든 처리는 기기 내부에서 끝난다.
- id: REQ-37
  text: 자판기는 동시에 한 명의 고객 거래만 처리한다.
  kind: constraint
  source: 동시에 한 명의 고객만 상대한다.
- id: REQ-38
  text: 개발 대상은 기존 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버) 위에서 동작하는 제어 소프트웨어에 한정된다.
  kind: constraint
  source: 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버)는 이미 있고, 그 위에서 도는 제어 소프트웨어만 대상이다.
