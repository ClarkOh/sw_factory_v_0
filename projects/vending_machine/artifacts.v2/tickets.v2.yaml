    돈이 새지는 않지만, 연속 구매를 하려고 배출 중에 코인을 넣은 고객의 코인이 계속 반환구로 떨어져 사용성이 나빠지고, 요구사항 8번의 열거가
    실제 제품과 불일치한 채 남는다. 문서 하나만 보고 다른 팀이 회계·감사 규칙을 만들면 거부 사유 개수부터 어긋난다.


