    coins_at_outage. 즉 refunded 라는 하나의 관측값이 실제 지급(pay_out)과 기록만(record_as_returned)
    두 가지를 겸하고 있어 테스트가 둘을 구별할 수 없다. REQ-34 는 [모호] 로 표시되어 있는데 물리적 반환을 하지 않는다 쪽으로 구현이
    확정되어 있다.


    **영향**

    정전 시점에 이미 하드웨어가 음료를 내보냈다면 실물은 나갔는데 재고 장부는 줄지 않아 SOLD_OUT 판정과 재고 보고가 계속 어긋난다. 동시에
    고객 돈은 반환됨 으로 기록만 되고 실제로는 동전통에 남아, 로그상 반환 완료인데 고객은 한 푼도 못 받는다.


    **제안**

    REQ-34 를 확정할 것 - 다음 두 문장 중 하나를 문서에 명시: (a) ''재기동 시 정전 시점의 투입 금액을 반환구로 물리적으로 지급하고
    사용한 동전을 보유 개수에서 차감한다.'' (b) ''반환 간주 금액은 지급하지 않고 회수 대상으로 별도 기록하며 보유량에 포함한다.'' 아울러
    ''배출을 개시한 뒤 완료 전에 전원이 끊긴 경우 재기동 시 해당 음료의 재고를 어떻게 처리하는지'' 를 규정할 것. 관측값도 지급 과 기록
    을 분리할 것(refunded / recorded_as_returned).


    **참조** REQ-34, REQ-17, REQ-22, REQ-33, T-007, T-001, T-003, tests/e2e/test_scenarios.py::test_uc05_alt_power_lost_while_dispensing,
