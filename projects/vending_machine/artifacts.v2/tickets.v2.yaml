    - 동작: `coins = compose_payout(credit); pay_out(coins); coin_count -= coins; credit
    = 0; display(credit); refresh_buttons()`


    유스케이스: [UC-02] 음료 구매하기


    인수 조건:

    - 등록된 음료 종류 수 = 3 이다.

    - 음료 3종의 가격은 서로 달라 서로 다른 값 3개를 이룬다.

    - 재고는 음료 종류별로 각각 조회·차감되며, 한 종류의 배출은 다른 종류의 재고 값을 변경하지 않는다.

    - 활성화된 버튼을 누르면 배출구에서 해당 종류의 음료 1개가 배출된다.

    - 배출 후 해당 음료 재고 = 배출 전 재고 - 1 이다.

    - 누적 투입 금액 1000원, 음료 가격 700원인 거래에서 배출과 함께 반환구 금액 합계 = 300원이다.

