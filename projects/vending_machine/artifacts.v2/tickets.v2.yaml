    REQ-25 의 원문은 "고객은 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다" 이다. 그런데 T-041 의 notes 는 "[미규정
    REQ-25] 관리 모드에서의 반환 레버 동작이 명시되지 않아 지급 없이 상태를 유지한다" 로 적고, 구현은 `_action_noop` 을
    붙였다(app/vending_machine.py:1059). tests/test_fsm.py::test_t_041 은 이를 기대값으로 굳혀
    `vm.refunded == []`, `vm.credit == 500` 을 단언하고, tests/e2e/test_scenarios.py::test_uc04_main_flow_restock_then_resume_sales(:888)도
    같은 동작을 정상으로 적는다. AWAITING 에서의 T-028 도 같은 이유로 지급하지 않는다.


