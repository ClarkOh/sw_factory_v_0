- key: SWF-153
  type: bug
  title: '[검토/medium] 재고 보충이 음료 종류를 검증하지 않아 팔 수 없는 유령 재고가 생기고 판매 중지가 풀린다'
  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    T-036 의 guard 도 `all(qty[d] >= 0)` 뿐이며(app/vending_machine.py:388), 구현 `_action_restock_drinks`(app/vending_machine.py:424)는
    `vm._stock.get(drink, 0) + count` 로 등록되지 않은 음료 id 에도 재고를 만든다. `total_stock`(app/vending_machine.py:1127)은
    stock 전체의 합이므로 유령 재고가 여기에 포함되고, T-039 의 guard `total_stock > 0` 이 참이 되어 IDLE(판매
    상태)로 나간다. 반면 `_refresh_buttons`(app/vending_machine.py:1191)는 `_prices` 만 순회하므로
    그 음료의 버튼은 영원히 켜지지 않는다. 이 입력도 진입점에서 `RESTOCK_DRINKS qty.Z=5` 로 그대로 들어간다. 어떤 테스트도
    등록되지 않은 음료 id 로 보충하지 않는다(무작위 생성기는 DRINKS 만 쓴다, tests/e2e/test_scenarios.py:1276).


    **영향**

    관리자의 오타 한 번으로 재고가 실제로는 0 인데 "재고 합계 > 0" 이라 판매 상태로 복귀하는 기기가 만들어진다. 이 기기는 코인을 정상
    수납하지만(REQ-27 의 보호가 걸리지 않는다) 어떤 버튼도 켜지지 않아 고객은 반환 레버를 당길 수밖에 없고, 재고가 0 이 되어도 판매
    중지로 돌아가지 못한다 (REQ-26 무력화). 등록 음료가 4 종이 되어 REQ-07 도 깨진다.


    **제안**

