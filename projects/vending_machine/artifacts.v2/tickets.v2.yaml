    **근거**

    요구사항 8번 / REQ-18~21 은 자판기가 되돌려 보내는 코인을 (비액면가, 인식 실패, 판매 중지 상태, 관리 모드) 네 가지로 열거한다.
    ''배출 진행 중''은 그 목록에 없으므로 REQ-01 / REQ-05 / REQ-16 에 따르면 수납되어야 한다. 그런데 T-029 는 notes
    에 "[미규정 REQ-16] 배출 진행 중 코인 투입 처리 규칙이 명시되지 않아 수납하지 않고 반환한다" 라고 적고 반환을 택했고, 구현 `_action_eject_any_coin`(app/vending_machine.py:189)과
    tests/test_fsm.py::test_t_029 · test_uc01_alt_no_intake_while_dispensing_or_sold_out
