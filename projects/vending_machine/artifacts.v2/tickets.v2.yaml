  type: bug
  title: '[검토/high] 보존 법칙 불변식이 absorbed 항으로 완화되어 돈이 새는 경로를 정당화한다'
  description: '**분류** vacuous-test

    **심각도** high


    **근거**

    REQ-22 는 보유량 합계 = 초기 보유액 + 보충된 금액 + 판매된 음료 가격의 합 이다. 그런데 tests/e2e/test_scenarios.py
    의 _Ledger.expected_coin_value 는 여기에 credit 과 absorbed 를 더한 값을 기대값으로 쓰고, _Ledger.record
    는 POWER_RESTORED 와 RESTOCK_COMPLETED 시점의 before credit 을 absorbed 에 그대로 적립한다.
    즉 F-01 과 F-04 에서 돈이 사라지는 바로 그 두 경로가 불변식의 항으로 편입되어 있다. 이 항의 값은 명세가 아니라 구현이 그렇게
    동작한다는 관찰에서 나왔다.


    **영향**

    돈이 새는 결함을 잡으라고 만든 유일한 회계 테스트가, 실제로 새는 두 경로를 예외로 인정하도록 작성되어 있다. 앞으로 같은 종류의 결함(지급
    없이 잔액을 삼키는 새 경로)이 추가되어도 absorbed 에 한 줄 더하면 초록을 유지할 수 있다.


    **제안**

    absorbed 항을 제거하고, REQ-22 의 등식 그대로(초기 + 보충 + 판매가격 + 미정산 잔액)만 허용하도록 되돌릴 것. 그 상태에서
    실패하는 경로가 F-01 / F-04 이며, 그것은 테스트가 아니라 명세와 구현에서 고쳐야 한다.


