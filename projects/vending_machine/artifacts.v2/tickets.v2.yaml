- key: SWF-155
  type: bug
  title: '[검토/low] 보존 법칙 등식(REQ-22)에 ''아직 정산되지 않은 투입 금액'' 항이 빠져 있어 등식 자체가 성립하지 않는다'
  description: '**분류** missing-rule

    **심각도** low


    **근거**

    요구사항 9번 / REQ-22 는 "어느 시점에나 보유량 합계 = 초기 보유액 + 보충된 금액 + 판매된 음료 가격의 합" 이라고 쓰여 있다.
    그러나 REQ-16 에 따라 수납된 코인은 즉시 보유량에 더해지므로, 고객이 코인을 넣고 아직 사지 않은 모든 시점에 이 등식은 투입액만큼
    어긋난다. 테스트는 이 구멍을 스스로 메웠다 — `_Ledger.expected_coin_value(credit)`(tests/e2e/test_scenarios.py:1382)가
    문서에 없는 `+ credit` 항을 더한다.


    **영향**

    문서의 등식을 그대로 현금 정산 규칙이나 런타임 감사 로직으로 구현하면 거래 진행 중인 모든 시점에 불일치 경보가 뜬다. 반대로 테스트가 임의로
    더한 항을 아무도 검토하지 않으면, 나중에 또 다른 항이 추가되어(과거의 absorbed 항처럼) 돈이 새는 경로가 다시 기대값으로 승격될
    여지가 남는다.


    **제안**

    요구사항 9번을 다음으로 고칠 것. "어느 시점에나 보유량 합계는 (초기 보유액 + 보충된 금액 + 판매된 음료 가격의 합 + 아직 정산되지
    않은 누적 투입 금액)과 같다. 이 밖의 항은 없다."


    **참조** REQ-22, REQ-16, tests/e2e/test_scenarios.py::test_invariant_coin_holdings_follow_conservation_law


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
