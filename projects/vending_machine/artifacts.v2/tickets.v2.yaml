- key: SWF-152
  type: bug
  title: '[검토/medium] 동전 보충이 액면가를 검증하지 않아 100/500/1000 이 아닌 동전이 보유량에 들어가고 거스름돈으로 나간다'
  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    T-037 의 guard 는 `all(counts[x] >= 0)` 뿐이다(app/vending_machine.py:399). FSM 의 action
    은 "for x in [100,500,1000]" 이라고 액면가를 고정해 두었는데, 구현 `_action_refill_coins`(app/vending_machine.py:443)는
    payload 의 키를 그대로 순회해 `vm._coins[denom] = vm._coins.get(denom, 0) + count` 를 실행한다.
    따라서 counts={50: 3} 같은 지시가 guard 를 통과해 50원이 보유량에 들어가고, `_compose_payout`(app/vending_machine.py:69)은
    `sorted(coins, reverse=True)` 로 보유 액면가를 모두 쓰므로 그 50원이 거스름돈으로 지급된다. 이 입력은 `python
    -m app` 진입점에서도 `REFILL_COINS counts.50=3` 으로 그대로 들어간다 (app/__main__.py:44 `_convert_key`).
    이를 잡을 단언 (`set(after["coins"]) <= {100, 500, 1000}`, tests/e2e/test_scenarios.py:1504)은
    존재하지만, 입력 생성기 `_random_event`(:1281)가 100/500/1000 만 만들기 때문에 실패할 수 없는 상태로 놓여 있다.


    **영향**

    관리자가 보충 화면에서 액면가를 잘못 지정하면(또는 상위 시스템이 50원·10원 칸을 넘기면) 기기가 스스로는 받지 않는 코인(REQ-04
    에 따라 즉시 반환하는 코인)을 거스름돈으로 고객에게 내준다. 고객은 그 코인을 다시 넣을 수 없고, 보유량 액면가 구성(REQ-14)과 지급
    규칙(REQ-17)이 동시에 깨진다.


    **제안**

    요구사항 13번(동전 보충)에 다음 문장을 추가할 것. "동전 보충은 100원, 500원, 1000원 액면가에 대해서만 지시할 수 있다. 그
    밖의 액면가가 포함된 보충 지시는 전체를 거부하고 보유량을 변경하지 않는다." 그리고 T-037 의 guard 를 `all(x in [100,500,1000]
    and counts[x] >= 0)` 으로 강화하고, 무작위 이벤트 생성기가 액면가 밖의 보충을 실제로 흘리도록 할 것.


    **참조** REQ-14, REQ-15, REQ-30, T-037, tests/e2e/test_scenarios.py::test_invariant_coin_holdings_stay_physically_possible


