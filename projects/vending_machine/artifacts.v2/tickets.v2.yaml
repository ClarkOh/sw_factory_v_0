- key: SWF-156
  type: bug
  title: '[검토/low] 재기동 시 판매 중지 여부를 외부에서 준 total_stock 이 정하므로 실제 재고와 어긋난 상태로 기동할 수
    있다'
  description: '**분류** missing-rule

    **심각도** low


    **근거**

    FSM 은 POWER_RESTORED 의 payload 에 `total_stock` 을 두었고, 구현의 `_guard_power_restored`(app/vending_machine.py:51)는
    `payload.get("total_stock", vm.total_stock)` 로 payload 값을 우선한다. 재고는 기기 내부가 보유한
    값인데(외부 전원 공급 설비가 알 수 없다) 요구사항에는 누가 이 값을 알려주는지에 대한 규칙이 없다. 테스트는 항상 일관된 값 (`total_stock=vm.total_stock`
    또는 픽스처와 같은 수)을 넘기므로 불일치가 드러나지 않는다.


    **영향**

    재기동 시 total_stock 을 실제와 다르게 넘기면(상위 제어기 버그·구성 오류) 재고가 남았는데 판매 중지로 기동해 매출이 멎거나,
    재고가 0 인데 판매 상태로 기동해 코인을 계속 수납하면서 아무 음료도 팔지 못한다(REQ-26 / REQ-27 위반). 후자는 고객이 반환
    레버를 당길 때까지 돈을 물고 있는 상태다.


    **제안**

    요구사항 15번에 다음 문장을 추가하고 POWER_RESTORED payload 에서 total_stock 을 제거할 것. "재기동 시 판매
    상태와 판매 중지 상태의 판정은 기기 내부에 보존된 음료 종류별 재고로만 한다."


    **참조** REQ-26, REQ-27, REQ-33, T-001, T-002, T-003, T-004, tests/e2e/test_scenarios.py::test_uc05_alt_restart_without_credit_and_while_sold_out


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
