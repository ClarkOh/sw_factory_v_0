    11번을 "고객은 판매 상태에서 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다. 관리 모드 진입 시점에 남은 금액은 진입과 함께 전액
    반환된다."로 고쳐 ''언제든''의 범위를 문서에서 먼저 좁힐 것.


