  type: bug
  title: '[검토/high] 잔액을 들고 관리 모드에 들어가면 고객 돈이 반환 없이 사라진다'
  description: '**분류** guessed-spec

    **심각도** high


    **근거**

    T-024(HAS_CREDIT --ADMIN_KEY_INSERTED[valid_key]--> ADMIN_MODE)는 잔액을 보존한 채 진입하고,
    ADMIN_MODE 의 반환 레버 T-041 은 guard 없이 _action_noop 이며, 보충 완료 T-039 / T-040 의 _action_clear_credit(app/vending_machine.py:477)
    은 credit 을 0 으로 만들 뿐 지급 action 이 없다. 투입된 코인은 T-017 로 이미 coin_count 에 더해진 뒤다. tests/e2e/test_scenarios.py::test_uc04_alt_entering_admin_mode_with_credit_absorbs_it
    은 600원을 넣고 관리 모드를 거친 뒤 coin_value(vm) == initial_value + 600, vm.refunded == []
    을 그대로 기대값으로 못박고 있다. FSM 의 T-024 notes 도 ''[미규정 REQ-29] 잔액 처리 규칙이 명시되지 않아 잔액은 변경하지
    않는다'' 고 스스로 적고 있다. 덤으로 진입 순간 display 가 ADMIN_MODE 로 바뀌어 잔액 600원이 화면에서 사라지므로 REQ-06(누적
    금액은 항상 표시) 도 깨진다.


    **영향**

    고객이 코인을 넣은 상태에서 관리자가 키를 꽂으면 그 돈은 반환구로 나오지 않고 동전통에 흡수된다. 고객은 반환 레버를 당겨도(REQ-25
    - 언제든 전액을 돌려받을 수 있다) 아무 일도 일어나지 않는다. 매일 보충하는 자판기에서 상시 발생하는 소액 착복이며, 회계상으로는 팔지
    않은 돈이 매출처럼 쌓인다.


    **제안**

    요구사항에 다음 문장을 추가할 것: ''관리 모드 진입 요청 시 진행 중인 거래의 누적 투입 금액이 0보다 크면 자판기는 관리 모드로 전환하기
    전에 그 전액을 반환구로 지급하고 사용한 동전을 보유 개수에서 차감한다.'' 아울러 REQ-25 의 언제든 을 관리 모드까지 포함할 것인지
