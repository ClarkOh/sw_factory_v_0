- key: SWF-5
  type: epic
  title: '[UC-05] 정전 후 재기동하기'
  description: '**액터** 외부 전원 공급 설비

    **사전조건** 자판기가 동작 중 전원 공급이 중단되었고, 중단 시점에 누적 투입 금액이 0 이상이다.

    **사후조건** 자판기가 누적 투입 금액 0인 상태로 기동하여 판매 상태 또는 판매 중지 상태로 서비스를 재개한다.


    **주 흐름**

    - 1. 외부 전원 공급 설비가 전원 공급을 중단한다.

    - 2. 시스템이 동작을 정지한다.

    - 3. 외부 전원 공급 설비가 전원 공급을 재개한다.

    - 4. 시스템이 기동하여 누적 투입 금액을 0으로 설정한다.

    - 5. 시스템이 정전 시점의 투입 중이던 금액을 반환된 것으로 간주하여 기록한다.

    - 6. 시스템이 누적 투입 금액 0을 화면에 표시한다.

    - 7. 시스템이 재고 상태에 따라 판매 상태 또는 판매 중지 상태로 전환하고 선택 버튼 상태를 갱신한다.


    **대안/예외 흐름**

    - 3a. 재기동 시점에 음료 3종 재고가 모두 0인 경우 시스템은 판매 중지 상태로 기동하고 코인을 받지 않는다.

    - 4a. 정전 시점의 누적 투입 금액이 0이었던 경우 시스템은 반환 간주 처리 없이 누적 투입 금액 0으로 기동한다.

    - 5a. [모호: REQ-34] 반환 간주 금액의 물리적 반환 동작 수행 여부와 동전 보유량 반영 여부가 요구사항에 명시되지 않은 경우,
    시스템은 해당 처리를 수행하기 전에 명세 확정을 요구한다.


    **인수 조건**

    - 정전 전 누적 투입 금액이 700원이었더라도 재기동 직후 화면의 누적 투입 금액 = 0원이다.

    - 재기동 직후 모든 음료 선택 버튼 상태 = 비활성이다.

    - 재기동 직후 정전 시점 투입 금액은 ''반환됨''으로 표시되며 누적 투입 금액에 포함되지 않는다.

    - REQ-34의 물리적 반환 수행 여부 및 보유량 반영 규칙이 확정되기 전까지 해당 동작에 대한 테스트는 미결(pending)로 보고된다.

    - 재기동 후 재고 합계 = 0 이면 코인 투입 시 그 코인이 반환구로 반환된다.'
