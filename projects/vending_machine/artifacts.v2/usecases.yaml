usecases:
- id: UC-01
  title: 코인 투입하기
  actor: 고객
  precondition: 자판기에 전원이 들어와 있고 코인 투입구가 사용 가능하다.
  postcondition: 투입된 코인은 수납되어 누적 투입 금액에 반영되거나, 수납되지 않고 그 코인이 그대로 반환구로 반환되어 있다.
  main_flow:
  - 1. 고객이 코인 투입구에 코인 1개를 투입한다.
  - 2. 시스템이 투입된 코인의 액면가를 인식한다.
  - 3. 시스템이 인식된 액면가가 100원, 500원, 1000원 중 하나임을 확인하고 코인을 수납한다.
  - 4. 시스템이 해당 액면가의 동전 보유 개수를 1 증가시킨다.
  - 5. 시스템이 누적 투입 금액에 해당 액면가를 더한다.
  - 6. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.
  - 7. 시스템이 음료 3종 각각에 대해 선택 버튼의 활성/비활성 상태를 갱신한다.
  alt_flows:
  - 1a. 자판기가 판매 중지 상태인 경우 시스템은 코인을 받아들이지 않고 투입된 코인을 그대로 반환구로 반환하며, 동전 보유량과 누적 투입 금액을
    변경하지 않는다.
  - 1b. 자판기가 관리 모드인 경우 시스템은 코인을 받아들이지 않고 투입된 코인을 그대로 반환구로 반환하며, 동전 보유량과 누적 투입 금액을
    변경하지 않는다.
  - 1c. 이미 진행 중인 고객 거래가 있는 경우 시스템은 새 거래를 시작하지 않고 투입을 진행 중인 거래의 누적 투입 금액에만 반영한다.
  - 2a. 코인 인식에 실패한 경우 시스템은 투입된 코인을 그대로 반환구로 반환하고, 동전 보유량과 누적 투입 금액을 변경하지 않는다.
  - 3a. 인식된 금액이 100원, 500원, 1000원이 아닌 경우 시스템은 해당 코인을 즉시 그대로 반환구로 반환하고, 동전 보유량과 누적
    투입 금액을 변경하지 않는다.
  acceptance:
  - 판매 상태에서 100원 코인 투입 후, 화면의 누적 투입 금액 = 투입 전 누적 금액 + 100 이다.
  - 판매 상태에서 500원 코인 투입 후, 화면의 누적 투입 금액 = 투입 전 누적 금액 + 500 이다.
  - 판매 상태에서 1000원 코인 투입 후, 화면의 누적 투입 금액 = 투입 전 누적 금액 + 1000 이다.
  - 판매 상태에서 액면가 코인 n개를 연속 투입하면 화면의 누적 투입 금액 = 각 코인 액면가의 합이다.
  - 액면가 X원 코인이 수납된 직후, X원 액면가 보유 개수 = 수납 전 개수 + 1 이고 다른 액면가 보유 개수는 불변이다.
  - 50원 코인을 투입하면 반환구에서 50원 코인 1개가 회수되고, 누적 투입 금액과 모든 액면가 보유 개수가 투입 전과 동일하다.
  - 인식 실패로 처리된 코인은 반환구에서 동일한 코인 1개로 회수되고, 누적 투입 금액과 모든 액면가 보유 개수가 투입 전과 동일하다.
  - 판매 중지 상태에서 액면가 코인을 투입하면 그 코인이 반환구로 반환되고, 누적 투입 금액은 0을 유지하며 보유 개수는 불변이다.
  - 관리 모드에서 액면가 코인을 투입하면 그 코인이 반환구로 반환되고, 누적 투입 금액과 보유 개수는 불변이다.
  - 누적 투입 금액이 변한 모든 시점에 화면 표시 금액 = 내부 누적 투입 금액 값이다.
  - 누적 투입 금액이 음료 A의 가격 이상이고 음료 A 재고 >= 1 이면 음료 A 선택 버튼 상태 = 활성이다.
  - 누적 투입 금액이 음료 A의 가격 미만이거나 음료 A 재고 = 0 이면 음료 A 선택 버튼 상태 = 비활성이다.
  - 구현 산출물은 기존 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버) 인터페이스를 호출하는 제어 소프트웨어이며, 하드웨어 변경을 요구하지
    않는다.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-06
  - REQ-10
  - REQ-11
  - REQ-14
  - REQ-16
  - REQ-18
  - REQ-19
  - REQ-20
  - REQ-21
  - REQ-27
  - REQ-37
  - REQ-38
- id: UC-02
  title: 음료 구매하기
  actor: 고객
  precondition: 자판기가 판매 상태이고, 서로 다른 가격의 음료 3종이 등록되어 있으며, 누적 투입 금액이 0보다 크고 선택 버튼이 활성화된
    음료가 1종 이상 있다.
  postcondition: 선택한 음료 1개가 배출되고 재고가 1 차감되며 거스름돈이 지급되고 누적 투입 금액이 0이 되거나, 배출 없이 누적
    투입 금액 전액이 반환되고 누적 투입 금액이 0이 된다.
  main_flow:
  - 1. 고객이 활성화된 음료 선택 버튼을 누른다.
  - 2. 시스템이 거스름돈 금액(누적 투입 금액 - 해당 음료 가격)을 보유 동전으로 구성할 수 있는지 판정한다.
  - 3. 시스템이 버튼 입력 시점부터 2초 이내에 해당 음료의 배출을 시작한다.
  - 4. 시스템이 해당 음료 종류의 재고를 1 차감한다.
  - 5. 시스템이 거스름돈 금액이 0보다 크면 해당 금액을 반환구로 지급하고, 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 6. 시스템이 누적 투입 금액을 0으로 만들고 화면에 표시한다.
  - 7. 시스템이 음료 3종의 선택 버튼 상태를 갱신한다.
  alt_flows:
  - 1a. 고객이 비활성 상태의 버튼을 누른 경우 시스템은 배출하지 않고 재고, 누적 투입 금액, 동전 보유량을 변경하지 않는다.
  - 2a. 보유 동전으로 거스름돈 금액을 구성할 수 없는 경우 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환구로 반환하며, 지급에
    사용한 동전 개수만큼 액면가별 보유 개수를 차감하고 재고를 변경하지 않는다.
  - 4a. 차감 결과 음료 3종의 재고가 모두 0이 된 경우 시스템은 판매 중지 상태로 전환하고 이후 투입되는 코인을 받지 않는다.
  acceptance:
  - 등록된 음료 종류 수 = 3 이다.
  - 음료 3종의 가격은 서로 달라 서로 다른 값 3개를 이룬다.
  - 재고는 음료 종류별로 각각 조회·차감되며, 한 종류의 배출은 다른 종류의 재고 값을 변경하지 않는다.
  - 활성화된 버튼을 누르면 배출구에서 해당 종류의 음료 1개가 배출된다.
  - 배출 후 해당 음료 재고 = 배출 전 재고 - 1 이다.
  - 누적 투입 금액 1000원, 음료 가격 700원인 거래에서 배출과 함께 반환구 금액 합계 = 300원이다.
  - 누적 투입 금액 = 음료 가격인 거래에서 반환구 지급 금액 = 0원이다.
  - 거스름돈 지급 후, 각 액면가 보유 개수 = 지급 전 개수 - 그 액면가로 지급한 개수이다.
  - '보유 동전 조합으로 거스름돈 금액을 구성할 수 없는 입력(예: 거스름돈 300원 필요, 100원 보유 0개)에서 배출 개수 = 0이고 반환구
    금액 = 누적 투입 금액 전액이며 재고는 불변이다.'
  - 비활성 버튼 입력 후 배출 개수 = 0, 재고 불변, 누적 투입 금액 불변이다.
  - 버튼 입력 시각과 배출 시작 시각의 차 <= 2000ms 이다.
  - 3종 재고가 모두 0이 된 직후 자판기 상태 = 판매 중지이다.
  - 임의 시점의 동전 보유량 합계 = 초기 보유액 + 보충된 금액 합 + 판매된 음료 가격의 합 이다.
  - 동전 보유량 변경 이력의 모든 항목은 수납(REQ-16), 지급(REQ-17), 보충(REQ-30) 중 하나에 해당한다.
  - 거래 처리 전 구간에서 제어 소프트웨어가 발생시킨 외부 네트워크 연결 시도 횟수 = 0이다.
  - 거래 판정에 필요한 모든 데이터(가격, 재고, 보유 동전)는 기기 내부 저장소에서 조회되며 외부 시스템 호출 없이 거래가 완결된다.
  requirements:
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-15
  - REQ-17
  - REQ-22
  - REQ-23
  - REQ-24
  - REQ-26
  - REQ-32
  - REQ-35
  - REQ-36
- id: UC-03
  title: 투입 금액 반환받기
  actor: 고객
  precondition: 자판기에 전원이 들어와 있고 누적 투입 금액이 0보다 크다.
  postcondition: 누적 투입 금액 전액이 반환구로 지급되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전만큼 보유 개수가 차감되어
    있다.
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.
  - 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 만들고 화면에 표시한다.
  - 5. 시스템이 음료 3종의 선택 버튼 상태를 갱신한다.
  alt_flows:
  - 1a. 누적 투입 금액이 0인 상태에서 반환 레버가 조작된 경우 시스템은 지급하지 않고 동전 보유량과 화면 표시를 변경하지 않는다.
  - 1b. 음료 배출이 진행 중인 시점에 반환 레버가 조작된 경우 시스템은 진행 중인 배출을 완료한 뒤 그 시점의 누적 투입 금액(0원)을 기준으로
    처리하여 추가 지급을 하지 않는다.
  acceptance:
  - 누적 투입 금액 1600원 상태에서 반환 레버 조작 후 반환구 금액 합계 = 1600원이다.
  - 반환 레버 조작 후 화면의 누적 투입 금액 = 0원이다.
  - 반환 지급 후, 각 액면가 보유 개수 = 지급 전 개수 - 그 액면가로 지급한 개수이다.
  - 누적 투입 금액 0원 상태에서 반환 레버 조작 후 반환구 금액 = 0원이고 모든 액면가 보유 개수가 불변이다.
  - 반환 완료 후 음료 3종의 선택 버튼 상태 = 모두 비활성이다.
  requirements:
  - REQ-06
  - REQ-11
  - REQ-17
  - REQ-25
- id: UC-04
  title: 관리 모드에서 재고와 동전 보충하기
  actor: 관리자
  precondition: 자판기에 전원이 들어와 있고 관리자가 전용 키를 소지하고 있다.
  postcondition: 자판기가 판매 상태이며, 보충된 음료 재고와 동전 보유량이 반영되어 있다.
  main_flow:
  - 1. 관리자가 전용 키를 사용해 관리 모드 진입을 요청한다.
  - 2. 시스템이 관리 모드로 전환하고 관리 모드임을 표시한다.
  - 3. 관리자가 음료 종류별 보충 수량을 입력하고 재고 보충을 실행한다.
  - 4. 시스템이 음료 종류별 재고를 보충 수량만큼 증가시킨다.
  - 5. 관리자가 액면가별 보충 개수를 입력하고 동전 보충을 실행한다.
  - 6. 시스템이 액면가별 동전 보유 개수를 보충 개수만큼 증가시킨다.
  - 7. 관리자가 보충 완료를 지시한다.
  - 8. 시스템이 판매 상태로 전환하고 누적 투입 금액 0을 화면에 표시한다.
  alt_flows:
  - 1a. 전용 키 없이 관리 모드 진입이 시도된 경우 시스템은 관리 모드로 전환하지 않고 현재 상태를 유지한다.
  - 3a. 관리자가 재고 보충 없이 동전만 보충하는 경우 시스템은 재고 값을 변경하지 않고 5단계로 진행한다.
  - 5a. 관리자가 동전 보충 없이 재고만 보충하는 경우 시스템은 동전 보유 개수를 변경하지 않고 7단계로 진행한다.
  - 7a. 보충 완료 시점에 음료 3종 재고가 모두 0인 경우 시스템은 판매 중지 상태로 전환한다.
  - 8a. 관리 모드 중 코인이 투입된 경우 시스템은 해당 코인을 그대로 반환구로 반환하고 동전 보유량에 더하지 않는다.
  acceptance:
  - 전용 키 입력 후 자판기 상태 = 관리 모드이다.
  - 전용 키가 없는 진입 시도 후 자판기 상태 = 시도 전 상태와 동일하다.
  - 음료 A에 n개 보충 후, 음료 A 재고 = 보충 전 재고 + n 이고 음료 B, C 재고는 불변이다.
  - 액면가 X원 동전 m개 보충 후, X원 보유 개수 = 보충 전 개수 + m 이고 다른 액면가 보유 개수는 불변이다.
  - 보유량은 액면가 100원, 500원, 1000원 각각의 개수로 조회 가능하다.
  - 보충 완료 지시 후, 재고 합계 > 0 이면 자판기 상태 = 판매 상태이다.
  - 보충 완료 지시 후, 재고 합계 = 0 이면 자판기 상태 = 판매 중지이다.
  - 보충 직후 동전 보유량 합계 = 보충 전 합계 + 보충된 금액 이며, 초기 보유액 + 보충 금액 합 + 판매 음료 가격 합 등식을 만족한다.
  - 관리 모드 중 투입된 코인은 반환구로 회수되고 모든 액면가 보유 개수가 불변이다.
  requirements:
  - REQ-09
  - REQ-14
  - REQ-15
  - REQ-21
  - REQ-22
