usecases:
- id: UC-01
  title: 코인을 투입하여 누적 금액을 올린다
  actor: 고객
  precondition: 자판기가 판매 상태이고 배출 진행 중이 아니다.
  postcondition: 투입한 코인 액면가만큼 누적 투입 금액이 증가하고, 그 액면가의 보유 개수가 1 증가하며, 화면에 갱신된 누적 금액이
    표시된다.
  main_flow:
  - 1. 고객이 코인 투입구에 100원, 500원 또는 1000원 코인을 넣는다.
  - 2. 시스템이 코인의 액면가를 인식하고 받아들인다.
  - 3. 시스템이 누적 투입 금액에 액면가를 더하고 화면에 표시한다.
  - 4. 시스템이 해당 액면가의 동전 보유 개수를 1 증가시킨다.
  - 5. 시스템이 각 음료의 선택 버튼 활성화 여부를 갱신한다(누적 금액 ≥ 가격 이고 재고 ≥ 1 인 음료만 활성).
  alt_flows:
  - 2a. 코인이 100원·500원·1000원 이외의 액면가인 경우 시스템은 그 코인을 그대로 즉시 되돌려 보내고 누적 금액과 보유량을 변경하지
    않는다.
  - 2b. 코인 인식에 실패한 경우 시스템은 그 코인을 그대로 즉시 되돌려 보내고 누적 금액과 보유량을 변경하지 않는다.
  - 2c. 자판기가 판매 중지 상태인 경우 시스템은 그 코인을 그대로 되돌려 보내고 누적 금액과 보유량을 변경하지 않는다.
  - 2d. 자판기가 관리 모드인 경우 시스템은 그 코인을 그대로 되돌려 보내고 누적 금액과 보유량을 변경하지 않는다.
  - 1a. 배출이 진행 중인 상태에서 코인이 투입된 경우 UC-04 로 처리한다.
  acceptance:
  - 누적 0원 상태에서 500원 투입 후 화면 표시값 == 500
  - 누적 500원 상태에서 1000원 투입 후 누적 == 1500 이고 1000원 보유 개수가 투입 전보다 정확히 1 크다
  - 50원 코인 투입 시 코인이 반환되고 누적 금액·모든 액면가 보유 개수가 투입 전과 동일하다
  - 인식 실패 코인 투입 시 코인이 반환되고 누적 금액·보유 개수가 투입 전과 동일하다
  - 판매 중지 상태·관리 모드에서 500원 투입 시 코인이 반환되고 누적 금액·보유 개수가 투입 전과 동일하다
  - 어떤 시점에도 화면에 표시되는 값 == 현재 누적 투입 금액
  - 누적 금액 ≥ 가격 이고 재고 ≥ 1 인 음료 버튼만 활성화 상태이고, 조건 미충족 음료 버튼은 비활성 상태이다
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-08
  - REQ-16
  - REQ-17
  - REQ-19
  - REQ-20
  - REQ-21
  - REQ-22
  - REQ-23
  - REQ-38
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 선택하려는 음료의 버튼이 활성화되어 있다(누적 금액 ≥ 가격, 재고 ≥ 1).
  postcondition: 해당 음료가 배출되고 재고가 1 감소하며, 버튼을 누른 시점의 (누적 금액 − 가격)이 거스름돈으로 지급되고 그만큼
    액면가별 보유 개수가 차감되며, 자판기는 판매 상태로 돌아간다.
  main_flow:
  - 1. 고객이 활성화된 음료 선택 버튼을 누른다.
  - 2. 시스템이 버튼을 누른 시점의 누적 금액에서 음료 가격을 뺀 값을 거스름돈으로 확정한다.
  - 3. 시스템이 보유 동전으로 거스름돈을 구성할 수 있음을 확인한다.
  - 4. 시스템이 2초 이내에 해당 음료의 배출을 개시한다.
  - 5. 시스템이 배출 완료 신호를 받는다.
  - 6. 시스템이 해당 음료의 재고를 1 차감하고 판매된 금액에 음료 가격을 더한다.
  - 7. 거스름돈이 0보다 크면 시스템이 거스름돈을 반환하고 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 8. 시스템이 누적 투입 금액에서 (가격 + 거스름돈)을 차감하고 화면에 표시한 뒤 판매 상태로 돌아간다.
  alt_flows:
  - 1a. 비활성화된 버튼을 누른 경우 시스템은 아무것도 하지 않는다(배출·금액·재고 변화 없음).
  - 3a. 보유 동전으로 거스름돈을 만들 수 없는 경우 시스템은 배출하지 않고 투입 금액 전액을 반환하며, 사용한 동전만큼 보유 개수를 차감하고
    재고를 변경하지 않은 채 판매 상태로 돌아간다.
  - 5a. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우 UC-05 로 처리한다.
  - 5b. 배출 완료를 기다리는 중 코인이 투입된 경우 UC-04 로 처리하며 진행 중인 배출의 거스름돈은 변하지 않는다.
  - 5c. 배출 완료를 기다리는 중 관리자가 전용 키로 관리 모드 진입을 요청한 경우 UC-07 로 처리한다.
  - 6a. 배출 후 모든 음료의 재고가 0이 된 경우 시스템은 판매 중지 상태로 전환한다(UC-11).
  acceptance:
  - 가격 700원 음료, 누적 1000원에서 버튼 누름 → 음료 1개 배출, 재고 −1, 거스름돈 300원 지급, 지급 후 누적 == 0
  - 가격 1000원 음료, 누적 1000원에서 버튼 누름 → 음료 배출되고 거스름돈 지급 동작이 발생하지 않는다
  - 거스름돈 300원 지급에 100원 3개 사용 시 100원 보유 개수가 정확히 3 감소하고 다른 액면가는 변화 없다
  - 가격 700원 음료, 누적 1000원, 100원 보유 0개·500원 보유 0개 → 배출되지 않고 1000원 전액 반환, 재고 변화 없음, 상태
    == 판매
  - 버튼 누름 시각과 배출 개시 시각의 차 ≤ 2초
  - 비활성 버튼을 눌렀을 때 누적 금액·재고·보유량·상태 모두 변화 없음
  requirements:
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-14
  - REQ-18
  - REQ-25
  - REQ-26
  - REQ-55
  - REQ-72
- id: UC-03
  title: 반환 레버로 투입 금액을 돌려받는다
  actor: 고객
  precondition: 자판기가 판매 상태이다.
  postcondition: 누적 투입 금액 전액이 반환되어 누적 금액이 0이 되고 화면에 0이 표시되며, 지급에 사용한 동전만큼 액면가별 보유
    개수가 차감된다.
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 누적 투입 금액 전액을 동전으로 반환한다.
  - 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시하며 모든 음료 버튼을 비활성화한다.
  alt_flows:
  - 1a. 누적 투입 금액이 0인 경우 시스템은 아무것도 반환하지 않고 상태를 유지한다.
  - 1b. 판매 중지 상태나 관리 모드에서 레버가 조작된 경우 시스템은 레버 조작에 반응하지 않는다(반환 대상 금액이 없음).
  acceptance:
  - 누적 1500원 상태에서 레버 조작 → 반환 금액 합계 == 1500, 조작 후 누적 == 0, 화면 표시 == 0
  - 반환에 1000원 1개·500원 1개 사용 시 1000원·500원 보유 개수가 각각 1씩 감소
  - 누적 0원 상태에서 레버 조작 → 반환 동작 없음, 보유량 변화 없음
  - 레버 조작 후 모든 음료 버튼이 비활성 상태
  requirements:
  - REQ-18
  - REQ-27
- id: UC-04
  title: 배출 진행 중에 코인을 투입한다
  actor: 고객
  precondition: 자판기가 어떤 음료의 배출을 개시한 뒤 배출 완료 신호를 기다리고 있다.
  postcondition: 투입된 코인이 수납되어 보유 개수와 누적 투입 금액에 더해지며, 진행 중인 배출의 거스름돈은 변하지 않고, 배출 완료
    후 그 금액이 누적 금액으로 남는다.
  main_flow:
  - 1. 고객이 배출 진행 중에 100원·500원·1000원 코인을 넣는다.
  - 2. 시스템이 코인을 받아들여 해당 액면가 보유 개수를 1 증가시키고 누적 투입 금액에 더해 화면에 표시한다.
  - 3. 시스템이 진행 중인 배출의 거스름돈을 버튼을 누른 시점 기준 금액 그대로 유지한다.
  - 4. 시스템이 배출을 완료하고 확정된 거스름돈만 지급한다.
  - 5. 시스템이 배출 중 투입된 금액을 누적 투입 금액으로 남기고 버튼 활성화 여부를 갱신한다.
  alt_flows:
  - 1a. 비액면가 또는 인식 실패 코인인 경우 시스템은 그 코인을 그대로 되돌려 보내고 아무것도 변경하지 않는다.
  - 4a. 배출이 실패로 처리된 경우 시스템은 (버튼 시점 누적 금액 + 배출 중 투입 금액) 전액을 반환한다(UC-05).
  acceptance:
  - 가격 700원, 누적 1000원에서 버튼 누름 후 배출 중 500원 투입 → 완료 시 거스름돈 == 300, 완료 후 누적 == 500, 화면
    표시 == 500
  - 배출 중 500원 투입 시 500원 보유 개수가 투입 전보다 1 크다
  - 완료 후 남은 500원으로 가격 500원 이하 음료(재고 ≥ 1) 버튼이 활성화된다
  requirements:
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-17
- id: UC-05
  title: 배출 실패를 처리한다
  actor: 배출 장치
  precondition: 자판기가 배출을 개시했고 아직 배출 완료 신호를 받지 못했다.
  postcondition: 재고가 차감되지 않고 누적 투입 금액 전액이 반환되어 0이 되며, 자판기는 판매 상태로 돌아간다. 이후 도착한 완료
    신호는 지연 배출로만 기록된다.
  main_flow:
  - 1. 배출 장치가 배출 개시 후 10초 안에 배출 완료 신호를 보내지 않는다.
  - 2. 시스템이 배출 실패로 처리하고 해당 음료의 재고를 차감하지 않는다.
  - 3. 시스템이 누적 투입 금액 전액을 반환하고 사용한 동전만큼 액면가별 보유 개수를 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 하여 화면에 표시하고 판매 상태로 돌아간다.
  alt_flows:
  - 4a. 배출 실패 처리 후 배출 장치로부터 배출 완료 신호가 도착한 경우 시스템은 상태·재고·금액을 변경하지 않고 그 신호를 '지연 배출'(음료
    종류, 시각)로 기록한다.
  - 3a. 전액 반환에 필요한 동전이 부족한 경우에도 시스템은 보유 동전으로 가능한 조합으로 반환하며 요구사항 상 별도 규정이 없으므로 나머지는
    반환 불가로 남긴다(명세 미정 사항으로 관리자에게 표시).
  acceptance:
  - 배출 개시 후 10초 경과까지 완료 신호 없음 → 상태 == 판매, 재고 == 배출 전 값, 누적 == 0, 반환 금액 == 버튼 시점 누적
    + 배출 중 투입 금액
  - 실패 처리 후 완료 신호 도착 → 상태·재고·누적 금액·보유량 모두 신호 도착 전과 동일
  - 실패 처리 후 완료 신호 도착 → 지연 배출 기록 건수가 1 증가
  - 배출 개시 후 9.9초에 완료 신호 도착 → 정상 배출로 처리(재고 −1)
  requirements:
  - REQ-18
  - REQ-30
  - REQ-31
  - REQ-32
  - REQ-33
  - REQ-34
  - REQ-35
- id: UC-06
  title: 무조작 시 투입 금액을 자동 반환한다
  actor: 타이머(시간 경과)
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.
  postcondition: 누적 투입 금액 전액이 반환되어 0이 되고 거래가 종료되며, 지급에 사용한 동전만큼 보유 개수가 차감된다.
  main_flow:
  - 1. 마지막 코인 투입, 음료 선택 또는 반환 레버 조작 이후 30초가 경과한다.
  - 2. 시스템이 누적 투입 금액 전액을 반환하고 사용한 동전만큼 액면가별 보유 개수를 차감한다.
  - 3. 시스템이 누적 투입 금액을 0으로 하여 화면에 표시하고 거래를 종료한다.
  alt_flows:
  - 1a. 30초 이내에 코인 투입, 음료 선택 또는 반환 레버 조작이 발생한 경우 시스템은 타이머를 재시작하고 자동 반환하지 않는다.
  - 1b. 누적 투입 금액이 0인 경우 시스템은 자동 반환을 수행하지 않는다.
  - 1c. 배출 진행 중(완료 대기)인 경우 음료 선택이 마지막 조작이므로 배출 처리(UC-02/UC-05)가 우선하며 이후 남은 누적 금액부터
    30초를 계산한다.
  acceptance:
  - 누적 500원 상태에서 30초간 조작 없음 → 반환 금액 == 500, 누적 == 0, 화면 표시 == 0
  - 누적 500원 상태에서 20초 뒤 100원 투입, 그로부터 29초 경과 → 자동 반환 미발생, 누적 == 600
  - 누적 500원 상태에서 20초 뒤 100원 투입, 그로부터 30초 경과 → 반환 금액 == 600
  - 누적 0원 상태에서 30초 경과 → 반환 동작 없음
  requirements:
  - REQ-18
  - REQ-28
  - REQ-29
- id: UC-07
  title: 관리 모드에 진입한다
  actor: 관리자
  precondition: 관리자가 전용 키를 소지하고 있고, 자판기는 판매 상태·판매 중지 상태 또는 배출 완료 대기 중이다.
  postcondition: 누적 투입 금액이 0이고 잔여 금액은 반환되었으며, 자판기는 관리 모드이다.
  main_flow:
  - 1. 관리자가 전용 키로 관리 모드 진입을 요청한다.
  - 2. 시스템이 누적 투입 금액이 남아 있으면 그 금액 전액을 반환하고 사용한 동전만큼 보유 개수를 차감한다.
  - 3. 시스템이 누적 투입 금액을 0으로 하고 화면에 표시한다.
  - 4. 시스템이 관리 모드로 전환한다.
  alt_flows:
  - 1a. 전용 키가 아닌 수단으로 진입이 시도된 경우 시스템은 관리 모드로 전환하지 않고 현재 상태를 유지한다.
  - 1b. 배출 완료를 기다리는 중에 진입이 요청된 경우 시스템은 진입을 허용하며, 남아 있는 누적 투입 금액(배출 중 투입분 포함)을 반환한
    뒤 관리 모드로 전환한다.
  - 2a. 누적 투입 금액이 0인 경우 시스템은 반환 없이 관리 모드로 전환한다.
  - 4a. 관리 모드 중 코인이 투입된 경우 시스템은 그 코인을 그대로 되돌려 보낸다(UC-01 2d).
  acceptance:
  - 판매 상태·누적 300원에서 전용 키 조작 → 반환 금액 == 300, 누적 == 0, 상태 == 관리 모드
  - 누적 0원에서 전용 키 조작 → 반환 동작 없음, 상태 == 관리 모드
  - 배출 완료 대기 중 전용 키 조작 → 상태 == 관리 모드
  - 판매 중지 상태에서 전용 키 조작 → 상태 == 관리 모드
  - 전용 키 없이 진입 시도 → 상태 변화 없음
  requirements:
  - REQ-18
  - REQ-23
  - REQ-39
  - REQ-40
  - REQ-41
  - REQ-42
- id: UC-08
  title: 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시된 음료의 재고와 액면가별 동전 보유 개수가 지시 수량만큼 증가하고, 보충된 금액이 누적 기록되며, 자판기는 판매
    상태(모든 재고가 0이면 판매 중지 상태)로 돌아간다.
  main_flow:
  - 1. 관리자가 보충 지시(음료 종류별 수량 및/또는 액면가별 동전 수량)를 입력한다.
  - 2. 시스템이 지시의 모든 대상이 등록된 3종 음료 또는 100원·500원·1000원 액면가이고, 모든 수량이 1 이상의 정수임을 검증한다.
  - 3. 시스템이 지시된 수량만큼 음료별 재고와 액면가별 보유 개수를 증가시키고 보충된 금액을 기록한다.
  - 4. 관리자가 보충 종료를 지시한다.
  - 5. 시스템이 종료 시점의 재고를 확인하여 재고가 1 이상인 음료가 있으면 판매 상태로 돌아간다.
  alt_flows:
  - 2a. 지시에 등록되지 않은 음료나 허용되지 않은 액면가가 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알리며 재고·보유량을
    변경하지 않는다.
  - 2b. 지시에 0 이하 또는 정수가 아닌 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알리며 재고·보유량을 변경하지
    않는다.
  - 5a. 종료 시점에 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 돌아간다.
  acceptance:
  - 음료A 재고 0에서 보충 5 → 음료A 재고 == 5, 다른 음료 재고 변화 없음
  - 100원 보유 2개에서 100원 10개 보충 → 100원 보유 == 12, 보충된 금액 기록 += 1000
  - 음료A 3개 + 미등록 음료D 2개 지시 → 거부 알림 발생, 음료A 재고 변화 없음
  - 음료A 3개 + 500원 0개 지시 → 거부 알림 발생, 재고·보유량 변화 없음
  - 50원 5개 보충 지시 → 거부 알림 발생, 보유량 변화 없음
  - 보충 종료 시 재고 합 ≥ 1 → 상태 == 판매; 재고 합 == 0 → 상태 == 판매 중지
  requirements:
  - REQ-05
  - REQ-07
  - REQ-15
  - REQ-16
  - REQ-43
  - REQ-44
  - REQ-45
  - REQ-46
  - REQ-47
  - REQ-49
  - REQ-50
  - REQ-53
  - REQ-54
- id: UC-09
  title: 동전을 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시된 액면가의 보유 개수가 회수 개수만큼 감소하고 회수된 금액이 누적 기록되며, 보유량 합계는 미반환 보관액 이상으로
    유지된다.
  main_flow:
  - 1. 관리자가 액면가별 회수 수량을 입력한다.
  - 2. 시스템이 모든 대상이 100원·500원·1000원 액면가이고 모든 수량이 1 이상의 정수이며 각 액면가 보유 개수 이내임을 검증한다.
  - 3. 시스템이 회수 후 보유량 합계가 미반환 보관액 이상임을 확인한다.
  - 4. 시스템이 지시된 개수만큼 해당 액면가의 보유 개수를 차감하고 회수된 금액을 기록한다.
  - 5. 시스템이 회수 결과를 관리자에게 표시한다.
  alt_flows:
  - 2a. 허용되지 않은 액면가나 0 이하의 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알리며 보유량을 변경하지 않는다.
  - 2b. 어느 액면가의 회수 수량이 보유 개수를 초과하는 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
  - 3a. 회수 후 보유량 합계가 미반환 보관액보다 작아지는 경우 시스템은 지시 전체를 거부하고 관리자에게 알리며 보유량을 변경하지 않는다.
  acceptance:
  - 500원 보유 10개, 미반환 보관액 0에서 500원 4개 회수 → 500원 보유 == 6, 회수된 금액 기록 += 2000
  - 보유 합계 3000원, 미반환 보관액 1000원에서 합계 2500원 회수 지시 → 거부 알림 발생, 보유량 변화 없음
  - 보유 합계 3000원, 미반환 보관액 1000원에서 합계 2000원 회수 지시 → 승인, 회수 후 합계 == 1000
  - 500원 2개 + 100원 0개 회수 지시 → 거부 알림 발생, 보유량 변화 없음
  - 1000원 보유 1개에서 1000원 2개 회수 지시 → 거부 알림 발생
  requirements:
  - REQ-15
  - REQ-16
  - REQ-46
  - REQ-48
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-52
  - REQ-62
  - REQ-63
- id: UC-10
  title: 지연 배출 기록과 미반환 보관액을 확인·회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 관리자가 지연 배출 기록과 미반환 보관액을 확인했으며, 미반환 보관액 회수를 지시한 경우 그 금액이 지급되고 미반환
    보관액 기록과 보유량이 그만큼 감소한다.
  main_flow:
  - 1. 관리자가 지연 배출 기록 조회를 요청한다.
  - 2. 시스템이 지연 배출 기록(음료 종류, 발생 시각, 건수)을 표시한다.
  - 3. 관리자가 지연 배출된 음료의 재고를 보충/조정한다(UC-08).
  - 4. 관리자가 미반환 보관액 조회를 요청한다.
  - 5. 시스템이 현재 미반환 보관액을 표시한다.
  - 6. 관리자가 미반환 보관액 회수를 지시한다.
  - 7. 시스템이 미반환 보관액에 해당하는 동전을 지급하고, 사용한 동전만큼 액면가별 보유 개수를 차감하며, 미반환 보관액 기록을 0으로 갱신한다.
  alt_flows:
  - 2a. 지연 배출 기록이 없는 경우 시스템은 '기록 없음'을 표시한다.
  - 6a. 미반환 보관액이 0인 경우 시스템은 회수를 수행하지 않고 관리자에게 알린다.
  - 7a. 보유 동전으로 미반환 보관액을 정확히 구성할 수 없는 경우 시스템은 회수를 거부하고 관리자에게 알리며 보유량·기록을 변경하지 않는다.
  - 7b. [모호, REQ-64] 미반환 보관액 회수 시 기록을 감소시키는지 문서에 명시되어 있지 않다. 본 유스케이스는 '회수한 만큼 미반환
    보관액 기록을 감소시킨다'는 가정을 채택하며, 채택 여부는 발주자 확인 대상이다.
  acceptance:
  - 지연 배출 기록 2건 존재 시 조회 결과 건수 == 2 이고 각 건에 음료 종류와 시각이 포함된다
  - 미반환 보관액 300원 상태에서 조회 → 표시값 == 300
  - 미반환 보관액 300원 회수 → 지급 합계 == 300, 회수 후 미반환 보관액 == 0, 보유량 합계가 300 감소
  - 미반환 보관액 0원에서 회수 지시 → 지급 없음, 알림 발생
  - 미반환 보관액 회수 후에도 REQ-24 의 보유량 합계 등식이 성립한다
  requirements:
  - REQ-18
  - REQ-36
  - REQ-60
  - REQ-61
  - REQ-64
- id: UC-11
  title: 재고 소진 시 판매를 중지한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 재고가 1인 음료 1종을 제외한 모든 음료의 재고가 0이다.
  postcondition: 자판기가 판매 중지 상태이며 코인을 받지 않는다.
  main_flow:
  - 1. 고객이 마지막 재고 음료를 구매한다(UC-02).
  - 2. 시스템이 배출 완료 후 재고를 차감하여 모든 음료의 재고가 0임을 확인한다.
  - 3. 시스템이 거스름돈을 지급하고 판매 중지 상태로 전환한다.
  - 4. 고객이 코인을 투입하면 시스템이 그 코인을 그대로 되돌려 보낸다.
  alt_flows:
  - 2a. 배출이 실패로 처리된 경우 재고가 차감되지 않으므로 시스템은 판매 상태를 유지한다.
  - 3a. 배출 중 투입된 금액이 남아 있는 경우 시스템은 판매 중지 전환 시 그 금액을 전액 반환한다.
  - 4a. 관리자가 관리 모드에 진입하여 보충한 뒤 종료 시점에 재고가 1 이상이면 시스템은 판매 상태로 돌아간다(UC-08).
  acceptance:
  - 재고 (1,0,0)에서 음료A 구매 완료 → 재고 == (0,0,0), 상태 == 판매 중지
  - 판매 중지 상태에서 500원 투입 → 코인 반환, 누적 == 0, 보유량 변화 없음
  - 재고 (1,0,0)에서 음료A 배출 실패 → 재고 == (1,0,0), 상태 == 판매
  - 판매 중지 상태에서 재고 보충 후 관리 모드 종료 → 상태 == 판매
  requirements:
  - REQ-07
  - REQ-22
  - REQ-37
  - REQ-38
  - REQ-54
- id: UC-12
  title: 정전 후 재기동한다
  actor: 전원(정전/복전)
  precondition: 자판기가 동작 중 전원이 끊겼다가 다시 공급된다.
  postcondition: 누적 투입 금액이 0이고, 정전 시점의 투입 금액이 미반환 보관액으로 기록되어 동전 보유량에 남아 있으며, 자판기는
    내부 보존 재고에 따라 판매 또는 판매 중지 상태이다.
  main_flow:
  - 1. 전원이 끊긴다.
  - 2. 전원이 다시 공급되어 자판기가 재기동한다.
  - 3. 시스템이 정전 시점의 누적 투입 금액을 미반환 보관액에 더해 기록하고 해당 동전을 물리적으로 반환하지 않은 채 보유량에 남긴다.
  - 4. 시스템이 누적 투입 금액을 0으로 하여 화면에 표시한다.
  - 5. 시스템이 외부 정보 없이 내부에 보존된 음료 종류별 재고만으로 상태를 판정하여, 재고가 1 이상인 음료가 있으면 판매 상태, 모두 0이면
    판매 중지 상태로 시작한다.
  alt_flows:
  - 3a. 정전 시점에 배출이 개시되었고 완료 전이었던 경우 시스템은 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된 금액으로 계상하며,
    미반환 보관액은 (정전 시점 누적 금액 − 음료 가격)으로만 잡는다.
  - 3b. 정전 시점 누적 투입 금액이 0이었던 경우 시스템은 미반환 보관액을 변경하지 않는다.
  - 3c. 정전 시점이 관리 모드였던 경우 시스템은 누적 금액 0으로 재기동하고 5단계의 판정에 따라 판매/판매 중지 상태로 시작한다.
  - 5a. 재기동 시 외부에서 재고 정보가 제공되더라도 시스템은 이를 무시하고 내부 보존 재고만 사용한다.
  acceptance:
  - 누적 1500원(배출 미개시) 중 정전 후 재기동 → 누적 == 0, 미반환 보관액 += 1500, 보유량 합계 == 정전 직전 값, 물리
    반환 없음
  - 가격 700원 음료 배출 개시 후 완료 전 정전, 누적 1000원 → 재기동 후 재고 −1, 판매된 금액 += 700, 미반환 보관액 +=
    300, 누적 == 0
  - 내부 재고 (0,0,0)으로 재기동 → 상태 == 판매 중지; 내부 재고 (0,1,0) → 상태 == 판매
  - 재기동 후 REQ-24 의 보유량 합계 등식이 성립한다
  - 재기동 과정에서 외부 통신·외부 재고 입력이 발생하지 않는다
  requirements:
  - REQ-56
  - REQ-57
  - REQ-58
  - REQ-59
  - REQ-65
  - REQ-66
  - REQ-67
  - REQ-68
  - REQ-69
  - REQ-70
  - REQ-71
- id: UC-13
  title: 동전 보유량 정합성을 검증한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 관리자가 액면가별 보유량과 합계, 그리고 합계 등식의 성립 여부를 확인했다.
  main_flow:
  - 1. 관리자가 동전 보유량 조회를 요청한다.
  - 2. 시스템이 100원·500원·1000원 액면가별 보유 개수와 합계 금액을 표시한다.
  - 3. 시스템이 (초기 보유액) + (보충된 금액) − (회수된 금액) + (판매된 음료 가격의 합) + (미정산 누적 투입 금액) + (미반환
    보관액) 을 계산하여 합계와 함께 표시한다.
  alt_flows:
  - 3a. 계산값과 실제 보유량 합계가 일치하지 않는 경우 시스템은 불일치를 관리자에게 알린다.
  acceptance:
  - 임의의 코인 투입·구매·반환·보충·회수·정전 시나리오 실행 후 어느 시점에서나 보유량 합계 == 초기 보유액 + 보충 − 회수 + 판매 합
    + 미정산 누적 금액 + 미반환 보관액
  - 관리 모드 조회 시 액면가 3종 각각의 개수와 합계가 표시되고, 합계 == Σ(액면가 × 개수)
  - 되돌려 보낸 코인(비액면가·인식 실패·판매 중지·관리 모드)은 어떤 항에도 반영되지 않는다
  requirements:
  - REQ-15
  - REQ-16
  - REQ-17
  - REQ-18
  - REQ-19
  - REQ-24
  - REQ-71
  - REQ-73
