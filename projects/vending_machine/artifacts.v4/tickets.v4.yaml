- key: SWF-196
  type: bug
  title: '[검토/medium] [모호] REQ-64 가 추측으로 채워져 코드로 굳었다 — 미반환 보관액 회수가 기록을 0 으로 지우는 동작'
  description: '**분류** guessed-spec

    **심각도** medium


    **근거**

    fsm T-103 notes ''[미규정 REQ-64] … 감소 가정 채택(발주자 확인 대상)''. app/vending_machine.py:892
