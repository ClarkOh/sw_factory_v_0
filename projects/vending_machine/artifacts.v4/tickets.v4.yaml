    tests/e2e/test_scenarios.py::test_uc10_delayed_log_and_unreturned_collection 이
    `held == 0` 을 단언해 이 가정을 명세로 고정했다. 발주자 확인이 이뤄졌다는 흔적(요구사항 문서 갱신·티켓)은 저장소에 없다. 부수적으로
    회수 금액이 `refunded`(고객 반환 목록)에 기록되고 `collected_amount` 에는 잡히지 않아, 관리자가 실제로 가져간 돈이
    ''회수된 금액'' 항에 나타나지 않는다.


    **영향**

    발주자가 ''미반환 보관액은 고객 민원 대비로 남겨 두고 별도 정산한다'' 를 의도했다면 지금 구현은 그 돈을 관리자가 꺼내가며 기록까지 지워
