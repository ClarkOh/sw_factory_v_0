    를 연달아 주입할 뿐, 객체를 버리고 다시 만드는 경로가 없다.


    **영향**

    실제 정전이면 제어 프로세스가 죽는다. 복전 후 소프트웨어는 재고·동전 보유량·미반환 보관액·pending 배출·판매 누계를 모두 잃고 데모
    초기값으로 시작한다. REQ-25(내부 보존 재고로 판정), REQ-58/59(미반환 보관액 기록·보유), REQ-65~67(배출 중 정전
    정산)이 전부 무효가 되고 REQ-24 등식도 깨진다. "정전은 FSM 상태다"라는 모델링이 영속성 요구를 전이 하나로 흡수해 버린 사례로,
    검토 안내의 "제약이 전이로 표현될 수 없어 빈 채로 남은" 패턴과 같다.


    **제안**

    영속 계층(재고·동전·held·pending·sold/refilled/collected 누계·initial_amount)을 요구사항으로 명시하고
    구현·검증하라. 요구사항 추가: "자판기는 음료 종류별 재고, 액면가별 동전 보유 개수, 미반환 보관액, 배출 진행 중 여부와 해당 음료,
    누적 투입 금액, 보충·회수·판매 누계를 전원과 무관하게 보존되는 내부 저장소에 매 변경 시점마다 기록한다. 재기동 시 이 저장소의 값만으로
    상태를 복원한다." 테스트는 VendingMachine 객체를 폐기하고 저장소로부터 새 객체를 만든 뒤 REQ-56~68 을 단언해야 한다.


    **참조** REQ-25, REQ-56, REQ-57, REQ-58, REQ-59, REQ-65, REQ-66, REQ-67, REQ-68,
