- key: SWF-7
  type: epic
  title: '[UC-07] 관리 모드에 진입한다'
  description: '**액터** 관리자

    **사전조건** 관리자가 전용 키를 소지하고 있고, 자판기는 판매 상태·판매 중지 상태 또는 배출 완료 대기 중이다.

    **사후조건** 누적 투입 금액이 0이고 잔여 금액은 반환되었으며, 자판기는 관리 모드이다.


    **주 흐름**

    - 1. 관리자가 전용 키로 관리 모드 진입을 요청한다.

    - 2. 시스템이 누적 투입 금액이 남아 있으면 그 금액 전액을 반환하고 사용한 동전만큼 보유 개수를 차감한다.

    - 3. 시스템이 누적 투입 금액을 0으로 하고 화면에 표시한다.

    - 4. 시스템이 관리 모드로 전환한다.


    **대안/예외 흐름**

    - 1a. 전용 키가 아닌 수단으로 진입이 시도된 경우 시스템은 관리 모드로 전환하지 않고 현재 상태를 유지한다.

    - 1b. 배출 완료를 기다리는 중에 진입이 요청된 경우 시스템은 진입을 허용하며, 남아 있는 누적 투입 금액(배출 중 투입분 포함)을 반환한
    뒤 관리 모드로 전환한다.

    - 2a. 누적 투입 금액이 0인 경우 시스템은 반환 없이 관리 모드로 전환한다.

    - 4a. 관리 모드 중 코인이 투입된 경우 시스템은 그 코인을 그대로 되돌려 보낸다(UC-01 2d).


    **인수 조건**

    - 판매 상태·누적 300원에서 전용 키 조작 → 반환 금액 == 300, 누적 == 0, 상태 == 관리 모드

    - 누적 0원에서 전용 키 조작 → 반환 동작 없음, 상태 == 관리 모드

    - 배출 완료 대기 중 전용 키 조작 → 상태 == 관리 모드

    - 판매 중지 상태에서 전용 키 조작 → 상태 == 관리 모드

    - 전용 키 없이 진입 시도 → 상태 변화 없음'
