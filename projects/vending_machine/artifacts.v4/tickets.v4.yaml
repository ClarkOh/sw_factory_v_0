- key: SWF-194
  type: bug
  title: '[검토/medium] 배출 완료 신호가 어떤 배출 요청에 대한 것인지 대조하지 않아, 실패 처리된 이전 배출의 늦은 신호가 다음
    구매를 ''완료''시킨'
  description: '**분류** missing-rule

    **심각도** medium


    **근거**

    app/vending_machine.py:446 `_resolve_pending` 는 payload 의 drink 를 무시하고 pending.drink
    로 정산한다. tests/test_fsm.py::test_t_013 vm6 은 `DISPENSE_DONE(drink=''water'')` 가
    cola 판매를 완료시키는 것을 명시적으로 기대한다. 시나리오: A 구매 → T-050 실패 처리·환불 → 고객이 곧바로 코인 투입 후 B
    구매(T-010) → 그제야 A 의 완료 신호 도착 → T-013 이 B 판매 완료로 처리(재고 B −1, 거스름돈 지급) → 실제 B 완료
    신호는 T-051 로 ''지연 배출 B'' 기록. 요구사항 14 는 ''배출 실패 처리 후 도착한 완료 신호는 지연 배출로 기록''이라 했지만
    ''어느 배출의 신호인지'' 식별 규칙이 없다.


    **영향**

    고객은 A(무료)와 B 를 모두 받고, 장부는 A 재고를 차감하지 않으며 지연 배출 기록에는 엉뚱한 음료(B)가 남아 관리자가 재고를 맞출
    수 없다.


    **제안**

    요구사항 14 에 추가: ''배출 완료 신호는 배출을 개시한 음료 종류를 포함하며, 자판기는 대기 중인 배출과 종류가 일치하는 신호만 완료로
    처리한다. 종류가 일치하지 않는 신호는 상태·재고·금액을 바꾸지 않고 지연 배출로 기록한다.'' T-013/T-020 가드에 `drink ==
    pending.drink` 를 넣고 불일치 분기를 추가한다.


