- key: SWF-4
  type: epic
  title: '[UC-04] 배출 진행 중에 코인을 투입한다'
  description: '**액터** 고객

    **사전조건** 자판기가 어떤 음료의 배출을 개시한 뒤 배출 완료 신호를 기다리고 있다.

    **사후조건** 투입된 코인이 수납되어 보유 개수와 누적 투입 금액에 더해지며, 진행 중인 배출의 거스름돈은 변하지 않고, 배출 완료 후 그
    금액이 누적 금액으로 남는다.


    **주 흐름**

    - 1. 고객이 배출 진행 중에 100원·500원·1000원 코인을 넣는다.

    - 2. 시스템이 코인을 받아들여 해당 액면가 보유 개수를 1 증가시키고 누적 투입 금액에 더해 화면에 표시한다.

    - 3. 시스템이 진행 중인 배출의 거스름돈을 버튼을 누른 시점 기준 금액 그대로 유지한다.

    - 4. 시스템이 배출을 완료하고 확정된 거스름돈만 지급한다.

    - 5. 시스템이 배출 중 투입된 금액을 누적 투입 금액으로 남기고 버튼 활성화 여부를 갱신한다.


    **대안/예외 흐름**

    - 1a. 비액면가 또는 인식 실패 코인인 경우 시스템은 그 코인을 그대로 되돌려 보내고 아무것도 변경하지 않는다.

    - 4a. 배출이 실패로 처리된 경우 시스템은 (버튼 시점 누적 금액 + 배출 중 투입 금액) 전액을 반환한다(UC-05).


    **인수 조건**

    - 가격 700원, 누적 1000원에서 버튼 누름 후 배출 중 500원 투입 → 완료 시 거스름돈 == 300, 완료 후 누적 == 500,
    화면 표시 == 500

    - 배출 중 500원 투입 시 500원 보유 개수가 투입 전보다 1 크다

    - 완료 후 남은 500원으로 가격 500원 이하 음료(재고 ≥ 1) 버튼이 활성화된다'
