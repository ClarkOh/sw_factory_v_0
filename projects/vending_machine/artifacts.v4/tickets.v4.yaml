- key: SWF-6
  type: epic
  title: '[UC-06] 무조작 시 투입 금액을 자동 반환한다'
  description: '**액터** 타이머(시간 경과)

    **사전조건** 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.

    **사후조건** 누적 투입 금액 전액이 반환되어 0이 되고 거래가 종료되며, 지급에 사용한 동전만큼 보유 개수가 차감된다.


    **주 흐름**

    - 1. 마지막 코인 투입, 음료 선택 또는 반환 레버 조작 이후 30초가 경과한다.

    - 2. 시스템이 누적 투입 금액 전액을 반환하고 사용한 동전만큼 액면가별 보유 개수를 차감한다.

    - 3. 시스템이 누적 투입 금액을 0으로 하여 화면에 표시하고 거래를 종료한다.


    **대안/예외 흐름**

    - 1a. 30초 이내에 코인 투입, 음료 선택 또는 반환 레버 조작이 발생한 경우 시스템은 타이머를 재시작하고 자동 반환하지 않는다.

    - 1b. 누적 투입 금액이 0인 경우 시스템은 자동 반환을 수행하지 않는다.

    - 1c. 배출 진행 중(완료 대기)인 경우 음료 선택이 마지막 조작이므로 배출 처리(UC-02/UC-05)가 우선하며 이후 남은 누적 금액부터
    30초를 계산한다.


    **인수 조건**

    - 누적 500원 상태에서 30초간 조작 없음 → 반환 금액 == 500, 누적 == 0, 화면 표시 == 0

    - 누적 500원 상태에서 20초 뒤 100원 투입, 그로부터 29초 경과 → 자동 반환 미발생, 누적 == 600

    - 누적 500원 상태에서 20초 뒤 100원 투입, 그로부터 30초 경과 → 반환 금액 == 600

    - 누적 0원 상태에서 30초 경과 → 반환 동작 없음'
