- id: UC-07
  title: 동전과 미반환 보관액을 확인·회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 회수한 개수만큼 해당 액면가의 동전 보유 개수가 차감되고, 미반환 보관액을 회수한 경우 미반환 보관액이 0이 된다.
  main_flow:
  - 1. 관리자가 미반환 보관액 확인을 요청한다.
  - 2. 시스템이 현재 미반환 보관액을 관리자에게 표시한다.
  - 3. 관리자가 액면가(100원/500원/1000원)와 개수를 지정하여 동전 회수를 지시한다.
  - 4. 시스템이 해당 액면가의 보유 개수를 회수한 개수만큼 차감한다.
  - 5. 관리자가 미반환 보관액 회수를 지시한다.
  - 6. 시스템이 미반환 보관액에 해당하는 금액만큼 동전을 회수 처리하여 액면가별 보유 개수를 차감하고 미반환 보관액을 0으로 한다.
  alt_flows:
  - 3a. 지정한 액면가의 보유 개수보다 많은 개수의 회수가 지시된 경우 시스템은 회수를 거부하여 보유 개수를 변경하지 않고 관리자에게 알린다.
  - 3b. 비액면가에 대한 회수가 지시된 경우 시스템은 회수를 거부하여 보유 개수를 변경하지 않고 관리자에게 알린다.
  - 5a. 미반환 보관액이 0인 상태에서 회수가 지시된 경우 시스템은 보유 개수를 변경하지 않는다.
  - 6a. 미반환 보관액을 보유 동전으로 구성할 수 없는 경우 시스템은 회수를 거부하여 보유 개수와 미반환 보관액을 변경하지 않고 관리자에게 알린다.
  acceptance:
  - 관리 모드에서 미반환 보관액 확인 요청 시 표시된 금액이 기록된 미반환 보관액과 일치한다.
  - 1000원 k개 회수 지시 후 1000원 보유 개수가 정확히 k 감소하고 100원·500원 보유 개수는 변하지 않는다.
  - 보유 개수를 초과하는 회수 지시 후 보유 개수가 변하지 않고 관리자에게 거부 알림이 출력된다.
  - 미반환 보관액 P(>0) 회수 후 미반환 보관액이 0이고 동전 보유량 합계가 회수 전 대비 정확히 P 감소한다.
  - 회수 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.
  - 관리 모드가 아닌 상태에서 회수 또는 미반환 보관액 확인 요청은 수행되지 않는다.
  requirements:
  - REQ-13
  - REQ-14
  - REQ-19
  - REQ-41
  - REQ-42
  - REQ-50
  - REQ-51
- id: UC-08
  title: 정전 후 재기동하여 판매를 재개한다
  actor: 전원 공급
  precondition: 자판기가 동작 중이며 기기 내부에 음료 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 배출 진행 여부가 보존되어
    있다.
  postcondition: 누적 투입 금액이 0이고, 정전 시점의 누적 투입 금액이 미반환 보관액에 더해져 있으며, 배출 개시 후 완료 전 정전이었다면
    해당 음료 재고가 1 차감되어 있고, 내부 보존 재고에 따라 판매 상태 또는 판매 중지 상태가 된다.
  main_flow:
  - 1. 전원 공급이 끊긴다.
  - 2. 시스템이 정전 시점에 투입 중이던 누적 투입 금액을 물리적으로 반환하지 않고 '미반환 보관액'에 기록하며, 해당 동전은 동전 보유량에
    그대로 남긴다.
  - 3. 전원 공급이 재개된다.
  - 4. 시스템이 누적 투입 금액을 0으로 시작하고 화면에 0을 표시한다.
  - 5. 시스템이 외부로부터 어떤 정보도 받지 않고 기기 내부에 보존된 음료 종류별 재고만으로 판매 상태 여부를 판정한다.
  - 6. 시스템이 재고가 1 이상인 음료가 하나라도 있으면 판매 상태로 시작한다.
  alt_flows:
  - 1a. 배출 개시 후 배출 완료 전에 전원이 끊긴 경우 시스템은 재기동 시 해당 음료의 재고를 1 차감한 뒤 5단계로 진행한다.
  - 2a. 정전 시점의 누적 투입 금액이 0인 경우 시스템은 미반환 보관액을 변경하지 않는다.
  - 6a. 보존된 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 시작하고 코인을 받지 않는다.
  - 6b. 관리 모드 중에 정전된 경우 시스템은 재기동 시 관리 모드가 아닌 5단계의 판정 결과 상태로 시작한다.
  acceptance:
  - 누적 투입 금액이 N(>0)인 상태에서 정전 후 재기동 시 화면 표시 및 누적 투입 금액이 0이고, 미반환 보관액이 정전 전 대비 정확히 N
    증가하며, 동전 보유량은 정전 직전과 동일하다.
  - 정전 시점에 어떤 동전도 물리적으로 반환되지 않는다.
  - 배출 개시 후 완료 신호 전에 정전되면 재기동 후 해당 음료 재고가 정전 직전 대비 정확히 1 감소하고 다른 음료 재고는 동일하다.
  - 배출 개시 전 또는 완료 후에 정전되면 재기동 후 모든 음료 재고가 정전 직전과 동일하다.
  - 재기동 시 보존된 재고가 하나라도 1 이상이면 판매 상태이고, 모두 0이면 판매 중지 상태이며, 이 판정에 외부 입력이나 네트워크 통신이 전혀
    사용되지 않는다.
  - 재기동 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.
  requirements:
  - REQ-04
