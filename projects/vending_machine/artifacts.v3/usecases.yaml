usecases:
- id: UC-01
  title: 코인을 투입하여 누적 투입 금액을 늘린다
  actor: 고객
  precondition: 자판기가 판매 상태이며 관리 모드가 아니다.
  postcondition: 유효 코인의 액면가가 누적 투입 금액에 더해지고, 해당 액면가의 동전 보유 개수가 1 증가하며, 화면에 갱신된 누적
    투입 금액이 표시된다.
  main_flow:
  - 1. 고객이 코인 투입구에 코인 1개를 넣는다.
  - 2. 시스템이 코인이 100원, 500원, 1000원 중 하나임을 확인하고 수납한다.
  - 3. 시스템이 코인 액면가를 누적 투입 금액에 더하고 해당 액면가의 동전 보유 개수를 1 증가시킨다.
  - 4. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.
  - 5. 시스템이 각 음료에 대해 (누적 투입 금액 ≥ 가격) 이고 (재고 ≥ 1)인 음료의 선택 버튼만 활성화한다.
  alt_flows:
  - 2a. 코인이 100원, 500원, 1000원 이외의 액면가인 경우 시스템은 그 코인 자체를 즉시 반환하고, 누적 투입 금액과 동전 보유량을
    변경하지 않는다.
  - 2b. 코인 인식에 실패한 경우 시스템은 그 코인 자체를 그대로 반환하고, 누적 투입 금액과 동전 보유량을 변경하지 않는다.
  - 2c. 자판기가 판매 중지 상태이거나 관리 모드인 경우 시스템은 그 코인 자체를 그대로 반환하고, 누적 투입 금액과 동전 보유량을 변경하지
    않는다.
  - 2d. 배출 진행 중(배출 완료 대기 중)에 유효 코인이 투입된 경우 시스템은 정상 수납하여 누적 투입 금액에 더하고 보유 개수를 1 증가시키며,
    그 금액은 배출 완료 후 다음 구매에 사용 가능하다.
  acceptance:
  - 판매 상태에서 100원·500원·1000원 각각을 투입하면 누적 투입 금액이 정확히 그 액면가만큼 증가한다.
  - 판매 상태에서 유효 코인 투입 후 해당 액면가의 동전 보유 개수가 투입 전 대비 정확히 1 증가한다.
  - 유효 코인 투입 직후 화면 표시 금액이 누적 투입 금액과 일치한다.
  - 10원, 50원 등 비액면가 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.
  - 인식 실패 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.
  - 판매 중지 상태 또는 관리 모드에서 유효 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.
  - 배출 개시 후 완료 전에 유효 코인을 투입하면 배출 완료 후 누적 투입 금액이 그 액면가만큼 증가해 있고, 그 금액으로 다음 음료 선택 버튼
    활성화가 판정된다.
  - 누적 투입 금액이 음료 가격 이상이고 재고가 1 이상인 음료의 버튼만 활성화되고, 둘 중 하나라도 불만족인 음료의 버튼은 비활성화된다.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-08
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-15
  - REQ-17
  - REQ-18
  - REQ-30
  - REQ-57
  - REQ-58
  - REQ-59
  - REQ-60
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 최소 1개 음료의 선택 버튼이 활성화되어 있다(누적 투입 금액 ≥ 해당 음료 가격, 해당 음료
    재고 ≥ 1).
  postcondition: 선택된 음료 1개가 배출되고 해당 음료 재고가 1 감소하며, 누적 투입 금액이 0이 되고, (누적 투입 금액 − 가격)
    > 0이었다면 그 잔액이 거스름돈으로 지급되고 사용한 동전 개수만큼 액면가별 보유 개수가 차감되며, 자판기는 판매 상태로 돌아간다.
  main_flow:
  - 1. 고객이 활성화된 음료 선택 버튼을 누른다.
  - 2. 시스템이 잔액(누적 투입 금액 − 음료 가격)을 계산하고, 잔액 > 0이면 보유 동전으로 잔액을 구성할 수 있는지 확인한다.
  - 3. 시스템이 버튼이 눌린 시점부터 2초 이내에 해당 음료의 배출을 개시한다.
  - 4. 시스템이 배출 개시 후 10초 이내에 배출 완료 신호를 받는다.
  - 5. 시스템이 해당 음료의 재고를 1 차감한다.
  - 6. 시스템이 잔액 > 0이면 잔액을 거스름돈으로 지급하고, 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 7. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시하며 판매 상태를 유지한다.
  alt_flows:
  - 1a. 비활성화된 버튼이 눌린 경우 시스템은 아무 것도 배출하지 않고 누적 투입 금액·재고·동전 보유량을 변경하지 않는다.
  - 2a. 보유 동전으로 잔액을 구성할 수 없는 경우 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환하며, 사용한 동전 개수만큼 액면가별
    보유 개수를 차감하고 누적 투입 금액을 0으로 한 뒤 판매 상태로 돌아간다.
  - 4a. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우 시스템은 배출 실패로 처리하여 재고를 차감하지 않고, 누적 투입 금액 전액을
    반환하고 사용한 동전만큼 보유 개수를 차감한 뒤 판매 상태로 돌아간다.
  - 4b. 배출 완료 대기 중에 유효 코인이 투입된 경우 시스템은 UC-01의 2d와 같이 수납하고, 잔액 계산에는 버튼이 눌린 시점의 누적 투입
    금액만 사용하지 않고 반환·거스름돈 시점의 누적 투입 금액 전체를 기준으로 처리하여 잔액이 고객에게 남지 않도록 한다.
  - 4c. 배출 완료 대기 중에 관리자가 전용 키로 관리 모드 진입을 요청한 경우 시스템은 UC-05로 진행한다.
  - 5a. 배출 완료 후 해당 음료 재고를 포함한 모든 음료의 재고가 0이 된 경우 시스템은 거스름돈 지급을 마친 뒤 판매 중지 상태로 전환한다.
  acceptance:
  - 3종류 음료 각각의 가격이 서로 다르고, 버튼이 눌린 시점의 누적 투입 금액이 가격 이상이고 재고가 1 이상일 때 그 음료 1개가 배출된다.
  - 배출 완료 신호 수신 후 해당 음료 재고가 정확히 1 감소하고 다른 음료의 재고는 변하지 않는다.
  - 누적 투입 금액 − 가격 > 0인 경우 지급된 거스름돈 합계가 그 잔액과 정확히 일치하고, 지급에 사용한 액면가별 동전 개수만큼 보유 개수가
    차감된다.
  - 누적 투입 금액 − 가격 = 0인 경우 어떤 동전도 지급되지 않고 동전 보유량이 변하지 않는다.
  - 잔액을 구성할 동전이 부족한 경우 음료가 배출되지 않고, 재고가 변하지 않으며, 반환된 금액 합계가 누적 투입 금액 전액과 일치한다.
  - 버튼이 눌린 시점부터 배출 개시 신호까지의 경과 시간이 2000ms 이하이다.
  - 배출 개시 후 10000ms 안에 배출 완료 신호가 없으면 재고가 변하지 않고, 반환된 금액 합계가 누적 투입 금액 전액과 일치하며, 이후
    상태가 판매 상태이다.
  - 거래 종료 후 누적 투입 금액이 0이고 화면에 0이 표시된다.
  - 거래 종료 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.
  requirements:
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-14
  - REQ-16
  - REQ-19
  - REQ-20
  - REQ-21
  - REQ-25
  - REQ-26
  - REQ-27
  - REQ-28
  - REQ-29
  - REQ-32
  - REQ-45
  - REQ-57
- id: UC-03
  title: 반환 레버로 투입 금액을 돌려받는다
  actor: 고객
  precondition: 자판기가 판매 상태이다.
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감되고,
    화면에 0이 표시된다.
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 지급한다.
  - 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시하며 모든 선택 버튼을 비활성화한다.
  alt_flows:
  - 1a. 누적 투입 금액이 0인 상태에서 레버가 조작된 경우 시스템은 어떤 동전도 지급하지 않고 동전 보유량을 변경하지 않는다.
  - 1b. 판매 중지 상태 또는 관리 모드에서 레버가 조작된 경우 시스템은 누적 투입 금액이 0이므로 어떤 동전도 지급하지 않는다.
  - 1c. 배출 완료 대기 중에 레버가 조작된 경우 시스템은 배출 진행 중 수납된 금액을 포함한 현재 누적 투입 금액 전액을 배출 처리 완료 후
    반환한다.
  acceptance:
  - 판매 상태에서 누적 투입 금액이 N(>0)일 때 레버 조작 후 반환된 금액 합계가 정확히 N이고 누적 투입 금액이 0이 된다.
  - 레버 조작 후 화면 표시 금액이 0이다.
  - 반환에 사용한 액면가별 동전 개수만큼 보유 개수가 차감되고 그 외 변동이 없다.
  - 누적 투입 금액이 0일 때 레버를 조작하면 지급된 동전이 없고 동전 보유량이 변하지 않는다.
  - 레버 조작 후 모든 음료 선택 버튼이 비활성화된다.
  requirements:
  - REQ-04
  - REQ-08
  - REQ-14
  - REQ-16
  - REQ-22
- id: UC-04
  title: 무조작 30초 경과로 투입 금액을 자동 반환한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.
  postcondition: 누적 투입 금액 전액이 반환되어 누적 투입 금액이 0이 되고, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감되며,
    거래가 종료되어 화면에 0이 표시된다.
  main_flow:
  - 1. 고객이 마지막 코인 투입, 음료 선택, 반환 레버 조작 이후 30초 동안 아무 조작도 하지 않는다.
  - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 지급하고 사용한 개수만큼 액면가별 보유 개수를 차감한다.
  - 3. 시스템이 누적 투입 금액을 0으로 하고 거래를 종료하며 화면에 0을 표시한다.
  alt_flows:
  - 1a. 30초 경과 전에 고객이 코인 투입, 음료 선택, 반환 레버 조작 중 하나를 수행한 경우 시스템은 자동 반환하지 않고 30초 계시를
    그 조작 시점부터 다시 시작한다.
  - 1b. 누적 투입 금액이 0인 경우 시스템은 30초가 경과해도 아무 동작도 하지 않는다.
  - 1c. 배출 완료 대기 중인 경우 시스템은 배출 처리(완료 또는 실패)가 끝날 때까지 자동 반환을 수행하지 않는다.
  acceptance:
  - 누적 투입 금액이 N(>0)인 상태에서 코인 투입·음료 선택·레버 조작 없이 30000ms 경과 시 반환된 금액 합계가 정확히 N이고 누적
    투입 금액이 0이 된다.
  - 29초 시점에 코인을 투입하면 그 시점부터 30초가 다시 계시되어 원래 30초 시점에는 반환이 발생하지 않는다.
  - 자동 반환 후 화면 표시 금액이 0이고 모든 선택 버튼이 비활성화된다.
  - 누적 투입 금액이 0인 상태에서 30초 경과 시 지급된 동전이 없고 동전 보유량이 변하지 않는다.
  requirements:
  - REQ-04
  - REQ-14
  - REQ-16
  - REQ-23
  - REQ-24
- id: UC-05
  title: 전용 키로 관리 모드에 진입한다
  actor: 관리자
  precondition: 자판기가 판매 상태, 판매 중지 상태, 또는 배출 완료 대기 중이며 관리 모드가 아니다.
  postcondition: 자판기가 관리 모드이고 누적 투입 금액이 0이며, 진입 전 누적 투입 금액이 0보다 컸다면 그 전액이 반환되어 사용한
    동전 개수만큼 액면가별 보유 개수가 차감되어 있다.
  main_flow:
  - 1. 관리자가 전용 키로 관리 모드 진입을 요청한다.
  - 2. 시스템이 누적 투입 금액이 0보다 크면 그 전액을 보유 동전으로 지급하고 사용한 개수만큼 액면가별 보유 개수를 차감한다.
  - 3. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시한다.
  - 4. 시스템이 관리 모드로 전환하고 모든 음료 선택 버튼을 비활성화한다.
  alt_flows:
  - 1a. 전용 키가 아닌 수단으로 진입이 요청된 경우 시스템은 관리 모드로 전환하지 않고 현재 상태를 유지한다.
  - 1b. 배출 완료 대기 중에 요청된 경우 시스템은 배출 완료 또는 배출 실패 처리를 마친 뒤(배출 실패 시 전액 반환 포함) 2단계부터 진행한다.
  - 2a. 누적 투입 금액이 0인 경우 시스템은 동전을 지급하지 않고 보유량을 변경하지 않은 채 4단계로 진행한다.
  - 4a. 관리 모드에서 코인이 투입된 경우 시스템은 그 코인 자체를 그대로 반환하고 보유량과 누적 투입 금액을 변경하지 않는다.
  acceptance:
  - 누적 투입 금액이 N(>0)인 판매 상태에서 전용 키로 진입 요청 시 반환된 금액 합계가 정확히 N이고, 이후 상태가 관리 모드이며 누적 투입
    금액이 0이다.
  - 누적 투입 금액이 0인 상태에서 진입 요청 시 지급된 동전이 없고 동전 보유량이 변하지 않은 채 관리 모드가 된다.
  - 판매 중지 상태에서 전용 키로 진입 요청 시 관리 모드가 된다.
  - 배출 개시 후 완료 전에 진입 요청 시 배출 처리 종료 후 관리 모드가 되고 누적 투입 금액이 0이다.
  - 관리 모드에서 유효 코인을 투입하면 동일 코인이 반환되고 누적 투입 금액과 보유량이 변하지 않는다.
  requirements:
  - REQ-14
  - REQ-16
  - REQ-17
  - REQ-18
  - REQ-31
  - REQ-32
  - REQ-33
  - REQ-34
  - REQ-60
- id: UC-06
  title: 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 유효한 보충 지시의 음료 종류별 재고와 액면가별 동전 보유 개수가 지시한 수량만큼 증가하고, 보충 종료 후 모든 음료
    재고가 0이면 판매 중지 상태, 아니면 판매 상태가 된다.
  main_flow:
  - 1. 관리자가 보충 대상(등록된 3종 음료 중 종류와 수량, 100원/500원/1000원 중 액면가와 개수)을 지정하여 보충 지시를 내린다.
  - 2. 시스템이 지시에 포함된 모든 대상이 등록된 3종 음료 또는 3개 액면가에 속하는지 확인한다.
  - 3. 시스템이 지정된 음료 종류별 재고와 액면가별 동전 보유 개수를 지시한 수량만큼 증가시킨다.
  - 4. 관리자가 보충 종료를 지시한다.
  - 5. 시스템이 모든 음료 재고가 0이 아니면 판매 상태로 전환하고, 코인 투입을 받기 시작한다.
  alt_flows:
  - 2a. 등록되지 않은 음료 또는 비액면가가 하나라도 포함된 경우 시스템은 지시 전체를 거부하여 재고와 동전 보유량을 전혀 변경하지 않고, 관리자에게
    거부 사실을 알린 뒤 관리 모드를 유지한다.
  - 5a. 보충 종료 시점에 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 전환하고 코인을 받지 않는다.
  - 5b. 관리자가 보충 지시 없이 보충 종료를 지시한 경우 시스템은 재고·보유량을 변경하지 않고 5단계 또는 5a에 따라 상태를 전환한다.
  acceptance:
  - 등록된 음료 A에 대해 n개 보충 지시 후 A의 재고가 정확히 n 증가하고 다른 음료 재고는 변하지 않는다.
  - 500원 m개 보충 지시 후 500원 보유 개수가 정확히 m 증가하고 100원·1000원 보유 개수는 변하지 않는다.
  - 유효 대상과 미등록 음료가 함께 포함된 지시 후 모든 음료 재고와 모든 액면가 보유 개수가 지시 전과 동일하고, 관리자에게 거부 알림이 출력된다.
  - '유효 액면가와 비액면가(예: 50원)가 함께 포함된 지시 후 모든 보유 개수가 지시 전과 동일하고, 관리자에게 거부 알림이 출력된다.'
  - 재고가 1 이상인 음료가 하나라도 있는 상태에서 보충 종료 시 상태가 판매 상태이고 유효 코인이 수납된다.
  - 모든 음료 재고가 0인 상태에서 보충 종료 시 상태가 판매 중지 상태이고 유효 코인이 그대로 반환된다.
  - 보충 후 동전 보유량 합계가 보충 전 합계 + 보충된 금액과 같다.
  requirements:
  - REQ-05
