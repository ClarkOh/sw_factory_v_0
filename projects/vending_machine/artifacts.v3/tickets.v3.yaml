- key: SWF-5
  type: epic
  title: '[UC-05] 전용 키로 관리 모드에 진입한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 판매 상태, 판매 중지 상태, 또는 배출 완료 대기 중이며 관리 모드가 아니다.

    **사후조건** 자판기가 관리 모드이고 누적 투입 금액이 0이며, 진입 전 누적 투입 금액이 0보다 컸다면 그 전액이 반환되어 사용한 동전
    개수만큼 액면가별 보유 개수가 차감되어 있다.


    **주 흐름**

    - 1. 관리자가 전용 키로 관리 모드 진입을 요청한다.

    - 2. 시스템이 누적 투입 금액이 0보다 크면 그 전액을 보유 동전으로 지급하고 사용한 개수만큼 액면가별 보유 개수를 차감한다.

    - 3. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시한다.

    - 4. 시스템이 관리 모드로 전환하고 모든 음료 선택 버튼을 비활성화한다.


    **대안/예외 흐름**

    - 1a. 전용 키가 아닌 수단으로 진입이 요청된 경우 시스템은 관리 모드로 전환하지 않고 현재 상태를 유지한다.

    - 1b. 배출 완료 대기 중에 요청된 경우 시스템은 배출 완료 또는 배출 실패 처리를 마친 뒤(배출 실패 시 전액 반환 포함) 2단계부터
    진행한다.

    - 2a. 누적 투입 금액이 0인 경우 시스템은 동전을 지급하지 않고 보유량을 변경하지 않은 채 4단계로 진행한다.

    - 4a. 관리 모드에서 코인이 투입된 경우 시스템은 그 코인 자체를 그대로 반환하고 보유량과 누적 투입 금액을 변경하지 않는다.


    **인수 조건**

    - 누적 투입 금액이 N(>0)인 판매 상태에서 전용 키로 진입 요청 시 반환된 금액 합계가 정확히 N이고, 이후 상태가 관리 모드이며 누적
    투입 금액이 0이다.

    - 누적 투입 금액이 0인 상태에서 진입 요청 시 지급된 동전이 없고 동전 보유량이 변하지 않은 채 관리 모드가 된다.

    - 판매 중지 상태에서 전용 키로 진입 요청 시 관리 모드가 된다.

    - 배출 개시 후 완료 전에 진입 요청 시 배출 처리 종료 후 관리 모드가 되고 누적 투입 금액이 0이다.

    - 관리 모드에서 유효 코인을 투입하면 동일 코인이 반환되고 누적 투입 금액과 보유량이 변하지 않는다.'
