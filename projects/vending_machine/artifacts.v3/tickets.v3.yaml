- key: SWF-16
  type: story
  title: '[T-013] IDLE --PRESS_BUTTON--> IDLE'
  description: 'FSM 전이 `T-013` 구현


    - 출발: `IDLE`

    - 이벤트: `PRESS_BUTTON`

    - 도착: `IDLE`

    - 가드: `없음`

    - 동작: `없음`


    유스케이스: [UC-02] 음료를 선택하여 구매한다


    인수 조건:

    - 3종류 음료 각각의 가격이 서로 다르고, 버튼이 눌린 시점의 누적 투입 금액이 가격 이상이고 재고가 1 이상일 때 그 음료 1개가 배출된다.

    - 배출 완료 신호 수신 후 해당 음료 재고가 정확히 1 감소하고 다른 음료의 재고는 변하지 않는다.

    - 누적 투입 금액 − 가격 > 0인 경우 지급된 거스름돈 합계가 그 잔액과 정확히 일치하고, 지급에 사용한 액면가별 동전 개수만큼 보유 개수가
    차감된다.

    - 누적 투입 금액 − 가격 = 0인 경우 어떤 동전도 지급되지 않고 동전 보유량이 변하지 않는다.

    - 잔액을 구성할 동전이 부족한 경우 음료가 배출되지 않고, 재고가 변하지 않으며, 반환된 금액 합계가 누적 투입 금액 전액과 일치한다.

    - 버튼이 눌린 시점부터 배출 개시 신호까지의 경과 시간이 2000ms 이하이다.

    - 배출 개시 후 10000ms 안에 배출 완료 신호가 없으면 재고가 변하지 않고, 반환된 금액 합계가 누적 투입 금액 전액과 일치하며, 이후
    상태가 판매 상태이다.

    - 거래 종료 후 누적 투입 금액이 0이고 화면에 0이 표시된다.

    - 거래 종료 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.


