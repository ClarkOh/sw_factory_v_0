- key: SWF-6
  type: epic
  title: '[UC-06] 재고와 동전을 보충한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 유효한 보충 지시의 음료 종류별 재고와 액면가별 동전 보유 개수가 지시한 수량만큼 증가하고, 보충 종료 후 모든 음료 재고가
    0이면 판매 중지 상태, 아니면 판매 상태가 된다.


    **주 흐름**

    - 1. 관리자가 보충 대상(등록된 3종 음료 중 종류와 수량, 100원/500원/1000원 중 액면가와 개수)을 지정하여 보충 지시를 내린다.

    - 2. 시스템이 지시에 포함된 모든 대상이 등록된 3종 음료 또는 3개 액면가에 속하는지 확인한다.

    - 3. 시스템이 지정된 음료 종류별 재고와 액면가별 동전 보유 개수를 지시한 수량만큼 증가시킨다.

    - 4. 관리자가 보충 종료를 지시한다.

    - 5. 시스템이 모든 음료 재고가 0이 아니면 판매 상태로 전환하고, 코인 투입을 받기 시작한다.


    **대안/예외 흐름**

    - 2a. 등록되지 않은 음료 또는 비액면가가 하나라도 포함된 경우 시스템은 지시 전체를 거부하여 재고와 동전 보유량을 전혀 변경하지 않고,
    관리자에게 거부 사실을 알린 뒤 관리 모드를 유지한다.

    - 5a. 보충 종료 시점에 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 전환하고 코인을 받지 않는다.

    - 5b. 관리자가 보충 지시 없이 보충 종료를 지시한 경우 시스템은 재고·보유량을 변경하지 않고 5단계 또는 5a에 따라 상태를 전환한다.


    **인수 조건**

    - 등록된 음료 A에 대해 n개 보충 지시 후 A의 재고가 정확히 n 증가하고 다른 음료 재고는 변하지 않는다.

    - 500원 m개 보충 지시 후 500원 보유 개수가 정확히 m 증가하고 100원·1000원 보유 개수는 변하지 않는다.

    - 유효 대상과 미등록 음료가 함께 포함된 지시 후 모든 음료 재고와 모든 액면가 보유 개수가 지시 전과 동일하고, 관리자에게 거부 알림이
    출력된다.

    - 유효 액면가와 비액면가(예: 50원)가 함께 포함된 지시 후 모든 보유 개수가 지시 전과 동일하고, 관리자에게 거부 알림이 출력된다.

    - 재고가 1 이상인 음료가 하나라도 있는 상태에서 보충 종료 시 상태가 판매 상태이고 유효 코인이 수납된다.

    - 모든 음료 재고가 0인 상태에서 보충 종료 시 상태가 판매 중지 상태이고 유효 코인이 그대로 반환된다.

    - 보충 후 동전 보유량 합계가 보충 전 합계 + 보충된 금액과 같다.'
