- key: SWF-3
  type: epic
  title: '[UC-03] 반환 레버로 투입 금액을 돌려받는다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이다.

    **사후조건** 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감되고,
    화면에 0이 표시된다.


    **주 흐름**

    - 1. 고객이 반환 레버를 조작한다.

    - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 지급한다.

    - 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.

    - 4. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시하며 모든 선택 버튼을 비활성화한다.


    **대안/예외 흐름**

    - 1a. 누적 투입 금액이 0인 상태에서 레버가 조작된 경우 시스템은 어떤 동전도 지급하지 않고 동전 보유량을 변경하지 않는다.

    - 1b. 판매 중지 상태 또는 관리 모드에서 레버가 조작된 경우 시스템은 누적 투입 금액이 0이므로 어떤 동전도 지급하지 않는다.

    - 1c. 배출 완료 대기 중에 레버가 조작된 경우 시스템은 배출 진행 중 수납된 금액을 포함한 현재 누적 투입 금액 전액을 배출 처리 완료
    후 반환한다.


    **인수 조건**

    - 판매 상태에서 누적 투입 금액이 N(>0)일 때 레버 조작 후 반환된 금액 합계가 정확히 N이고 누적 투입 금액이 0이 된다.

    - 레버 조작 후 화면 표시 금액이 0이다.

    - 반환에 사용한 액면가별 동전 개수만큼 보유 개수가 차감되고 그 외 변동이 없다.

    - 누적 투입 금액이 0일 때 레버를 조작하면 지급된 동전이 없고 동전 보유량이 변하지 않는다.

    - 레버 조작 후 모든 음료 선택 버튼이 비활성화된다.'
