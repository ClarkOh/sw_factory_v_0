  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    app/vending_machine.py `_refill_valid` 는 키만 검사하고 값은 보지 않는다. `_refill` 은 stock/coins
    에 그대로 더하므로 REFILL drinks={"A": -2} 는 재고를 줄이고 coins={100: -5} 는 보유 동전을 줄인다. `_collect_ok`
    는 count <= coins[denom] 만 보므로 COLLECT_COINS denom=100 count=-3 이 통과해 `_collect_coins`
    가 coins[100] += 3 을 한다. 어느 테스트도 음수를 넣지 않는다 (random_event 는 randint(0,3), test_t_073/078
    은 양수만). e2e 장부(Machine.send)는 payload 값을 그대로 더하므로 등식 검사도 이를 잡지 못한다.


    **영향**

    존재하지 않는 동전이 보유량에 잡히면 이후 거스름돈 지급이 실물 없이 ''지급됨'' 으로 기록되어 고객이 돈을 못 받거나, 음수 재고로 total_stock
    이 0 아래로 떨어져 END_REFILL 의 두 가드(>0 / ==0)에 모두 걸리지 않아 관리 모드에서 영영 못 나온다. REQ-14 "이
