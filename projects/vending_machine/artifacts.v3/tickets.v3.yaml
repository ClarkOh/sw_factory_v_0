- key: SWF-2
  type: epic
  title: '[UC-02] 음료를 선택하여 구매한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고, 최소 1개 음료의 선택 버튼이 활성화되어 있다(누적 투입 금액 ≥ 해당 음료 가격, 해당 음료 재고
    ≥ 1).

    **사후조건** 선택된 음료 1개가 배출되고 해당 음료 재고가 1 감소하며, 누적 투입 금액이 0이 되고, (누적 투입 금액 − 가격) >
    0이었다면 그 잔액이 거스름돈으로 지급되고 사용한 동전 개수만큼 액면가별 보유 개수가 차감되며, 자판기는 판매 상태로 돌아간다.


    **주 흐름**

    - 1. 고객이 활성화된 음료 선택 버튼을 누른다.

    - 2. 시스템이 잔액(누적 투입 금액 − 음료 가격)을 계산하고, 잔액 > 0이면 보유 동전으로 잔액을 구성할 수 있는지 확인한다.

    - 3. 시스템이 버튼이 눌린 시점부터 2초 이내에 해당 음료의 배출을 개시한다.

    - 4. 시스템이 배출 개시 후 10초 이내에 배출 완료 신호를 받는다.

    - 5. 시스템이 해당 음료의 재고를 1 차감한다.

    - 6. 시스템이 잔액 > 0이면 잔액을 거스름돈으로 지급하고, 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다.

    - 7. 시스템이 누적 투입 금액을 0으로 하고 화면에 0을 표시하며 판매 상태를 유지한다.


    **대안/예외 흐름**

    - 1a. 비활성화된 버튼이 눌린 경우 시스템은 아무 것도 배출하지 않고 누적 투입 금액·재고·동전 보유량을 변경하지 않는다.

    - 2a. 보유 동전으로 잔액을 구성할 수 없는 경우 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환하며, 사용한 동전 개수만큼
    액면가별 보유 개수를 차감하고 누적 투입 금액을 0으로 한 뒤 판매 상태로 돌아간다.

    - 4a. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우 시스템은 배출 실패로 처리하여 재고를 차감하지 않고, 누적 투입 금액
    전액을 반환하고 사용한 동전만큼 보유 개수를 차감한 뒤 판매 상태로 돌아간다.

    - 4b. 배출 완료 대기 중에 유효 코인이 투입된 경우 시스템은 UC-01의 2d와 같이 수납하고, 잔액 계산에는 버튼이 눌린 시점의 누적
    투입 금액만 사용하지 않고 반환·거스름돈 시점의 누적 투입 금액 전체를 기준으로 처리하여 잔액이 고객에게 남지 않도록 한다.

    - 4c. 배출 완료 대기 중에 관리자가 전용 키로 관리 모드 진입을 요청한 경우 시스템은 UC-05로 진행한다.

    - 5a. 배출 완료 후 해당 음료 재고를 포함한 모든 음료의 재고가 0이 된 경우 시스템은 거스름돈 지급을 마친 뒤 판매 중지 상태로 전환한다.


    **인수 조건**

    - 3종류 음료 각각의 가격이 서로 다르고, 버튼이 눌린 시점의 누적 투입 금액이 가격 이상이고 재고가 1 이상일 때 그 음료 1개가 배출된다.

    - 배출 완료 신호 수신 후 해당 음료 재고가 정확히 1 감소하고 다른 음료의 재고는 변하지 않는다.

    - 누적 투입 금액 − 가격 > 0인 경우 지급된 거스름돈 합계가 그 잔액과 정확히 일치하고, 지급에 사용한 액면가별 동전 개수만큼 보유 개수가
    차감된다.

    - 누적 투입 금액 − 가격 = 0인 경우 어떤 동전도 지급되지 않고 동전 보유량이 변하지 않는다.

    - 잔액을 구성할 동전이 부족한 경우 음료가 배출되지 않고, 재고가 변하지 않으며, 반환된 금액 합계가 누적 투입 금액 전액과 일치한다.

    - 버튼이 눌린 시점부터 배출 개시 신호까지의 경과 시간이 2000ms 이하이다.

    - 배출 개시 후 10000ms 안에 배출 완료 신호가 없으면 재고가 변하지 않고, 반환된 금액 합계가 누적 투입 금액 전액과 일치하며, 이후
    상태가 판매 상태이다.

    - 거래 종료 후 누적 투입 금액이 0이고 화면에 0이 표시된다.

    - 거래 종료 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.'
