- key: SWF-4
  type: epic
  title: '[UC-04] 무조작 30초 경과로 투입 금액을 자동 반환한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.

    **사후조건** 누적 투입 금액 전액이 반환되어 누적 투입 금액이 0이 되고, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감되며,
    거래가 종료되어 화면에 0이 표시된다.


    **주 흐름**

    - 1. 고객이 마지막 코인 투입, 음료 선택, 반환 레버 조작 이후 30초 동안 아무 조작도 하지 않는다.

    - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 지급하고 사용한 개수만큼 액면가별 보유 개수를 차감한다.

    - 3. 시스템이 누적 투입 금액을 0으로 하고 거래를 종료하며 화면에 0을 표시한다.


    **대안/예외 흐름**

    - 1a. 30초 경과 전에 고객이 코인 투입, 음료 선택, 반환 레버 조작 중 하나를 수행한 경우 시스템은 자동 반환하지 않고 30초 계시를
    그 조작 시점부터 다시 시작한다.

    - 1b. 누적 투입 금액이 0인 경우 시스템은 30초가 경과해도 아무 동작도 하지 않는다.

    - 1c. 배출 완료 대기 중인 경우 시스템은 배출 처리(완료 또는 실패)가 끝날 때까지 자동 반환을 수행하지 않는다.


    **인수 조건**

    - 누적 투입 금액이 N(>0)인 상태에서 코인 투입·음료 선택·레버 조작 없이 30000ms 경과 시 반환된 금액 합계가 정확히 N이고 누적
    투입 금액이 0이 된다.

    - 29초 시점에 코인을 투입하면 그 시점부터 30초가 다시 계시되어 원래 30초 시점에는 반환이 발생하지 않는다.

    - 자동 반환 후 화면 표시 금액이 0이고 모든 선택 버튼이 비활성화된다.

    - 누적 투입 금액이 0인 상태에서 30초 경과 시 지급된 동전이 없고 동전 보유량이 변하지 않는다.'
