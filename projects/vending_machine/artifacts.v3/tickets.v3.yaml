- key: SWF-1
  type: epic
  title: '[UC-01] 코인을 투입하여 누적 투입 금액을 늘린다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이며 관리 모드가 아니다.

    **사후조건** 유효 코인의 액면가가 누적 투입 금액에 더해지고, 해당 액면가의 동전 보유 개수가 1 증가하며, 화면에 갱신된 누적 투입 금액이
    표시된다.


    **주 흐름**

    - 1. 고객이 코인 투입구에 코인 1개를 넣는다.

    - 2. 시스템이 코인이 100원, 500원, 1000원 중 하나임을 확인하고 수납한다.

    - 3. 시스템이 코인 액면가를 누적 투입 금액에 더하고 해당 액면가의 동전 보유 개수를 1 증가시킨다.

    - 4. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.

    - 5. 시스템이 각 음료에 대해 (누적 투입 금액 ≥ 가격) 이고 (재고 ≥ 1)인 음료의 선택 버튼만 활성화한다.


    **대안/예외 흐름**

    - 2a. 코인이 100원, 500원, 1000원 이외의 액면가인 경우 시스템은 그 코인 자체를 즉시 반환하고, 누적 투입 금액과 동전 보유량을
    변경하지 않는다.

    - 2b. 코인 인식에 실패한 경우 시스템은 그 코인 자체를 그대로 반환하고, 누적 투입 금액과 동전 보유량을 변경하지 않는다.

    - 2c. 자판기가 판매 중지 상태이거나 관리 모드인 경우 시스템은 그 코인 자체를 그대로 반환하고, 누적 투입 금액과 동전 보유량을 변경하지
    않는다.

    - 2d. 배출 진행 중(배출 완료 대기 중)에 유효 코인이 투입된 경우 시스템은 정상 수납하여 누적 투입 금액에 더하고 보유 개수를 1 증가시키며,
    그 금액은 배출 완료 후 다음 구매에 사용 가능하다.


    **인수 조건**

    - 판매 상태에서 100원·500원·1000원 각각을 투입하면 누적 투입 금액이 정확히 그 액면가만큼 증가한다.

    - 판매 상태에서 유효 코인 투입 후 해당 액면가의 동전 보유 개수가 투입 전 대비 정확히 1 증가한다.

    - 유효 코인 투입 직후 화면 표시 금액이 누적 투입 금액과 일치한다.

    - 10원, 50원 등 비액면가 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.

    - 인식 실패 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.

    - 판매 중지 상태 또는 관리 모드에서 유효 코인 투입 시 동일 코인이 반환되고 누적 투입 금액과 모든 액면가 보유 개수가 변하지 않는다.

    - 배출 개시 후 완료 전에 유효 코인을 투입하면 배출 완료 후 누적 투입 금액이 그 액면가만큼 증가해 있고, 그 금액으로 다음 음료 선택
    버튼 활성화가 판정된다.

    - 누적 투입 금액이 음료 가격 이상이고 재고가 1 이상인 음료의 버튼만 활성화되고, 둘 중 하나라도 불만족인 음료의 버튼은 비활성화된다.'
