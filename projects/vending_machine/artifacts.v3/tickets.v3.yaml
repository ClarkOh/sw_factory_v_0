- key: SWF-7
  type: epic
  title: '[UC-07] 동전과 미반환 보관액을 확인·회수한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 회수한 개수만큼 해당 액면가의 동전 보유 개수가 차감되고, 미반환 보관액을 회수한 경우 미반환 보관액이 0이 된다.


    **주 흐름**

    - 1. 관리자가 미반환 보관액 확인을 요청한다.

    - 2. 시스템이 현재 미반환 보관액을 관리자에게 표시한다.

    - 3. 관리자가 액면가(100원/500원/1000원)와 개수를 지정하여 동전 회수를 지시한다.

    - 4. 시스템이 해당 액면가의 보유 개수를 회수한 개수만큼 차감한다.

    - 5. 관리자가 미반환 보관액 회수를 지시한다.

    - 6. 시스템이 미반환 보관액에 해당하는 금액만큼 동전을 회수 처리하여 액면가별 보유 개수를 차감하고 미반환 보관액을 0으로 한다.


    **대안/예외 흐름**

    - 3a. 지정한 액면가의 보유 개수보다 많은 개수의 회수가 지시된 경우 시스템은 회수를 거부하여 보유 개수를 변경하지 않고 관리자에게 알린다.

    - 3b. 비액면가에 대한 회수가 지시된 경우 시스템은 회수를 거부하여 보유 개수를 변경하지 않고 관리자에게 알린다.

    - 5a. 미반환 보관액이 0인 상태에서 회수가 지시된 경우 시스템은 보유 개수를 변경하지 않는다.

    - 6a. 미반환 보관액을 보유 동전으로 구성할 수 없는 경우 시스템은 회수를 거부하여 보유 개수와 미반환 보관액을 변경하지 않고 관리자에게
    알린다.


    **인수 조건**

    - 관리 모드에서 미반환 보관액 확인 요청 시 표시된 금액이 기록된 미반환 보관액과 일치한다.

    - 1000원 k개 회수 지시 후 1000원 보유 개수가 정확히 k 감소하고 100원·500원 보유 개수는 변하지 않는다.

    - 보유 개수를 초과하는 회수 지시 후 보유 개수가 변하지 않고 관리자에게 거부 알림이 출력된다.

    - 미반환 보관액 P(>0) 회수 후 미반환 보관액이 0이고 동전 보유량 합계가 회수 전 대비 정확히 P 감소한다.

    - 회수 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
    보관액)과 같다.

    - 관리 모드가 아닌 상태에서 회수 또는 미반환 보관액 확인 요청은 수행되지 않는다.'
