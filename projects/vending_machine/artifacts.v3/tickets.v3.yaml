    유스케이스: [UC-08] 정전 후 재기동하여 판매를 재개한다


    인수 조건:

    - 누적 투입 금액이 N(>0)인 상태에서 정전 후 재기동 시 화면 표시 및 누적 투입 금액이 0이고, 미반환 보관액이 정전 전 대비 정확히
    N 증가하며, 동전 보유량은 정전 직전과 동일하다.

    - 정전 시점에 어떤 동전도 물리적으로 반환되지 않는다.

    - 배출 개시 후 완료 신호 전에 정전되면 재기동 후 해당 음료 재고가 정전 직전 대비 정확히 1 감소하고 다른 음료 재고는 동일하다.

    - 배출 개시 전 또는 완료 후에 정전되면 재기동 후 모든 음료 재고가 정전 직전과 동일하다.

    - 재기동 시 보존된 재고가 하나라도 1 이상이면 판매 상태이고, 모두 0이면 판매 중지 상태이며, 이 판정에 외부 입력이나 네트워크 통신이
    전혀 사용되지 않는다.

    - 재기동 후 동전 보유량 합계가 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(미정산 누적 투입 금액)+(미반환
