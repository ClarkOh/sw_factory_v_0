- key: SWF-149
  type: bug
  title: '[검토/high] 보충·회수 수량이 양수여야 한다는 규칙이 없어 음수 지시로 동전·재고가 무에서 생기거나 음수가 된다'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-073 가드는 키(음료 종류·액면가)만 검사하고 값은 검사하지 않는다 (app/vending_machine.py:154-158 `_refill_valid`).
    `REFILL drinks={"A": -5}` 는 재고를 음수로, `coins={100: -3}` 는 보유 개수를 음수로 만든다. T-078
    가드 `count <= coins[denom]` 은 count=-3 에 대해 참이므로 `coins[denom] -= -3` 으로 보유 개수가
    증가한다 (app/vending_machine.py:165-168, 350-352). app/__main__.py `convert()` 는
    "-3" 을 int 로 받아들여 CLI 에서 그대로 도달한다. e2e 무작위 열은 `rng.randint(0, 3)` 만 사용하고(tests/e2e/test_scenarios.py:1006-1015),
    장부도 `collected += denom * count` 로 음수를 그대로 따라가므로 check_invariants 의 등식이 이 경우를
