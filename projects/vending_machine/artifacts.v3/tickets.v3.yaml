- key: SWF-148
  type: bug
  title: '[검토/high] 배출 중 투입된 코인이 ''다음 구매''에 남지 않고 즉시 거스름돈으로 반환된다 — REQ-12 가 어떤 테스트로도
    검증되지 않고'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    FSM T-050/T-051/T-052 action 은 `pay_out(credit - price(selected)); credit = 0`
    으로 배출 중 수납분(T-040)을 전부 거스름돈에 섞어 내보낸다 (app/vending_machine.py:292-301 `_finish_dispense`).
    DISPENSING → HAS_CREDIT 전이는 존재하지 않는다. UC-01 acceptance 7번째 항목은 "배출 완료 후 누적 투입
    금액이 그 액면가만큼 증가해 있고, 그 금액으로 다음 음료 선택 버튼 활성화가 판정된다" 고 요구하지만 UC-02 alt 4b 는 "잔액이
    고객에게 남지 않도록 한다" 로 정반대를 기술한다. 테스트는 후자만 고정한다: tests/test_fsm.py::test_t_050 (`refunded
    == [300]` for 500+100), tests/e2e/test_scenarios.py::test_uc01_coin_inserted_during_dispensing_is_accepted_and_settled
    (`refunded == [700]`, `credit == 0`).


    **영향**

    고객이 두 번째 음료를 사려고 배출 중에 넣은 돈이 첫 음료의 거스름돈과 함께 그대로 튀어나온다. 원문 6번("다음 구매에 쓸 수 있다")이
    출시 후에도 동작하지 않으며, UC-01 acceptance 는 통과한 적 없는 채로 초록이다.


    **제안**

    UC-02 alt 4b 를 UC-01 acceptance 와 일치시키고 FSM 에 다음을 추가: "DISPENSE_DONE 시 거스름돈은 (버튼이
    눌린 시점의 누적 투입 금액 − 가격) 만 지급하고, 배출 중 수납된 금액은 누적 투입 금액으로 남겨 HAS_CREDIT 로 전이하며 30초
    계시를 시작한다." 요구사항에 문장 추가: "배출 완료 시 거스름돈은 선택 시점의 누적 투입 금액에서 가격을 뺀 잔액으로 한정하며, 배출 중
    투입된 금액은 반환하지 않고 누적 투입 금액으로 유지한다." T-050/T-051/T-052 의 잔액 기준과 테스트를 그에 맞게 수정.


    **참조** REQ-11, REQ-12, UC-01, UC-02, T-040, T-050, T-051, T-052, tests/test_fsm.py::test_t_050,
    tests/e2e/test_scenarios.py::test_uc01_coin_inserted_during_dispensing_is_accepted_and_settled


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
