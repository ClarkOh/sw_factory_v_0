requirements:
- id: REQ-01
  text: 자판기는 100원, 500원, 1000원 코인을 투입 코인으로 받아들인다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-02
  text: 100원, 500원, 1000원 이외의 코인이 투입되면 즉시 반환한다.
  kind: functional
  source: 그 외 금액은 즉시 반환한다.
- id: REQ-03
  text: 받아들인 코인의 금액은 누적 투입 금액에 더해진다.
  kind: functional
  source: 투입 금액은 누적된다.
- id: REQ-04
  text: 누적 투입 금액은 항상 화면에 표시된다.
  kind: functional
  source: 누적 금액은 항상 화면에 표시된다.
- id: REQ-05
  text: 자판기는 3종류의 음료를 취급한다.
  kind: constraint
  source: 음료는 3종류이며
- id: REQ-06
  text: 3종류 음료의 가격은 각각 서로 다르다.
  kind: constraint
  source: 가격이 각각 다르다.
- id: REQ-07
  text: 재고는 음료 종류별로 별도의 수량으로 관리된다.
  kind: functional
  source: 재고는 종류별로 관리된다.
- id: REQ-08
  text: 음료 선택 버튼은 누적 투입 금액이 해당 음료 가격 이상이고 해당 음료 재고가 1 이상일 때만 활성화된다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-09
  text: 활성화된 선택 버튼이 눌리면 해당 음료를 배출한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고
- id: REQ-10
  text: 음료 배출 시 누적 투입 금액에서 음료 가격을 뺀 잔액이 0보다 크면 그 잔액을 거스름돈으로 반환한다.
  kind: functional
  source: 거스름돈이 있으면 함께 반환한다.
- id: REQ-11
  text: 배출 진행 중에 투입된 유효 코인은 정상 수납되어 누적 투입 금액에 더해진다.
  kind: functional
  source: 배출이 진행 중일 때 투입된 코인은 정상적으로 수납되어 누적 금액에 더해진다.
- id: REQ-12
  text: 배출 진행 중에 수납된 금액은 다음 구매에 사용할 수 있다.
  kind: functional
  source: 다음 구매에 쓸 수 있다.
- id: REQ-13
  text: 자판기는 거스름돈용 동전 보유량을 100원, 500원, 1000원 액면가별 개수로 보유한다.
  kind: functional
  source: 자판기는 거스름돈용 동전을 액면가(100원, 500원, 1000원)별 개수로 보유한다.
- id: REQ-14
  text: 동전 보유량은 REQ-15~REQ-17 및 REQ-32, REQ-33, REQ-41의 규칙 이외의 원인으로는 변하지 않는다.
  kind: constraint
  source: 이 보유량은 아래 규칙에 따라서만 변한다.
- id: REQ-15
  text: 자판기가 받아들인 코인 1개당 그 액면가의 보유 개수를 1 증가시킨다.
  kind: functional
  source: 자판기가 받아들인 코인은 그 액면가의 보유 개수에 1개 더해진다.
- id: REQ-16
  text: 거스름돈 또는 반환 금액 지급에 사용한 동전은 액면가별로 사용한 개수만큼 보유 개수에서 뺀다.
  kind: functional
  source: 지급에 사용한 동전은 액면가별로 보유 개수에서 그만큼 뺀다.
- id: REQ-17
  text: 받아들이지 않고 되돌려 보내는 코인(비액면가, 인식 실패, 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에 더해지지 않는다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(비액면가, 인식 실패, 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에
    더해지지 않는다.
- id: REQ-18
  text: 받아들이지 않는 코인은 투입된 그 코인 자체가 그대로 반환된다.
  kind: functional
  source: 들어온 그 코인이 그대로 나간다.
- id: REQ-19
  text: 어느 시점에나 동전 보유량 합계는 (초기 보유액) + (보충된 금액) − (회수된 금액) + (판매된 음료 가격의 합) + (아직 정산되지
    않은 누적 투입 금액) + (미반환 보관액)과 같다.
  kind: constraint
  source: 어느 시점에나 보유량 합계는 다음과 같다. 이 밖의 항은 없다.
- id: REQ-20
  text: 거스름돈을 구성할 동전이 부족하면 음료를 배출하지 않는다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고
- id: REQ-21
  text: 거스름돈을 구성할 동전이 부족하면 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-22
  text: 판매 상태에서 반환 레버가 조작되면 언제든 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 고객은 판매 상태에서 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다.
- id: REQ-23
  text: 누적 투입 금액이 0보다 큰 상태에서 코인 투입, 음료 선택, 반환 레버 조작이 30초 동안 없으면 누적 투입 금액 전액을 자동 반환한다.
  kind: functional
  source: 30초 동안 코인 투입, 음료 선택, 반환 레버 조작이 없으면 자판기는 누적 투입 금액 전액을 자동으로 반환하고
- id: REQ-24
  text: 30초 무조작 자동 반환 후 거래를 종료한다.
  kind: functional
  source: 자동으로 반환하고 거래를 종료한다.
- id: REQ-25
  text: 배출 개시 후 10초 안에 배출 완료 신호를 받지 못하면 배출 실패로 처리한다.
  kind: functional
  source: 배출을 개시한 뒤 10초 안에 배출 완료 신호를 받지 못하면 자판기는 배출 실패로 처리한다.
- id: REQ-26
  text: 배출 실패 시 해당 음료의 재고를 차감하지 않는다.
  kind: functional
  source: 재고를 차감하지 않고
- id: REQ-27
  text: 배출 실패 시 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 누적 투입 금액 전액을 반환한 뒤
- id: REQ-28
  text: 배출 실패 처리 후 판매 상태로 돌아간다.
  kind: functional
  source: 누적 투입 금액 전액을 반환한 뒤 판매 상태로 돌아간다.
- id: REQ-29
  text: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 된다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고
- id: REQ-30
  text: 판매 중지 상태에서는 코인을 받지 않는다.
  kind: functional
  source: 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-31
  text: 관리자는 전용 키로 관리 모드에 진입할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어갈 수 있다.
- id: REQ-32
  text: 배출 완료를 기다리는 중에도 관리 모드 진입이 가능하다.
  kind: functional
  source: 배출 완료를 기다리는 중에도 들어갈 수 있다.
- id: REQ-33
  text: 누적 투입 금액이 0보다 큰 상태에서 관리 모드 진입이 요청되면 관리 모드 전환 전에 그 금액 전액을 반환한다.
  kind: functional
  source: 자판기는 먼저 그 금액 전액을 반환하고
- id: REQ-34
  text: 관리 모드 진입 시 반환 후 누적 투입 금액을 0으로 만든 뒤 관리 모드로 전환한다.
  kind: functional
  source: 누적 투입 금액을 0으로 만든 뒤 관리 모드로 전환한다.
- id: REQ-35
  text: 관리 모드에서 관리자는 재고를 보충할 수 있다.
  kind: functional
  source: 관리 모드에서 관리자는 재고와 동전을 보충할 수 있다.
- id: REQ-36
  text: 관리 모드에서 관리자는 동전을 보충할 수 있다.
  kind: functional
  source: 관리 모드에서 관리자는 재고와 동전을 보충할 수 있다.
- id: REQ-37
  text: 재고 보충은 등록된 3종의 음료에 대해서만 지시할 수 있다.
  kind: functional
  source: 재고 보충은 등록된 3종의 음료에 대해서만
- id: REQ-38
  text: 동전 보충은 100원, 500원, 1000원 액면가에 대해서만 지시할 수 있다.
  kind: functional
  source: 동전 보충은 100원, 500원, 1000원 액면가에 대해서만 지시할 수 있다.
- id: REQ-39
  text: 등록되지 않은 음료 또는 비액면가가 하나라도 포함된 보충 지시는 전체를 거부한다.
  kind: functional
  source: 그 밖의 대상이 포함된 보충 지시는 전체를 거부하고
- id: REQ-40
  text: 보충 지시를 거부하면 관리자에게 거부 사실을 알린다.
  kind: functional
  source: 전체를 거부하고 관리자에게 알린다.
- id: REQ-41
  text: 관리 모드에서 관리자는 액면가별로 동전을 회수할 수 있다.
  kind: functional
  source: 관리 모드에서 관리자는 액면가별로 동전을 회수할 수 있으며
- id: REQ-42
  text: 동전 회수 시 회수한 개수만큼 해당 액면가의 보유 개수를 차감한다.
  kind: functional
  source: 회수한 개수만큼 해당 액면가의 보유 개수를 차감한다.
- id: REQ-43
  text: 보충이 끝나면 자판기는 판매 상태로 돌아간다.
  kind: functional
  source: 보충이 끝나면 판매 상태로 돌아간다.
- id: REQ-44
  text: 보충 종료 시점에 모든 음료의 재고가 0이면 판매 중지 상태로 돌아간다.
  kind: functional
  source: 그 시점에 모든 음료의 재고가 0이면 판매 중지 상태로 돌아간다.
- id: REQ-45
  text: 선택 버튼이 눌린 시점부터 배출 개시까지의 시간은 2초를 넘지 않는다.
  kind: nonfunctional
  source: 버튼을 누른 뒤 배출이 시작될 때까지 2초를 넘지 않는다.
- id: REQ-46
  text: 정전 후 재기동 시 누적 투입 금액은 0에서 시작한다.
  kind: functional
  source: 정전 후 재기동 시 누적 투입 금액은 0에서 시작한다.
- id: REQ-47
  text: 정전 시점에 투입 중이던 금액은 물리적으로 반환하지 않는다.
  kind: functional
  source: 정전 시점에 투입 중이던 금액은 물리적으로 반환하지 않는다.
- id: REQ-48
  text: 정전 시점에 투입 중이던 금액을 '미반환 보관액'으로 기록한다.
  kind: functional
  source: 자판기는 그 금액을 '미반환 보관액'으로 기록하고
- id: REQ-49
  text: 미반환 보관액에 해당하는 동전은 동전 보유량에 그대로 남긴다.
  kind: functional
  source: 동전 보유량에 그대로 남긴다.
- id: REQ-50
  text: 관리자는 관리 모드에서 미반환 보관액을 확인할 수 있다.
  kind: functional
  source: 미반환 보관액은 관리자가 관리 모드에서 확인하고
- id: REQ-51
  text: 관리자는 관리 모드에서 미반환 보관액을 회수할 수 있다.
  kind: functional
  source: 미반환 보관액은 관리자가 관리 모드에서 확인하고 회수할 수 있다.
- id: REQ-52
  text: 배출 개시 후 완료 전에 전원이 끊긴 경우, 재기동 시 해당 음료의 재고를 1 차감한다.
  kind: functional
  source: 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우, 재기동 시 해당 음료의 재고를 1 차감한다.
- id: REQ-53
  text: 재기동 시 판매 상태와 판매 중지 상태의 판정은 기기 내부에 보존된 음료 종류별 재고로만 한다.
  kind: functional
  source: 재기동 시 판매 상태와 판매 중지 상태의 판정은 기기 내부에 보존된 음료 종류별 재고로만 한다.
- id: REQ-54
  text: 재기동 시 외부로부터 재고 정보를 받지 않는다.
  kind: constraint
  source: 외부에서 재고 정보를 받지 않는다.
- id: REQ-55
  text: 자판기는 외부 네트워크에 연결하지 않는다.
  kind: constraint
  source: 외부 네트워크에 연결하지 않는다.
- id: REQ-56
  text: 모든 처리는 기기 내부에서 완결된다.
  kind: constraint
  source: 모든 처리는 기기 내부에서 끝난다.
- id: REQ-57
  text: 자판기는 동시에 한 명의 고객만 상대한다.
  kind: constraint
  source: 동시에 한 명의 고객만 상대한다.
- id: REQ-58
  text: 대상은 기존 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버) 위에서 동작하는 제어 소프트웨어로 한정된다.
  kind: constraint
  source: 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버)는 이미 있고, 그 위에서 도는 제어 소프트웨어만 대상이다.
- id: REQ-59
  text: '[모호] 인식 실패 코인은 받아들이지 않고 반환한다 (인식 실패의 판정 기준은 문서에 정의되지 않음).'
  kind: constraint
  source: 인식 실패, 판매 중지 상태나 관리 모드에서 투입된 코인
- id: REQ-60
  text: '[모호] 관리 모드에서 투입된 코인은 받아들이지 않고 그대로 반환한다.'
  kind: constraint
  source: 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에 더해지지 않는다. 들어온 그 코인이 그대로 나간다.
