usecases:
- id: UC-01
  title: 코인을 투입하여 금액을 누적한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 관리 모드가 아니다.
  postcondition: 유효 코인의 액면가가 누적 투입 금액에 더해지고 화면에 갱신 표시된다.
  main_flow:
  - 1. 고객이 코인 투입구에 코인을 1개 투입한다.
  - 2. 시스템이 투입된 코인의 액면가를 판별한다.
  - 3. 시스템이 액면가가 100원, 500원, 1000원 중 하나임을 확인한다.
  - 4. 시스템이 해당 액면가를 기존 누적 투입 금액에 합산한다.
  - 5. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.
  - 6. 시스템이 각 음료의 선택 버튼 활성/비활성 상태를 갱신한다.
  alt_flows:
  - 3a. 액면가가 100원, 500원, 1000원이 아닌 경우 시스템은 해당 코인을 반환구로 즉시 반환하고 누적 투입 금액을 변경하지 않으며
    화면 표시를 유지한다.
  - 3b. 코인의 액면가를 판별할 수 없는 경우 시스템은 해당 코인을 반환구로 즉시 반환하고 누적 투입 금액을 변경하지 않는다.
  - 1a. 자판기가 판매 중지 상태인 경우 시스템은 투입된 코인을 받아들이지 않고 반환구로 반환하며 누적 투입 금액을 변경하지 않는다.
  - 1b. 자판기가 관리 모드인 경우 시스템은 투입된 코인을 받아들이지 않고 반환구로 반환한다.
  acceptance:
  - 누적 투입 금액 0원 상태에서 100원 코인 투입 후, 화면 표시 금액 == 100.
  - 누적 투입 금액 0원 상태에서 500원 코인 투입 후, 화면 표시 금액 == 500.
  - 누적 투입 금액 0원 상태에서 1000원 코인 투입 후, 화면 표시 금액 == 1000.
  - 100원 투입 후 500원 투입 시, 화면 표시 금액 == 600.
  - 10원 또는 50원 코인 투입 시, 반환구 반환 코인 == 투입한 코인 1개 AND 누적 투입 금액 변화량 == 0.
  - 임의의 코인 투입 직후 화면 표시 금액 == 시스템 내부 누적 투입 금액.
  - 판매 중지 상태에서 100원 코인 투입 시, 누적 투입 금액 변화량 == 0 AND 반환구 반환 금액 == 100.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-06
  - REQ-18
  - REQ-28
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 누적 투입 금액이 선택하려는 음료의 가격 이상이며, 해당 음료의 재고가 1개 이상이어서 그 음료의
    선택 버튼이 활성화되어 있다.
  postcondition: 선택한 음료 1개가 배출구로 배출되고, 거스름돈이 있으면 반환되며, 해당 음료의 재고가 1 감소하고 누적 투입 금액이
    0으로 초기화되어 화면에 0이 표시된다.
  main_flow:
  - 1. 고객이 활성화된 음료의 선택 버튼을 누른다.
  - 2. 시스템이 누적 투입 금액에서 해당 음료 가격을 뺀 거스름돈 금액을 산출한다.
  - 3. 시스템이 보유 동전으로 그 거스름돈 금액을 구성할 수 있음을 확인한다.
  - 4. 시스템이 해당 음료 1개를 배출구로 배출한다.
  - 5. 시스템이 해당 음료의 재고를 1 감소시킨다.
  - 6. 시스템이 거스름돈 금액이 0보다 크면 그 금액을 반환구로 반환한다.
  - 7. 시스템이 누적 투입 금액을 0으로 초기화하고 화면에 0을 표시한다.
  - 8. 시스템이 각 음료의 선택 버튼 활성/비활성 상태를 갱신한다.
  alt_flows:
  - 1a. 고객이 비활성화된 버튼(누적 투입 금액 < 가격, 또는 재고 == 0)을 누른 경우 시스템은 음료를 배출하지 않고 누적 투입 금액을
    변경하지 않으며 현재 상태를 유지한다.
  - 3a. 보유 동전으로 거스름돈 금액을 구성할 수 없는 경우 시스템은 음료를 배출하지 않고 재고를 변경하지 않으며 누적 투입 금액 전액을 반환구로
    반환하고 누적 투입 금액을 0으로 만들어 화면에 0을 표시한다.
  - 6a. 거스름돈 금액이 0인 경우 시스템은 반환구로 아무 금액도 반환하지 않는다.
  - 8a. 배출 후 3종류 음료의 재고가 모두 0이 된 경우 시스템은 판매 중지 상태로 전이하고 모든 선택 버튼을 비활성화한다.
  acceptance:
  - 누적 투입 금액 == 음료 가격인 상태에서 해당 버튼을 누르면, 배출구 배출 음료 == 선택 음료 1개 AND 반환구 반환 금액 == 0 AND
    화면 표시 금액 == 0.
  - 누적 투입 금액 1000, 음료 가격 700, 보유 동전으로 300 구성 가능일 때 버튼을 누르면, 배출 음료 수 == 1 AND 반환구 반환
    금액 == 300 AND 해당 음료 재고 감소량 == 1.
  - 누적 투입 금액 1000, 음료 가격 700, 보유 동전으로 300 구성 불가일 때 버튼을 누르면, 배출 음료 수 == 0 AND 해당 음료
    재고 감소량 == 0 AND 반환구 반환 금액 == 1000 AND 화면 표시 금액 == 0.
  - 누적 투입 금액 < 음료 가격일 때 해당 버튼 상태 == 비활성 AND 버튼 입력 후 배출 음료 수 == 0 AND 누적 투입 금액 변화량
    == 0.
  - 특정 음료 재고 == 0일 때 해당 버튼 상태 == 비활성 (누적 투입 금액과 무관).
  - 특정 음료 재고 >= 1 AND 누적 투입 금액 >= 해당 음료 가격일 때 해당 버튼 상태 == 활성.
  - 버튼 입력 시각 t0, 배출 시작 시각 t1에 대해 (t1 - t0) <= 2.0초.
  - 3종류 음료의 가격 집합의 원소 수 == 3 (서로 다름) AND 취급 음료 종류 수 == 3.
  - 재고는 음료 종류별로 각각 조회 가능하며, 한 종류의 재고 감소가 다른 종류의 재고를 변경하지 않는다.
  requirements:
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-15
  - REQ-23
  - REQ-28
- id: UC-03
  title: 반환 레버로 투입 금액을 회수한다
  actor: 고객
  precondition: 자판기에 전원이 공급되어 있고 누적 투입 금액이 0 이상이다.
  postcondition: 조작 시점의 누적 투입 금액 전액이 반환구로 반환되고 누적 투입 금액이 0이 되어 화면에 0이 표시된다.
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 현재 누적 투입 금액 전액을 반환구로 반환한다.
  - 3. 시스템이 누적 투입 금액을 0으로 초기화한다.
  - 4. 시스템이 화면에 0을 표시한다.
  - 5. 시스템이 모든 음료의 선택 버튼을 비활성화 상태로 갱신한다.
  alt_flows:
  - 2a. 누적 투입 금액이 0인 경우 시스템은 반환구로 아무 금액도 반환하지 않고 화면 표시 0을 유지한다.
  - 1a. 음료 배출 처리가 진행 중인 경우 시스템은 진행 중인 배출 처리를 완료한 뒤 그 시점의 누적 투입 금액(0)을 기준으로 반환을 수행한다.
  - 1b. 자판기가 판매 중지 상태인 경우에도 시스템은 누적 투입 금액 전액을 반환구로 반환한다.
  acceptance:
  - 누적 투입 금액 == 600에서 반환 레버 조작 시, 반환구 반환 금액 == 600 AND 화면 표시 금액 == 0.
  - 누적 투입 금액 == 0에서 반환 레버 조작 시, 반환구 반환 금액 == 0 AND 화면 표시 금액 == 0.
  - 반환 레버 조작 후 모든 음료 선택 버튼 상태 == 비활성.
  requirements:
  - REQ-16
  - REQ-28
- id: UC-04
  title: 재고 소진으로 판매를 중지한다
  actor: 고객
  precondition: 자판기가 판매 상태이다.
  postcondition: 3종류 음료의 재고가 모두 0인 동안 자판기는 판매 중지 상태이며 코인을 받아들이지 않는다.
  main_flow:
  - 1. 고객이 음료를 구매하여 마지막 재고가 소진된다.
  - 2. 시스템이 3종류 음료의 재고가 모두 0임을 확인한다.
  - 3. 시스템이 판매 중지 상태로 전이한다.
  - 4. 시스템이 화면에 판매 중지를 표시하고 모든 선택 버튼을 비활성화한다.
  - 5. 고객이 코인을 투입한다.
  - 6. 시스템이 해당 코인을 받아들이지 않고 반환구로 반환한다.
  alt_flows:
  - 2a. 어느 한 종류라도 재고가 1개 이상인 경우 시스템은 판매 상태를 유지한다.
  - 5a. 고객이 반환 레버를 조작한 경우 시스템은 판매 중지 상태에서도 누적 투입 금액 전액을 반환한다.
  - 6a. 관리자가 관리 모드에서 재고를 보충한 경우 시스템은 보충 종료 시 판매 상태로 전이한다.
  - '[미규정 REQ-31] 판매 중지 상태 진입 시 이미 투입되어 있던 누적 금액의 처리 방식이 요구사항에 규정되어 있지 않아 본 유스케이스에서
    정의하지 않는다. 확정 전까지 검증 대상에서 제외한다.'
  acceptance:
  - 3종류 재고가 모두 0이 된 직후 자판기 상태 == 판매 중지.
  - 판매 중지 상태에서 100원/500원/1000원 코인을 각각 투입 시, 모든 경우 누적 투입 금액 변화량 == 0 AND 반환구 반환 금액
    == 투입 액면가.
  - 재고 중 1종류라도 1개 이상이면 자판기 상태 != 판매 중지.
  requirements:
  - REQ-17
  - REQ-18
  - REQ-31
- id: UC-05
  title: 관리 모드에서 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기에 전원이 공급되어 있고 관리자가 관리자 전용 키를 보유하고 있다.
  postcondition: 보충된 음료 재고 수량과 거스름돈용 동전 보유량이 반영되고 자판기가 판매 상태로 전이한다.
  main_flow:
  - 1. 관리자가 관리자 전용 키를 입력한다.
  - 2. 시스템이 키를 검증하고 관리 모드로 진입하여 화면에 관리 모드를 표시한다.
  - 3. 관리자가 음료 종류별 재고를 보충한다.
  - 4. 시스템이 종류별 재고 수량을 갱신하여 표시한다.
  - 5. 관리자가 거스름돈용 동전을 보충한다.
  - 6. 시스템이 동전 액면가별 보유 수량을 갱신하여 표시한다.
  - 7. 관리자가 보충 종료를 지시한다.
  - 8. 시스템이 판매 상태로 전이하고 화면에 누적 투입 금액 0을 표시하며 선택 버튼 상태를 갱신한다.
  alt_flows:
  - 2a. 입력된 키가 관리자 전용 키가 아닌 경우 시스템은 관리 모드로 진입하지 않고 이전 상태를 유지한다.
  - 3a. 관리자가 재고를 보충하지 않고 동전만 보충한 경우 시스템은 음료 재고 수량을 변경하지 않는다.
  - 5a. 관리자가 동전을 보충하지 않고 재고만 보충한 경우 시스템은 동전 보유량을 변경하지 않는다.
  - 8a. 보충 종료 시점에 3종류 음료의 재고가 모두 0인 경우 시스템은 판매 중지 상태로 전이한다.
  - '[미규정 REQ-30] 관리 모드 진입 시 진행 중이던 투입 금액과 거래의 처리 방식이 요구사항에 규정되어 있지 않아 본 유스케이스에서 정의하지
    않는다. 확정 전까지 검증 대상에서 제외한다.'
  acceptance:
  - 관리자 전용 키 입력 후 자판기 상태 == 관리 모드.
  - 관리자 전용 키가 아닌 입력 후 자판기 상태 변화 == 없음.
  - 관리 모드에서 음료 A를 n개 보충 시, 음료 A 재고 증가량 == n AND 음료 B/C 재고 변화량 == 0.
  - 관리 모드에서 100원 동전 m개 보충 시, 100원 동전 보유 수량 증가량 == m.
  - 재고가 1개 이상인 상태에서 보충 종료 지시 후 자판기 상태 == 판매 상태 AND 화면 표시 금액 == 0.
  requirements:
  - REQ-19
  - REQ-20
  - REQ-21
  - REQ-22
  - REQ-30
- id: UC-06
  title: 정전 후 재기동한다
  actor: 관리자
  precondition: 자판기가 정전으로 전원이 차단된 상태이며, 차단 직전 누적 투입 금액은 0 이상이다.
  postcondition: 자판기가 누적 투입 금액 0인 상태에서 판매 상태 또는 판매 중지 상태로 동작을 시작하고 화면에 0이 표시된다.
  main_flow:
  - 1. 관리자가 자판기에 전원을 재공급한다.
  - 2. 시스템이 기동을 시작한다.
  - 3. 시스템이 누적 투입 금액을 0으로 초기화한다.
  - 4. 시스템이 화면에 누적 투입 금액 0을 표시한다.
  - 5. 시스템이 음료 종류별 재고를 기준으로 선택 버튼 활성/비활성 상태를 갱신한다.
  - 6. 시스템이 고객의 코인 투입을 받아들일 수 있는 상태가 된다.
  alt_flows:
  - 5a. 3종류 음료의 재고가 모두 0인 경우 시스템은 판매 중지 상태로 기동하고 코인을 받아들이지 않는다.
  - 1a. 재기동 중 다시 정전이 발생한 경우 시스템은 다음 전원 재공급 시 동일하게 누적 투입 금액 0에서 기동한다.
  - '[미규정 REQ-29] 정전 시 반환된 것으로 간주하는 투입 금액을 물리적으로 반환하는지 여부가 요구사항에 규정되어 있지 않아 본 유스케이스에서
    정의하지 않는다. 확정 전까지 검증 대상에서 제외한다.'
  acceptance:
  - 누적 투입 금액 == 700인 상태에서 전원 차단 후 재공급 시, 기동 완료 시점의 누적 투입 금액 == 0 AND 화면 표시 금액 == 0.
  - 재기동 후 재고가 1개 이상인 음료에 대해, 누적 투입 금액이 가격 이상이 될 때까지 선택 버튼 상태 == 비활성.
  - 재기동 후 3종류 재고가 모두 0이면 자판기 상태 == 판매 중지.
  requirements:
  - REQ-24
  - REQ-29
- id: UC-07
  title: 단일 고객 거래를 기기 내부에서 완결한다
  actor: 고객
  precondition: 자판기에 전원이 공급되어 있고 진행 중인 다른 거래가 없다.
  postcondition: 코인 투입부터 배출 또는 반환까지의 거래가 외부 통신 없이 기기 내부에서 완결되고, 다음 고객의 거래가 시작 가능한
    상태가 된다.
  main_flow:
  - 1. 고객이 코인을 투입하여 거래를 시작한다.
  - 2. 시스템이 해당 고객의 거래를 진행 중으로 점유한다.
  - 3. 고객이 음료를 선택하거나 반환 레버를 조작한다.
  - 4. 시스템이 배출 및 반환 처리를 기기 내부에서 수행하여 완료한다.
  - 5. 시스템이 누적 투입 금액을 0으로 만들고 거래 점유를 해제한다.
  - 6. 시스템이 다음 고객의 코인 투입을 받아들일 수 있는 상태가 된다.
  alt_flows:
  - 3a. 거래가 진행 중인 동안 다른 고객이 코인을 투입한 경우 시스템은 그 코인을 현재 진행 중인 하나의 거래의 누적 투입 금액으로 합산하며
    별도의 병행 거래를 생성하지 않는다.
  - 4a. 거스름돈 부족으로 배출이 불가한 경우 시스템은 전액을 반환하고 거래 점유를 해제한다.
  - 4b. 외부 시스템 응답이 필요한 처리 경로는 존재하지 않으며, 시스템은 네트워크 단절 상태에서도 1~6단계를 동일하게 완료한다.
  acceptance:
  - 임의 시점에 시스템이 관리하는 진행 중 거래(누적 투입 금액 컨텍스트)의 수 <= 1.
  - 네트워크 인터페이스가 없거나 단절된 환경에서 코인 투입-음료 선택-배출-거스름돈 반환 시나리오가 전부 성공한다.
  - 제어 소프트웨어 실행 중 발생하는 외부 네트워크 연결(소켓/HTTP/DNS) 시도 횟수 == 0.
  - 제어 소프트웨어의 의존 대상에 외부 시스템 호출이 포함되지 않는다 (정적 검사 결과 외부 통신 API 사용 == 0건).
  - 제어 대상 하드웨어 인터페이스는 코인 투입구, 선택 버튼, 배출구, 반환 레버, 표시 화면으로 한정되며 그 외 신규 하드웨어 요구 == 0건.
  requirements:
  - REQ-25
  - REQ-26
  - REQ-27
  - REQ-28
