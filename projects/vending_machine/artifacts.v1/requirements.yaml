requirements:
- id: REQ-01
  text: 자판기는 100원 코인 투입을 받아들인다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-02
  text: 자판기는 500원 코인 투입을 받아들인다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-03
  text: 자판기는 1000원 코인 투입을 받아들인다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-04
  text: 100원, 500원, 1000원이 아닌 코인이 투입되면 자판기는 해당 코인을 즉시 반환한다.
  kind: functional
  source: 그 외 금액은 즉시 반환한다.
- id: REQ-05
  text: 자판기는 투입된 코인의 금액을 기존 투입 금액에 누적하여 합산한다.
  kind: functional
  source: 투입 금액은 누적된다.
- id: REQ-06
  text: 자판기는 현재 누적 투입 금액을 항상 화면에 표시한다.
  kind: functional
  source: 누적 금액은 항상 화면에 표시된다.
- id: REQ-07
  text: 자판기는 3종류의 음료를 취급한다.
  kind: functional
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-08
  text: 3종류 음료의 가격은 서로 다르게 설정된다.
  kind: functional
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-09
  text: 자판기는 재고 수량을 음료 종류별로 구분하여 관리한다.
  kind: functional
  source: 재고는 종류별로 관리된다.
- id: REQ-10
  text: 누적 투입 금액이 해당 음료의 가격 이상이고 그 음료의 재고가 1개 이상일 때 해당 음료의 선택 버튼이 활성화된다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-11
  text: 누적 투입 금액이 해당 음료의 가격 미만이거나 그 음료의 재고가 0이면 해당 음료의 선택 버튼은 비활성화된다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-12
  text: 활성화된 선택 버튼이 눌리면 자판기는 해당 음료를 배출한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-13
  text: 음료 배출 시 누적 투입 금액에서 음료 가격을 뺀 거스름돈이 0보다 크면 자판기는 그 거스름돈을 반환한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-14
  text: 보유 동전으로 거스름돈 금액을 구성할 수 없으면 자판기는 음료를 배출하지 않는다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-15
  text: 보유 동전으로 거스름돈 금액을 구성할 수 없으면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-16
  text: 반환 레버가 조작되면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 고객은 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다.
- id: REQ-17
  text: 3종류 음료의 재고가 모두 0이면 자판기는 판매 중지 상태로 전이한다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-18
  text: 판매 중지 상태에서 자판기는 투입된 코인을 받아들이지 않는다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-19
  text: 관리자 전용 키가 입력되면 자판기는 관리 모드로 진입한다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-20
  text: 관리 모드에서 관리자는 음료 재고를 보충할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-21
  text: 관리 모드에서 관리자는 거스름돈용 동전을 보충할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다.
- id: REQ-22
  text: 보충이 종료되면 자판기는 관리 모드에서 판매 상태로 전이한다.
  kind: functional
  source: 보충이 끝나면 판매 상태로 돌아간다.
- id: REQ-23
  text: 선택 버튼이 눌린 시점부터 음료 배출이 시작될 때까지의 시간은 2초를 넘지 않는다.
  kind: nonfunctional
  source: 버튼을 누른 뒤 배출이 시작될 때까지 2초를 넘지 않는다.
- id: REQ-24
  text: 정전 후 재기동 시 자판기는 누적 투입 금액을 0으로 초기화한 상태에서 동작을 시작한다.
  kind: nonfunctional
  source: 정전 후 재기동 시 투입 중이던 금액은 반환된 것으로 간주하고 0에서 시작한다.
- id: REQ-25
  text: 제어 소프트웨어는 외부 네트워크에 연결하지 않는다.
  kind: constraint
  source: 외부 네트워크에 연결하지 않는다.
- id: REQ-26
  text: 모든 처리는 기기 내부에서 수행되며 외부 시스템에 처리를 위임하지 않는다.
  kind: constraint
  source: 모든 처리는 기기 내부에서 끝난다.
- id: REQ-27
  text: 자판기는 동시에 한 명의 고객 거래만 처리한다.
  kind: constraint
  source: 동시에 한 명의 고객만 상대한다.
- id: REQ-28
  text: 개발 대상은 기존 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버) 위에서 동작하는 제어 소프트웨어로 한정한다.
  kind: constraint
  source: 하드웨어(코인 투입구, 버튼, 배출구, 반환 레버)는 이미 있고, 그 위에서 도는 제어 소프트웨어만 대상이다.
- id: REQ-29
  text: '[모호] 정전 시 반환된 것으로 간주하는 투입 금액을 물리적으로 반환하는지 여부는 문서에 규정되어 있지 않다.'
  kind: constraint
  source: 정전 후 재기동 시 투입 중이던 금액은 반환된 것으로 간주하고 0에서 시작한다.
- id: REQ-30
  text: '[모호] 관리 모드 진입 시 진행 중이던 투입 금액과 거래의 처리 방식은 문서에 규정되어 있지 않다.'
  kind: constraint
  source: 관리자는 전용 키로 관리 모드에 들어가 재고와 동전을 보충할 수 있다. 보충이 끝나면 판매 상태로 돌아간다.
- id: REQ-31
  text: '[모호] 판매 중지 상태 진입 시 이미 투입되어 있던 누적 금액의 처리 방식은 문서에 규정되어 있지 않다.'
  kind: constraint
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
