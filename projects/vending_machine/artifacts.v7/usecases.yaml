usecases:
- id: UC-01
  title: 코인을 투입하여 누적 투입 금액을 늘린다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 다른 고객의 거래가 진행 중이지 않다
  postcondition: 투입된 코인의 액면가만큼 누적 투입 금액과 해당 액면가 동전 보유 개수가 증가하고, 누적 투입 금액이 화면에 표시된다
  main_flow:
  - step: 1. 고객이 코인 투입구에 코인을 넣는다
    event: INSERT_COIN
  - step: 2. 시스템이 코인의 액면가를 판정한다
  - step: 3. 시스템이 코인을 수납하고 해당 액면가의 동전 보유 개수를 1 증가시킨다
  - step: 4. 시스템이 누적 투입 금액에 그 액면가를 더한다
  - step: 5. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다
  - step: 6. 시스템이 누적 투입 금액 이상 가격이면서 재고가 1개 이상인 음료의 선택 버튼을 활성화한다
  alt_flows:
  - step: 2a. 투입액이 100원/500원/1000원이 아닌 경우, 시스템은 그 코인을 수납하지 않고 즉시 그대로 반환하며 누적 투입 금액과
      동전 보유량을 변경하지 않는다
    event: INSERT_COIN
  - step: '2b. 코인 인식에 실패한 경우, 시스템은 그 코인을 수납하지 않고 그대로 반환하며 누적 투입 금액과 동전 보유량을 변경하지 않는다
      (인식 실패 판정 기준은 요구사항에 미정의: REQ-91)'
    event: INSERT_COIN
  - step: 6a. 누적 투입 금액이 모든 음료 가격보다 작거나 해당 음료 재고가 0인 경우, 시스템은 그 음료의 선택 버튼을 비활성 상태로
      유지한다
  acceptance:
  - 100원/500원/1000원 코인 투입 시 누적 투입 금액이 정확히 그 액면가만큼 증가한다
  - 100원/500원/1000원 코인 투입 시 해당 액면가의 보유 개수가 정확히 1 증가한다
  - 비액면가 코인 또는 인식 실패 코인 투입 후 누적 투입 금액 변화량 = 0 이고 액면가별 보유 개수 변화량 = 0 이며, 투입된 코인과 동일한
    코인이 반환구에 나온다
  - 코인 투입 처리 후 화면 표시 금액 == 누적 투입 금액
  - 동전 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 (그 밖의 항 없음)
  - 한 거래가 진행 중인 동안 두 번째 고객 세션이 동시에 생성되지 않는다
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-08
  - REQ-14
  - REQ-15
  - REQ-17
  - REQ-18
  - REQ-89
  - REQ-91
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 선택하려는 음료의 선택 버튼이 활성화되어 있다(누적 투입 금액 >= 가격 이고 재고 >= 1)
  postcondition: 배출이 개시되고 일련번호가 부여되며, 거스름돈이 0보다 크면 거스름돈이 반환된다
  main_flow:
  - step: 1. 고객이 활성화된 음료 선택 버튼을 누른다
    event: SELECT_DRINK
  - step: 2. 시스템이 버튼을 누른 시점의 누적 투입 금액에서 음료 가격을 뺀 값을 거스름돈으로 계산한다
  - step: 3. 시스템이 거스름돈을 구성할 동전 보유량이 충분한지 확인한다
  - step: 4. 시스템이 그 배출에 새 일련번호를 부여하고 배출을 개시한다
  - step: 5. 시스템이 거스름돈이 0보다 크면 거스름돈을 반환하고 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다
  - step: 6. 시스템이 누적 투입 금액을 갱신하고 화면에 표시한다
  alt_flows:
  - step: 1a. 고객이 비활성 상태의 선택 버튼을 누른 경우, 시스템은 배출을 개시하지 않고 누적 투입 금액·재고·동전 보유량을 변경하지
      않는다
    event: SELECT_DRINK
  - step: 3a. 거스름돈을 구성할 동전이 부족한 경우, 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환한 뒤 누적 투입 금액을
      0으로 만들고 재고를 차감하지 않는다
    event: SELECT_DRINK
  acceptance:
  - 취급 음료는 정확히 3종이며 3종의 가격이 서로 모두 다르다
  - 거스름돈 == (버튼을 누른 시점의 누적 투입 금액) − (선택한 음료 가격)
  - 선택 버튼 누름 시각부터 배출 시작 시각까지 경과 시간 <= 2000ms
  - 배출 개시마다 부여된 일련번호가 직전 값보다 1 크다
  - 거스름돈 지급 후 액면가별 보유 개수 감소량 합계 금액 == 지급한 거스름돈 금액
  - 동전 부족 케이스에서 재고 변화량 = 0 이고 반환 금액 == 버튼을 누른 시점의 누적 투입 금액이며 종료 후 누적 투입 금액 == 0
  - 비활성 버튼 누름 후 상태·재고·누적 투입 금액·동전 보유량이 모두 불변이다
  - 거스름돈 동전 조합 선택 규칙은 요구사항에 미정의(REQ-93)이므로 조합 자체가 아니라 지급 총액과 보유량 감소액의 일치만 판정한다
  - 구체적 음료 가격과 초기 재고 수량은 요구사항에 미정의(REQ-92)이므로 생성 시 주입된 값으로 판정한다
  - 제어 대상은 소프트웨어이며 코인 투입구·버튼·배출구·반환 레버는 외부 인터페이스로만 호출된다
  requirements:
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-13
  - REQ-16
  - REQ-19
  - REQ-20
  - REQ-28
  - REQ-67
  - REQ-90
  - REQ-92
  - REQ-93
- id: UC-03
  title: 배출 진행 중에 코인을 투입한다
  actor: 고객
  precondition: 배출이 개시되어 배출 완료를 기다리는 중이다
  postcondition: 투입된 코인이 수납되어 누적 투입 금액에 더해지고, 그 금액은 진행 중인 배출의 거스름돈에 포함되지 않는다
  main_flow:
  - step: 1. 고객이 배출 진행 중에 코인 투입구에 코인을 넣는다
    event: INSERT_COIN
  - step: 2. 시스템이 코인을 정상 수납하고 해당 액면가의 보유 개수를 1 증가시킨다
  - step: 3. 시스템이 누적 투입 금액에 그 액면가를 더한다
  - step: 4. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다
  - step: 5. 시스템이 배출 완료 후에도 그 금액을 누적 투입 금액으로 유지한다
  alt_flows:
  - step: 2a. 비액면가 또는 인식 실패 코인인 경우, 시스템은 수납하지 않고 그대로 반환하며 누적 투입 금액과 보유량을 변경하지 않는다
    event: INSERT_COIN
  - step: 5a. 진행 중인 배출이 배출 실패로 처리된 경우, 시스템은 배출 중 투입된 금액을 포함한 누적 투입 금액 전액을 반환한다
    event: DISPENSE_TIMEOUT
  acceptance:
  - 배출 중 투입 금액은 진행 중인 배출에서 지급된 거스름돈에 포함되지 않는다(지급 거스름돈 == 버튼 누름 시점 누적 금액 − 음료 가격)
  - 배출 완료 직후 누적 투입 금액 == 배출 중 투입된 금액의 합
  - 배출 완료 후 남은 누적 투입 금액으로 다음 구매가 가능하다
  requirements:
  - REQ-11
  - REQ-12
- id: UC-04
  title: 배출 완료 신호를 처리한다
  actor: 배출 기구(하드웨어)
  precondition: 배출이 개시되어 특정 일련번호의 배출 완료를 기다리는 중이다
  postcondition: 해당 음료 재고가 1 차감되고 음료 가격이 판매 금액으로 확정되며 거래가 종료된다
  main_flow:
  - step: 1. 배출 기구가 일련번호를 포함한 배출 완료 신호를 보낸다
    event: DISPENSE_COMPLETE
  - step: 2. 시스템이 신호의 일련번호가 현재 기다리는 일련번호와 일치하는지 확인한다
  - step: 3. 시스템이 해당 음료의 재고를 1 차감하고 음료 가격을 판매 금액으로 계상한다
  - step: 4. 시스템이 판매 상태로 돌아가 남은 누적 투입 금액을 화면에 표시한다
  alt_flows:
  - step: 2a. 일련번호가 일치하지 않는 경우, 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다
    event: DISPENSE_COMPLETE
  - step: 4a. 차감 결과 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 전환한다
  - step: 4b. 관리 모드 진입이 예약되어 있는 경우, 시스템은 배출 완료 직후 관리 모드로 전환한다
  acceptance:
  - 일련번호 일치 신호 1건당 해당 음료 재고 감소량 == 1
  - 일련번호 불일치 신호 처리 후 상태 이름·재고·누적 투입 금액·동전 보유량이 모두 불변이다
  - 배출 완료 후 모든 종류 재고 == 0 이면 상태 이름 == 판매 중지
  requirements:
  - REQ-07
  - REQ-29
  - REQ-45
- id: UC-05
  title: 배출 실패를 처리하고 고장 상태로 전환한다
  actor: 배출 기구(하드웨어)
  precondition: 배출이 개시되어 배출 완료를 기다리는 중이고 개시 후 10초가 경과했다
  postcondition: 재고가 차감되지 않고 누적 투입 금액 전액이 반환되며 자판기가 고장 상태가 된다
  main_flow:
  - step: 1. 배출 기구가 배출 개시 후 10초 안에 배출 완료 신호를 보내지 않는다
    event: DISPENSE_TIMEOUT
  - step: 2. 시스템이 해당 배출을 배출 실패로 처리하고 재고를 차감하지 않는다
  - step: 3. 시스템이 누적 투입 금액 전액을 반환하고 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다
  - step: 4. 시스템이 누적 투입 금액을 0으로 만든다
  - step: 5. 시스템이 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를 표시한다
  alt_flows:
  - step: 1a. 10초 이내에 일련번호가 일치하는 배출 완료 신호가 도착한 경우, 시스템은 배출 실패로 처리하지 않고 정상 완료(UC-04)로
      진행한다
    event: DISPENSE_COMPLETE
  - step: 5a. 그 배출에 관리 모드 진입이 예약되어 있던 경우, 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다
    event: INSERT_ADMIN_KEY
  acceptance:
  - 배출 개시 후 10초 경과 시점까지 유효한 완료 신호가 없으면 상태 이름 == 고장
  - 배출 실패 처리 후 해당 음료 재고 변화량 == 0
  - 배출 실패 처리 시 반환 금액 == 실패 처리 직전 누적 투입 금액
  - 고장 상태 진입 시점의 누적 투입 금액 == 0
  requirements:
  - REQ-24
  - REQ-25
  - REQ-26
  - REQ-27
  - REQ-38
  - REQ-52
- id: UC-06
  title: 무효한 배출 완료 신호를 지연 배출로 기록한다
  actor: 배출 기구(하드웨어)
  precondition: 자판기가 해당 일련번호의 배출 완료를 더 이상 기다리지 않는다(실패 처리 완료 또는 다른 일련번호 대기 중)
  postcondition: 상태·재고·금액이 변경되지 않고 지연 배출 기록이 음료 종류와 함께 남는다
  main_flow:
  - step: 1. 배출 기구가 일련번호를 포함한 배출 완료 신호를 보낸다
    event: DISPENSE_COMPLETE
  - step: 2. 시스템이 그 일련번호가 현재 기다리는 일련번호와 일치하지 않음을 판정한다
  - step: 3. 시스템이 상태·재고·누적 투입 금액·동전 보유량을 변경하지 않는다
  - step: 4. 시스템이 그 신호를 어느 음료였는지와 함께 지연 배출로 기록한다
  alt_flows:
  - step: 2a. 배출 실패로 처리한 뒤에 도착한 신호인 경우에도, 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다
    event: DISPENSE_COMPLETE
  - step: 4a. 동일 일련번호의 신호가 중복 도착한 경우, 시스템은 상태·재고·금액을 변경하지 않는다
    event: DISPENSE_COMPLETE
  acceptance:
  - 무효 신호 처리 전후 상태 이름·종류별 재고·누적 투입 금액·액면가별 보유량이 모두 동일하다
  - 무효 신호 1건당 지연 배출 기록이 1건 추가되고 그 기록에 음료 종류가 포함된다
  - 지연 배출 기록은 관리자 확인 전까지 미확인 상태로 조회된다
  requirements:
  - REQ-29
  - REQ-32
  - REQ-33
- id: UC-07
  title: 반환 레버로 투입 금액을 돌려받는다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 된다
  main_flow:
  - step: 1. 고객이 반환 레버를 조작한다
    event: PULL_RETURN_LEVER
  - step: 2. 시스템이 누적 투입 금액 전액을 반환한다
  - step: 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다
  - step: 4. 시스템이 누적 투입 금액을 0으로 만들고 화면에 0을 표시한다
  - step: 5. 시스템이 모든 선택 버튼을 비활성화한다
  alt_flows:
  - step: 1a. 누적 투입 금액이 0인 상태에서 반환 레버가 조작된 경우, 시스템은 아무것도 반환하지 않고 상태·금액·보유량을 변경하지 않는다
    event: PULL_RETURN_LEVER
  - step: 1b. 배출 완료를 기다리는 중에 반환 레버가 조작된 경우, 시스템은 진행 중인 배출의 거스름돈과 섞지 않고 그 시점의 누적 투입
      금액만 반환한다
    event: PULL_RETURN_LEVER
  acceptance:
  - 반환 금액 == 레버 조작 직전의 누적 투입 금액
  - 반환 후 누적 투입 금액 == 0 이고 화면 표시 금액 == 0
  - 액면가별 보유 개수 감소량의 합계 금액 == 반환 금액
  requirements:
  - REQ-16
  - REQ-21
  - REQ-93
- id: UC-08
  title: 30초 무조작으로 투입 금액을 자동 반환받는다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다
  postcondition: 누적 투입 금액 전액이 자동 반환되고 거래가 종료된다
  main_flow:
  - step: 1. 고객이 30초 동안 코인 투입, 음료 선택, 반환 레버 조작을 하지 않는다
    event: NO_ACTION_TIMEOUT
  - step: 2. 시스템이 누적 투입 금액 전액을 자동으로 반환하고 액면가별 보유 개수를 그만큼 차감한다
  - step: 3. 시스템이 누적 투입 금액을 0으로 만들고 화면에 0을 표시한다
  - step: 4. 시스템이 거래를 종료하고 모든 선택 버튼을 비활성화한다
  alt_flows:
  - step: 1a. 30초 경과 전에 코인 투입·음료 선택·반환 레버 조작 중 하나가 발생한 경우, 시스템은 자동 반환하지 않고 무조작 시간을
      0부터 다시 센다
    event: INSERT_COIN
  - step: 1b. 누적 투입 금액이 0인 상태로 30초가 경과한 경우, 시스템은 자동 반환을 수행하지 않는다
    event: NO_ACTION_TIMEOUT
  acceptance:
  - 마지막 고객 조작 시각으로부터 30초 경과 시 자동 반환 금액 == 그 시점의 누적 투입 금액
  - 자동 반환 후 누적 투입 금액 == 0 이고 거래가 종료되어 있다
  - 29.9초 시점에 코인이 투입되면 자동 반환이 발생하지 않는다
  requirements:
  - REQ-22
  - REQ-23
- id: UC-09
  title: 고장 상태에서 고객 조작을 거부한다
  actor: 고객
  precondition: 자판기가 고장 상태이고 누적 투입 금액이 0이다
  postcondition: 코인이 수납되지 않고 그대로 반환되며 자판기는 고장 상태를 유지한다
  main_flow:
  - step: 1. 시스템이 화면에 고장임을 표시하고 관리자 호출 안내를 표시한다
  - step: 2. 고객이 코인 투입구에 코인을 넣는다
    event: INSERT_COIN
  - step: 3. 시스템이 코인을 받아들이지 않고 그대로 되돌려 보낸다
  - step: 4. 시스템이 모든 음료 선택 버튼을 비활성 상태로 유지한다
  alt_flows:
  - step: 2a. 고객이 음료 선택 버튼을 누른 경우, 시스템은 배출을 개시하지 않고 상태·재고·금액을 변경하지 않는다
    event: SELECT_DRINK
  - step: 2b. 고객이 반환 레버를 조작한 경우, 시스템은 반환할 누적 투입 금액이 0이므로 아무것도 반환하지 않는다
    event: PULL_RETURN_LEVER
  - step: 2c. 전원이 껐다 켜진 경우, 시스템은 고장 상태로 복원되며 고장이 해제되지 않는다
    event: POWER_ON
  acceptance:
  - 고장 상태에서 화면에 고장 표시와 관리자 호출 안내가 동시에 표시된다
  - 고장 상태 코인 투입 후 누적 투입 금액 변화량 = 0, 액면가별 보유 개수 변화량 = 0, 투입된 코인이 그대로 반환된다
  - 고장 상태에서 3종 모든 선택 버튼의 활성 여부 == 비활성
  - 고장 상태에서 전원 재투입 후 상태 이름 == 고장
  requirements:
  - REQ-17
  - REQ-34
  - REQ-35
  - REQ-36
  - REQ-37
  - REQ-39
  - REQ-40
- id: UC-10
  title: 판매 중지 상태에서 코인 투입을 거부한다
  actor: 고객
  precondition: 모든 음료의 재고가 0이어서 자판기가 판매 중지 상태다
  postcondition: 코인이 수납되지 않고 그대로 반환되며 자판기는 판매 중지 상태를 유지한다
  main_flow:
  - step: 1. 시스템이 판매 중지 상태를 화면에 표시하고 모든 선택 버튼을 비활성화한다
  - step: 2. 고객이 코인 투입구에 코인을 넣는다
    event: INSERT_COIN
  - step: 3. 시스템이 코인을 받아들이지 않고 투입된 코인 그대로 반환한다
  - step: 4. 시스템이 누적 투입 금액과 동전 보유량을 변경하지 않는다
  alt_flows:
  - step: 2a. 고객이 음료 선택 버튼을 누른 경우, 시스템은 배출을 개시하지 않고 상태·재고·금액을 변경하지 않는다
    event: SELECT_DRINK
  - step: 2b. 관리자가 전용 키로 관리 모드에 진입한 경우, 시스템은 관리 모드로 전환한다
    event: INSERT_ADMIN_KEY
  acceptance:
  - 모든 종류 재고 == 0 이 되는 즉시 상태 이름 == 판매 중지
  - 판매 중지 상태에서 코인 투입 후 누적 투입 금액 변화량 = 0 이고 액면가별 보유 개수 변화량 = 0 이며 투입된 코인이 그대로 반환된다
  requirements:
  - REQ-17
  - REQ-45
  - REQ-46
- id: UC-11
  title: 전용 키로 관리 모드에 진입한다
  actor: 관리자
  precondition: 관리자가 전용 키를 소지하고 있다
  postcondition: 누적 투입 금액이 0으로 정리된 상태에서 자판기가 관리 모드가 된다
  main_flow:
  - step: 1. 관리자가 전용 키를 꽂는다
    event: INSERT_ADMIN_KEY
  - step: 2. 시스템이 누적 투입 금액이 0보다 큰지 확인한다
  - step: 3. 시스템이 누적 투입 금액 전액을 반환하고 누적 투입 금액을 0으로 만든다
  - step: 4. 시스템이 관리 모드로 전환하고 관리 메뉴를 표시한다
  alt_flows:
  - step: 2a. 자판기가 고장 상태인 경우에도, 시스템은 관리 모드 진입을 허용한다
    event: INSERT_ADMIN_KEY
  - step: 2b. 배출 완료를 기다리는 중인 경우, 시스템은 관리 모드 진입을 예약해 두고 배출 완료 직후 관리 모드로 전환하며, 이미 개시된
      배출의 음료 가격은 판매로 확정하고 배출 중 투입된 금액만 반환한다
    event: INSERT_ADMIN_KEY
  - step: 2c. 진입이 예약된 배출이 배출 실패로 처리된 경우, 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다
    event: DISPENSE_TIMEOUT
  - step: 2d. 관리 모드에서 코인이 투입된 경우, 시스템은 그 코인을 받아들이지 않고 그대로 반환한다
    event: INSERT_COIN
  acceptance:
  - 관리 모드 진입 완료 시점의 누적 투입 금액 == 0
  - 진입 전 누적 투입 금액 > 0 이면 반환 금액 == 진입 요청 시점의 누적 투입 금액
  - 상태 이름 == 고장 인 상태에서 키 삽입 후 상태 이름 == 관리 모드
  - 배출 대기 중 키 삽입 시 즉시 상태가 바뀌지 않고 관리 모드 진입 예약 == 참 이며, 배출 완료 직후 상태 이름 == 관리 모드
  - 예약 진입 시 반환 금액 == 배출 중 투입된 금액이고 개시된 배출의 음료 가격은 판매 금액에 계상된다
  - 예약 진입 중 배출 실패 시 상태 전이 순서가 고장 → 관리 모드 이다
  requirements:
  - REQ-41
  - REQ-47
  - REQ-48
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-52
  - REQ-53
- id: UC-12
  title: 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드다
  postcondition: 지시한 음료 재고와 액면가별 동전 보유 개수가 증가하고 자판기가 판매 상태 또는 판매 중지 상태로 돌아간다
  main_flow:
  - step: 1. 관리자가 음료 종류와 수량을 지정해 재고 보충을 지시한다
    event: REFILL_STOCK
  - step: 2. 시스템이 대상이 등록된 3종 음료이고 수량이 1 이상의 정수인지 검증한다
  - step: 3. 시스템이 지시한 수량만큼 해당 음료의 재고를 증가시킨다
  - step: 4. 관리자가 액면가와 개수를 지정해 동전 보충을 지시한다
    event: REFILL_COINS
  - step: 5. 시스템이 대상이 100원/500원/1000원이고 개수가 1 이상의 정수인지 검증한다
  - step: 6. 시스템이 지시한 개수만큼 해당 액면가의 보유 개수를 증가시킨다
  - step: 7. 관리자가 관리 모드를 종료한다
    event: EXIT_ADMIN_MODE
  - step: 8. 시스템이 판매 상태로 돌아간다
  alt_flows:
  - step: 2a. 등록되지 않은 음료가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 거부 사실을
      알린다
    event: REFILL_STOCK
  - step: 2b. 0 이하의 수량이 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 알린다
    event: REFILL_STOCK
  - step: 5a. 100원/500원/1000원 이외의 액면가나 0 이하의 개수가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 보유량을
      변경하지 않으며 관리자에게 알린다
    event: REFILL_COINS
  - step: 8a. 종료 시점에 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 돌아간다
  acceptance:
  - 유효한 보충 지시 후 대상 재고 증가량 == 지시 수량, 대상 액면가 보유 개수 증가량 == 지시 개수
  - 무효 항목이 1개라도 포함된 지시 처리 후 모든 재고와 모든 액면가 보유 개수의 변화량 = 0 (부분 반영 없음)
  - 거부된 지시마다 관리자에게 거부 통지가 1건 발생한다
  - 보충 종료 후 모든 종류 재고 > 0 이면 상태 이름 == 판매, 모든 종류 재고 == 0 이면 상태 이름 == 판매 중지
  requirements:
  - REQ-54
  - REQ-55
  - REQ-56
  - REQ-57
  - REQ-58
  - REQ-59
  - REQ-60
  - REQ-65
  - REQ-66
- id: UC-13
  title: 재고를 실물에 맞춰 하향 조정한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 장부 재고와 실물 재고가 다를 수 있다
  postcondition: 지정한 음료의 장부 재고가 조정값으로 낮아지고 지연 배출 기록이 확인 완료로 표시된다
  main_flow:
  - step: 1. 관리자가 지연 배출 기록을 조회한다
    event: ADJUST_STOCK
  - step: 2. 시스템이 지연 배출 기록을 음료 종류와 함께 표시한다
  - step: 3. 관리자가 음료 종류와 조정값을 지정해 재고 조정을 지시한다
    event: ADJUST_STOCK
  - step: 4. 시스템이 조정값이 0 이상이고 현재 장부 재고 이하인지 검증한다
  - step: 5. 시스템이 해당 음료의 재고를 조정값으로 설정한다
  - step: 6. 시스템이 지연 배출 기록을 관리자가 확인한 것으로 표시한다
  alt_flows:
  - step: 4a. 조정값이 음수인 경우, 시스템은 지시를 거부하고 재고를 변경하지 않으며 관리자에게 알린다
    event: ADJUST_STOCK
  - step: 4b. 조정값이 현재 장부 재고보다 큰 경우, 시스템은 지시를 거부하고 재고를 변경하지 않으며 관리자에게 알린다
    event: ADJUST_STOCK
  acceptance:
  - 0 <= 조정값 <= 현재 장부 재고 인 지시 처리 후 해당 음료 재고 == 조정값
  - 조정값 < 0 또는 조정값 > 현재 장부 재고 인 지시 처리 후 재고 변화량 = 0 이고 거부 통지가 발생한다
  - 정상 조정 완료 후 해당 지연 배출 기록의 확인 여부 == 확인됨
  requirements:
  - REQ-61
  - REQ-62
  - REQ-63
- id: UC-14
  title: 동전을 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드다
  postcondition: 회수한 개수만큼 액면가별 보유 개수가 차감되고 보유량 합계가 미반환 보관액 이상으로 유지된다
  main_flow:
  - step: 1. 관리자가 액면가와 회수 개수를 지정해 동전 회수를 지시한다
    event: COLLECT_COINS
  - step: 2. 시스템이 대상이 100원/500원/1000원이고 회수 개수가 1 이상의 정수인지 검증한다
  - step: 3. 시스템이 회수 후 보유량 합계가 미반환 보관액 이상으로 남는지 검증한다
  - step: 4. 시스템이 지정된 액면가의 보유 개수를 회수 개수만큼 차감하고 동전을 배출한다
  - step: 5. 시스템이 갱신된 액면가별 보유량을 관리자에게 표시한다
  alt_flows:
  - step: 2a. 등록되지 않은 액면가나 0 이하의 개수가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게
      알린다
    event: COLLECT_COINS
  - step: 3a. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우, 시스템은 지시를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다
    event: COLLECT_COINS
  - step: 2b. 회수 개수가 해당 액면가의 현재 보유 개수를 초과하는 경우, 시스템은 지시를 거부하고 보유량을 변경하지 않는다
    event: COLLECT_COINS
  acceptance:
  - 유효한 회수 지시 후 해당 액면가 보유 개수 감소량 == 회수 개수
  - 회수 완료 후 보유량 합계 >= 미반환 보관액
  - 보유량 합계를 미반환 보관액 아래로 낮추는 지시 처리 후 모든 액면가 보유 개수의 변화량 = 0
  - 회수 후에도 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 이 성립한다
  requirements:
  - REQ-16
  - REQ-18
  - REQ-58
  - REQ-64
  - REQ-72
- id: UC-15
  title: 미반환 보관액을 확인하고 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 미반환 보관액이 0보다 크다
  postcondition: 관리자가 미반환 보관액을 확인하고 회수하며 회수 후에도 보유량 합계 제약이 유지된다
  main_flow:
  - step: 1. 관리자가 미반환 보관액 조회를 요청한다
    event: COLLECT_COINS
  - step: 2. 시스템이 기록된 미반환 보관액 금액을 표시한다
  - step: 3. 관리자가 미반환 보관액 회수를 지시한다
    event: COLLECT_COINS
  - step: 4. 시스템이 해당 금액에 상당하는 동전을 배출하고 액면가별 보유 개수를 그만큼 차감한다
  - step: 5. 시스템이 갱신된 미반환 보관액과 보유량을 표시한다
  alt_flows:
  - step: 2a. 미반환 보관액이 0인 경우, 시스템은 회수를 수행하지 않고 보유량을 변경하지 않는다
    event: COLLECT_COINS
  - step: 4a. 보유량 합계가 미반환 보관액보다 적은 경우, 시스템은 회수 지시를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다
    event: COLLECT_COINS
  acceptance:
  - 관리 모드에서 미반환 보관액 값이 조회 가능하다
  - 미반환 보관액 회수 시 액면가별 보유 개수 감소량의 합계 금액 == 회수한 금액
  - 회수 후 보유량 합계 >= 갱신된 미반환 보관액
  - 회수 후 미반환 보관액 갱신 규칙은 요구사항에 미정의(REQ-94)이므로 보유량 합계 항등식 성립 여부로만 판정한다
  requirements:
  - REQ-70
  - REQ-71
  - REQ-72
  - REQ-94
- id: UC-16
  title: 배출 실패를 확인하여 고장 표시를 해제한다
  actor: 관리자
  precondition: 자판기가 고장 상태에서 관리 모드로 진입해 있고 진행 중이던 배출 기록이 남아 있다
  postcondition: 진행 중이던 배출 기록이 정리되고 고장 표시가 해제된다
  main_flow:
  - step: 1. 시스템이 진행 중이던 배출의 일련번호와 음료를 관리자에게 표시한다
  - step: 2. 관리자가 배출 실패를 확인한다
    event: CONFIRM_DISPENSE_FAILURE
  - step: 3. 시스템이 진행 중이던 배출 기록을 정리한다
  - step: 4. 시스템이 고장 표시를 해제한다
  - step: 5. 관리자가 관리 모드를 종료한다
    event: EXIT_ADMIN_MODE
  - step: 6. 시스템이 재고에 따라 판매 상태 또는 판매 중지 상태로 전환한다
  alt_flows:
  - step: 5a. 배출 실패를 확인하지 않은 채 관리 모드를 나간 경우, 시스템은 다시 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출
      안내를 표시한다
    event: EXIT_ADMIN_MODE
  - step: 5b. 관리 모드 종료 조작 방법이 요구사항에 미정의(REQ-95)이므로 키 제거를 종료 이벤트로 간주한다
    event: EXIT_ADMIN_MODE
  - step: 6a. 전원을 껐다 켜기만 한 경우, 시스템은 고장 상태를 유지하며 고장을 해제하지 않는다
    event: POWER_ON
  acceptance:
  - 배출 실패 확인 후 진행 중인 배출의 일련번호와 음료 필드가 비어 있다
  - 배출 실패 확인 후 관리 모드를 종료하면 상태 이름 != 고장
  - 배출 실패 미확인 상태로 관리 모드를 종료하면 상태 이름 == 고장
  - 관리자 확인 없이 전원 재투입만으로는 상태 이름이 고장에서 바뀌지 않는다
  requirements:
  - REQ-40
  - REQ-42
  - REQ-43
  - REQ-44
  - REQ-95
- id: UC-17
  title: 정전 후 재기동하여 상태를 복원한다
  actor: 전원 공급 장치
  precondition: 저장 파일에 직전에 완전히 기록된 상태가 존재하거나 저장 파일이 없다
  postcondition: 저장된 상태가 복원되고 정전·재기동 규칙이 적용된 상태로 자판기가 기동한다
  main_flow:
  - step: 1. 전원이 끊긴다
    event: POWER_OFF
  - step: 2. 전원이 다시 공급된다
    event: POWER_ON
  - step: 3. 시스템이 저장 파일에서 상태를 복원한다
  - step: 4. 시스템이 누적 투입 금액을 0으로 설정하고 정전 시점에 투입 중이던 금액을 물리적으로 반환하지 않는다
  - step: 5. 시스템이 그 금액을 미반환 보관액으로 기록하고 동전 보유량에 그대로 남긴다
  - step: 6. 시스템이 배출 일련번호를 저장된 값에 이어서 증가하도록 설정한다
  - step: 7. 시스템이 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태를 판정한다
  alt_flows:
  - step: 3a. 저장된 상태가 고장 상태인 경우, 시스템은 고장 상태로 기동하고 고장을 해제하지 않는다
    event: POWER_ON
  - step: 4a. 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우, 시스템은 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된 금액으로
      계상하며, 미반환 보관액을 (정전 시점 누적 투입 금액 − 음료 가격)으로 계상한다
    event: POWER_ON
  - step: 3b. 저장 파일이 없거나 손상된 경우, 시스템은 초기 상태(재고 0, 동전 0, 보관액 0)로 기동하고 관리자에게 알린다
    event: POWER_ON
  acceptance:
  - 재기동 직후 누적 투입 금액 == 0
  - 정전 시점 투입 금액에 대한 물리적 반환이 발생하지 않고 미반환 보관액 == 정전 시점 누적 투입 금액(배출 중 정전이 아닌 경우)
  - 배출 중 정전 시 해당 음료 재고 감소량 == 1, 판매 금액 증가분 == 음료 가격, 미반환 보관액 == 정전 시점 누적 투입 금액 − 음료
    가격
  - 재기동 후 첫 배출의 일련번호 > 저장 파일에 기록되어 있던 일련번호
  - 재기동 후 상태 이름은 보존된 종류별 재고만으로 결정되며 외부 입력으로 재고가 설정되지 않는다
  - 저장 파일 부재/손상 시 재고 == 0, 동전 보유량 == 0, 미반환 보관액 == 0 이고 관리자 통지가 1건 발생한다
  - 저장된 상태가 고장이면 재기동 후 상태 이름 == 고장
  requirements:
  - REQ-31
  - REQ-39
  - REQ-68
  - REQ-69
  - REQ-70
  - REQ-73
  - REQ-74
  - REQ-75
  - REQ-76
  - REQ-77
  - REQ-83
  - REQ-84
  - REQ-85
- id: UC-18
  title: 상태 전이마다 상태를 원자적으로 저장한다
  actor: 고객
  precondition: 자판기가 기동되어 있고 저장 파일 위치가 생성 시 지정되어 있다
  postcondition: 전이 완료 시점의 상태 전체가 저장 파일에 원자적으로 기록된다
  main_flow:
  - step: 1. 고객이 상태 전이를 일으키는 조작을 한다
    event: INSERT_COIN
  - step: 2. 시스템이 전이를 완료한다
  - step: 3. 시스템이 상태 전체(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행
      중인 배출의 일련번호와 음료, 관리 모드 진입 예약 여부)를 임시 파일에 기록한다
  - step: 4. 시스템이 임시 파일 내용을 fsync로 디스크에 강제 동기화한다
  - step: 5. 시스템이 원자적 교체로 본 파일을 갈아치운다
  - step: 6. 시스템이 디렉터리 항목을 동기화한다
  alt_flows:
  - step: 3a. 기록 도중 전원이 끊긴 경우, 시스템은 다음 기동에서 직전에 완전히 기록된 상태를 읽으며 절반만 쓰인 파일을 읽지 않는다
    event: POWER_OFF
  - step: 5a. 원자적 교체 직전에 전원이 끊긴 경우, 시스템은 다음 기동에서 교체 이전의 완전한 본 파일을 읽는다
    event: POWER_OFF
  - step: 1a. 관리자 조작으로 전이가 발생한 경우에도, 시스템은 동일한 저장 절차를 수행한다
    event: REFILL_STOCK
  acceptance:
  - 모든 상태 전이 완료 직후 저장 파일의 내용이 메모리상 현재 상태와 일치한다
  - 저장 파일에 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인 배출의 일련번호와
    음료, 관리 모드 진입 예약 여부가 모두 존재한다
  - 저장 호출 순서가 임시 파일 write → fsync → 원자적 rename → 디렉터리 fsync 이다
  - 쓰기 중 임의 시점에 전원 차단을 주입해도 읽어들인 파일은 항상 완전한 상태이며 파싱 오류가 발생하지 않는다
  - 생성자에 지정한 경로에만 저장 파일이 만들어지고, 테스트에서 임시 파일 경로를 지정하면 그 경로에 기록된다
  - 저장·복원 처리 중 외부 네트워크 연결이 1건도 발생하지 않는다
  requirements:
  - REQ-18
  - REQ-30
  - REQ-78
  - REQ-79
  - REQ-80
  - REQ-81
  - REQ-82
  - REQ-86
  - REQ-87
  - REQ-88
