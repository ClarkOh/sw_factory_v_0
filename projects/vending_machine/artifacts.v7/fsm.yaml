  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'coins' && (denom not in [100, 500, 1000] || !count_integer_ge_1)
  action: notify_admin('reject_invalid_collect_request')
  usecase: UC-14
  notes: ''
- id: T-069
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'coins' && denom in [100, 500, 1000] && count_integer_ge_1 && count
    > coins[denom]
  action: notify_admin('reject_count_exceeds_holding')
  usecase: UC-14
  notes: ''
- id: T-070
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'coins' && denom in [100, 500, 1000] && count_integer_ge_1 && count
    <= coins[denom] && coin_total - denom * count < deposit
  action: notify_admin('reject_below_unreturned_deposit')
  usecase: UC-14
  notes: ''
- id: T-071
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'deposit' && op == 'view'
  action: show_unreturned_deposit()
  usecase: UC-15
  notes: UC-15 의 첫 COLLECT_COINS 는 ADMIN_MODE 진입 이후를 전제하므로 POWERED_OFF 기준 지적은 결함이
    아니다
- id: T-072
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'deposit' && op == 'collect' && deposit > 0 && coin_total >= deposit
  action: eject_amount(deposit); coins -= used_coins(deposit); update_deposit(); show_unreturned_deposit();
    show_coin_holdings(); persist()
  usecase: UC-15
  notes: 회수 후 미반환 보관액 갱신 규칙 [미규정 REQ-94] - 보유량 합계 항등식만 판정한다
- id: T-073
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'deposit' && op == 'collect' && deposit == 0
  action: ''
  usecase: UC-15
  notes: ''
- id: T-074
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'deposit' && op == 'collect' && deposit > 0 && coin_total < deposit
  action: notify_admin('reject_insufficient_holding')
  usecase: UC-15
  notes: ''
- id: T-075
  src: ADMIN_MODE
  event: CONFIRM_DISPENSE_FAILURE
  dst: ADMIN_MODE
  guard: fault_pending
  action: clear_pending_dispense(); fault_pending = false; clear_fault_display();
    persist()
  usecase: UC-16
  notes: UC-16 의 첫 CONFIRM_DISPENSE_FAILURE 는 고장 상태에서 관리 모드로 진입(T-055/T-050) 한 뒤를
    전제하므로 POWERED_OFF 기준 지적은 결함이 아니다
