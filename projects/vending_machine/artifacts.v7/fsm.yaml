  usecase: UC-13
  notes: ''
- id: T-067
  src: ADMIN_MODE
  event: COLLECT_COINS
  dst: ADMIN_MODE
  guard: target == 'coins' && denom in [100, 500, 1000] && count_integer_ge_1 && count
