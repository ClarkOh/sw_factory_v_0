- id: T-048
  src: AWAITING_DISPENSE_COMPLETE
  event: DISPENSE_TIMEOUT
  dst: FAULTED
  guard: '!admin_reserved'
  action: refund(credit); coins -= used_coins(credit); credit = 0; pending_kept_for_admin();
    fault_pending = true; show_fault_and_call_admin(); persist()
  usecase: UC-05
  notes: 재고를 차감하지 않는다. UC-05 의 첫 DISPENSE_TIMEOUT 은 배출 개시 후 10초 타이머가 도는 상태를 전제하므로
    POWERED_OFF 기준 지적은 결함이 아니다
- id: T-049
  src: AWAITING_DISPENSE_COMPLETE
  event: DISPENSE_TIMEOUT
  dst: FAULTED
  guard: admin_reserved
  action: refund(credit); coins -= used_coins(credit); credit = 0; pending_kept_for_admin();
    fault_pending = true; show_fault_and_call_admin(); persist()
  usecase: UC-11
  notes: 예약된 관리 모드 진입은 고장 전이 이후에 수행한다 (T-050)
