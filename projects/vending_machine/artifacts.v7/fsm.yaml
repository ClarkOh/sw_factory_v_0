  usecase: UC-11
  notes: UC-11 의 첫 INSERT_ADMIN_KEY 는 POWER_ON 이후의 운전 상태를 전제한다. 전원이 없으면 관리 메뉴 자체를
    표시할 수 없으므로 POWERED_OFF 기준 지적은 결함이 아니다
- id: T-052
  src: SELLING_WITH_CREDIT
  event: INSERT_ADMIN_KEY
  dst: ADMIN_MODE
  guard: credit > 0
  action: refund(credit); coins -= used_coins(credit); credit = 0; show_admin_menu();
    persist()
  usecase: UC-11
  notes: ''
- id: T-053
  src: OUT_OF_STOCK
  event: INSERT_ADMIN_KEY
  dst: ADMIN_MODE
  guard: credit == 0
  action: show_admin_menu(); persist()
  usecase: UC-10
  notes: ''
- id: T-054
  src: OUT_OF_STOCK
