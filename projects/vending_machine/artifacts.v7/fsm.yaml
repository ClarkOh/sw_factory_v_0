  action: 'for i in items: stock[i.drink] += i.qty; persist()'
  usecase: UC-12
  notes: UC-12 의 첫 REFILL_STOCK 은 POWER_ON 과 INSERT_ADMIN_KEY 로 도달한 ADMIN_MODE 를 전제하므로
