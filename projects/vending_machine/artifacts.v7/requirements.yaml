requirements:
- id: REQ-01
  text: 자판기는 100원, 500원, 1000원 액면가의 코인을 투입 가능한 코인으로 받아들인다.
  kind: functional
  source: 고객은 100원, 500원, 1000원짜리 코인을 넣을 수 있다.
- id: REQ-02
  text: 100원, 500원, 1000원 이외의 금액이 투입되면 자판기는 그 코인을 즉시 반환한다.
  kind: functional
  source: 그 외 금액은 즉시 반환한다.
- id: REQ-03
  text: 자판기는 투입된 코인의 금액을 누적 투입 금액에 더한다.
  kind: functional
  source: 투입 금액은 누적된다.
- id: REQ-04
  text: 자판기는 누적 투입 금액을 항상 화면에 표시한다.
  kind: functional
  source: 누적 금액은 항상 화면에 표시된다.
- id: REQ-05
  text: 자판기는 3종류의 음료를 취급한다.
  kind: constraint
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-06
  text: 3종류 음료의 가격은 각각 서로 다르다.
  kind: constraint
  source: 음료는 3종류이며 가격이 각각 다르다.
- id: REQ-07
  text: 자판기는 재고를 음료 종류별로 구분하여 관리한다.
  kind: functional
  source: 재고는 종류별로 관리된다.
- id: REQ-08
  text: 자판기는 누적 투입 금액이 해당 음료 가격 이상이고 그 음료의 재고가 1개 이상일 때만 그 음료의 선택 버튼을 활성화한다.
  kind: functional
  source: 누적 금액이 해당 음료 가격 이상이고 재고가 남아 있을 때만 그 음료의 선택 버튼이 활성화된다.
- id: REQ-09
  text: 활성화된 선택 버튼이 눌리면 자판기는 해당 음료를 배출한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-10
  text: 음료 배출 시 거스름돈이 0보다 크면 자판기는 거스름돈을 함께 반환한다.
  kind: functional
  source: 고객이 활성화된 버튼을 누르면 음료를 배출하고, 거스름돈이 있으면 함께 반환한다.
- id: REQ-11
  text: 배출이 진행 중일 때 투입된 코인은 정상 수납되어 누적 투입 금액에 더해진다.
  kind: functional
  source: 배출이 진행 중일 때 투입된 코인은 정상적으로 수납되어 누적 금액에 더해진다.
- id: REQ-12
  text: 배출 중 투입된 금액은 진행 중인 배출의 거스름돈에 포함되지 않고 배출 완료 후 누적 투입 금액으로 남아 다음 구매에 사용된다.
  kind: functional
  source: 이 금액은 진행 중인 배출의 거스름돈에 섞이지 않고, 배출 완료 후 누적 금액으로 남아 다음 구매에 쓰인다.
- id: REQ-13
  text: 거스름돈은 선택 버튼을 누른 시점의 누적 투입 금액에서 음료 가격을 뺀 값으로 계산한다.
  kind: functional
  source: 거스름돈은 버튼을 누른 시점의 누적 금액에서 음료 가격을 뺀 값으로만 계산한다.
- id: REQ-14
  text: 자판기는 거스름돈용 동전 보유량을 100원, 500원, 1000원 액면가별 개수로 보유한다.
  kind: functional
  source: 자판기는 거스름돈용 동전을 액면가(100원, 500원, 1000원)별 개수로 보유한다.
- id: REQ-15
  text: 자판기가 코인을 받아들이면 해당 액면가의 보유 개수를 1 증가시킨다.
  kind: functional
  source: 자판기가 받아들인 코인은 그 액면가의 보유 개수에 1개 더해진다.
- id: REQ-16
  text: 자판기가 거스름돈이나 반환 금액을 지급할 때 지급에 사용한 동전 개수만큼 해당 액면가의 보유 개수를 차감한다.
  kind: functional
  source: 자판기가 거스름돈이나 반환 금액을 내줄 때, 지급에 사용한 동전은 액면가별로 보유 개수에서 그만큼 뺀다.
- id: REQ-17
  text: 자판기가 받아들이지 않고 되돌려 보내는 코인(비액면가, 인식 실패, 판매 중지 상태 투입, 관리 모드 투입)은 보유량에 더하지 않고
    투입된 코인 그대로 반환한다.
  kind: functional
  source: 자판기가 받아들이지 않고 그대로 되돌려 보내는 코인(비액면가, 인식 실패, 판매 중지 상태나 관리 모드에서 투입된 코인)은 보유량에
    더해지지 않는다. 들어온 그 코인이 그대로 나간다.
- id: REQ-18
  text: 어느 시점에나 동전 보유량 합계는 (초기 보유액)+(보충된 금액)−(회수된 금액)+(판매된 음료 가격의 합)+(아직 정산되지 않은 누적
    투입 금액)+(미반환 보관액)과 같으며 이 밖의 항은 없다.
  kind: nonfunctional
  source: 어느 시점에나 보유량 합계는 다음과 같다. 이 밖의 항은 없다. (초기 보유액) + (보충된 금액) − (회수된 금액) + (판매된
    음료 가격의 합) + (아직 정산되지 않은 누적 투입 금액) + (미반환 보관액)
- id: REQ-19
  text: 거스름돈을 구성할 동전이 부족하면 자판기는 음료를 배출하지 않는다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-20
  text: 거스름돈을 구성할 동전이 부족하면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 거스름돈을 만들 동전이 부족하면 배출하지 않고 투입 금액 전액을 반환한다.
- id: REQ-21
  text: 판매 상태에서 반환 레버가 조작되면 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 고객은 판매 상태에서 언제든 반환 레버로 투입 금액 전액을 돌려받을 수 있다.
- id: REQ-22
  text: 누적 투입 금액이 0보다 큰 상태에서 코인 투입, 음료 선택, 반환 레버 조작이 30초 동안 없으면 자판기는 누적 투입 금액 전액을
    자동으로 반환한다.
  kind: functional
  source: 누적 투입 금액이 0보다 큰 상태에서 30초 동안 코인 투입, 음료 선택, 반환 레버 조작이 없으면 자판기는 누적 투입 금액 전액을
    자동으로 반환하고 거래를 종료한다.
- id: REQ-23
  text: 30초 무조작 자동 반환 후 자판기는 거래를 종료한다.
  kind: functional
  source: 자판기는 누적 투입 금액 전액을 자동으로 반환하고 거래를 종료한다.
- id: REQ-24
  text: 배출 개시 후 10초 안에 배출 완료 신호를 받지 못하면 자판기는 그 배출을 배출 실패로 처리한다.
  kind: functional
  source: 배출을 개시한 뒤 10초 안에 배출 완료 신호를 받지 못하면 자판기는 배출 실패로 처리한다.
- id: REQ-25
  text: 배출 실패로 처리한 경우 자판기는 해당 음료의 재고를 차감하지 않는다.
  kind: functional
  source: 재고를 차감하지 않고 누적 투입 금액 전액을 반환한 뒤 고장 상태로 전환한다.
- id: REQ-26
  text: 배출 실패로 처리한 경우 자판기는 누적 투입 금액 전액을 반환한다.
  kind: functional
  source: 재고를 차감하지 않고 누적 투입 금액 전액을 반환한 뒤 고장 상태로 전환한다.
- id: REQ-27
  text: 배출 실패로 처리한 뒤 자판기는 고장 상태로 전환한다.
  kind: functional
  source: 재고를 차감하지 않고 누적 투입 금액 전액을 반환한 뒤 고장 상태로 전환한다.
- id: REQ-28
  text: 자판기는 배출을 개시할 때마다 그 배출에 일련번호를 부여한다.
  kind: functional
  source: 자판기는 배출을 개시할 때마다 일련번호를 매기고
- id: REQ-29
  text: 자판기는 배출 완료 신호를 현재 기다리는 일련번호와 일치할 때만 유효한 것으로 처리한다.
  kind: functional
  source: 배출 완료 신호는 현재 기다리는 일련번호와 일치할 때만 유효하다.
- id: REQ-30
  text: 배출 일련번호는 저장 상태에 포함된다.
  kind: functional
  source: 일련번호는 저장 상태에 포함되며 재기동 후에도 이어서 증가한다.
- id: REQ-31
  text: 배출 일련번호는 재기동 후에도 이전 값에 이어서 증가한다.
  kind: functional
  source: 일련번호는 저장 상태에 포함되며 재기동 후에도 이어서 증가한다.
- id: REQ-32
  text: 일련번호가 일치하지 않거나 배출 실패 처리 후에 도착한 배출 완료 신호는 상태, 재고, 금액을 변경하지 않는다.
  kind: functional
  source: 일치하지 않거나 배출 실패로 처리한 뒤에 도착한 배출 완료 신호는 상태·재고·금액을 바꾸지 않는다.
- id: REQ-33
  text: 자판기는 무효한 배출 완료 신호를 어느 음료였는지와 함께 '지연 배출'로 기록한다.
  kind: functional
  source: 자판기는 그 신호를 '지연 배출'로 어느 음료였는지와 함께 기록해 관리자가 확인하고 재고를 맞출 수 있게 한다.
- id: REQ-34
  text: 고장 상태에서 자판기는 화면에 고장임을 표시한다.
  kind: functional
  source: 고장 상태에서 자판기는 화면에 고장임을 표시하고 관리자 호출을 안내한다.
- id: REQ-35
  text: 고장 상태에서 자판기는 화면에 관리자 호출 안내를 표시한다.
  kind: functional
  source: 고장 상태에서 자판기는 화면에 고장임을 표시하고 관리자 호출을 안내한다.
- id: REQ-36
  text: 고장 상태에서 자판기는 코인을 받아들이지 않고 투입된 코인을 그대로 되돌려 보낸다.
  kind: functional
  source: 고장 상태에서는 코인을 받지 않고 투입된 코인을 그대로 되돌려 보내며, 모든 선택 버튼은 비활성이다.
- id: REQ-37
  text: 고장 상태에서 모든 음료 선택 버튼은 비활성이다.
  kind: functional
  source: 모든 선택 버튼은 비활성이다.
- id: REQ-38
  text: 고장 상태에 진입한 시점의 누적 투입 금액은 0이다.
  kind: functional
  source: 반환할 누적 금액은 이미 없다.
- id: REQ-39
  text: 고장 상태는 저장되어 전원을 껐다 켜도 유지된다.
  kind: functional
  source: 고장 상태는 저장되며 전원을 껐다 켜도 유지된다.
- id: REQ-40
  text: 고장 상태는 전원 재투입으로 해제되지 않고 관리자만 해제할 수 있다.
  kind: functional
  source: 전원 재투입으로는 풀리지 않고 관리자만 해제할 수 있다.
- id: REQ-41
  text: 관리자는 고장 상태에서도 전용 키로 관리 모드에 진입할 수 있다.
  kind: functional
  source: 관리자는 고장 상태에서도 전용 키로 관리 모드에 들어갈 수 있다.
- id: REQ-42
  text: 관리 모드에서 관리자가 배출 실패를 확인하면 진행 중이던 배출 기록이 정리된다.
  kind: functional
  source: 관리 모드에서 배출 실패를 확인하면 진행 중이던 배출 기록이 정리되고 고장 표시가 해제된다.
- id: REQ-43
  text: 관리 모드에서 관리자가 배출 실패를 확인하면 고장 표시가 해제된다.
  kind: functional
  source: 관리 모드에서 배출 실패를 확인하면 진행 중이던 배출 기록이 정리되고 고장 표시가 해제된다.
- id: REQ-44
  text: 배출 실패를 확인하지 않은 채 관리 모드를 나가면 자판기는 다시 고장 상태로 전환한다.
  kind: functional
  source: 배출 실패를 확인하지 않은 채 관리 모드를 나가면 자판기는 다시 고장 상태로 돌아간다.
- id: REQ-45
  text: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 된다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-46
  text: 판매 중지 상태에서 자판기는 코인을 받아들이지 않는다.
  kind: functional
  source: 모든 음료의 재고가 0이면 자판기는 판매 중지 상태가 되고 코인을 받지 않는다.
- id: REQ-47
  text: 관리자는 전용 키로 관리 모드에 진입할 수 있다.
  kind: functional
  source: 관리자는 전용 키로 관리 모드에 들어갈 수 있다.
- id: REQ-48
  text: 배출 완료를 기다리는 중에 전용 키가 꽂히면 자판기는 관리 모드 진입을 예약한다.
  kind: functional
  source: 배출 완료를 기다리는 중에 키를 꽂으면 자판기는 진입을 예약해 두고, 배출이 완료된 직후에 관리 모드로 전환한다.
- id: REQ-49
  text: 관리 모드 진입이 예약된 상태에서 배출이 완료되면 자판기는 배출 완료 직후 관리 모드로 전환한다.
  kind: functional
  source: 배출이 완료된 직후에 관리 모드로 전환한다.
- id: REQ-50
  text: 예약된 관리 모드 진입 시 이미 개시된 배출의 음료 가격은 판매로 확정된다.
  kind: functional
  source: 이때 이미 개시된 배출의 음료 가격은 판매로 확정되며, 배출 중 투입된 금액만 반환한다.
- id: REQ-51
  text: 예약된 관리 모드 진입 시 자판기는 배출 중 투입된 금액만 반환한다.
  kind: functional
  source: 이때 이미 개시된 배출의 음료 가격은 판매로 확정되며, 배출 중 투입된 금액만 반환한다.
- id: REQ-52
  text: 관리 모드 진입이 예약된 배출이 실패로 처리된 경우 자판기는 요구사항 14에 따라 고장 상태로 전환한 뒤 관리 모드로 진입한다.
  kind: functional
  source: 배출이 실패로 처리된 경우에는 요구사항 14를 따라 고장 상태로 전환한 뒤 관리 모드로 들어간다.
- id: REQ-53
