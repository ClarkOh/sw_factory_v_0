- key: SWF-296
  type: bug
  title: '[검토/medium] 고장이 해제된 뒤 도착한 배출 완료 신호는 지연 배출로 기록되지 않고 조용히 버려진다'
  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    DISPENSE_COMPLETE 를 받는 상태는 AWAITING_DISPENSE_COMPLETE(T-043~T-046) · AWAITING_DISPENSE_COMPLETE_ADMIN_RESERVED(T-063/T-064)
    · FAULT(T-084) · ADMIN_MODE_FAULT_UNRESOLVED(T-114) 넷뿐이다. IDLE · HAS_CREDIT ·
    OUT_OF_STOCK · ADMIN_MODE 에는 이 이벤트의 전이가 없어 `handle()` 이 None 을 돌려주고 `record_delayed_dispense()`
    가 불리지 않는다. 도달 경로는 평범하다 — 배출 실패로 FAULT → 관리자 확인(T-111) → ADMIN_EXIT(T-104) → IDLE
    로 나온 뒤 붙잡혀 있던 배출 기구가 뒤늦게 음료를 내보내고 완료 신호를 보내는 경우, 또는 정상 완료(T-045) 후 하드웨어가 같은 신호를
    재전송하는 경우다. REQ-41/42 는 상태를 가리지 않고 "일치하지 않거나 배출 실패로 처리한 뒤에 도착한 배출 완료 신호"를 모두 지연
    배출로 기록하라고 한다. 전이 커버리지 테스트(test_transition_pair_coverage)는 명세된 쌍이 도달 가능한지(명세 ⊆
    도달)와 구현이 명세를 넘지 않는지(구현 ⊆ 명세)만 보므로, 명세와 구현이 함께 빠뜨린 이 쌍은 어느 방향으로도 드러나지 않는다.


    **영향**

    음료는 실물로 나갔는데 장부 재고는 그대로 남고, 관리자가 확인할 지연 배출 기록도 생기지 않는다. 관리자는 어긋남이 있다는 사실 자체를 알
    수 없어 T-098 로 재고를 맞출 계기가 없다. 장부에 있는 음료를 사려던 고객이 빈 자판기 앞에서 배출 실패를 겪고, 그 실패가 다시 고장으로
    이어진다.


    **제안**

    IDLE · HAS_CREDIT · OUT_OF_STOCK · ADMIN_MODE(그리고 검토 후 ADMIN_MODE 계열 전체)에 DISPENSE_COMPLETE
    자기 전이를 추가해 `recordDelayedDispense(serial, drink); persist()` 를 수행하게 하세요. 함께, 명세된
    쌍의 도달 가능성만이 아니라 "각 상태가 받지 않기로 한 이벤트가 정말로 무시되어도 되는 이벤트인지"를 확인하는 테스트를 추가하세요.


