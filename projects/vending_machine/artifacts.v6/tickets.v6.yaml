- key: SWF-308
  type: bug
  title: '[검토/high] 배출이 실패하면 음료 가격만큼의 돈이 손님에게도 돌아가지 않고 장부 어느 항에도 잡히지 않는다'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    `_act_start_dispense`(app/vending_machine.py:1661-1667)는 버튼을 누른 시점에 거스름돈 `credit
    - price` 만 반환구로 지급하고 `clear_credit()` 으로 누적 금액을 0 으로 만든다 — 음료 가격 `price` 는 기기가
    든 채로 남는다. 이어 배출이 실패하면 `_act_fail_dispense_into_fault`(2145-2151)는 `mark_dispense_failed()`
    만 부르고 `complete_dispense()` 는 부르지 않으므로 재고도 `sold_total` 도 늘지 않고, 반환하는 것은 `payout(vm.credit)`
    — 즉 **배출 중에 추가로 투입된 금액뿐**이다. 그 결과 음료 가격에 해당하는 동전이 (판매)도 (누적 투입)도 (미반환 보관액)도 아닌
    채로 통 안에 남는다. tests/e2e/test_scenarios.py:734 가 그 상태를 그대로 기대값으로 적어 두었다: `assert
    coin_total(vm.coins) == coin_total(start_coins) + 500 # 가격은 기기가 든 채다`. REQ-26
    의 회계식으로는 이 돈을 가리킬 항이 없어, 불변식 테스트가 명세에 없는 항 `orphaned` 를 따로 만들어 좌우를 맞춘다 (test_scenarios.py:2009-2013
    의 주석 "관리자가 실패를 확인해 기록을 지우는 순간 그 금액을 가리키는 관측값이 사라진다. 장부가 맞으려면 밖에서 따로 세는 수밖에 없다"
    와 2103 의 `+ self.orphaned`). REQ-27 은 "이 밖의 항은 없다"고 못박고 있다.


    **영향**

    배출 기구가 걸릴 때마다 손님은 음료도 못 받고 음료 가격만큼을 잃는다(1000원 넣고 700원짜리를 고르면 300원만 돌려받고 700원은
    사라진다). 자판기 쪽에서도 그 돈은 판매액이 아니고 보관액도 아니어서, 관리자가 T-111 로 실패를 확인하는 순간 (`clear_pending_dispense()`,
    2462) 그 금액을 가리키는 관측값이 완전히 없어진다. 정산할 때 통 안의 현금이 장부보다 많은데 그 차액이 어디서 왔는지 아무도 모른다.


    **제안**

    요구사항 14 에 다음 문장을 넣고 그에 맞춰 유스케이스 UC-06 의 인수 조건과 T-047 · T-065 의 action 을 고칠 것.
    "배출 실패로 처리할 때 자판기는 버튼을 누른 시점의 누적 투입 금액 중 아직 반환하지 않은 금액(음료 가격에 해당하는 금액)과 배출 중에
    투입된 금액을 합쳐 전액 반환한다. 반환할 동전을 구성할 수 없으면 그 금액을 미반환 보관액으로 기록하고 관리자에게 알린다." (전액 반환이
    아니라 보관 쪽으로 정하더라도, 요구사항 10 의 합계식에 그 금액을 가리키는 항이 반드시 하나 있어야 한다.)


    **참조** REQ-33, REQ-34, REQ-35, REQ-26, REQ-27, T-047, T-065, UC-06, tests/e2e/test_scenarios.py::test_uc06_dispense_failure_faults_then_admin_recovers


