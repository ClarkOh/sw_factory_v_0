    그런데 REQ-109 는 "상태 복원 후 자판기는 정전·재기동 규칙(22~25)을 적용한다", REQ-95 는 "재기동 시 해당 음료의 재고를
    1 차감하고" 라고 재기동 쪽을 지목한다. 테스트는 재기동 전에 반드시 POWER_LOST 를 흘린다(test_scenarios.py:2389-2393
    의 `reboot()`, test_uc17_*, test_invariant_holds_across_power_cycles:2280-2283)
    — 이벤트 없는 전원 차단을 재현하는 테스트가 하나도 없다.


    **영향**

    실제 정전은 자판기에게 "곧 꺼진다"고 알려 주지 않는다. REQ-27(원자적 저장)과 REQ-106 자체가 "기록 도중 전원이 끊겨도"를
    전제하므로, 이 모델은 지켜야 할 바로 그 상황에서 동작하지 않는다. 마지막 저장이 T-010(state=HAS_CREDIT, credit=500)인
    순간 전원이 끊기면 재기동은 T-005 로 IDLE 에 떨어지고 credit 은 0, retained 는 0 인데 동전 500 원은 통 안에
    그대로다 — 손님 돈이 장부에서 증발하고 REQ-26 이 깨진다(REQ-87·88·89 위반). 마지막 저장이 T-023(state=AWAITING_DISPENSE_COMPLETE,
    pending 있음)이면 재기동 후 IDLE 로 올라오면서 재고를 차감하지 않고 (REQ-95 위반) 음료 가격을 판매로 잡지도 않으며(REQ-96
    위반) 보관액도 잡지 않는다(REQ-97 위반). 실물 음료는 이미 나갔는데 장부 재고만 그대로 남아 계속 어긋난다.


    **제안**

    정전 정산을 POWER_LOST 가 아니라 POWER_ON 쪽(T-002~T-005 의 action)으로 옮기고, 복원한 레코드의 `credit`(>0)과
    `pending`(not None)을 입력으로 REQ-95~97 을 적용할 것. 아울러 요구사항에 다음 문장을 명시할 것. "자판기는 전원이
    끊기는 것을 미리 알 수 없다. 정전·재기동 규칙(22~25)은 저장 파일에 남은 마지막 상태만을 입력으로 재기동 시점에 적용한다." 그리고
    POWER_LOST 이벤트 없이 마지막 저장 파일만으로 재기동하는 테스트를 상태별로 추가할 것.


