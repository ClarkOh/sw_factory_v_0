- key: SWF-18
  type: epic
  title: '[UC-18] 상태 전이마다 상태 전체를 원자적으로 저장한다'
  description: '**액터** 전원(정전)

    **사전조건** 자판기 생성 시 저장 파일 위치가 지정되어 있고 해당 위치에 기록할 수 있다

    **사후조건** 전이가 끝날 때마다 상태 전체가 저장 파일에 원자적으로 기록되어, 기록 도중 전원이 끊겨도 직전에 완전히 기록된 상태가 남는다


    **주 흐름**

    - 1. 시스템이 상태가 바뀌는 전이를 완료한다.

    - 2. 시스템이 현재 상태 전체(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행
    중인 배출의 일련번호와 음료, 관리 모드 진입 예약 여부)를 임시 파일에 기록한다.

    - 3. 시스템이 임시 파일의 내용을 fsync로 디스크에 강제 동기화한다.

    - 4. 시스템이 원자적 교체로 본 저장 파일을 갈아치운다.

    - 5. 시스템이 교체 후 디렉터리 항목도 동기화한다.


    **대안/예외 흐름**

    - 2a. 임시 파일 기록 도중 전원이 끊긴 경우, 본 저장 파일에는 직전에 완전히 기록된 상태가 그대로 남고 절반만 쓰인 임시 파일은 읽히지
    않는다.

    - 4a. 원자적 교체 직전에 전원이 끊긴 경우, 재기동 시 시스템은 직전에 완전히 기록된 본 저장 파일을 읽는다.

    - 1a. 테스트 환경인 경우, 저장 파일 위치로 임시 파일 경로를 지정하여 동일한 저장 절차를 수행한다.

    - 2b. 저장 파일 위치에 기록할 수 없는 경우, 시스템은 관리자에게 알린다.


    **인수 조건**

    - 상태를 바꾸는 전이 1회당 저장 파일 기록 완료 1회가 발생한다

    - 저장된 레코드가 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인 배출의
    일련번호와 음료, 관리 모드 진입 예약 여부의 9개 항목을 모두 포함한다

    - 저장 호출의 시스템 콜 순서 == 임시 파일 쓰기 → fsync(임시 파일) → 원자적 교체 → fsync(디렉터리)

    - 쓰기 중 임의 시점에 전원을 끊은 뒤 읽은 저장 파일은 항상 완전한 상태 레코드로 파싱되며, 부분 기록된 내용이 읽히지 않는다

    - 자판기 생성 시 지정한 경로에만 저장 파일이 생성되고, 테스트에서 임시 경로를 지정하면 그 경로가 사용된다

    - 전체 실행 동안 외부 네트워크 소켓 연결 시도 횟수 == 0 이고 모든 처리가 기기 내부에서 완결된다'
