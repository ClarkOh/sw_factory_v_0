- key: SWF-35
  type: story
  title: '[T-023] HAS_CREDIT --SELECT_DRINK--> AWAITING_DISPENSE_COMPLETE'
  description: 'FSM 전이 `T-023` 구현


    - 출발: `HAS_CREDIT`

    - 이벤트: `SELECT_DRINK`

    - 도착: `AWAITING_DISPENSE_COMPLETE`

    - 가드: `credit >= price(drink) && stock(drink) >= 1 && changeComposable(credit
    - price(drink))`

    - 동작: `dispenseSerial += 1; pendingDrink = drink; startDispense(drink, dispenseSerial);
    change = credit - price(drink); payout(change); coins -= coinsUsed(change); credit
    = 0; display(credit); startDispenseTimer(10); persist()`


    유스케이스: [UC-02] 음료를 선택하여 구매한다


    인수 조건:

    - 취급 음료 종류 수 == 3 이고 3종의 가격이 서로 모두 다르다

    - 3종 음료 각각의 구체적인 가격 값은 요구사항에 명시되어 있지 않아 외부 설정으로 주입되어야 한다 [모호: REQ-08]

    - 재고는 음료 종류별로 개별 카운터로 유지되며 한 종류의 차감이 다른 종류의 재고를 변경하지 않는다

    - (누적 금액 >= 가격 AND 재고 >= 1)인 음료의 버튼 활성 == true, 그 외 음료의 버튼 활성 == false

    - 지급된 거스름돈 금액 == 버튼을 누른 시점의 누적 투입 금액 − 선택한 음료 가격

    - 거스름돈 지급 후 각 액면가 보유 개수 감소량 == 그 액면가로 지급한 동전 개수

    - 거스름돈 = 0이면 반환구로 지급되는 금액 == 0

    - 거스름돈 구성 불가 시: 배출 개시 횟수 == 0, 재고 변화량 == 0, 반환 금액 == 버튼을 누른 시점의 누적 투입 금액

    - 버튼 입력 시각과 배출 개시 시각의 차이 <= 2초


    **완료 조건: `test_t_023` 통과**'
