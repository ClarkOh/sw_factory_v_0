- key: SWF-294
  type: bug
  title: '[검토/high] fsync 가 한 줄도 없다 — 저장 내구성 요구사항이 구현도 검증도 되지 않았다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    `VendingMachine.save()`(app/vending_machine.py:797-814)는 임시 파일에 json.dump 한 뒤
    곧바로 `os.replace()` 를 부른다. 저장소 전체(app/, tests/)에서 `fsync` 문자열이 한 번도 나오지 않는다. REQ-103(임시
    파일 fsync)과 REQ-105(교체 후 디렉터리 fsync)에 대응하는 코드가 없다. UC-18 인수 조건은 "저장 호출의 시스템 콜 순서
    == 임시 파일 쓰기 → fsync(임시 파일) → 원자적 교체 → fsync(디렉터리)"를 요구하지만, test_uc18_every_state_change_is_persisted_completely(tests/e2e/test_scenarios.py:980)는
    저장 파일의 항목 유무와 임시 파일이 남지 않는 것만 본다. 시스템 콜 순서를 보는 단언이 없다.


    **영향**

    실제 정전에서는 rename 만 디스크에 반영되고 데이터 블록은 반영되지 않아 길이 0 이거나 쓰레기가 든 저장 파일이 남을 수 있다. 그러면
    재기동 때 `load_save()` 가 None 을 돌려 T-001 이 발동해 재고 0 · 동전 0 · 미반환 보관액 0 으로 초기화된다 —
    즉 한 번의 나쁜 타이밍의 정전이 재고 장부와 보관 중이던 고객 돈의 기록을 전부 지우고, 걸려 있던 고장(REQ-50/51 "전원 재투입으로는
    풀리지 않는다")까지 풀어 버린다. 배출 기구가 고장난 자판기가 다시 팔기 시작한다.


    **제안**

    `save()` 에 `f.flush(); os.fsync(f.fileno())` 를 os.replace 앞에, 교체 뒤에는 `dirfd =
    os.open(directory, os.O_RDONLY); os.fsync(dirfd)` 를 넣으세요(Windows 는 디렉터리 fsync
    가 없으므로 대체 수단을 문서에 명시). 그리고 UC-18 인수 조건대로 호출 순서를 검증하는 테스트를 추가하세요 — os.fsync/os.replace
    를 감싸 호출 순서를 기록한 뒤 [write, fsync(tmp), replace, fsync(dir)] 인지 단언하면 됩니다.


    **참조** REQ-102, REQ-103, REQ-104, REQ-105, REQ-106, REQ-107, REQ-50, REQ-51, UC-18,
