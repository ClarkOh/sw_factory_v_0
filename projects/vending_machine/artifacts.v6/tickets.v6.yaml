    에는 바로 위 tests/e2e/test_scenarios.py:1644 에 pytest.mark.xfail(strict=True) 가 달려
    있어 실패해도 통과로 집계된다.


    **영향**

    원자적 교체만으로는 데이터 블록이 디스크에 닿았음을 보장하지 못한다. 정전 시 길이 0 이거나 쓰레기가 든 저장 파일이 남으면 load_save
    가 None 을 돌려 T-001 이 발동하고, 재고와 동전 보유량과 미반환 보관액이 모두 0 으로 지워질 뿐 아니라 fault_latched
    까지 풀려 배출 기구가 고장난 자판기가 다시 판매를 시작한다. REQ-27 의 원자적 저장 요구는 지금 구현에도 검증에도 없는데 테스트 결과는
    전부 초록이라 이 사실이 드러나지 않는다.


    **제안**

    save() 를 임시 파일 쓰기 다음 flush 와 os.fsync(임시 파일 fd), os.replace, 디렉터리 fd 의 fsync(윈도우에서는
    교체된 본 파일의 fsync) 순서로 고치고 xfail 표시를 걷어라. 고칠 계획이 없다면 REQ-103 과 REQ-105 를 요구사항에서
    제외하거나 유예 사유를 명시하라 — 지금은 요구사항이 살아 있는데 검증만 꺼져 있는 상태다.


    **참조** REQ-103, REQ-104, REQ-105, REQ-106, REQ-107, UC-18, tests/e2e/test_scenarios.py::test_uc18_save_syscall_order_is_write_fsync_replace_fsync


