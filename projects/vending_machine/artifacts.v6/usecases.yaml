usecases:
- id: UC-01
  title: 코인을 투입하여 누적 투입 금액을 늘린다
  actor: 고객
  precondition: 자판기가 판매 상태이고 코인 투입구가 사용 가능하다
  postcondition: 받아들인 코인의 액면가만큼 누적 투입 금액과 해당 액면가 동전 보유 개수가 각각 증가하고, 화면에 갱신된 누적 투입
    금액이 표시된다
  main_flow:
  - 1. 고객이 코인 투입구에 코인 1개를 넣는다.
  - 2. 시스템이 코인의 액면가를 식별한다.
  - 3. 시스템이 코인을 수납하고 누적 투입 금액에 액면가를 더한다.
  - 4. 시스템이 해당 액면가의 동전 보유 개수를 1 증가시킨다.
  - 5. 시스템이 화면에 현재 누적 투입 금액을 표시한다.
  - 6. 시스템이 구매 가능 조건에 따라 각 음료 선택 버튼의 활성/비활성 상태를 갱신한다.
  alt_flows:
  - 2a. 투입 금액이 100원·500원·1000원이 아닌 비액면가인 경우, 시스템은 그 코인을 수납하지 않고 즉시 그대로 반환구로 되돌려 보내며
    누적 투입 금액과 동전 보유량을 변경하지 않는다.
  - 2b. 코인 인식에 실패한 경우, 시스템은 그 코인을 수납하지 않고 그대로 되돌려 보내며 누적 투입 금액과 동전 보유량을 변경하지 않는다.
  - 2c. 자판기가 판매 중지 상태인 경우, 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - 2d. 자판기가 관리 모드인 경우, 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - 2e. 자판기가 고장 상태인 경우, 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - 1a. 이미 다른 고객의 거래가 진행 중인 경우, 시스템은 새 거래를 동시에 시작하지 않는다.
  acceptance:
  - 100원 투입 후 화면 표시 누적 금액 = 투입 전 누적 금액 + 100 이고, 100원 보유 개수 = 투입 전 개수 + 1
  - 500원·1000원 투입에 대해서도 동일하게 누적 금액과 해당 액면가 보유 개수가 각각 증가한다
  - '50원·10원 등 비액면가 투입 시: 누적 금액 변화량 = 0, 모든 액면가 보유 개수 변화량 = 0, 반환구에 투입한 그 코인이 나온다'
  - '인식 실패 코인 투입 시: 누적 금액 변화량 = 0, 보유 개수 변화량 = 0, 투입된 코인이 그대로 반환된다'
  - 판매 중지·관리 모드·고장 상태에서 액면가 코인을 투입해도 누적 금액 변화량 = 0, 보유 개수 변화량 = 0, 코인이 그대로 반환된다
  - 코인 투입 직후 (동전 보유량 합계) == (초기 보유액) + (보충된 금액) − (회수된 금액) + (판매된 음료 가격의 합) + (누적
    투입 금액) + (미반환 보관액) 이 성립한다
  - 동전 보유량은 코인 수납·거스름돈 지급·반환 지급·관리자 보충·관리자 회수 이외의 경로로 변경되지 않는다
  - 동시에 진행 중인 고객 거래 수 <= 1
  - 제어 대상 인터페이스는 코인 투입구·선택 버튼·배출구·반환 레버로 한정되며 그 외 입출력 장치를 사용하지 않는다
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-18
  - REQ-19
  - REQ-20
  - REQ-22
  - REQ-23
  - REQ-24
  - REQ-25
  - REQ-26
  - REQ-27
  - REQ-116
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크며 3종 음료의 가격과 종류별 재고가 유지되고 있다
  postcondition: 선택한 음료가 배출 개시되고, 해당 음료 가격이 판매로 계상되며, 거스름돈이 0보다 크면 함께 반환되고 지급에 사용한
    동전만큼 액면가별 보유 개수가 차감된다
  main_flow:
  - 1. 시스템이 각 음료에 대해 (누적 투입 금액 >= 음료 가격) 그리고 (해당 음료 재고 >= 1)이면 그 선택 버튼을 활성화하고, 아니면
    비활성 상태로 둔다.
  - 2. 고객이 활성화된 음료 선택 버튼을 누른다.
  - 3. 시스템이 거스름돈 = (버튼을 누른 시점의 누적 투입 금액 − 음료 가격)을 계산한다.
  - 4. 시스템이 보유 동전으로 거스름돈을 구성할 수 있는지 확인한다.
  - 5. 시스템이 해당 음료의 배출을 개시한다.
  - 6. 시스템이 거스름돈이 0보다 크면 거스름돈을 반환구로 지급하고, 지급에 사용한 동전을 액면가별 보유 개수에서 차감한다.
  - 7. 시스템이 배출 완료 후 해당 음료의 재고를 1 차감하고 화면의 누적 투입 금액 표시를 갱신한다.
  alt_flows:
  - 2a. 누적 투입 금액이 해당 음료 가격 미만인 경우, 그 버튼은 비활성이며 눌러도 시스템은 배출을 개시하지 않는다.
  - 2b. 해당 음료의 재고가 0인 경우, 그 버튼은 비활성이며 눌러도 시스템은 배출을 개시하지 않는다.
  - 4a. 거스름돈을 구성할 동전이 부족한 경우, 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환한 뒤 누적 투입 금액을 0으로 만든다.
  - 5a. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우, 시스템은 UC-06의 배출 실패 처리를 수행한다.
  - 7a. 배출 완료 결과 모든 음료의 재고가 0이 된 경우, 시스템은 판매 중지 상태로 전환한다.
  acceptance:
  - 취급 음료 종류 수 == 3 이고 3종의 가격이 서로 모두 다르다
  - '3종 음료 각각의 구체적인 가격 값은 요구사항에 명시되어 있지 않아 외부 설정으로 주입되어야 한다 [모호: REQ-08]'
  - 재고는 음료 종류별로 개별 카운터로 유지되며 한 종류의 차감이 다른 종류의 재고를 변경하지 않는다
  - (누적 금액 >= 가격 AND 재고 >= 1)인 음료의 버튼 활성 == true, 그 외 음료의 버튼 활성 == false
  - 지급된 거스름돈 금액 == 버튼을 누른 시점의 누적 투입 금액 − 선택한 음료 가격
  - 거스름돈 지급 후 각 액면가 보유 개수 감소량 == 그 액면가로 지급한 동전 개수
  - 거스름돈 = 0이면 반환구로 지급되는 금액 == 0
  - '거스름돈 구성 불가 시: 배출 개시 횟수 == 0, 재고 변화량 == 0, 반환 금액 == 버튼을 누른 시점의 누적 투입 금액'
  - 버튼 입력 시각과 배출 개시 시각의 차이 <= 2초
  requirements:
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-17
  - REQ-21
  - REQ-28
  - REQ-29
  - REQ-85
- id: UC-03
  title: 배출 진행 중에 다음 구매를 위한 코인을 투입한다
  actor: 고객
  precondition: 자판기가 어떤 음료의 배출을 개시하고 배출 완료를 기다리는 중이다
  postcondition: 배출 중 투입된 금액이 누적 투입 금액에 더해져 진행 중인 배출의 거스름돈과 분리된 채로 남고, 배출 완료 후 다음
    구매에 사용된다
  main_flow:
  - 1. 고객이 배출 진행 중에 액면가 코인을 투입한다.
  - 2. 시스템이 그 코인을 수납하고 누적 투입 금액에 더하며 해당 액면가 보유 개수를 1 증가시킨다.
  - 3. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.
  - 4. 시스템이 배출 완료 신호를 받아 배출을 완료 처리한다.
  - 5. 시스템이 배출 중 투입된 금액을 누적 투입 금액으로 유지한 채 다음 구매 입력을 기다린다.
  alt_flows:
  - 1a. 투입된 코인이 비액면가이거나 인식에 실패한 경우, 시스템은 그 코인을 그대로 되돌려 보내고 누적 투입 금액을 변경하지 않는다.
  - 4a. 배출이 실패로 처리된 경우, 시스템은 배출 중 투입된 금액을 포함한 누적 투입 금액 전액을 반환한다(UC-06).
  - 4b. 관리 모드 진입이 예약된 경우, 시스템은 배출 중 투입된 금액만 반환한다(UC-11).
  acceptance:
  - 배출 중 100원 투입 시 누적 투입 금액 증가량 == 100
  - 진행 중인 배출의 거스름돈 == 버튼을 누른 시점의 누적 투입 금액 − 음료 가격 이며, 배출 중 투입 금액은 이 값에 포함되지 않는다
  - 배출 완료 직후 누적 투입 금액 == 배출 중 투입된 금액의 합
  - 배출 완료 후 그 누적 투입 금액으로 조건을 만족하는 음료의 선택 버튼이 활성화된다
  requirements:
  - REQ-14
  - REQ-15
  - REQ-16
- id: UC-04
  title: 반환 레버로 투입 금액을 돌려받는다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전만큼 액면가별 보유 개수가 차감된다
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.
  - 3. 시스템이 지급에 사용한 동전 개수를 액면가별 보유 개수에서 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 만들고 화면에 0을 표시한다.
  - 5. 시스템이 모든 음료 선택 버튼을 비활성 상태로 갱신한다.
  alt_flows:
  - 1a. 누적 투입 금액이 0인 경우, 시스템은 아무 금액도 지급하지 않고 보유량도 변경하지 않는다.
  - 1b. 자판기가 판매 상태가 아닌 경우(판매 중지·고장·관리 모드), 시스템은 반환 레버 조작으로 금액을 지급하지 않는다.
  - 2a. 반환할 금액을 구성할 동전이 부족한 경우, 시스템은 반환을 완료하지 못한 것으로 처리하고 관리자에게 알린다.
  acceptance:
  - 레버 조작 후 반환구 지급 금액 == 조작 직전 누적 투입 금액
  - 레버 조작 후 누적 투입 금액 == 0
  - 각 액면가 보유 개수 감소량 == 그 액면가로 지급한 동전 개수
  - 누적 투입 금액이 0일 때 레버 조작 시 지급 금액 == 0 이고 보유량 변화량 == 0
  requirements:
  - REQ-30
  - REQ-21
- id: UC-05
  title: 30초 무조작 시 투입 금액을 자동 반환한다
  actor: 타이머(시계)
  precondition: 누적 투입 금액이 0보다 크고 자판기가 판매 상태이다
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며 거래가 종료된다
  main_flow:
  - 1. 시스템이 마지막 코인 투입·음료 선택·반환 레버 조작 시각으로부터 경과 시간을 계측한다.
  - 2. 타이머가 30초 경과를 알린다.
  - 3. 시스템이 누적 투입 금액 전액을 반환구로 지급하고 사용한 동전을 액면가별 보유 개수에서 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 만들고 거래를 종료한다.
  - 5. 시스템이 화면에 누적 투입 금액 0을 표시한다.
  alt_flows:
  - 1a. 30초가 지나기 전에 코인 투입·음료 선택·반환 레버 조작이 발생한 경우, 시스템은 무조작 경과 시간을 0으로 재시작하고 자동 반환하지
    않는다.
  - 1b. 누적 투입 금액이 0인 경우, 시스템은 30초가 지나도 반환을 수행하지 않는다.
  - 2a. 배출 완료를 기다리는 중인 경우, 시스템은 진행 중인 배출을 자동 반환으로 중단하지 않는다.
  acceptance:
  - '누적 금액 > 0 이고 마지막 조작 후 30초 경과 시: 지급 금액 == 경과 직전 누적 투입 금액, 이후 누적 투입 금액 == 0, 거래
    종료 상태'
  - 29초 시점에 코인을 투입하면 그 시점부터 다시 30초가 경과해야 자동 반환이 발생한다
  - 누적 금액 == 0 인 상태로 30초 경과 시 지급 금액 == 0
  requirements:
  - REQ-31
  - REQ-32
- id: UC-06
  title: 배출 실패를 처리하고 고장 상태로 전환한다
  actor: 배출 장치(하드웨어)
  precondition: 자판기가 배출을 개시하고 해당 일련번호의 배출 완료 신호를 기다리는 중이다
  postcondition: 재고가 차감되지 않은 채 누적 투입 금액 전액이 반환되고 자판기가 고장 상태로 전환되어 저장된다
  main_flow:
  - 1. 시스템이 배출 개시 시각으로부터 경과 시간을 계측한다.
  - 2. 배출 장치가 10초 안에 배출 완료 신호를 보내지 않는다.
  - 3. 시스템이 해당 배출을 배출 실패로 처리한다.
  - 4. 시스템이 해당 음료의 재고를 차감하지 않는다.
  - 5. 시스템이 누적 투입 금액 전액을 반환구로 지급하고 사용한 동전을 액면가별 보유 개수에서 차감한다.
  - 6. 시스템이 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를 표시한다.
  alt_flows:
  - 2a. 10초 이내에 대기 중인 일련번호와 일치하는 배출 완료 신호가 도착한 경우, 시스템은 배출을 정상 완료로 처리하고 재고를 1 차감한다.
  - 3a. 관리 모드 진입이 예약된 상태에서 배출이 실패로 처리된 경우, 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다(UC-11).
  - 5a. 반환 후에도 배출 완료 신호가 뒤늦게 도착한 경우, 시스템은 그 신호로 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다(UC-07).
  acceptance:
  - 배출 개시 후 10초 경과까지 완료 신호가 없으면 상태 == 고장
  - 배출 실패 시 해당 음료 재고 변화량 == 0
  - 배출 실패 시 반환 금액 == 실패 시점의 누적 투입 금액, 이후 누적 투입 금액 == 0
  - 9.9초 시점에 유효한 완료 신호가 도착하면 상태 != 고장 이고 재고 감소량 == 1
  requirements:
  - REQ-33
  - REQ-34
  - REQ-35
  - REQ-36
- id: UC-07
  title: 배출 완료 신호를 일련번호로 검증하고 지연 배출을 기록한다
  actor: 배출 장치(하드웨어)
  precondition: 자판기가 배출 일련번호를 저장 상태로 보존하고 있다
  postcondition: 일련번호가 일치하는 완료 신호만 배출 완료로 반영되고, 불일치하거나 실패 처리 후 도착한 신호는 음료 종류와 함께 지연
    배출로 기록된다
  main_flow:
  - 1. 시스템이 배출을 개시할 때 그 배출에 일련번호를 부여하고 저장 상태에 기록한다.
  - 2. 배출 장치가 일련번호를 포함한 배출 완료 신호를 보낸다.
  - 3. 시스템이 신호의 일련번호가 현재 대기 중인 일련번호와 일치하는지 확인한다.
  - 4. 시스템이 일치하면 배출을 완료로 처리하고 재고를 1 차감한다.
  - 5. 시스템이 다음 배출 개시 시 일련번호를 직전 값에서 증가시킨다.
  alt_flows:
  - 3a. 신호의 일련번호가 대기 중인 일련번호와 일치하지 않는 경우, 시스템은 상태·재고·금액을 변경하지 않고 그 신호를 어느 음료였는지와 함께
    지연 배출로 기록한다.
  - 3b. 이미 배출 실패로 처리한 뒤에 완료 신호가 도착한 경우, 시스템은 상태·재고·금액을 변경하지 않고 그 신호를 음료 종류와 함께 지연
    배출로 기록한다.
  - 1a. 재기동 직후 첫 배출을 개시하는 경우, 시스템은 저장 파일에서 복원한 직전 일련번호에서 이어서 증가시킨다.
  acceptance:
  - 배출 개시마다 부여되는 일련번호가 이전 값보다 크고 서로 중복되지 않는다
  - 일련번호가 일치하는 완료 신호에 대해서만 재고 감소량 == 1
  - '일치하지 않는 완료 신호 처리 후: 상태 변화 없음, 재고 변화량 == 0, 누적 투입 금액 변화량 == 0, 동전 보유량 변화량 == 0'
  - 무효 신호 1건당 지연 배출 기록 1건이 생성되고 그 기록은 음료 종류를 포함한다
  - 재기동 후 첫 배출의 일련번호 > 재기동 전 마지막 배출의 일련번호
  requirements:
  - REQ-37
  - REQ-38
  - REQ-39
  - REQ-40
  - REQ-41
  - REQ-42
- id: UC-08
  title: 고장 상태에서 고객 조작을 거부한다
  actor: 고객
  precondition: 자판기가 고장 상태이고 반환할 누적 투입 금액은 0이다
  postcondition: 고객의 코인 투입과 음료 선택이 모두 거부되고 고장 상태가 유지되어 저장된다
  main_flow:
  - 1. 시스템이 화면에 고장임을 표시하고 관리자 호출을 안내한다.
  - 2. 고객이 코인을 투입한다.
  - 3. 시스템이 그 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - 4. 고객이 음료 선택 버튼을 누른다.
  - 5. 시스템이 모든 선택 버튼을 비활성 상태로 유지하고 배출을 개시하지 않는다.
  alt_flows:
  - 1a. 고객이 전원을 껐다 켠 경우, 시스템은 저장된 고장 상태를 복원하여 고장 상태를 유지한다.
  - 1b. 관리자가 전용 키를 꽂은 경우, 시스템은 고장 상태에서도 관리 모드 진입을 허용한다(UC-10).
  - 1c. 고객이 반환 레버를 조작한 경우, 반환할 누적 투입 금액이 0이므로 시스템은 아무 금액도 지급하지 않는다.
  acceptance:
  - 고장 상태에서 화면 출력에 고장 표시와 관리자 호출 안내가 모두 포함된다
  - '고장 상태에서 액면가 코인 투입 시: 누적 투입 금액 변화량 == 0, 동전 보유량 변화량 == 0, 투입한 코인이 그대로 반환된다'
  - 고장 상태에서 3종 음료 버튼의 활성 == false 이고 버튼 입력 후 배출 개시 횟수 == 0
  - 고장 상태 진입 시점의 누적 투입 금액 == 0
  - 전원 재투입 후 상태 == 고장
  - 관리자 해제 이외의 어떤 입력으로도 상태가 고장에서 벗어나지 않는다
  requirements:
  - REQ-44
  - REQ-45
  - REQ-46
  - REQ-47
  - REQ-48
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-52
- id: UC-09
  title: 재고 소진 시 판매 중지 상태로 운영한다
  actor: 고객
  precondition: 자판기가 판매 상태이거나 재기동 직후이며 종류별 재고가 유지되고 있다
  postcondition: 모든 음료의 재고가 0이면 자판기가 판매 중지 상태가 되고 코인을 받아들이지 않는다
  main_flow:
  - 1. 시스템이 배출 완료 또는 재고 변경 후 3종 음료의 재고를 확인한다.
  - 2. 시스템이 모든 음료의 재고가 0임을 확인하고 판매 중지 상태로 전환한다.
  - 3. 고객이 코인을 투입한다.
  - 4. 시스템이 그 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - 5. 시스템이 모든 음료 선택 버튼을 비활성 상태로 유지한다.
  alt_flows:
  - 2a. 재고가 1 이상인 음료가 하나라도 있는 경우, 시스템은 판매 상태를 유지한다.
  - 2b. 관리자가 관리 모드에서 재고를 보충하여 재고가 1 이상이 된 경우, 시스템은 보충 종료 시 판매 상태로 돌아간다(UC-12).
  - 3a. 관리자가 전용 키를 꽂은 경우, 시스템은 판매 중지 상태에서도 관리 모드 진입을 허용한다.
  acceptance:
  - 3종 재고가 모두 0이 된 직후 상태 == 판매 중지
  - 재고 합계 >= 1 이면 상태 != 판매 중지
  - '판매 중지 상태에서 액면가 코인 투입 시: 누적 투입 금액 변화량 == 0, 동전 보유량 변화량 == 0, 코인이 그대로 반환된다'
  requirements:
  - REQ-57
  - REQ-58
- id: UC-10
  title: 전용 키로 관리 모드에 진입한다
  actor: 관리자
  precondition: 관리자가 전용 키를 소지하고 있으며 자판기가 판매·판매 중지·고장 중 하나의 상태이다
  postcondition: 누적 투입 금액이 전액 반환되고 0이 된 뒤 자판기가 관리 모드로 전환된다
  main_flow:
  - 1. 관리자가 전용 키를 꽂아 관리 모드 진입을 요청한다.
  - 2. 시스템이 누적 투입 금액이 0보다 큰지 확인한다.
  - 3. 시스템이 누적 투입 금액 전액을 반환구로 지급하고 사용한 동전을 액면가별 보유 개수에서 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 만든다.
  - 5. 시스템이 관리 모드로 전환하고 관리자 조작 화면을 표시한다.
  alt_flows:
  - 2a. 누적 투입 금액이 0인 경우, 시스템은 반환 없이 곧바로 관리 모드로 전환한다.
  - 1a. 자판기가 고장 상태인 경우에도 시스템은 전용 키에 의한 관리 모드 진입을 허용한다.
  - 1b. 배출 완료를 기다리는 중에 키가 꽂힌 경우, 시스템은 즉시 전환하지 않고 관리 모드 진입을 예약한다(UC-11).
  - 5a. 관리 모드에서 코인이 투입된 경우, 시스템은 그 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  acceptance:
  - 키 삽입 시 누적 금액 > 0 이면 반환 금액 == 진입 요청 시점의 누적 투입 금액
  - 관리 모드 전환 시점의 누적 투입 금액 == 0
  - 반환 완료 시각 <= 관리 모드 전환 시각 (반환 후에 전환한다)
  - 고장 상태에서 전용 키 삽입 시 관리 모드 진입 == 성공
  - 관리 모드에서 액면가 코인 투입 시 동전 보유량 변화량 == 0 이고 코인이 그대로 반환된다
  requirements:
  - REQ-53
  - REQ-59
  - REQ-65
  - REQ-66
  - REQ-67
- id: UC-11
  title: 배출 대기 중 관리 모드 진입을 예약하고 배출 완료 후 전환한다
  actor: 관리자
  precondition: 자판기가 배출을 개시하고 배출 완료 신호를 기다리는 중이다
  postcondition: 배출 완료 직후 관리 모드로 전환되고, 개시된 배출의 음료 가격은 판매로 확정되며 배출 중 투입된 금액만 반환된다
  main_flow:
  - 1. 관리자가 배출 완료 대기 중에 전용 키를 꽂는다.
  - 2. 시스템이 관리 모드 진입을 예약하고 예약 여부를 저장 상태에 기록한다.
  - 3. 배출 장치가 유효한 배출 완료 신호를 보낸다.
  - 4. 시스템이 개시된 배출의 음료 가격을 판매로 확정하고 재고를 1 차감한다.
  - 5. 시스템이 배출 중 투입된 금액만 반환구로 지급한다.
  - 6. 시스템이 관리 모드로 전환한다.
  alt_flows:
  - 3a. 배출이 실패로 처리된 경우, 시스템은 재고를 차감하지 않고 누적 투입 금액 전액을 반환한 뒤 고장 상태로 전환하고 이어서 관리 모드로
    진입한다.
  - 5a. 배출 중 투입된 금액이 0인 경우, 시스템은 아무 금액도 지급하지 않고 관리 모드로 전환한다.
  - 3b. 배출 완료 신호의 일련번호가 일치하지 않는 경우, 시스템은 그 신호를 지연 배출로 기록하고 예약 상태를 유지한다.
  acceptance:
  - 배출 대기 중 키 삽입 후 배출 완료 전까지 상태 != 관리 모드
  - 배출 완료 직후 상태 == 관리 모드
  - 판매로 확정된 금액 == 개시된 배출의 음료 가격
  - 예약 전환 시 반환 금액 == 배출 중 투입된 금액의 합 (진행 중이던 배출의 거스름돈과 음료 가격은 포함하지 않는다)
  - 예약 상태에서 배출 실패 시 상태 전이 순서 == 고장 → 관리 모드 이고 재고 변화량 == 0
  - 관리 모드 진입 예약 여부가 저장 상태에 포함되어 재기동 후에도 복원된다
  requirements:
  - REQ-60
  - REQ-61
  - REQ-62
  - REQ-63
  - REQ-64
- id: UC-12
  title: 음료 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 등록된 3종 음료와 3개 액면가가 정의되어 있다
  postcondition: 유효한 보충 지시가 반영되어 종류별 재고와 액면가별 동전 보유 개수가 증가하고, 보충 종료 시 재고에 따라 판매 상태
    또는 판매 중지 상태로 돌아간다
  main_flow:
  - 1. 관리자가 보충 대상(음료 종류 또는 액면가)과 보충 수량을 지시한다.
  - 2. 시스템이 대상이 등록된 3종 음료 또는 100원·500원·1000원 액면가인지 검증한다.
  - 3. 시스템이 보충 수량이 1 이상의 정수인지 검증한다.
  - 4. 시스템이 지시된 수량만큼 해당 음료의 재고 또는 해당 액면가의 동전 보유 개수를 증가시킨다.
  - 5. 관리자가 보충을 종료한다.
  - 6. 시스템이 판매 상태로 돌아간다.
  alt_flows:
  - 2a. 등록되지 않은 음료나 100원·500원·1000원 이외의 액면가가 대상에 포함된 경우, 시스템은 지시 전체를 거부하고 어떤 재고·보유량도
    변경하지 않으며 관리자에게 알린다.
  - 3a. 수량이 0 이하이거나 정수가 아닌 항목이 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 관리자에게 알린다.
  - 6a. 보충 종료 시점에 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 돌아간다.
  acceptance:
  - 유효한 보충 지시 후 대상 음료 재고 증가량 == 지시 수량, 대상 액면가 보유 개수 증가량 == 지시 수량
  - 재고 보충 대상이 등록된 3종 이외이면 지시 결과 == 거부, 모든 재고·보유량 변화량 == 0
  - 동전 보충 대상이 100/500/1000 이외이면 지시 결과 == 거부, 모든 보유량 변화량 == 0
  - 수량 <= 0 또는 비정수 항목이 1개라도 포함된 다항목 지시의 결과 == 전체 거부 (부분 반영 0건)
  - 거부 시 관리자 대상 알림이 1회 발생한다
  - '관리자에게 알리는 수단(화면·부저·로그 등)은 요구사항에 명시되어 있지 않아 별도 결정이 필요하다 [모호: REQ-76]'
  - 보충 종료 후 재고 합계 >= 1 이면 상태 == 판매, 재고 합계 == 0 이면 상태 == 판매 중지
  requirements:
  - REQ-68
  - REQ-69
  - REQ-70
  - REQ-71
  - REQ-72
  - REQ-74
  - REQ-75
  - REQ-76
  - REQ-83
  - REQ-84
- id: UC-13
  title: 지연 배출을 확인하고 재고를 실제 개수에 맞춘다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 지연 배출 기록이 조회 가능하다
  postcondition: 장부 재고가 관리자가 지정한 실제 개수로 하향 조정되고 관련 지연 배출 기록이 확인 완료로 표시된다
  main_flow:
  - 1. 관리자가 기록된 지연 배출 목록을 조회한다.
  - 2. 시스템이 각 지연 배출 기록을 해당 음료 종류와 함께 표시한다.
  - 3. 관리자가 음료 종류별 실제 재고 개수를 조정값으로 입력한다.
  - 4. 시스템이 조정값이 0 이상이고 현재 장부 재고 이하인지 검증한다.
  - 5. 시스템이 해당 음료의 장부 재고를 조정값으로 변경한다.
  - 6. 시스템이 지연 배출 기록을 관리자가 확인한 것으로 표시한다.
  alt_flows:
  - 4a. 조정값이 0 미만인 경우, 시스템은 그 조정을 거부하고 재고를 변경하지 않는다.
  - 4b. 조정값이 현재 장부 재고보다 큰 경우(상향 조정), 시스템은 그 조정을 거부하고 재고를 변경하지 않는다.
  - 1a. 지연 배출 기록이 없는 경우, 시스템은 빈 목록을 표시한다.
  acceptance:
  - 지연 배출 목록의 각 항목이 음료 종류를 포함한다
  - 0 <= 조정값 <= 현재 장부 재고 인 입력에 대해 조정 후 장부 재고 == 조정값
  - 조정값 < 0 또는 조정값 > 현재 장부 재고 인 입력의 결과 == 거부, 재고 변화량 == 0
  - 조정 완료 후 해당 지연 배출 기록의 확인 여부 == 확인됨
  requirements:
  - REQ-43
  - REQ-77
  - REQ-78
  - REQ-79
  - REQ-80
- id: UC-14
  title: 액면가별로 동전을 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 액면가별 동전 보유 개수와 미반환 보관액이 기록되어 있다
  postcondition: 유효한 회수 지시가 반영되어 해당 액면가의 보유 개수가 회수 개수만큼 차감되고, 보유량 합계는 미반환 보관액 이상으로
    유지된다
  main_flow:
  - 1. 관리자가 회수할 액면가와 회수 수량을 지시한다.
  - 2. 시스템이 액면가가 100원·500원·1000원 중 하나인지, 회수 수량이 1 이상의 정수인지 검증한다.
  - 3. 시스템이 회수 후 보유량 합계가 미반환 보관액 이상으로 남는지 검증한다.
  - 4. 시스템이 지시된 개수의 동전을 관리자에게 내준다.
  - 5. 시스템이 해당 액면가의 보유 개수를 회수 개수만큼 차감한다.
  alt_flows:
  - 2a. 회수 수량이 0 이하이거나 정수가 아니거나 허용되지 않은 액면가가 포함된 경우, 시스템은 지시 전체를 거부하고 관리자에게 알린다.
  - 3a. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우, 시스템은 그 회수 지시를 거부하고 보유량을 변경하지 않는다.
  - 2b. 회수 수량이 현재 보유 개수를 초과하는 경우, 시스템은 그 지시를 거부하고 보유량을 변경하지 않는다.
  acceptance:
  - 유효한 회수 후 해당 액면가 보유 개수 감소량 == 회수 수량
  - 회수 수량 <= 0 또는 비정수 또는 허용되지 않은 액면가 지시의 결과 == 전체 거부, 보유량 변화량 == 0
  - 회수 후 보유량 합계 >= 미반환 보관액 이 항상 성립한다
  - 보유량 합계를 미반환 보관액 아래로 낮추는 회수 지시의 결과 == 거부, 보유량 변화량 == 0
  requirements:
  - REQ-73
  - REQ-81
  - REQ-82
  - REQ-92
  - REQ-93
- id: UC-15
  title: 미반환 보관액을 확인하고 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 미반환 보관액이 0보다 크다
  postcondition: 관리자가 미반환 보관액을 확인하고 해당 금액을 회수하며, 회수 결과가 저장 상태에 반영된다
  main_flow:
  - 1. 관리자가 미반환 보관액 조회를 요청한다.
  - 2. 시스템이 현재 미반환 보관액을 표시한다.
  - 3. 관리자가 미반환 보관액의 회수를 지시한다.
  - 4. 시스템이 해당 금액에 상당하는 동전을 관리자에게 내주고 액면가별 보유 개수를 차감한다.
  - 5. 시스템이 회수 결과를 반영한 상태를 저장한다.
  alt_flows:
  - 2a. 미반환 보관액이 0인 경우, 시스템은 0을 표시하고 회수를 수행하지 않는다.
  - 4a. 보유 동전으로 해당 금액을 구성할 수 없는 경우, 시스템은 회수를 거부하고 보유량을 변경하지 않는다.
  acceptance:
  - 관리 모드에서 미반환 보관액 조회 결과 == 현재 기록된 미반환 보관액
  - 미반환 보관액 회수 후 지급 금액 == 회수 지시 금액이고 보유량 합계 감소량 == 회수 지시 금액
  - 미반환 보관액 == 0 일 때 회수 지시의 지급 금액 == 0
  - '회수 후 미반환 보관액 값의 갱신 규칙이 요구사항에 명시되어 있지 않아 별도 결정이 필요하다 [모호: REQ-94]'
  requirements:
  - REQ-90
  - REQ-91
  - REQ-94
- id: UC-16
  title: 배출 실패를 확인하여 고장 상태를 해제한다
  actor: 관리자
  precondition: 자판기가 고장 상태이며 관리자가 전용 키로 관리 모드에 진입해 있고 진행 중이던 배출 기록이 남아 있다
  postcondition: 배출 실패를 확인하면 진행 중이던 배출 기록이 정리되고 고장 표시가 해제되며, 확인하지 않고 종료하면 고장 상태로 되돌아간다
  main_flow:
  - 1. 관리자가 관리 모드에서 진행 중이던 배출 실패 내역을 조회한다.
  - 2. 시스템이 실패한 배출의 음료와 일련번호를 표시한다.
  - 3. 관리자가 배출 실패를 확인 처리한다.
  - 4. 시스템이 진행 중이던 배출 기록을 정리한다.
  - 5. 시스템이 고장 표시를 해제한다.
  - 6. 관리자가 관리 모드를 종료한다.
  - 7. 시스템이 판매 상태 또는 판매 중지 상태로 돌아간다.
  alt_flows:
  - 6a. 관리자가 배출 실패를 확인하지 않은 채 관리 모드를 종료한 경우, 시스템은 다시 고장 상태가 되어 고장 표시와 관리자 호출 안내를 표시한다.
  - 7a. 종료 시점에 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 돌아간다.
  - 1a. 관리자 이외의 조작으로는 고장 상태가 해제되지 않는다.
  acceptance:
  - 배출 실패 확인 후 진행 중인 배출 기록 == 없음 이고 화면의 고장 표시 == 해제됨
  - 배출 실패를 확인하고 관리 모드를 종료하면 상태 != 고장
  - 배출 실패를 확인하지 않고 관리 모드를 종료하면 상태 == 고장
  - 관리자 확인 이외의 입력(전원 재투입 포함)으로 고장 표시가 해제되지 않는다
  requirements:
  - REQ-52
  - REQ-54
  - REQ-55
  - REQ-56
- id: UC-17
  title: 정전 후 재기동하여 상태를 복원한다
  actor: 전원(정전·재기동)
  precondition: 자판기 저장 파일에 직전에 완전히 기록된 상태가 존재하거나 저장 파일이 없다
  postcondition: 저장 상태가 복원되고 정전·재기동 규칙이 적용되어 누적 투입 금액이 0이 되며, 미반환 보관액과 재고가 규칙대로 계상된
    상태로 운전이 재개된다
  main_flow:
  - 1. 전원이 복구되어 자판기가 기동한다.
  - 2. 시스템이 저장 파일에서 상태 전체를 복원한다.
  - 3. 시스템이 누적 투입 금액을 0으로 시작하고, 정전 시점에 투입 중이던 금액을 물리적으로 반환하지 않은 채 미반환 보관액으로 기록한다.
  - 4. 시스템이 미반환 보관액에 해당하는 금액을 동전 보유량에 그대로 남긴다.
  - 5. 시스템이 기기 내부에 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태를 판정한다.
  - 6. 시스템이 화면에 누적 투입 금액 0과 현재 상태를 표시한다.
  alt_flows:
  - 2a. 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우, 시스템은 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된 금액으로 계상하며,
    미반환 보관액을 (정전 시점의 누적 투입 금액 − 해당 음료 가격)으로 계상한다.
  - 2b. 저장 파일이 없거나 손상된 경우, 시스템은 재고 0·동전 0·보관액 0의 초기 상태로 기동하고 관리자에게 알린다.
  - 2c. 저장된 상태가 고장인 경우, 시스템은 고장 상태를 유지하고 전원 재투입만으로는 해제하지 않는다.
  - 5a. 복원된 재고가 모두 0인 경우, 시스템은 판매 중지 상태로 기동한다.
  - 5b. 외부에서 재고 정보를 제공받는 경로는 존재하지 않으므로 시스템은 이를 사용하지 않는다.
  acceptance:
  - 재기동 직후 누적 투입 금액 == 0
  - '정전 시점 누적 투입 금액 X, 배출 미개시인 경우: 반환구 지급 금액 == 0 이고 미반환 보관액 증가량 == X, 동전 보유량 변화량
    == 0'
  - '배출 개시 후 완료 전 정전인 경우: 해당 음료 재고 감소량 == 1, 판매된 금액 증가량 == 음료 가격, 미반환 보관액 증가량 == (정전
    시점 누적 투입 금액 − 음료 가격)'
  - 재기동 후 상태 판정은 보존된 종류별 재고만을 입력으로 하며 외부 입력을 참조하지 않는다
  - '저장 파일 부재 또는 손상 시: 재고 == 0, 동전 보유량 == 0, 미반환 보관액 == 0 이고 관리자 알림이 1회 발생한다'
  - 재기동 후에도 저장된 배출 일련번호에서 이어서 증가한다
  requirements:
  - REQ-86
  - REQ-87
  - REQ-88
  - REQ-89
  - REQ-95
  - REQ-96
  - REQ-97
  - REQ-98
  - REQ-99
  - REQ-108
  - REQ-109
  - REQ-110
  - REQ-111
- id: UC-18
  title: 상태 전이마다 상태 전체를 원자적으로 저장한다
  actor: 전원(정전)
  precondition: 자판기 생성 시 저장 파일 위치가 지정되어 있고 해당 위치에 기록할 수 있다
  postcondition: 전이가 끝날 때마다 상태 전체가 저장 파일에 원자적으로 기록되어, 기록 도중 전원이 끊겨도 직전에 완전히 기록된 상태가
    남는다
  main_flow:
  - 1. 시스템이 상태가 바뀌는 전이를 완료한다.
  - 2. 시스템이 현재 상태 전체(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인
    배출의 일련번호와 음료, 관리 모드 진입 예약 여부)를 임시 파일에 기록한다.
  - 3. 시스템이 임시 파일의 내용을 fsync로 디스크에 강제 동기화한다.
  - 4. 시스템이 원자적 교체로 본 저장 파일을 갈아치운다.
  - 5. 시스템이 교체 후 디렉터리 항목도 동기화한다.
  alt_flows:
  - 2a. 임시 파일 기록 도중 전원이 끊긴 경우, 본 저장 파일에는 직전에 완전히 기록된 상태가 그대로 남고 절반만 쓰인 임시 파일은 읽히지
    않는다.
  - 4a. 원자적 교체 직전에 전원이 끊긴 경우, 재기동 시 시스템은 직전에 완전히 기록된 본 저장 파일을 읽는다.
  - 1a. 테스트 환경인 경우, 저장 파일 위치로 임시 파일 경로를 지정하여 동일한 저장 절차를 수행한다.
  - 2b. 저장 파일 위치에 기록할 수 없는 경우, 시스템은 관리자에게 알린다.
  acceptance:
  - 상태를 바꾸는 전이 1회당 저장 파일 기록 완료 1회가 발생한다
  - 저장된 레코드가 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인 배출의 일련번호와
    음료, 관리 모드 진입 예약 여부의 9개 항목을 모두 포함한다
  - 저장 호출의 시스템 콜 순서 == 임시 파일 쓰기 → fsync(임시 파일) → 원자적 교체 → fsync(디렉터리)
  - 쓰기 중 임의 시점에 전원을 끊은 뒤 읽은 저장 파일은 항상 완전한 상태 레코드로 파싱되며, 부분 기록된 내용이 읽히지 않는다
  - 자판기 생성 시 지정한 경로에만 저장 파일이 생성되고, 테스트에서 임시 경로를 지정하면 그 경로가 사용된다
  - 전체 실행 동안 외부 네트워크 소켓 연결 시도 횟수 == 0 이고 모든 처리가 기기 내부에서 완결된다
