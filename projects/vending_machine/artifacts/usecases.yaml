usecases:
- id: UC-01
  title: 코인을 투입하여 금액을 누적한다
  actor: 고객
  precondition: 자판기에 전원이 들어와 있고 장부가 복원되어 있다. 자판기는 동시에 한 명의 고객만 상대하며 다른 고객의 거래가 진행
    중이 아니다.
  postcondition: 받아들인 코인의 액면가만큼 누적 투입 금액과 해당 액면가의 동전 보유 개수가 각각 증가하고, 갱신된 누적 투입 금액이
    화면에 표시된다.
  main_flow:
  - step: 1. 고객이 코인 투입구에 코인을 넣는다.
    event: INSERT_COIN
  - step: 2. 시스템이 코인의 액면가가 100원, 500원, 1000원 중 하나인지 판별한다.
  - step: 3. 시스템이 코인을 수납하고 해당 액면가의 보유 개수를 1 증가시킨다.
  - step: 4. 시스템이 코인의 액면가를 누적 투입 금액에 더한다.
  - step: 5. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.
  alt_flows:
  - step: 2a. 100원·500원·1000원이 아닌 액면가인 경우 시스템은 코인을 즉시 반환하고, 누적 투입 금액과 동전 보유량을 변경하지
      않는다.
    event: INSERT_COIN
  - step: 2b. 코인 인식에 실패한 경우 시스템은 코인을 그대로 되돌려 보내고, 누적 투입 금액과 동전 보유량을 변경하지 않는다.
    event: INSERT_COIN
  - step: 2c. 판매 중지 상태인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
    event: INSERT_COIN
  - step: 2d. 고장 상태인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
    event: INSERT_COIN
  - step: 2e. 관리 모드인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
    event: INSERT_COIN
  acceptance:
  - 판매 상태에서 100원 코인 투입 후 누적 투입 금액이 투입 전 값 + 100 이고, 100원 보유 개수가 투입 전 값 + 1 이다.
  - 판매 상태에서 500원, 1000원 코인 투입에 대해서도 각각 동일한 증가가 성립한다.
  - 50원 코인 투입 후 반환구에 50원이 배출되고, 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.
  - 인식 실패 코인 투입 후 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.
  - 판매 중지 상태 / 고장 상태 / 관리 모드에서 1000원 코인 투입 후 코인이 반환되고, 누적 투입 금액과 1000원 보유 개수가 투입 전과
    동일하다.
  - 코인 투입 처리가 끝난 시점에 화면에 표시된 금액이 장부의 누적 투입 금액과 같다.
  - 제어 소프트웨어는 코인 투입구·버튼·배출구·반환 레버를 외부 인터페이스로만 호출하며 하드웨어를 생성하지 않는다.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-05
  - REQ-24
  - REQ-25
  - REQ-26
  - REQ-28
  - REQ-98
- id: UC-02
  title: 음료를 선택하여 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 누적 투입 금액이 가격 이상이며 재고가 1 이상인 음료가 하나 이상 존재하여 해당 음료의 선택
    버튼이 활성화되어 있다.
  postcondition: 배출 완료 신호를 받은 경우 해당 음료의 재고가 1 차감되고, 음료 가격이 매출로 기록되며, 거스름돈이 지급되고, (거스름돈
    + 음료 가격)이 누적 투입 금액에서 차감된 상태로 거래가 종료된다.
  main_flow:
  - step: 1. 고객이 활성화된 음료 선택 버튼을 누른다.
    event: PRESS_SELECT_BUTTON
  - step: 2. 시스템이 (누적 투입 금액 − 음료 가격)을 거스름돈 금액으로 계산하고, 보유 동전으로 그 금액을 구성할 수 있는지 확인한다.
  - step: 3. 시스템이 이 배출에 일련번호를 부여하고, 버튼 입력 후 2초 이내에 배출을 개시한다.
  - step: 4. 배출 장치가 해당 일련번호의 배출 완료 신호를 보낸다.
    event: DISPENSE_COMPLETE
  - step: 5. 시스템이 재고 1 차감, 음료 가격의 매출 기록, 거스름돈 지급, 누적 투입 금액에서 (거스름돈 + 음료 가격) 차감을 하나의
      장부 트랜잭션으로 반영한다.
  - step: 6. 시스템이 남은 누적 투입 금액을 화면에 표시한다.
  alt_flows:
  - step: 1a. 비활성 버튼(누적 투입 금액 < 가격 또는 재고 0)이 눌린 경우 시스템은 배출을 개시하지 않고 상태·재고·금액을 변경하지
      않는다.
    event: PRESS_SELECT_BUTTON
  - step: 2a. 보유 동전으로 거스름돈 금액을 구성할 수 없는 경우 시스템은 배출을 개시하지 않고 누적 투입 금액 전액을 반환한 뒤 거래를
      종료한다.
    event: PRESS_SELECT_BUTTON
  - step: 4a. 배출 완료 전에 코인이 투입된 경우 시스템은 그 코인을 수납해 누적 투입 금액에 더하되 진행 중인 배출의 거스름돈에는 포함하지
      않는다.
    event: INSERT_COIN
  - step: 4b. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우 시스템은 배출 실패로 처리한다(UC-06).
    event: DISPENSE_TIMEOUT
  - step: 4c. 기다리는 일련번호와 일치하지 않는 배출 완료 신호가 도착한 경우 시스템은 그 신호를 무효로 처리하고 지연 배출로 기록한다(UC-07).
    event: DISPENSE_COMPLETE
  - step: 5a. 반영 결과가 동전 보유량 합계 등식을 만족하지 않는 경우 시스템은 트랜잭션을 커밋하지 않고 전이를 거부한다.
  acceptance:
  - 등록된 음료는 정확히 3종이며 3종의 가격이 서로 다르고, 재고는 음료 종류별 개수로 조회된다.
  - 누적 투입 금액 < 음료 가격이거나 그 음료의 재고가 0이면 해당 버튼의 활성 상태가 false 이다.
  - 누적 투입 금액 >= 음료 가격이고 재고 >= 1 이면 해당 버튼의 활성 상태가 true 이다.
  - 버튼 입력 시각과 배출 개시 시각의 차이가 2초 이하이다.
  - 배출 개시 시점부터 배출 완료 신호 도착 직전까지 누적 투입 금액이 버튼을 누른 시점의 값(그 사이 투입분 포함)과 같고, 재고·매출은 변경되지
    않는다.
  - '누적 1500원, 가격 1000원, 보유 동전에 500원 1개 이상인 상태에서 배출 완료 후: 재고 −1, 매출 +1000, 반환구 지급액
    500, 누적 투입 금액 0 이다.'
  - 거스름돈을 구성할 수 없는 상태에서 활성 버튼을 누르면 배출이 개시되지 않고 반환액이 버튼 누른 시점의 누적 투입 금액과 같으며, 재고와 매출이
    변경되지 않는다.
  - 배출 완료 처리 중 어느 시점을 관측해도 재고 차감·매출 기록·거스름돈 지급·누적 금액 차감의 네 변경이 전부 반영된 장부이거나 전부 미반영된
    장부 중 하나이다.
  - 배출 완료 처리 도중 도착한 이벤트는 그 처리가 끝난 뒤에 처리되며, 중간 장부를 관측하지 못한다.
  - 전이 종료 시점의 장부가 보유량 합계 등식을 만족한다.
  - 각 배출 개시마다 부여된 일련번호가 직전 배출의 일련번호보다 크다.
  requirements:
  - REQ-06
  - REQ-07
  - REQ-08
  - REQ-09
  - REQ-10
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-15
  - REQ-16
  - REQ-17
  - REQ-18
  - REQ-19
  - REQ-20
  - REQ-29
  - REQ-30
  - REQ-37
  - REQ-38
  - REQ-71
  - REQ-85
  - REQ-86
  - REQ-87
  - REQ-88
  - REQ-89
- id: UC-03
  title: 배출 진행 중에 다음 구매를 위한 코인을 투입한다
  actor: 고객
  precondition: 자판기가 배출을 개시하고 배출 완료 신호를 기다리는 중이다.
  postcondition: 배출 중 투입된 금액은 진행 중인 배출의 거스름돈에 포함되지 않고, 배출 완료 정산 후 누적 투입 금액으로 남는다.
  main_flow:
  - step: 1. 고객이 배출이 진행되는 동안 코인을 투입한다.
    event: INSERT_COIN
  - step: 2. 시스템이 코인을 수납하고 해당 액면가의 보유 개수를 1 증가시킨 뒤 누적 투입 금액에 더한다.
  - step: 3. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.
  - step: 4. 배출 장치가 배출 완료 신호를 보낸다.
    event: DISPENSE_COMPLETE
  - step: 5. 시스템이 버튼을 누른 시점의 거스름돈 금액만 지급하고, 배출 중 투입된 금액은 누적 투입 금액으로 남긴다.
  alt_flows:
  - step: 4a. 배출이 실패로 처리된 경우 시스템은 배출 중 투입분을 포함한 남은 누적 투입 금액 전액을 반환한다.
    event: DISPENSE_TIMEOUT
  - step: 4b. 관리 모드 진입이 예약된 상태로 배출이 완료된 경우 시스템은 배출 중 투입된 금액만 반환한다(UC-10).
    event: DISPENSE_COMPLETE
  acceptance:
  - 누적 1000원, 가격 1000원으로 버튼을 누른 뒤 배출 중 500원을 투입하고 배출이 완료되면 지급된 거스름돈이 0원이다.
  - 동일 시나리오에서 배출 완료 후 누적 투입 금액이 500원이다.
  - 배출 중 투입한 500원에 대해 500원 보유 개수가 투입 전보다 1 크다.
  - 배출 완료 후 남은 누적 투입 금액 500원으로 가격 500원 이하의 음료 버튼이 활성화된다.
  requirements:
  - REQ-21
  - REQ-22
  - REQ-23
- id: UC-04
  title: 반환 레버로 투입 금액을 돌려받는다
  actor: 고객
  precondition: 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감된다.
  main_flow:
  - step: 1. 고객이 반환 레버를 조작한다.
    event: PULL_RETURN_LEVER
  - step: 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.
  - step: 3. 시스템이 지급에 사용한 동전 개수를 액면가별 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든다.
  - step: 4. 시스템이 누적 투입 금액 0을 화면에 표시한다.
  alt_flows:
  - step: 1a. 누적 투입 금액이 0인 상태에서 반환 레버가 조작된 경우 시스템은 아무것도 지급하지 않고 장부를 변경하지 않는다.
    event: PULL_RETURN_LEVER
  - step: 1b. 고장 상태 또는 관리 모드에서 반환 레버가 조작된 경우 시스템은 지급하지 않고 장부를 변경하지 않는다.
    event: PULL_RETURN_LEVER
  - step: 3a. 반환 결과가 보유량 합계 등식을 만족하지 않는 경우 시스템은 전이를 커밋하지 않고 거부한다.
  acceptance:
  - 누적 1500원(1000원 1개, 500원 1개 투입) 상태에서 반환 레버 조작 후 반환구 지급액이 1500원이고 누적 투입 금액이 0이다.
  - 반환 후 지급에 사용한 액면가별 동전 개수만큼 보유 개수가 감소한다.
  - 누적 0원 상태에서 반환 레버 조작 후 지급액이 0이고 동전 보유량이 조작 전과 동일하다.
  - 반환 완료 시점의 장부가 보유량 합계 등식을 만족한다.
  requirements:
  - REQ-27
  - REQ-31
- id: UC-05
  title: 무조작 30초 경과로 투입 금액을 자동 반환한다
  actor: 타이머(외부 시각 경과)
  precondition: 누적 투입 금액이 0보다 크고, 마지막 코인 투입·음료 선택·반환 레버 조작으로부터 시간이 흐르고 있다.
  postcondition: 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며 거래가 종료된다.
  main_flow:
  - step: 1. 타이머가 마지막 고객 조작으로부터 30초 경과를 알린다.
    event: IDLE_TIMEOUT
  - step: 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.
  - step: 3. 시스템이 지급에 사용한 동전 개수를 액면가별 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든 뒤 거래를 종료한다.
  - step: 4. 시스템이 누적 투입 금액 0을 화면에 표시한다.
  alt_flows:
  - step: 1a. 30초가 지나기 전에 코인이 투입된 경우 시스템은 무조작 경과 시간을 0으로 재설정한다.
    event: INSERT_COIN
  - step: 1b. 30초가 지나기 전에 음료 선택 버튼이 눌린 경우 시스템은 무조작 경과 시간을 0으로 재설정한다.
    event: PRESS_SELECT_BUTTON
  - step: 1c. 30초가 지나기 전에 반환 레버가 조작된 경우 시스템은 UC-04로 전액을 반환한다.
    event: PULL_RETURN_LEVER
  - step: 1d. 누적 투입 금액이 0인 상태로 30초가 경과한 경우 시스템은 아무것도 지급하지 않고 장부를 변경하지 않는다.
    event: IDLE_TIMEOUT
  acceptance:
  - 누적 700원 상태에서 29.9초 시점에는 반환이 발생하지 않는다.
  - 누적 700원 상태에서 마지막 조작 후 30초가 경과하면 반환구 지급액이 700원이고 누적 투입 금액이 0이며 거래가 종료된 상태이다.
  - 20초 시점에 코인을 투입하면 그 시점부터 다시 30초가 경과해야 자동 반환이 발생한다.
  - 누적 0원 상태로 30초가 경과해도 지급액이 0이고 장부가 변경되지 않는다.
  requirements:
  - REQ-32
- id: UC-06
  title: 배출 실패를 처리하고 고장 상태로 전환한다
  actor: 타이머(외부 시각 경과)
  precondition: 자판기가 배출을 개시하고 해당 일련번호의 배출 완료 신호를 기다리는 중이다.
  postcondition: 재고가 차감되지 않은 채 남은 누적 투입 금액 전액이 반환되고 자판기가 고장 상태가 된다.
  main_flow:
  - step: 1. 타이머가 배출 개시 후 10초 경과를 알린다.
    event: DISPENSE_TIMEOUT
  - step: 2. 시스템이 그 배출을 배출 실패로 처리하고 재고를 차감하지 않는다.
  - step: 3. 시스템이 남아 있는 누적 투입 금액 전액을 반환구로 지급하고 누적 투입 금액을 0으로 만든다.
  - step: 4. 시스템이 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를 표시한다.
  alt_flows:
  - step: 1a. 10초 안에 일치하는 배출 완료 신호가 도착한 경우 시스템은 정상 정산을 수행한다(UC-02).
    event: DISPENSE_COMPLETE
  - step: 1b. 배출 실패로 처리한 뒤 배출 완료 신호가 도착한 경우 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다(UC-07).
    event: DISPENSE_COMPLETE
  - step: 4a. 관리 모드 진입이 예약된 배출이 실패로 처리된 경우 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다.
    event: DISPENSE_TIMEOUT
  acceptance:
  - 배출 개시 후 10초 동안 완료 신호가 없으면 해당 음료의 재고가 배출 개시 전과 동일하다.
  - 배출 실패 처리 후 매출 합계가 배출 개시 전과 동일하다.
  - 배출 실패 처리 후 반환구 지급액이 실패 시점의 누적 투입 금액과 같고 누적 투입 금액이 0이다.
  - 배출 실패 처리 후 상태 이름이 '고장'이다.
  - 관리 모드 진입 예약이 있는 상태에서 배출 실패가 발생하면 상태 이력에 '고장' 전환 후 '관리 모드' 진입이 기록된다.
  requirements:
  - REQ-33
  - REQ-34
  - REQ-35
  - REQ-36
  - REQ-57
- id: UC-07
  title: 무효한 배출 완료 신호를 지연 배출로 기록한다
  actor: 배출 장치
  precondition: 자판기가 기다리는 배출 일련번호가 없거나, 도착한 신호의 일련번호가 기다리는 일련번호와 다르다.
  postcondition: 상태·재고·금액이 변경되지 않고, 해당 음료 종류와 함께 지연 배출 기록이 장부에 남는다.
  main_flow:
  - step: 1. 배출 장치가 배출 완료 신호를 보낸다.
    event: DISPENSE_COMPLETE
  - step: 2. 시스템이 신호의 일련번호를 현재 기다리는 일련번호와 대조한다.
  - step: 3. 시스템이 일치하지 않음을 확인하고 그 신호를 무효로 처리한다.
  - step: 4. 시스템이 신호에 담긴 음료 종류와 함께 지연 배출 기록을 장부에 남긴다.
  alt_flows:
  - step: 2a. 일련번호가 일치하는 경우 시스템은 정상 정산을 수행한다(UC-02).
    event: DISPENSE_COMPLETE
  - step: 3a. 배출 실패로 처리한 뒤 도착한 신호인 경우 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다.
    event: DISPENSE_COMPLETE
  - step: 4a. 지연 배출 기록은 관리자가 재고를 조정할 때까지 미확인 상태로 유지된다.
  acceptance:
  - 기다리는 일련번호가 N일 때 일련번호 N−1의 완료 신호를 보내면 재고·매출·누적 투입 금액·동전 보유량·상태 이름이 신호 전과 동일하다.
  - 무효 신호 처리 후 지연 배출 기록이 1건 추가되고 그 기록의 음료 종류가 신호에 담긴 음료 종류와 같다.
  - 배출 실패 처리 후 도착한 완료 신호에 대해서도 재고가 차감되지 않고 지연 배출 기록이 1건 추가된다.
  - 새로 추가된 지연 배출 기록의 확인 여부가 미확인이다.
  requirements:
  - REQ-38
  - REQ-40
  - REQ-41
- id: UC-08
  title: 고장 상태에서 고객 조작을 차단하고 안내한다
  actor: 고객
  precondition: 자판기가 고장 상태이다.
  postcondition: 코인이 수납되지 않고 음료가 배출되지 않으며 고장 상태가 유지된다.
  main_flow:
  - step: 1. 시스템이 화면에 고장임을 표시하고 관리자 호출을 안내한다.
  - step: 2. 고객이 코인을 투입한다.
    event: INSERT_COIN
  - step: 3. 시스템이 코인을 받아들이지 않고 그대로 되돌려 보낸다.
  - step: 4. 고객이 음료 선택 버튼을 누른다.
    event: PRESS_SELECT_BUTTON
  - step: 5. 시스템이 모든 선택 버튼을 비활성으로 유지하고 배출을 개시하지 않는다.
  alt_flows:
  - step: 2a. 전원이 차단된 뒤 다시 투입된 경우 시스템은 저장된 고장 상태로 기동하며 고장 상태가 해제되지 않는다.
    event: POWER_ON
  - step: 4a. 관리자가 전용 키로 관리 모드에 진입하고 배출 실패를 확인한 경우에만 고장 표시가 해제된다(UC-15).
    event: INSERT_ADMIN_KEY
  acceptance:
  - 고장 상태에서 화면 출력에 고장 표시와 관리자 호출 안내가 모두 포함된다.
  - 고장 상태에서 1000원 투입 후 반환구 지급액이 1000원이고 누적 투입 금액이 0이며 1000원 보유 개수가 투입 전과 동일하다.
  - 고장 상태에서 3종 음료의 선택 버튼 활성 상태가 모두 false 이다.
  - 고장 상태에서 버튼을 눌러도 배출이 개시되지 않고 배출 일련번호가 증가하지 않는다.
  - 고장 상태에서 전원을 껐다 켠 뒤 상태 이름이 여전히 '고장'이다.
  - 관리자 해제 조작 없이는 상태 이름이 '고장'에서 변경되지 않는다.
  requirements:
  - REQ-42
  - REQ-43
  - REQ-44
  - REQ-45
  - REQ-46
  - REQ-47
- id: UC-09
  title: 관리자가 전용 키로 관리 모드에 진입한다
  actor: 관리자
  precondition: 자판기에 전원이 들어와 있고 배출 완료를 기다리는 중이 아니다.
  postcondition: 누적 투입 금액이 0이 된 상태로 자판기가 관리 모드가 된다.
  main_flow:
  - step: 1. 관리자가 전용 키를 꽂는다.
    event: INSERT_ADMIN_KEY
  - step: 2. 시스템이 누적 투입 금액이 남아 있는지 확인한다.
  - step: 3. 시스템이 남아 있는 누적 투입 금액 전액을 반환하고 누적 투입 금액을 0으로 만든다.
  - step: 4. 시스템이 관리 모드로 전환한다.
  alt_flows:
  - step: 1a. 고장 상태에서 전용 키가 꽂힌 경우에도 시스템은 관리 모드로 전환한다.
    event: INSERT_ADMIN_KEY
  - step: 1b. 배출 완료를 기다리는 중에 전용 키가 꽂힌 경우 시스템은 관리 모드 진입을 예약한다(UC-10).
    event: INSERT_ADMIN_KEY
  - step: 2a. 누적 투입 금액이 0인 경우 시스템은 반환 없이 관리 모드로 전환한다.
    event: INSERT_ADMIN_KEY
  - step: 3a. 관리 모드에서 코인이 투입된 경우 시스템은 수납하지 않고 그대로 반환한다.
    event: INSERT_COIN
  acceptance:
  - 누적 800원 상태에서 전용 키 진입 시 반환구 지급액이 800원이고, 관리 모드 진입 시점의 누적 투입 금액이 0이다.
  - 누적 0원 상태에서 전용 키 진입 시 지급액이 0이고 상태 이름이 '관리 모드'이다.
  - 고장 상태에서 전용 키 진입 후 상태 이름이 '관리 모드'이다.
  - 관리 모드 진입 완료 시점의 장부가 보유량 합계 등식을 만족한다.
  requirements:
  - REQ-48
  - REQ-53
  - REQ-58
- id: UC-10
  title: 배출 완료 대기 중 관리 모드 진입을 예약한다
  actor: 관리자
  precondition: 자판기가 배출을 개시하고 해당 일련번호의 배출 완료 신호를 기다리는 중이다.
  postcondition: 배출이 완료된 직후 자판기가 관리 모드로 전환되고, 이미 개시된 배출의 음료 가격은 판매로 확정되며 배출 중 투입된
    금액만 반환된다.
  main_flow:
  - step: 1. 관리자가 배출 완료 대기 중에 전용 키를 꽂는다.
    event: INSERT_ADMIN_KEY
  - step: 2. 시스템이 관리 모드 진입 예약을 장부에 기록하고 배출을 계속 기다린다.
  - step: 3. 배출 장치가 해당 일련번호의 배출 완료 신호를 보낸다.
    event: DISPENSE_COMPLETE
  - step: 4. 시스템이 그 음료의 재고를 1 차감하고 음료 가격을 판매로 확정하며 거스름돈을 지급한다.
  - step: 5. 시스템이 배출 중 투입된 금액만 반환하고 누적 투입 금액을 0으로 만든다.
  - step: 6. 시스템이 관리 모드로 전환한다.
  alt_flows:
  - step: 3a. 예약된 배출이 10초 내 완료되지 않아 실패로 처리된 경우 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다.
    event: DISPENSE_TIMEOUT
  - step: 3b. 예약 상태에서 코인이 투입된 경우 시스템은 수납해 누적 투입 금액에 더하고, 그 금액은 배출 완료 후 반환 대상이 된다.
    event: INSERT_COIN
  acceptance:
  - 배출 대기 중 전용 키를 꽂으면 장부의 관리 모드 진입 예약 값이 참이다.
  - 예약 직후 상태 이름이 아직 '관리 모드'가 아니며 배출 대기가 유지된다.
  - '누적 1500원·가격 1000원으로 개시한 배출 중 500원을 추가 투입하고 완료 신호가 도착하면: 매출 +1000, 재고 −1, 거스름돈
    500원 지급, 추가 반환 500원, 누적 투입 금액 0, 상태 이름 ''관리 모드''이다.'
  - 예약된 배출이 실패하면 상태 이력이 '고장' → '관리 모드' 순서로 기록된다.
  requirements:
  - REQ-54
  - REQ-55
  - REQ-56
  - REQ-57
- id: UC-11
  title: 관리자가 재고와 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시가 유효하면 지정한 음료의 재고와 지정한 액면가의 동전 보유 개수가 지시한 수량만큼 증가하고, 유효하지 않으면 어떤
    값도 변경되지 않는다.
  main_flow:
  - step: 1. 관리자가 음료 종류와 수량을 지정해 재고 보충을 지시한다.
    event: REPLENISH_STOCK
  - step: 2. 시스템이 대상이 등록된 3종 음료에 속하고 수량이 1 이상의 정수인지 검증한다.
  - step: 3. 시스템이 지정한 음료의 재고를 지시한 수량만큼 증가시킨다.
  - step: 4. 관리자가 액면가와 수량을 지정해 동전 보충을 지시한다.
    event: REPLENISH_COIN
  - step: 5. 시스템이 액면가가 100원·500원·1000원 중 하나이고 수량이 1 이상의 정수인지 검증한다.
  - step: 6. 시스템이 해당 액면가의 보유 개수를 지시한 수량만큼 증가시킨다.
  alt_flows:
  - step: 2a. 등록되지 않은 음료가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
    event: REPLENISH_STOCK
  - step: 2b. 수량이 0 이하이거나 정수가 아닌 항목이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
    event: REPLENISH_STOCK
  - step: 5a. 100원·500원·1000원이 아닌 액면가가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
    event: REPLENISH_COIN
  - step: 5b. 수량이 0 이하인 항목이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
    event: REPLENISH_COIN
  acceptance:
  - 음료 A에 수량 5의 보충 지시 후 A의 재고가 지시 전 + 5 이다.
  - 500원 액면가에 수량 10의 보충 지시 후 500원 보유 개수가 지시 전 + 10 이다.
  - 등록되지 않은 음료 D를 포함한 {A:3, D:2} 지시 후 A의 재고와 D 관련 값이 모두 지시 전과 동일하고, 거부 알림이 관리자에게 반환된다.
  - '{A:3, B:0} 지시 후 A와 B의 재고가 모두 지시 전과 동일하고 거부 알림이 반환된다.'
  - 50원 액면가를 포함한 동전 보충 지시 후 모든 액면가의 보유 개수가 지시 전과 동일하고 거부 알림이 반환된다.
  - 수량 −1을 포함한 동전 보충 지시가 거부되고 보유량이 변경되지 않는다.
  requirements:
  - REQ-59
  - REQ-60
  - REQ-61
  - REQ-62
  - REQ-63
  - REQ-64
- id: UC-12
  title: 관리자가 재고를 실제 개수에 맞춰 조정한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 조정값이 유효하면 해당 음료의 장부 재고가 조정값이 되고 지연 배출 기록이 확인 완료로 표시되며, 유효하지 않으면 재고가
    변경되지 않는다.
  main_flow:
  - step: 1. 관리자가 음료 종류와 실제 개수를 지정해 재고 조정을 지시한다.
    event: ADJUST_STOCK
  - step: 2. 시스템이 조정값이 0 이상이고 현재 장부 재고 이하인지 검증한다.
  - step: 3. 시스템이 해당 음료의 장부 재고를 조정값으로 변경한다.
  - step: 4. 시스템이 지연 배출 기록을 관리자가 확인한 것으로 표시한다.
  alt_flows:
  - step: 2a. 조정값이 0 미만인 경우 시스템은 지시를 거부하고 재고를 변경하지 않는다.
    event: ADJUST_STOCK
  - step: 2b. 조정값이 현재 장부 재고보다 큰 경우 시스템은 지시를 거부하고 재고를 변경하지 않는다.
    event: ADJUST_STOCK
  - step: 2c. 등록되지 않은 음료가 지정된 경우 시스템은 지시를 거부하고 관리자에게 알린다.
    event: ADJUST_STOCK
  acceptance:
  - 장부 재고 7인 음료를 5로 조정하면 그 음료의 재고가 5이다.
  - 장부 재고 7인 음료를 8로 조정하면 거부되고 재고가 7로 유지된다.
  - 장부 재고 7인 음료를 −1로 조정하면 거부되고 재고가 7로 유지된다.
  - 조정 성공 후 모든 지연 배출 기록의 확인 여부가 확인 완료이다.
  - 조정이 거부된 경우 지연 배출 기록의 확인 여부가 변경되지 않는다.
  requirements:
  - REQ-65
  - REQ-66
  - REQ-67
- id: UC-13
  title: 관리자가 동전과 미반환 보관액을 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 회수 지시가 유효하면 액면가별 보유 개수가 회수 개수만큼 차감되고, 보유량 합계를 미반환 보관액 미만으로 낮추는 지시는
    거부되어 보유량이 유지된다.
  main_flow:
  - step: 1. 관리자가 미반환 보관액과 액면가별 동전 보유량 조회를 요청한다.
    event: VIEW_LEDGER
  - step: 2. 시스템이 미반환 보관액과 액면가별 보유 개수를 관리자에게 표시한다.
  - step: 3. 관리자가 액면가와 회수 개수를 지정해 회수를 지시한다.
    event: COLLECT_COIN
  - step: 4. 시스템이 회수 개수가 1 이상의 정수이고 액면가가 100원·500원·1000원 중 하나이며, 회수 후 보유량 합계가 미반환
      보관액 이상인지 검증한다.
  - step: 5. 시스템이 해당 액면가의 보유 개수를 회수 개수만큼 차감하고 회수 금액만큼 미반환 보관액을 정리한다.
  alt_flows:
  - step: 4a. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우 시스템은 지시를 거부하고 보유량을 변경하지 않는다.
    event: COLLECT_COIN
  - step: 4b. 회수 개수가 0 이하이거나 등록되지 않은 액면가가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.
    event: COLLECT_COIN
  - step: 4c. 보유 개수보다 많은 개수를 회수하려는 경우 시스템은 지시를 거부하고 보유량을 변경하지 않는다.
    event: COLLECT_COIN
  - step: 5a. 회수 결과가 보유량 합계 등식을 만족하지 않는 경우 시스템은 전이를 커밋하지 않고 거부한다.
  acceptance:
  - 관리 모드 조회 응답에 미반환 보관액과 100원·500원·1000원 각각의 보유 개수가 포함된다.
  - 500원 보유 10개 상태에서 500원 3개 회수 후 500원 보유 개수가 7이다.
  - 보유량 합계 2000원, 미반환 보관액 1500원인 상태에서 1000원 1개 회수 지시가 거부되고 보유 개수가 변경되지 않는다.
  - 회수 개수 0 또는 −1 지시가 거부되고 보유량이 변경되지 않는다.
  - 회수 완료 시점의 장부가 보유량 합계 등식을 만족한다.
  - 동전 보유량은 코인 수납, 지급(거스름돈·반환), 보충, 회수 이외의 경로로는 변경되지 않는다.
  requirements:
  - REQ-24
  - REQ-25
  - REQ-27
  - REQ-68
  - REQ-77
  - REQ-78
- id: UC-14
  title: 관리자가 배출 실패를 확인해 고장 상태를 해제한다
  actor: 관리자
  precondition: 자판기가 고장 상태에서 관리 모드로 진입했고 진행 중이던 배출 기록이 남아 있다.
  postcondition: 배출 실패를 확인하면 진행 중 배출 기록이 정리되고 고장 표시가 해제되며, 확인하지 않고 나가면 고장 상태로 되돌아간다.
  main_flow:
  - step: 1. 관리자가 관리 모드에서 배출 실패 내역을 조회한다.
    event: VIEW_LEDGER
  - step: 2. 시스템이 진행 중이던 배출의 일련번호와 음료를 표시한다.
  - step: 3. 관리자가 배출 실패를 확인 처리한다.
    event: ACK_DISPENSE_FAILURE
  - step: 4. 시스템이 진행 중 배출 기록을 정리하고 고장 표시를 해제한다.
  - step: 5. 관리자가 전용 키를 뽑아 관리 모드를 종료한다.
    event: REMOVE_ADMIN_KEY
  - step: 6. 시스템이 판매 상태 또는 판매 중지 상태로 전환한다.
  alt_flows:
  - step: 5a. 배출 실패를 확인하지 않은 채 관리 모드를 종료한 경우 시스템은 다시 고장 상태로 전환한다.
    event: REMOVE_ADMIN_KEY
  - step: 3a. 전원을 껐다 켜는 것만으로는 고장 표시가 해제되지 않는다.
    event: POWER_ON
  acceptance:
  - 관리 모드 조회 응답에 진행 중이던 배출의 일련번호와 음료 종류가 포함된다.
  - 배출 실패 확인 후 장부의 진행 중 배출 항목이 비어 있고 고장 표시가 거짓이다.
  - 배출 실패 확인 후 관리 모드를 종료하면 상태 이름이 '판매' 또는 '판매 중지'이다.
  - 배출 실패를 확인하지 않고 관리 모드를 종료하면 상태 이름이 '고장'이다.
  - 고장 상태에서 전원 재투입만 수행한 경우 상태 이름이 '고장'으로 유지된다.
  requirements:
  - REQ-47
  - REQ-49
  - REQ-50
- id: UC-15
  title: 관리 모드를 종료하고 판매 가능 여부에 따라 상태를 정한다
  actor: 관리자
  precondition: 자판기가 관리 모드이고 보충·조정·회수 작업이 끝났다.
  postcondition: 재고가 하나라도 남아 있으면 판매 상태로, 모든 음료의 재고가 0이면 판매 중지 상태로 전환된다.
  main_flow:
  - step: 1. 관리자가 전용 키를 뽑아 관리 모드 종료를 지시한다.
    event: REMOVE_ADMIN_KEY
  - step: 2. 시스템이 음료 종류별 재고를 확인한다.
  - step: 3. 시스템이 재고가 1 이상인 음료가 존재하면 판매 상태로 전환하고 누적 투입 금액 0을 화면에 표시한다.
  alt_flows:
  - step: 1a. 종료 시점에 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 전환한다.
    event: REMOVE_ADMIN_KEY
  - step: 1b. 배출 실패를 확인하지 않은 채 종료한 경우 시스템은 고장 상태로 전환한다(UC-14).
    event: REMOVE_ADMIN_KEY
  - step: 3a. 판매 중지 상태에서 코인이 투입된 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.
    event: INSERT_COIN
  - step: 3b. 판매 중 마지막 재고가 소진되어 모든 음료의 재고가 0이 된 경우 시스템은 판매 중지 상태로 전환한다.
    event: DISPENSE_COMPLETE
  acceptance:
  - 재고 {A:2, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 '판매'이다.
  - 재고 {A:0, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 '판매 중지'이다.
  - 판매 중지 상태에서 500원 투입 후 반환구 지급액이 500원이고 누적 투입 금액이 0이며 500원 보유 개수가 변하지 않는다.
  - 마지막 재고 1개가 판매 완료된 직후 상태 이름이 '판매 중지'이다.
  - '[모호] 관리 모드 종료(보충 완료) 시점의 판정 조작이 명세되어 있지 않아 전용 키 제거를 종료 조작으로 가정한다.'
  requirements:
  - REQ-51
  - REQ-52
  - REQ-69
  - REQ-70
- id: UC-16
  title: 전원 차단 시점의 잔액을 미반환 보관액으로 기록한다
  actor: 전원 공급원(정전 또는 전원 스위치 차단)
  precondition: 자판기에 전원이 들어와 있고 누적 투입 금액이 0 이상이다.
  postcondition: 차단 시점의 잔액이 미반환 보관액으로 기록되고 해당 동전은 보유량에 그대로 남으며, 물리적 반환은 일어나지 않는다.
  main_flow:
  - step: 1. 전원 공급원이 자판기의 전원을 끊는다.
    event: POWER_OFF
  - step: 2. 시스템이 차단 시점에 남아 있던 누적 투입 금액을 미반환 보관액으로 기록한다.
  - step: 3. 시스템이 그 금액에 해당하는 동전을 동전 보유량에 그대로 남긴다.
  - step: 4. 시스템이 누적 투입 금액을 반환하지 않고 종료한다.
  alt_flows:
  - step: 1a. 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우 시스템은 재기동 시 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된
      금액으로 기록한다.
    event: POWER_OFF
  - step: 1b. 1a의 경우 미반환 보관액은 (정전 시점의 누적 투입 금액 − 그 음료 가격)으로 기록된다.
    event: POWER_OFF
  - step: 1c. 전이 완료 보고 전에 전원이 끊긴 경우 시스템은 재기동 시 직전 전이까지의 장부로 복원한다.
    event: POWER_OFF
  - step: 1d. 전원 스위치를 내린 경우에도 정전과 동일하게 미반환 보관액 규칙이 적용된다.
    event: POWER_OFF
  - step: 1e. 차단 시점의 누적 투입 금액이 0인 경우 미반환 보관액은 증가하지 않는다.
    event: POWER_OFF
  acceptance:
  - 누적 700원 상태에서 전원 차단 시 반환구 지급액이 0이다.
  - 전원 차단 후 재기동 시 미반환 보관액이 700원이다.
  - 전원 차단 전후로 액면가별 동전 보유 개수가 동일하다.
  - 전원 스위치 차단과 정전에 대해 미반환 보관액 결과가 동일하다.
  - 누적 1500원·가격 1000원의 배출 개시 후 완료 전 전원 차단 시, 재기동 후 그 음료 재고가 −1, 매출 +1000, 미반환 보관액
    500원이다.
  - 누적 0원 상태에서 전원 차단 시 미반환 보관액이 차단 전과 동일하다.
  - 완료 보고 전에 끊긴 전이의 변경은 재기동 후 장부에 나타나지 않는다.
  requirements:
  - REQ-72
  - REQ-73
  - REQ-74
  - REQ-75
  - REQ-76
  - REQ-79
  - REQ-80
  - REQ-81
  - REQ-91
- id: UC-17
  title: 재기동하여 장부를 복원하고 상태를 판정한다
  actor: 전원 공급원(전원 투입)
  precondition: 자판기가 꺼져 있고 지정된 보관 위치에 장부가 있거나 없다.
  postcondition: 저장된 장부가 복원되고 정전·재기동 규칙이 적용된 뒤, 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태가
    판정된다.
  main_flow:
  - step: 1. 전원 공급원이 자판기에 전원을 투입한다.
    event: POWER_ON
  - step: 2. 시스템이 생성 시 지정된 보관 위치에서 장부(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액,
      지연 배출 기록, 진행 중 배출의 일련번호와 음료, 관리 모드 진입 예약)를 복원한다.
  - step: 3. 시스템이 복원한 장부가 보유량 합계 등식을 만족하는지 검사한다.
  - step: 4. 시스템이 정전·재기동 규칙을 적용해 누적 투입 금액을 0으로 두고 미반환 보관액을 확정한다.
  - step: 5. 시스템이 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태를 판정하고 화면에 누적 투입 금액 0을 표시한다.
  alt_flows:
  - step: 2a. 복원할 장부가 없는 경우 시스템은 초기 장부(재고 0, 동전 0, 보관액 0)로 기동하고 관리자에게 알린다.
    event: POWER_ON
  - step: 3a. 복원한 장부가 일관성 등식을 만족하지 않는 경우 시스템은 초기 장부로 기동하고 관리자에게 알린다.
    event: POWER_ON
  - step: 4a. 저장된 상태 이름이 고장인 경우 시스템은 고장 상태로 기동한다.
    event: POWER_ON
  - step: 4b. 진행 중 배출이 남아 있는 경우 시스템은 그 음료의 재고를 1 차감하고 가격을 매출로 기록한 뒤 미반환 보관액을 확정한다(UC-16).
    event: POWER_ON
  - step: 5a. 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 기동한다.
    event: POWER_ON
  acceptance:
  - 재기동 직후 누적 투입 금액이 0이다.
  - 재기동 후 배출 일련번호의 다음 값이 전원 차단 전 마지막 일련번호보다 크다.
  - 복원된 장부 객체에 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중 배출의 일련번호와
    음료, 관리 모드 진입 예약이 모두 포함된다.
  - 재고 {A:0,B:0,C:0}으로 저장된 장부로 재기동하면 상태 이름이 '판매 중지'이고, 재고 {A:1,...}이면 '판매'이다.
  - 재기동 시 상태 판정에 외부 입력이나 네트워크 호출이 사용되지 않는다.
  - 완료 보고된 전이 직후 전원이 끊긴 경우 재기동 후 장부에 그 전이의 변경이 반영되어 있다.
  - 보관 위치에 파일이 없을 때 재기동하면 재고 합계 0, 동전 보유량 합계 0, 미반환 보관액 0이고 관리자 알림이 1건 발생한다.
  - 보유량 합계 등식을 만족하지 않는 장부로 재기동하면 초기 장부로 기동하고 관리자 알림이 1건 발생한다.
  - 자판기 생성 시 임의의 보관 위치를 인자로 지정할 수 있고, 테스트에서 임시 디렉터리를 지정해 기동할 수 있다.
  - 동작 전 구간에서 외부 네트워크 소켓 연결이 발생하지 않는다.
  - '[모호] 관리자 알림 수단이 명세되어 있지 않아 관리자에게 노출되는 알림 기록 1건 생성으로 판정한다.'
