- id: T-061
  src: AWAITING_DISPENSE_ADMIN_PENDING
  event: DISPENSE_COMPLETE
  dst: ADMIN_MODE
  guard: serial == pendingDispense.serial
  action: commit{ stock(drink) -= 1; sales += price(drink); payout(pendingDispense.change);
    coins := coins - changeCoins; credit -= pendingDispense.change + price(drink);
    payout(credit); coins := coins - refundCoins; credit := 0; pendingDispense :=
    none; adminEntryReserved := false; persist(ledger with stock, sales, coins, credit,
    pendingDispense, adminEntryReserved, savedState = 'ADMIN_MODE') }; display(0)
  usecase: UC-10
  notes: 매출로 잡는 price(drink) 와 거스름돈을 잔액에서 명시적으로 차감한 뒤, 남은 잔액을 고객에게 지급하고 0으로 만들어 관리
    모드로 넘어간다.
- id: T-062
  src: AWAITING_DISPENSE_ADMIN_PENDING
  event: DISPENSE_COMPLETE
  dst: AWAITING_DISPENSE_ADMIN_PENDING
  guard: serial != pendingDispense.serial
  action: 'recordLateDispense(drink, acknowledged: false); persist(ledger with lateDispenses)'
  usecase: UC-07
  notes: ''
- id: T-063
  src: ADMIN_MODE
  event: REPLENISH_STOCK
  dst: ADMIN_MODE
  guard: all(items.drink in registeredDrinks) && all(items.qty is int && items.qty
    >= 1)
  action: 'commit{ for each item: stock(item.drink) += item.qty; persist(ledger with
    stock) }'
  usecase: UC-11
  notes: ''
- id: T-064
  src: ADMIN_MODE
  event: REPLENISH_STOCK
  dst: ADMIN_MODE
  guard: any(items.drink not in registeredDrinks) || any(items.qty is not int || items.qty
    < 1)
  action: rejectAll(); notifyAdmin('replenish_stock_rejected')
  usecase: UC-11
  notes: ''
- id: T-065
  src: ADMIN_MODE
  event: REPLENISH_COIN
  dst: ADMIN_MODE
  guard: all(items.denomination in {100, 500, 1000}) && all(items.qty is int && items.qty
    >= 1)
  action: 'commit{ for each item: coins[item.denomination] += item.qty; persist(ledger
    with coins) }'
  usecase: UC-11
  notes: ''
- id: T-066
  src: ADMIN_MODE
  event: REPLENISH_COIN
  dst: ADMIN_MODE
  guard: any(items.denomination not in {100, 500, 1000}) || any(items.qty is not int
    || items.qty < 1)
  action: rejectAll(); notifyAdmin('replenish_coin_rejected')
  usecase: UC-11
  notes: ''
- id: T-067
  src: ADMIN_MODE
  event: ADJUST_STOCK
  dst: ADMIN_MODE
  guard: drink in registeredDrinks && actual >= 0 && actual <= stock(drink)
  action: commit{ stock(drink) := actual; ackAllLateDispenses(); persist(ledger with
    stock, lateDispenses) }
  usecase: UC-12
  notes: 지연 배출로 생긴 유령 재고를 관리자가 실측값으로 줄이는 경로다.
- id: T-068
  src: ADMIN_MODE
  event: ADJUST_STOCK
  dst: ADMIN_MODE
  guard: drink not in registeredDrinks || actual < 0 || actual > stock(drink)
  action: reject(); notifyAdmin('adjust_stock_rejected')
  usecase: UC-12
  notes: ''
- id: T-069
  src: ADMIN_MODE
  event: VIEW_LEDGER
  dst: ADMIN_MODE
  guard: ''
  action: showAdmin(unreturned, coins, lateDispenses, pendingDispense)
  usecase: UC-13
  notes: 정전으로 회수된 고객 잔액은 unreturned 로 조회되어 관리자가 돌려줄 수 있다.
- id: T-070
  src: ADMIN_MODE
  event: COLLECT_COIN
  dst: ADMIN_MODE
  guard: denomination in {100, 500, 1000} && count is int && count >= 1 && count <=
    coins[denomination] && coinTotal - denomination * count >= unreturned
  action: commit{ coins[denomination] -= count; unreturned -= min(unreturned, denomination
    * count); persist(ledger with coins, unreturned) }
  usecase: UC-13
  notes: ''
- id: T-071
  src: ADMIN_MODE
  event: COLLECT_COIN
  dst: ADMIN_MODE
  guard: denomination not in {100, 500, 1000} || count is not int || count < 1 ||
    count > coins[denomination] || coinTotal - denomination * count < unreturned
  action: reject(); notifyAdmin('collect_coin_rejected')
  usecase: UC-13
  notes: ''
- id: T-072
  src: ADMIN_MODE
  event: ACK_DISPENSE_FAILURE
  dst: ADMIN_MODE
  guard: pendingDispense != none
  action: commit{ pendingDispense := none; faultFlag := false; persist(ledger with
    pendingDispense, faultFlag, savedState = 'ADMIN_MODE') }
  usecase: UC-14
  notes: 고장 해제는 사람만 할 수 있으며, 해제 사실을 저장하면서 savedState 의 FAULT 표시도 함께 지운다.
- id: T-073
  src: ADMIN_MODE
  event: ACK_DISPENSE_FAILURE
  dst: ADMIN_MODE
  guard: pendingDispense == none
  action: notifyAdmin('nothing_to_acknowledge')
  usecase: UC-14
  notes: ''
- id: T-074
  src: ADMIN_MODE
  event: REMOVE_ADMIN_KEY
  dst: FAULT
  guard: pendingDispense != none || faultFlag
  action: faultFlag := true; persist(ledger with faultFlag, savedState = 'FAULT');
    showFaultNotice()
  usecase: UC-14
  notes: '[검사 오탐] ADMIN_MODE 는 잔액을 가질 수 없다 — 잔액을 들고 오는 진입 전이(T-053, T-061)가 진입 전에
    전액 지급하고 credit := 0 으로 만들며, 나머지 진입 전이(T-042, T-054~T-056)의 출발 상태도 잔액이 0 이고, 관리
    모드 중 투입된 코인은 T-020 이 즉시 반환한다.'
- id: T-075
  src: ADMIN_MODE
  event: REMOVE_ADMIN_KEY
  dst: SALE_IDLE
  guard: pendingDispense == none && !faultFlag && anyStock
  action: credit := 0; persist(ledger with credit, savedState = 'SALE_IDLE'); display(0)
  usecase: UC-15
  notes: '[미규정 REQ-51] 관리 모드 종료 조작이 명세되어 있지 않아 전용 키 제거를 종료 조작으로 가정한다. credit := 0
    은 이미 0 인 값을 다시 쓰는 방어적 기록이다.'
- id: T-076
  src: ADMIN_MODE
  event: REMOVE_ADMIN_KEY
  dst: SALE_STOPPED
  guard: pendingDispense == none && !faultFlag && !anyStock
  action: credit := 0; persist(ledger with credit, savedState = 'SALE_STOPPED'); display(0)
  usecase: UC-15
  notes: '[검사 오탐] ADMIN_MODE 는 잔액을 가질 수 없다 — 모든 진입 전이가 잔액을 지급했거나 출발 상태의 잔액이 0 이고 관리
    모드 중 투입 코인은 T-020 이 즉시 반환하므로, 잔액을 든 채 SALE_STOPPED 로 넘어가지 않는다.'
