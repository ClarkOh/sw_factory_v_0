- key: SWF-16
  type: epic
  title: '[UC-16] 전원 차단 시점의 잔액을 미반환 보관액으로 기록한다'
  description: '**액터** 전원 공급원(정전 또는 전원 스위치 차단)

    **사전조건** 자판기에 전원이 들어와 있고 누적 투입 금액이 0 이상이다.

    **사후조건** 차단 시점의 잔액이 미반환 보관액으로 기록되고 해당 동전은 보유량에 그대로 남으며, 물리적 반환은 일어나지 않는다.


    **주 흐름**

    - 1. 전원 공급원이 자판기의 전원을 끊는다.  `[POWER_OFF]`

    - 2. 시스템이 차단 시점에 남아 있던 누적 투입 금액을 미반환 보관액으로 기록한다.

    - 3. 시스템이 그 금액에 해당하는 동전을 동전 보유량에 그대로 남긴다.

    - 4. 시스템이 누적 투입 금액을 반환하지 않고 종료한다.


    **대안/예외 흐름**

    - 1a. 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우 시스템은 재기동 시 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된 금액으로
    기록한다.  `[POWER_OFF]`

    - 1b. 1a의 경우 미반환 보관액은 (정전 시점의 누적 투입 금액 − 그 음료 가격)으로 기록된다.  `[POWER_OFF]`

    - 1c. 전이 완료 보고 전에 전원이 끊긴 경우 시스템은 재기동 시 직전 전이까지의 장부로 복원한다.  `[POWER_OFF]`

    - 1d. 전원 스위치를 내린 경우에도 정전과 동일하게 미반환 보관액 규칙이 적용된다.  `[POWER_OFF]`

    - 1e. 차단 시점의 누적 투입 금액이 0인 경우 미반환 보관액은 증가하지 않는다.  `[POWER_OFF]`


    **인수 조건**

    - 누적 700원 상태에서 전원 차단 시 반환구 지급액이 0이다.

    - 전원 차단 후 재기동 시 미반환 보관액이 700원이다.

    - 전원 차단 전후로 액면가별 동전 보유 개수가 동일하다.

    - 전원 스위치 차단과 정전에 대해 미반환 보관액 결과가 동일하다.

    - 누적 1500원·가격 1000원의 배출 개시 후 완료 전 전원 차단 시, 재기동 후 그 음료 재고가 −1, 매출 +1000, 미반환 보관액
    500원이다.

    - 누적 0원 상태에서 전원 차단 시 미반환 보관액이 차단 전과 동일하다.

    - 완료 보고 전에 끊긴 전이의 변경은 재기동 후 장부에 나타나지 않는다.'
