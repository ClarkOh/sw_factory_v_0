    동전이 물리적으로 반환구에 나간 직후 · 두 번째 저장 전에 전원이 끊기면, 재기동은 첫 저장(반환 전 장부)으로 복원한다. 그 장부에는 이미
    나간 금액이 credit 으로 남아 있고 기동 규칙이 그것을 미반환 보관액으로 접는다. 자판기는 손님에게 이미 준 돈을 ''아직 돌려주지 않은
    돈'' 으로 다시 기록하고, 관리자는 그 금액을 한 번 더 내주게 된다. 동전통에는 그 금액이 없으므로 실사 때 그만큼 비게 된다.


    **제안**

    미완료 반환의 복구 규칙을 요구사항에 명시한다 — ''반환 지시를 저장한 뒤 완료 저장 전에 전원이 끊긴 경우, 재기동 시 자판기는 그 반환을
    미완료 반환으로 관리자에게 알리고 해당 금액을 자동으로 미반환 보관액에 넣지 않는다.'' 그리고 기동 전이가 payout_intent 를 실제로
    읽어 그 규칙을 적용하게 하거나, 규칙을 만들지 않을 것이면 이 필드를 장부에서 제거한다.


