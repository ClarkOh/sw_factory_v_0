- key: SWF-1
  type: epic
  title: '[UC-01] 코인을 투입하여 금액을 누적한다'
  description: '**액터** 고객

    **사전조건** 자판기에 전원이 들어와 있고 장부가 복원되어 있다. 자판기는 동시에 한 명의 고객만 상대하며 다른 고객의 거래가 진행 중이
    아니다.

    **사후조건** 받아들인 코인의 액면가만큼 누적 투입 금액과 해당 액면가의 동전 보유 개수가 각각 증가하고, 갱신된 누적 투입 금액이 화면에
    표시된다.


    **주 흐름**

    - 1. 고객이 코인 투입구에 코인을 넣는다.  `[INSERT_COIN]`

    - 2. 시스템이 코인의 액면가가 100원, 500원, 1000원 중 하나인지 판별한다.

    - 3. 시스템이 코인을 수납하고 해당 액면가의 보유 개수를 1 증가시킨다.

    - 4. 시스템이 코인의 액면가를 누적 투입 금액에 더한다.

    - 5. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.


    **대안/예외 흐름**

    - 2a. 100원·500원·1000원이 아닌 액면가인 경우 시스템은 코인을 즉시 반환하고, 누적 투입 금액과 동전 보유량을 변경하지 않는다.  `[INSERT_COIN]`

    - 2b. 코인 인식에 실패한 경우 시스템은 코인을 그대로 되돌려 보내고, 누적 투입 금액과 동전 보유량을 변경하지 않는다.  `[INSERT_COIN]`

    - 2c. 판매 중지 상태인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.  `[INSERT_COIN]`

    - 2d. 고장 상태인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.  `[INSERT_COIN]`

    - 2e. 관리 모드인 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.  `[INSERT_COIN]`


    **인수 조건**

    - 판매 상태에서 100원 코인 투입 후 누적 투입 금액이 투입 전 값 + 100 이고, 100원 보유 개수가 투입 전 값 + 1 이다.

    - 판매 상태에서 500원, 1000원 코인 투입에 대해서도 각각 동일한 증가가 성립한다.

    - 50원 코인 투입 후 반환구에 50원이 배출되고, 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.

    - 인식 실패 코인 투입 후 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.

    - 판매 중지 상태 / 고장 상태 / 관리 모드에서 1000원 코인 투입 후 코인이 반환되고, 누적 투입 금액과 1000원 보유 개수가 투입
    전과 동일하다.

    - 코인 투입 처리가 끝난 시점에 화면에 표시된 금액이 장부의 누적 투입 금액과 같다.

    - 제어 소프트웨어는 코인 투입구·버튼·배출구·반환 레버를 외부 인터페이스로만 호출하며 하드웨어를 생성하지 않는다.'
