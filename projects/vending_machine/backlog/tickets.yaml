- key: SWF-81
  type: story
  title: '[T-063] ADMIN_MODE --REPLENISH_STOCK--> ADMIN_MODE'
  description: 'FSM 전이 `T-063` 구현


    - 출발: `ADMIN_MODE`

    - 이벤트: `REPLENISH_STOCK`

    - 도착: `ADMIN_MODE`

    - 가드: `all(items.drink in registeredDrinks) && all(items.qty is int && items.qty
    >= 1)`

    - 동작: `commit{ for each item: stock(item.drink) += item.qty; persist(ledger with
    stock) }`


    유스케이스: [UC-11] 관리자가 재고와 동전을 보충한다


    인수 조건:

    - 음료 A에 수량 5의 보충 지시 후 A의 재고가 지시 전 + 5 이다.

    - 500원 액면가에 수량 10의 보충 지시 후 500원 보유 개수가 지시 전 + 10 이다.

    - 등록되지 않은 음료 D를 포함한 {A:3, D:2} 지시 후 A의 재고와 D 관련 값이 모두 지시 전과 동일하고, 거부 알림이 관리자에게
    반환된다.

    - {A:3, B:0} 지시 후 A와 B의 재고가 모두 지시 전과 동일하고 거부 알림이 반환된다.

    - 50원 액면가를 포함한 동전 보충 지시 후 모든 액면가의 보유 개수가 지시 전과 동일하고 거부 알림이 반환된다.

    - 수량 −1을 포함한 동전 보충 지시가 거부되고 보유량이 변경되지 않는다.


    **완료 조건: `test_t_063` 통과**'
