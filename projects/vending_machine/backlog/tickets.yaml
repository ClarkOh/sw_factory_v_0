    - 이벤트: `DISPENSE_COMPLETE`

    - 도착: `SALE_HAS_CREDIT`

    - 가드: `serial == pendingDispense.serial && stockAfter(drink) == 0 && anyStockAfter
    && credit - pendingDispense.change - price(drink) > 0`

    - 동작: `commit{ stock(drink) -= 1; sales += price(drink); payout(pendingDispense.change);
    coins := coins - changeCoins; credit -= pendingDispense.change + price(drink);
    pendingDispense := none; persist(ledger with stock, sales, coins, credit, pendingDispense,
    savedState = ''SALE_HAS_CREDIT'') }; display(credit); resetIdleTimer()`


    유스케이스: [UC-02] 음료를 선택하여 구매한다


    인수 조건:

    - 등록된 음료는 정확히 3종이며 3종의 가격이 서로 다르고, 재고는 음료 종류별 개수로 조회된다.

    - 누적 투입 금액 < 음료 가격이거나 그 음료의 재고가 0이면 해당 버튼의 활성 상태가 false 이다.

    - 누적 투입 금액 >= 음료 가격이고 재고 >= 1 이면 해당 버튼의 활성 상태가 true 이다.

    - 버튼 입력 시각과 배출 개시 시각의 차이가 2초 이하이다.

    - 배출 개시 시점부터 배출 완료 신호 도착 직전까지 누적 투입 금액이 버튼을 누른 시점의 값(그 사이 투입분 포함)과 같고, 재고·매출은
    변경되지 않는다.

    - 누적 1500원, 가격 1000원, 보유 동전에 500원 1개 이상인 상태에서 배출 완료 후: 재고 −1, 매출 +1000, 반환구 지급액
    500, 누적 투입 금액 0 이다.

    - 거스름돈을 구성할 수 없는 상태에서 활성 버튼을 누르면 배출이 개시되지 않고 반환액이 버튼 누른 시점의 누적 투입 금액과 같으며, 재고와
    매출이 변경되지 않는다.

    - 배출 완료 처리 중 어느 시점을 관측해도 재고 차감·매출 기록·거스름돈 지급·누적 금액 차감의 네 변경이 전부 반영된 장부이거나 전부 미반영된
    장부 중 하나이다.

    - 배출 완료 처리 도중 도착한 이벤트는 그 처리가 끝난 뒤에 처리되며, 중간 장부를 관측하지 못한다.

    - 전이 종료 시점의 장부가 보유량 합계 등식을 만족한다.

    - 각 배출 개시마다 부여된 일련번호가 직전 배출의 일련번호보다 크다.


    **완료 조건: `test_t_029` 통과**'
