- key: SWF-5
  type: epic
  title: '[UC-05] 무조작 30초 경과로 투입 금액을 자동 반환한다'
  description: '**액터** 타이머(외부 시각 경과)

    **사전조건** 누적 투입 금액이 0보다 크고, 마지막 코인 투입·음료 선택·반환 레버 조작으로부터 시간이 흐르고 있다.

    **사후조건** 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며 거래가 종료된다.


    **주 흐름**

    - 1. 타이머가 마지막 고객 조작으로부터 30초 경과를 알린다.  `[IDLE_TIMEOUT]`

    - 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.

    - 3. 시스템이 지급에 사용한 동전 개수를 액면가별 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든 뒤 거래를 종료한다.

    - 4. 시스템이 누적 투입 금액 0을 화면에 표시한다.


    **대안/예외 흐름**

    - 1a. 30초가 지나기 전에 코인이 투입된 경우 시스템은 무조작 경과 시간을 0으로 재설정한다.  `[INSERT_COIN]`

    - 1b. 30초가 지나기 전에 음료 선택 버튼이 눌린 경우 시스템은 무조작 경과 시간을 0으로 재설정한다.  `[PRESS_SELECT_BUTTON]`

    - 1c. 30초가 지나기 전에 반환 레버가 조작된 경우 시스템은 UC-04로 전액을 반환한다.  `[PULL_RETURN_LEVER]`

    - 1d. 누적 투입 금액이 0인 상태로 30초가 경과한 경우 시스템은 아무것도 지급하지 않고 장부를 변경하지 않는다.  `[IDLE_TIMEOUT]`


    **인수 조건**

    - 누적 700원 상태에서 29.9초 시점에는 반환이 발생하지 않는다.

    - 누적 700원 상태에서 마지막 조작 후 30초가 경과하면 반환구 지급액이 700원이고 누적 투입 금액이 0이며 거래가 종료된 상태이다.

    - 20초 시점에 코인을 투입하면 그 시점부터 다시 30초가 경과해야 자동 반환이 발생한다.

    - 누적 0원 상태로 30초가 경과해도 지급액이 0이고 장부가 변경되지 않는다.'
