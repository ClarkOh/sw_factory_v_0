- key: SWF-8
  type: epic
  title: '[UC-08] 고장 상태에서 고객 조작을 차단하고 안내한다'
  description: '**액터** 고객

    **사전조건** 자판기가 고장 상태이다.

    **사후조건** 코인이 수납되지 않고 음료가 배출되지 않으며 고장 상태가 유지된다.


    **주 흐름**

    - 1. 시스템이 화면에 고장임을 표시하고 관리자 호출을 안내한다.

    - 2. 고객이 코인을 투입한다.  `[INSERT_COIN]`

    - 3. 시스템이 코인을 받아들이지 않고 그대로 되돌려 보낸다.

    - 4. 고객이 음료 선택 버튼을 누른다.  `[PRESS_SELECT_BUTTON]`

    - 5. 시스템이 모든 선택 버튼을 비활성으로 유지하고 배출을 개시하지 않는다.


    **대안/예외 흐름**

    - 2a. 전원이 차단된 뒤 다시 투입된 경우 시스템은 저장된 고장 상태로 기동하며 고장 상태가 해제되지 않는다.  `[POWER_ON]`

    - 4a. 관리자가 전용 키로 관리 모드에 진입하고 배출 실패를 확인한 경우에만 고장 표시가 해제된다(UC-15).  `[INSERT_ADMIN_KEY]`


    **인수 조건**

    - 고장 상태에서 화면 출력에 고장 표시와 관리자 호출 안내가 모두 포함된다.

    - 고장 상태에서 1000원 투입 후 반환구 지급액이 1000원이고 누적 투입 금액이 0이며 1000원 보유 개수가 투입 전과 동일하다.

    - 고장 상태에서 3종 음료의 선택 버튼 활성 상태가 모두 false 이다.

    - 고장 상태에서 버튼을 눌러도 배출이 개시되지 않고 배출 일련번호가 증가하지 않는다.

    - 고장 상태에서 전원을 껐다 켠 뒤 상태 이름이 여전히 ''고장''이다.

    - 관리자 해제 조작 없이는 상태 이름이 ''고장''에서 변경되지 않는다.'
