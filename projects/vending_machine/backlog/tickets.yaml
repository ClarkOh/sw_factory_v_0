- key: SWF-6
  type: epic
  title: '[UC-06] 배출 실패를 처리하고 고장 상태로 전환한다'
  description: '**액터** 타이머(외부 시각 경과)

    **사전조건** 자판기가 배출을 개시하고 해당 일련번호의 배출 완료 신호를 기다리는 중이다.

    **사후조건** 재고가 차감되지 않은 채 남은 누적 투입 금액 전액이 반환되고 자판기가 고장 상태가 된다.


    **주 흐름**

    - 1. 타이머가 배출 개시 후 10초 경과를 알린다.  `[DISPENSE_TIMEOUT]`

    - 2. 시스템이 그 배출을 배출 실패로 처리하고 재고를 차감하지 않는다.

    - 3. 시스템이 남아 있는 누적 투입 금액 전액을 반환구로 지급하고 누적 투입 금액을 0으로 만든다.

    - 4. 시스템이 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를 표시한다.


    **대안/예외 흐름**

    - 1a. 10초 안에 일치하는 배출 완료 신호가 도착한 경우 시스템은 정상 정산을 수행한다(UC-02).  `[DISPENSE_COMPLETE]`

    - 1b. 배출 실패로 처리한 뒤 배출 완료 신호가 도착한 경우 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다(UC-07).  `[DISPENSE_COMPLETE]`

    - 4a. 관리 모드 진입이 예약된 배출이 실패로 처리된 경우 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다.  `[DISPENSE_TIMEOUT]`


    **인수 조건**

    - 배출 개시 후 10초 동안 완료 신호가 없으면 해당 음료의 재고가 배출 개시 전과 동일하다.

    - 배출 실패 처리 후 매출 합계가 배출 개시 전과 동일하다.

    - 배출 실패 처리 후 반환구 지급액이 실패 시점의 누적 투입 금액과 같고 누적 투입 금액이 0이다.

    - 배출 실패 처리 후 상태 이름이 ''고장''이다.

    - 관리 모드 진입 예약이 있는 상태에서 배출 실패가 발생하면 상태 이력에 ''고장'' 전환 후 ''관리 모드'' 진입이 기록된다.'
