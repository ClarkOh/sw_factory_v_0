- key: SWF-17
  type: epic
  title: '[UC-17] 재기동하여 장부를 복원하고 상태를 판정한다'
  description: '**액터** 전원 공급원(전원 투입)

    **사전조건** 자판기가 꺼져 있고 지정된 보관 위치에 장부가 있거나 없다.

    **사후조건** 저장된 장부가 복원되고 정전·재기동 규칙이 적용된 뒤, 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태가 판정된다.


    **주 흐름**

    - 1. 전원 공급원이 자판기에 전원을 투입한다.  `[POWER_ON]`

    - 2. 시스템이 생성 시 지정된 보관 위치에서 장부(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연
    배출 기록, 진행 중 배출의 일련번호와 음료, 관리 모드 진입 예약)를 복원한다.

    - 3. 시스템이 복원한 장부가 보유량 합계 등식을 만족하는지 검사한다.

    - 4. 시스템이 정전·재기동 규칙을 적용해 누적 투입 금액을 0으로 두고 미반환 보관액을 확정한다.

    - 5. 시스템이 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태를 판정하고 화면에 누적 투입 금액 0을 표시한다.


    **대안/예외 흐름**

    - 2a. 복원할 장부가 없는 경우 시스템은 초기 장부(재고 0, 동전 0, 보관액 0)로 기동하고 관리자에게 알린다.  `[POWER_ON]`

    - 3a. 복원한 장부가 일관성 등식을 만족하지 않는 경우 시스템은 초기 장부로 기동하고 관리자에게 알린다.  `[POWER_ON]`

    - 4a. 저장된 상태 이름이 고장인 경우 시스템은 고장 상태로 기동한다.  `[POWER_ON]`

    - 4b. 진행 중 배출이 남아 있는 경우 시스템은 그 음료의 재고를 1 차감하고 가격을 매출로 기록한 뒤 미반환 보관액을 확정한다(UC-16).  `[POWER_ON]`

    - 5a. 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 기동한다.  `[POWER_ON]`


    **인수 조건**

    - 재기동 직후 누적 투입 금액이 0이다.

    - 재기동 후 배출 일련번호의 다음 값이 전원 차단 전 마지막 일련번호보다 크다.

    - 복원된 장부 객체에 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중 배출의
    일련번호와 음료, 관리 모드 진입 예약이 모두 포함된다.

    - 재고 {A:0,B:0,C:0}으로 저장된 장부로 재기동하면 상태 이름이 ''판매 중지''이고, 재고 {A:1,...}이면 ''판매''이다.

    - 재기동 시 상태 판정에 외부 입력이나 네트워크 호출이 사용되지 않는다.

    - 완료 보고된 전이 직후 전원이 끊긴 경우 재기동 후 장부에 그 전이의 변경이 반영되어 있다.

    - 보관 위치에 파일이 없을 때 재기동하면 재고 합계 0, 동전 보유량 합계 0, 미반환 보관액 0이고 관리자 알림이 1건 발생한다.

    - 보유량 합계 등식을 만족하지 않는 장부로 재기동하면 초기 장부로 기동하고 관리자 알림이 1건 발생한다.

    - 자판기 생성 시 임의의 보관 위치를 인자로 지정할 수 있고, 테스트에서 임시 디렉터리를 지정해 기동할 수 있다.

    - 동작 전 구간에서 외부 네트워크 소켓 연결이 발생하지 않는다.

    - [모호] 관리자 알림 수단이 명세되어 있지 않아 관리자에게 노출되는 알림 기록 1건 생성으로 판정한다.'
