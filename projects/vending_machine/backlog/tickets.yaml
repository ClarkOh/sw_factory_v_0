- key: SWF-4
  type: epic
  title: '[UC-04] 반환 레버로 투입 금액을 돌려받는다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고 누적 투입 금액이 0보다 크다.

    **사후조건** 누적 투입 금액 전액이 반환되고 누적 투입 금액이 0이 되며, 지급에 사용한 동전 개수만큼 액면가별 보유 개수가 차감된다.


    **주 흐름**

    - 1. 고객이 반환 레버를 조작한다.  `[PULL_RETURN_LEVER]`

    - 2. 시스템이 누적 투입 금액 전액을 반환구로 지급한다.

    - 3. 시스템이 지급에 사용한 동전 개수를 액면가별 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든다.

    - 4. 시스템이 누적 투입 금액 0을 화면에 표시한다.


    **대안/예외 흐름**

    - 1a. 누적 투입 금액이 0인 상태에서 반환 레버가 조작된 경우 시스템은 아무것도 지급하지 않고 장부를 변경하지 않는다.  `[PULL_RETURN_LEVER]`

    - 1b. 고장 상태 또는 관리 모드에서 반환 레버가 조작된 경우 시스템은 지급하지 않고 장부를 변경하지 않는다.  `[PULL_RETURN_LEVER]`

    - 3a. 반환 결과가 보유량 합계 등식을 만족하지 않는 경우 시스템은 전이를 커밋하지 않고 거부한다.


    **인수 조건**

    - 누적 1500원(1000원 1개, 500원 1개 투입) 상태에서 반환 레버 조작 후 반환구 지급액이 1500원이고 누적 투입 금액이 0이다.

    - 반환 후 지급에 사용한 액면가별 동전 개수만큼 보유 개수가 감소한다.

    - 누적 0원 상태에서 반환 레버 조작 후 지급액이 0이고 동전 보유량이 조작 전과 동일하다.

    - 반환 완료 시점의 장부가 보유량 합계 등식을 만족한다.'
