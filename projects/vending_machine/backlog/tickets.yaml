- key: SWF-29
  type: story
  title: '[T-012] SALE_IDLE --INSERT_COIN--> SALE_HAS_CREDIT'
  description: 'FSM 전이 `T-012` 구현


    - 출발: `SALE_IDLE`

    - 이벤트: `INSERT_COIN`

    - 도착: `SALE_HAS_CREDIT`

    - 가드: `recognized && denomination in {100, 500, 1000}`

    - 동작: `coins[denomination] += 1; credit += denomination; persist(ledger with coins,
    credit, savedState = ''SALE_HAS_CREDIT''); display(credit); resetIdleTimer()`


    유스케이스: [UC-01] 코인을 투입하여 금액을 누적한다


    인수 조건:

    - 판매 상태에서 100원 코인 투입 후 누적 투입 금액이 투입 전 값 + 100 이고, 100원 보유 개수가 투입 전 값 + 1 이다.

    - 판매 상태에서 500원, 1000원 코인 투입에 대해서도 각각 동일한 증가가 성립한다.

    - 50원 코인 투입 후 반환구에 50원이 배출되고, 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.

    - 인식 실패 코인 투입 후 누적 투입 금액과 모든 액면가의 보유 개수가 투입 전과 동일하다.

    - 판매 중지 상태 / 고장 상태 / 관리 모드에서 1000원 코인 투입 후 코인이 반환되고, 누적 투입 금액과 1000원 보유 개수가 투입
    전과 동일하다.

    - 코인 투입 처리가 끝난 시점에 화면에 표시된 금액이 장부의 누적 투입 금액과 같다.

    - 제어 소프트웨어는 코인 투입구·버튼·배출구·반환 레버를 외부 인터페이스로만 호출하며 하드웨어를 생성하지 않는다.


    **완료 조건: `test_t_012` 통과**'
