- key: SWF-3
  type: epic
  title: '[UC-03] 배출 진행 중에 다음 구매를 위한 코인을 투입한다'
  description: '**액터** 고객

    **사전조건** 자판기가 배출을 개시하고 배출 완료 신호를 기다리는 중이다.

    **사후조건** 배출 중 투입된 금액은 진행 중인 배출의 거스름돈에 포함되지 않고, 배출 완료 정산 후 누적 투입 금액으로 남는다.


    **주 흐름**

    - 1. 고객이 배출이 진행되는 동안 코인을 투입한다.  `[INSERT_COIN]`

    - 2. 시스템이 코인을 수납하고 해당 액면가의 보유 개수를 1 증가시킨 뒤 누적 투입 금액에 더한다.

    - 3. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다.

    - 4. 배출 장치가 배출 완료 신호를 보낸다.  `[DISPENSE_COMPLETE]`

    - 5. 시스템이 버튼을 누른 시점의 거스름돈 금액만 지급하고, 배출 중 투입된 금액은 누적 투입 금액으로 남긴다.


    **대안/예외 흐름**

    - 4a. 배출이 실패로 처리된 경우 시스템은 배출 중 투입분을 포함한 남은 누적 투입 금액 전액을 반환한다.  `[DISPENSE_TIMEOUT]`

    - 4b. 관리 모드 진입이 예약된 상태로 배출이 완료된 경우 시스템은 배출 중 투입된 금액만 반환한다(UC-10).  `[DISPENSE_COMPLETE]`


    **인수 조건**

    - 누적 1000원, 가격 1000원으로 버튼을 누른 뒤 배출 중 500원을 투입하고 배출이 완료되면 지급된 거스름돈이 0원이다.

    - 동일 시나리오에서 배출 완료 후 누적 투입 금액이 500원이다.

    - 배출 중 투입한 500원에 대해 500원 보유 개수가 투입 전보다 1 크다.

    - 배출 완료 후 남은 누적 투입 금액 500원으로 가격 500원 이하의 음료 버튼이 활성화된다.'
