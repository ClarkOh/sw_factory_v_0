- key: SWF-12
  type: epic
  title: '[UC-12] 관리자가 재고를 실제 개수에 맞춰 조정한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 조정값이 유효하면 해당 음료의 장부 재고가 조정값이 되고 지연 배출 기록이 확인 완료로 표시되며, 유효하지 않으면 재고가 변경되지
    않는다.


    **주 흐름**

    - 1. 관리자가 음료 종류와 실제 개수를 지정해 재고 조정을 지시한다.  `[ADJUST_STOCK]`

    - 2. 시스템이 조정값이 0 이상이고 현재 장부 재고 이하인지 검증한다.

    - 3. 시스템이 해당 음료의 장부 재고를 조정값으로 변경한다.

    - 4. 시스템이 지연 배출 기록을 관리자가 확인한 것으로 표시한다.


    **대안/예외 흐름**

    - 2a. 조정값이 0 미만인 경우 시스템은 지시를 거부하고 재고를 변경하지 않는다.  `[ADJUST_STOCK]`

    - 2b. 조정값이 현재 장부 재고보다 큰 경우 시스템은 지시를 거부하고 재고를 변경하지 않는다.  `[ADJUST_STOCK]`

    - 2c. 등록되지 않은 음료가 지정된 경우 시스템은 지시를 거부하고 관리자에게 알린다.  `[ADJUST_STOCK]`


    **인수 조건**

    - 장부 재고 7인 음료를 5로 조정하면 그 음료의 재고가 5이다.

    - 장부 재고 7인 음료를 8로 조정하면 거부되고 재고가 7로 유지된다.

    - 장부 재고 7인 음료를 −1로 조정하면 거부되고 재고가 7로 유지된다.

    - 조정 성공 후 모든 지연 배출 기록의 확인 여부가 확인 완료이다.

    - 조정이 거부된 경우 지연 배출 기록의 확인 여부가 변경되지 않는다.'
