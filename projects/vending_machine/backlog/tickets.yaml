- key: SWF-2
  type: epic
  title: '[UC-02] 음료를 선택하여 구매한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고, 누적 투입 금액이 가격 이상이며 재고가 1 이상인 음료가 하나 이상 존재하여 해당 음료의 선택 버튼이
    활성화되어 있다.

    **사후조건** 배출 완료 신호를 받은 경우 해당 음료의 재고가 1 차감되고, 음료 가격이 매출로 기록되며, 거스름돈이 지급되고, (거스름돈
    + 음료 가격)이 누적 투입 금액에서 차감된 상태로 거래가 종료된다.


    **주 흐름**

    - 1. 고객이 활성화된 음료 선택 버튼을 누른다.  `[PRESS_SELECT_BUTTON]`

    - 2. 시스템이 (누적 투입 금액 − 음료 가격)을 거스름돈 금액으로 계산하고, 보유 동전으로 그 금액을 구성할 수 있는지 확인한다.

    - 3. 시스템이 이 배출에 일련번호를 부여하고, 버튼 입력 후 2초 이내에 배출을 개시한다.

    - 4. 배출 장치가 해당 일련번호의 배출 완료 신호를 보낸다.  `[DISPENSE_COMPLETE]`

    - 5. 시스템이 재고 1 차감, 음료 가격의 매출 기록, 거스름돈 지급, 누적 투입 금액에서 (거스름돈 + 음료 가격) 차감을 하나의 장부
    트랜잭션으로 반영한다.

    - 6. 시스템이 남은 누적 투입 금액을 화면에 표시한다.


    **대안/예외 흐름**

    - 1a. 비활성 버튼(누적 투입 금액 < 가격 또는 재고 0)이 눌린 경우 시스템은 배출을 개시하지 않고 상태·재고·금액을 변경하지 않는다.  `[PRESS_SELECT_BUTTON]`

    - 2a. 보유 동전으로 거스름돈 금액을 구성할 수 없는 경우 시스템은 배출을 개시하지 않고 누적 투입 금액 전액을 반환한 뒤 거래를 종료한다.  `[PRESS_SELECT_BUTTON]`

    - 4a. 배출 완료 전에 코인이 투입된 경우 시스템은 그 코인을 수납해 누적 투입 금액에 더하되 진행 중인 배출의 거스름돈에는 포함하지 않는다.  `[INSERT_COIN]`

    - 4b. 배출 개시 후 10초 안에 배출 완료 신호를 받지 못한 경우 시스템은 배출 실패로 처리한다(UC-06).  `[DISPENSE_TIMEOUT]`

    - 4c. 기다리는 일련번호와 일치하지 않는 배출 완료 신호가 도착한 경우 시스템은 그 신호를 무효로 처리하고 지연 배출로 기록한다(UC-07).  `[DISPENSE_COMPLETE]`

    - 5a. 반영 결과가 동전 보유량 합계 등식을 만족하지 않는 경우 시스템은 트랜잭션을 커밋하지 않고 전이를 거부한다.


    **인수 조건**

    - 등록된 음료는 정확히 3종이며 3종의 가격이 서로 다르고, 재고는 음료 종류별 개수로 조회된다.

    - 누적 투입 금액 < 음료 가격이거나 그 음료의 재고가 0이면 해당 버튼의 활성 상태가 false 이다.

    - 누적 투입 금액 >= 음료 가격이고 재고 >= 1 이면 해당 버튼의 활성 상태가 true 이다.

    - 버튼 입력 시각과 배출 개시 시각의 차이가 2초 이하이다.

    - 배출 개시 시점부터 배출 완료 신호 도착 직전까지 누적 투입 금액이 버튼을 누른 시점의 값(그 사이 투입분 포함)과 같고, 재고·매출은
    변경되지 않는다.

    - 누적 1500원, 가격 1000원, 보유 동전에 500원 1개 이상인 상태에서 배출 완료 후: 재고 −1, 매출 +1000, 반환구 지급액
    500, 누적 투입 금액 0 이다.

    - 거스름돈을 구성할 수 없는 상태에서 활성 버튼을 누르면 배출이 개시되지 않고 반환액이 버튼 누른 시점의 누적 투입 금액과 같으며, 재고와
    매출이 변경되지 않는다.

    - 배출 완료 처리 중 어느 시점을 관측해도 재고 차감·매출 기록·거스름돈 지급·누적 금액 차감의 네 변경이 전부 반영된 장부이거나 전부 미반영된
    장부 중 하나이다.

    - 배출 완료 처리 도중 도착한 이벤트는 그 처리가 끝난 뒤에 처리되며, 중간 장부를 관측하지 못한다.

    - 전이 종료 시점의 장부가 보유량 합계 등식을 만족한다.

    - 각 배출 개시마다 부여된 일련번호가 직전 배출의 일련번호보다 크다.'
