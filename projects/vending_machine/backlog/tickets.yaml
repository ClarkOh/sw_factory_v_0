  type: story
  title: '[T-030] AWAITING_DISPENSE --DISPENSE_COMPLETE--> SALE_STOPPED'
  description: 'FSM 전이 `T-030` 구현


    - 출발: `AWAITING_DISPENSE`

    - 이벤트: `DISPENSE_COMPLETE`

    - 도착: `SALE_STOPPED`

    - 가드: `serial == pendingDispense.serial && !anyStockAfter`

    - 동작: `commit{ stock(drink) -= 1; sales += price(drink); payout(pendingDispense.change);
    coins := coins - changeCoins; credit -= pendingDispense.change + price(drink);
    payout(credit); coins := coins - refundCoins; credit := 0; pendingDispense :=
    none; persist(ledger with stock, sales, coins, credit, pendingDispense, savedState
    = ''SALE_STOPPED'') }; display(0)`


    유스케이스: [UC-15] 관리 모드를 종료하고 판매 가능 여부에 따라 상태를 정한다


    인수 조건:

    - 재고 {A:2, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 ''판매''이다.

    - 재고 {A:0, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 ''판매 중지''이다.

    - 판매 중지 상태에서 500원 투입 후 반환구 지급액이 500원이고 누적 투입 금액이 0이며 500원 보유 개수가 변하지 않는다.

    - 마지막 재고 1개가 판매 완료된 직후 상태 이름이 ''판매 중지''이다.

    - [모호] 관리 모드 종료(보충 완료) 시점의 판정 조작이 명세되어 있지 않아 전용 키 제거를 종료 조작으로 가정한다.


    **완료 조건: `test_t_030` 통과**'
