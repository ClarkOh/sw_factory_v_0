- key: SWF-11
  type: epic
  title: '[UC-11] 관리자가 재고와 동전을 보충한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 지시가 유효하면 지정한 음료의 재고와 지정한 액면가의 동전 보유 개수가 지시한 수량만큼 증가하고, 유효하지 않으면 어떤 값도
    변경되지 않는다.


    **주 흐름**

    - 1. 관리자가 음료 종류와 수량을 지정해 재고 보충을 지시한다.  `[REPLENISH_STOCK]`

    - 2. 시스템이 대상이 등록된 3종 음료에 속하고 수량이 1 이상의 정수인지 검증한다.

    - 3. 시스템이 지정한 음료의 재고를 지시한 수량만큼 증가시킨다.

    - 4. 관리자가 액면가와 수량을 지정해 동전 보충을 지시한다.  `[REPLENISH_COIN]`

    - 5. 시스템이 액면가가 100원·500원·1000원 중 하나이고 수량이 1 이상의 정수인지 검증한다.

    - 6. 시스템이 해당 액면가의 보유 개수를 지시한 수량만큼 증가시킨다.


    **대안/예외 흐름**

    - 2a. 등록되지 않은 음료가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.  `[REPLENISH_STOCK]`

    - 2b. 수량이 0 이하이거나 정수가 아닌 항목이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.  `[REPLENISH_STOCK]`

    - 5a. 100원·500원·1000원이 아닌 액면가가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.  `[REPLENISH_COIN]`

    - 5b. 수량이 0 이하인 항목이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.  `[REPLENISH_COIN]`


    **인수 조건**

    - 음료 A에 수량 5의 보충 지시 후 A의 재고가 지시 전 + 5 이다.

    - 500원 액면가에 수량 10의 보충 지시 후 500원 보유 개수가 지시 전 + 10 이다.

    - 등록되지 않은 음료 D를 포함한 {A:3, D:2} 지시 후 A의 재고와 D 관련 값이 모두 지시 전과 동일하고, 거부 알림이 관리자에게
    반환된다.

    - {A:3, B:0} 지시 후 A와 B의 재고가 모두 지시 전과 동일하고 거부 알림이 반환된다.

    - 50원 액면가를 포함한 동전 보충 지시 후 모든 액면가의 보유 개수가 지시 전과 동일하고 거부 알림이 반환된다.

    - 수량 −1을 포함한 동전 보충 지시가 거부되고 보유량이 변경되지 않는다.'
