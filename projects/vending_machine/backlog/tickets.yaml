    관리자가 매출로 쌓인 동전만 회수해도 미반환 보관액 기록이 함께 0 이 된다. 정전으로 고객이 잃은 700 원이 장부 어디에도 남지 않아,
    그 고객이 뒤늦게 돌려달라고 해도 근거가 없고 회계상으로도 매출과 구분되지 않는다. 반대 해석(보관액은 관리자가 명시적으로 회수 처리할 때에만
    줄어든다)을 택했다면 지금 통과하는 테스트가 그대로 틀린 명세를 굳힌 셈이다.


