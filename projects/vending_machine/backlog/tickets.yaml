    - 이벤트: `DISPENSE_COMPLETE`

    - 도착: `SALE_HAS_CREDIT`

    - 가드: `serial == pendingDispense.serial && credit - pendingDispense.change - price(drink)
    > 0 && stockAfter(drink) >= 1`

