  title: '[T-059] AWAITING_DISPENSE_ADMIN_PENDING --INSERT_COIN--> AWAITING_DISPENSE_ADMIN_PENDING'
  description: 'FSM 전이 `T-059` 구현


    - 출발: `AWAITING_DISPENSE_ADMIN_PENDING`

    - 이벤트: `INSERT_COIN`

    - 도착: `AWAITING_DISPENSE_ADMIN_PENDING`

    - 가드: `recognized && denomination not in {100, 500, 1000}`

    - 동작: `returnCoin(denomination)`


    유스케이스: [UC-10] 배출 완료 대기 중 관리 모드 진입을 예약한다


    인수 조건:

    - 배출 대기 중 전용 키를 꽂으면 장부의 관리 모드 진입 예약 값이 참이다.

    - 예약 직후 상태 이름이 아직 ''관리 모드''가 아니며 배출 대기가 유지된다.

    - 누적 1500원·가격 1000원으로 개시한 배출 중 500원을 추가 투입하고 완료 신호가 도착하면: 매출 +1000, 재고 −1, 거스름돈
    500원 지급, 추가 반환 500원, 누적 투입 금액 0, 상태 이름 ''관리 모드''이다.

    - 예약된 배출이 실패하면 상태 이력이 ''고장'' → ''관리 모드'' 순서로 기록된다.


    **완료 조건: `test_t_059` 통과**'
