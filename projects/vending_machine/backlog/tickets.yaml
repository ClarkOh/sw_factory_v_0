- key: SWF-9
  type: epic
  title: '[UC-09] 관리자가 전용 키로 관리 모드에 진입한다'
  description: '**액터** 관리자

    **사전조건** 자판기에 전원이 들어와 있고 배출 완료를 기다리는 중이 아니다.

    **사후조건** 누적 투입 금액이 0이 된 상태로 자판기가 관리 모드가 된다.


    **주 흐름**

    - 1. 관리자가 전용 키를 꽂는다.  `[INSERT_ADMIN_KEY]`

    - 2. 시스템이 누적 투입 금액이 남아 있는지 확인한다.

    - 3. 시스템이 남아 있는 누적 투입 금액 전액을 반환하고 누적 투입 금액을 0으로 만든다.

    - 4. 시스템이 관리 모드로 전환한다.


    **대안/예외 흐름**

    - 1a. 고장 상태에서 전용 키가 꽂힌 경우에도 시스템은 관리 모드로 전환한다.  `[INSERT_ADMIN_KEY]`

    - 1b. 배출 완료를 기다리는 중에 전용 키가 꽂힌 경우 시스템은 관리 모드 진입을 예약한다(UC-10).  `[INSERT_ADMIN_KEY]`

    - 2a. 누적 투입 금액이 0인 경우 시스템은 반환 없이 관리 모드로 전환한다.  `[INSERT_ADMIN_KEY]`

    - 3a. 관리 모드에서 코인이 투입된 경우 시스템은 수납하지 않고 그대로 반환한다.  `[INSERT_COIN]`


    **인수 조건**

    - 누적 800원 상태에서 전용 키 진입 시 반환구 지급액이 800원이고, 관리 모드 진입 시점의 누적 투입 금액이 0이다.

    - 누적 0원 상태에서 전용 키 진입 시 지급액이 0이고 상태 이름이 ''관리 모드''이다.

    - 고장 상태에서 전용 키 진입 후 상태 이름이 ''관리 모드''이다.

    - 관리 모드 진입 완료 시점의 장부가 보유량 합계 등식을 만족한다.'
