- key: SWF-326
  type: bug
  title: '[검토/high] 30 초 · 10 초 · 2 초 시한을 재는 주체가 없고 어떤 테스트도 시간을 재지 않는다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    IDLE_TIMER_SECONDS = 30 과 DISPENSE_TIMER_SECONDS = 10 은 상수로만 있고(app/vending_machine.py:36-37),
    idle_timer 는 reset_idle_timer() 가 30 으로 되감기만 할 뿐(627-629) 어디에서도 줄어들거나 읽히지 않는 쓰기
    전용 값이다. DISPENSE_TIMER_SECONDS 는 상수 정의 외에 참조가 0 건이다. IDLE_TIMEOUT · DISPENSE_TIMEOUT
    은 외부에서 주입되는 이벤트로만 존재하고, 이를 만들어 내는 코드가 app/ 안에 없다. UC-05 acceptance 의 ''29.9 초
    시점에는 반환이 발생하지 않는다'' 와 ''20 초 시점에 코인을 투입하면 그 시점부터 다시 30 초'' 는 tests/e2e/test_scenarios.py:463-466
    에서 ''경과를 알리는 이벤트가 오지 않는 동안에는 반환이 일어나지 않는다'' 로 바뀌어 있다 — 이벤트를 쏘지 않았으니 아무 일도 없다는
    동어반복이다. REQ-71(2 초)에 대응하는 시간 측정은 저장소 전체에 없다(time 참조는 Windows 파일 잠금 재시도용 sleep
    한 곳뿐).


    **영향**

    REQ-01 이 이미 있다고 전제한 하드웨어는 코인 투입구 · 버튼 · 배출구 · 반환 레버뿐이고 타이머는 거기 없다. 그러므로 이 시한을
    재는 것은 제어 소프트웨어의 몫인데 아무도 재지 않는다. 현장에서는 REQ-32 의 자동 반환이 영원히 일어나지 않아 고객이 자리를 뜨면 돈이
    기계 안에 남고, REQ-33 의 배출 실패 감지도 영원히 일어나지 않아 배출 기구가 고장 나면 자판기가 고객 돈을 문 채 AWAITING_DISPENSE
    에서 무한히 멈춘다 — 이 자리에서는 반환 레버(T-048)마저 무시된다.


    **제안**

