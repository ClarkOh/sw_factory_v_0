- key: SWF-7
  type: epic
  title: '[UC-07] 무효한 배출 완료 신호를 지연 배출로 기록한다'
  description: '**액터** 배출 장치

    **사전조건** 자판기가 기다리는 배출 일련번호가 없거나, 도착한 신호의 일련번호가 기다리는 일련번호와 다르다.

    **사후조건** 상태·재고·금액이 변경되지 않고, 해당 음료 종류와 함께 지연 배출 기록이 장부에 남는다.


    **주 흐름**

    - 1. 배출 장치가 배출 완료 신호를 보낸다.  `[DISPENSE_COMPLETE]`

    - 2. 시스템이 신호의 일련번호를 현재 기다리는 일련번호와 대조한다.

    - 3. 시스템이 일치하지 않음을 확인하고 그 신호를 무효로 처리한다.

    - 4. 시스템이 신호에 담긴 음료 종류와 함께 지연 배출 기록을 장부에 남긴다.


    **대안/예외 흐름**

    - 2a. 일련번호가 일치하는 경우 시스템은 정상 정산을 수행한다(UC-02).  `[DISPENSE_COMPLETE]`

    - 3a. 배출 실패로 처리한 뒤 도착한 신호인 경우 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다.  `[DISPENSE_COMPLETE]`

    - 4a. 지연 배출 기록은 관리자가 재고를 조정할 때까지 미확인 상태로 유지된다.


    **인수 조건**

    - 기다리는 일련번호가 N일 때 일련번호 N−1의 완료 신호를 보내면 재고·매출·누적 투입 금액·동전 보유량·상태 이름이 신호 전과 동일하다.

    - 무효 신호 처리 후 지연 배출 기록이 1건 추가되고 그 기록의 음료 종류가 신호에 담긴 음료 종류와 같다.

    - 배출 실패 처리 후 도착한 완료 신호에 대해서도 재고가 차감되지 않고 지연 배출 기록이 1건 추가된다.

    - 새로 추가된 지연 배출 기록의 확인 여부가 미확인이다.'
