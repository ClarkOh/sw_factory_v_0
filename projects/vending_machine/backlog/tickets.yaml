- key: SWF-324
  type: bug
  title: '[검토/high] 배출 중 정전 시 재고 1 차감 · 매출 기록 · 차액 보관 규칙이 구현에도 테스트에도 없다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    REQ-79 · REQ-80 · REQ-81 은 배출 개시 후 완료 전 전원이 끊기면 재기동 시 재고를 1 차감하고 음료 가격을 매출로 잡고
    미반환 보관액을 (정전 시점 누적 금액 − 음료 가격)으로 잡으라고 한다. 구현의 settle_pending_dispense() 는 app/vending_machine.py:364-375
    에서 pending 이 None 이면 return 할 뿐 본문이 비어 있고, mark_dispense_failed() (같은 파일 377-392)
    는 docstring 만 있는 빈 함수다. _action_t002(695-702) 는 fold_credit_into_deposit() 으로
    누적 금액 전액을 보관액에 접는다. e2e 테스트 tests/e2e/test_scenarios.py:938-957 은 이 어긋남을 주석으로
    인정한 뒤(941-944행) 요구사항과 반대인 값을 단언한다 — stock == STOCK, sales == 0, deposit == 1500.


    **영향**

    실물이 이미 배출구로 나갔을 가능성이 높은 음료가 장부에는 팔리지 않은 것으로 남는다. 관리자는 고객 잔액 1500 원 전액을 보관액으로 보고
    돌려주게 되어 음료 값 1000 원을 그대로 손해 보고, 장부 재고는 실물보다 1 많은 유령 재고가 되어 다음 고객이 없는 음료를 살 수 있다.
    이 손실은 정전 한 번마다 반복된다.


    **제안**

    구현을 FSM 에 맞출지 요구사항에 맞출지를 먼저 정할 것. 요구사항이 맞다면 T-002 의 settlePendingDispense() 를
    명세대로 채우고(재고 −1 · sales += price · deposit += credit − price · credit := 0) 그 값을
    단언하는 테스트로 바꾼다. FSM 쪽이 맞다면 requirements.md 의 요구사항 24 를 다음 문장으로 고쳐야 한다 — ''배출을 개시한
    뒤 완료 전에 전원이 끊긴 경우, 재기동 시 그 배출을 실패로 보아 재고와 매출을 건드리지 않고 고장 상태로 기동하며, 관리자가 실물을 확인해
    재고를 조정한다. 누적 투입 금액 전액은 미반환 보관액으로 잡는다.''


    **참조** REQ-79, REQ-80, REQ-81, T-002, UC-16, tests/e2e/test_scenarios.py::test_uc16_power_cut_during_dispense_settles_on_reboot


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
