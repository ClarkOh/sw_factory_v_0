- key: SWF-13
  type: epic
  title: '[UC-13] 관리자가 동전과 미반환 보관액을 회수한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 회수 지시가 유효하면 액면가별 보유 개수가 회수 개수만큼 차감되고, 보유량 합계를 미반환 보관액 미만으로 낮추는 지시는 거부되어
    보유량이 유지된다.


    **주 흐름**

    - 1. 관리자가 미반환 보관액과 액면가별 동전 보유량 조회를 요청한다.  `[VIEW_LEDGER]`

    - 2. 시스템이 미반환 보관액과 액면가별 보유 개수를 관리자에게 표시한다.

    - 3. 관리자가 액면가와 회수 개수를 지정해 회수를 지시한다.  `[COLLECT_COIN]`

    - 4. 시스템이 회수 개수가 1 이상의 정수이고 액면가가 100원·500원·1000원 중 하나이며, 회수 후 보유량 합계가 미반환 보관액
    이상인지 검증한다.

    - 5. 시스템이 해당 액면가의 보유 개수를 회수 개수만큼 차감하고 회수 금액만큼 미반환 보관액을 정리한다.


    **대안/예외 흐름**

    - 4a. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우 시스템은 지시를 거부하고 보유량을 변경하지 않는다.  `[COLLECT_COIN]`

    - 4b. 회수 개수가 0 이하이거나 등록되지 않은 액면가가 포함된 경우 시스템은 지시 전체를 거부하고 관리자에게 알린다.  `[COLLECT_COIN]`

    - 4c. 보유 개수보다 많은 개수를 회수하려는 경우 시스템은 지시를 거부하고 보유량을 변경하지 않는다.  `[COLLECT_COIN]`

    - 5a. 회수 결과가 보유량 합계 등식을 만족하지 않는 경우 시스템은 전이를 커밋하지 않고 거부한다.


    **인수 조건**

    - 관리 모드 조회 응답에 미반환 보관액과 100원·500원·1000원 각각의 보유 개수가 포함된다.

    - 500원 보유 10개 상태에서 500원 3개 회수 후 500원 보유 개수가 7이다.

    - 보유량 합계 2000원, 미반환 보관액 1500원인 상태에서 1000원 1개 회수 지시가 거부되고 보유 개수가 변경되지 않는다.

    - 회수 개수 0 또는 −1 지시가 거부되고 보유량이 변경되지 않는다.

    - 회수 완료 시점의 장부가 보유량 합계 등식을 만족한다.

    - 동전 보유량은 코인 수납, 지급(거스름돈·반환), 보충, 회수 이외의 경로로는 변경되지 않는다.'
