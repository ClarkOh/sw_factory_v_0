  type: story
  title: '[T-040] AWAITING_DISPENSE --DISPENSE_TIMEOUT--> FAULT'
  description: 'FSM 전이 `T-040` 구현


    - 출발: `AWAITING_DISPENSE`

    - 이벤트: `DISPENSE_TIMEOUT`

    - 도착: `FAULT`

    - 가드: `serial == pendingDispense.serial`

    - 동작: `markDispenseFailed(pendingDispense); faultFlag := true; persist(ledger
    with pendingDispense, faultFlag, savedState = ''FAULT''); commit{ payout(credit);
    coins := coins - refundCoins; credit := 0; persist(ledger with coins, credit)
    }; showFaultNotice(); display(0)`


    유스케이스: [UC-06] 배출 실패를 처리하고 고장 상태로 전환한다


    인수 조건:

    - 배출 개시 후 10초 동안 완료 신호가 없으면 해당 음료의 재고가 배출 개시 전과 동일하다.

    - 배출 실패 처리 후 매출 합계가 배출 개시 전과 동일하다.

    - 배출 실패 처리 후 반환구 지급액이 실패 시점의 누적 투입 금액과 같고 누적 투입 금액이 0이다.

    - 배출 실패 처리 후 상태 이름이 ''고장''이다.

    - 관리 모드 진입 예약이 있는 상태에서 배출 실패가 발생하면 상태 이력에 ''고장'' 전환 후 ''관리 모드'' 진입이 기록된다.


