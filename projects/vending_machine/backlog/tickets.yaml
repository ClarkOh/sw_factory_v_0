- key: SWF-10
  type: epic
  title: '[UC-10] 배출 완료 대기 중 관리 모드 진입을 예약한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 배출을 개시하고 해당 일련번호의 배출 완료 신호를 기다리는 중이다.

    **사후조건** 배출이 완료된 직후 자판기가 관리 모드로 전환되고, 이미 개시된 배출의 음료 가격은 판매로 확정되며 배출 중 투입된 금액만
    반환된다.


    **주 흐름**

    - 1. 관리자가 배출 완료 대기 중에 전용 키를 꽂는다.  `[INSERT_ADMIN_KEY]`

    - 2. 시스템이 관리 모드 진입 예약을 장부에 기록하고 배출을 계속 기다린다.

    - 3. 배출 장치가 해당 일련번호의 배출 완료 신호를 보낸다.  `[DISPENSE_COMPLETE]`

    - 4. 시스템이 그 음료의 재고를 1 차감하고 음료 가격을 판매로 확정하며 거스름돈을 지급한다.

    - 5. 시스템이 배출 중 투입된 금액만 반환하고 누적 투입 금액을 0으로 만든다.

    - 6. 시스템이 관리 모드로 전환한다.


    **대안/예외 흐름**

    - 3a. 예약된 배출이 10초 내 완료되지 않아 실패로 처리된 경우 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다.  `[DISPENSE_TIMEOUT]`

    - 3b. 예약 상태에서 코인이 투입된 경우 시스템은 수납해 누적 투입 금액에 더하고, 그 금액은 배출 완료 후 반환 대상이 된다.  `[INSERT_COIN]`


    **인수 조건**

    - 배출 대기 중 전용 키를 꽂으면 장부의 관리 모드 진입 예약 값이 참이다.

    - 예약 직후 상태 이름이 아직 ''관리 모드''가 아니며 배출 대기가 유지된다.

    - 누적 1500원·가격 1000원으로 개시한 배출 중 500원을 추가 투입하고 완료 신호가 도착하면: 매출 +1000, 재고 −1, 거스름돈
    500원 지급, 추가 반환 500원, 누적 투입 금액 0, 상태 이름 ''관리 모드''이다.

    - 예약된 배출이 실패하면 상태 이력이 ''고장'' → ''관리 모드'' 순서로 기록된다.'
