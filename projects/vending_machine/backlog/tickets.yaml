- key: SWF-14
  type: epic
  title: '[UC-14] 관리자가 배출 실패를 확인해 고장 상태를 해제한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 고장 상태에서 관리 모드로 진입했고 진행 중이던 배출 기록이 남아 있다.

    **사후조건** 배출 실패를 확인하면 진행 중 배출 기록이 정리되고 고장 표시가 해제되며, 확인하지 않고 나가면 고장 상태로 되돌아간다.


    **주 흐름**

    - 1. 관리자가 관리 모드에서 배출 실패 내역을 조회한다.  `[VIEW_LEDGER]`

    - 2. 시스템이 진행 중이던 배출의 일련번호와 음료를 표시한다.

    - 3. 관리자가 배출 실패를 확인 처리한다.  `[ACK_DISPENSE_FAILURE]`

    - 4. 시스템이 진행 중 배출 기록을 정리하고 고장 표시를 해제한다.

    - 5. 관리자가 전용 키를 뽑아 관리 모드를 종료한다.  `[REMOVE_ADMIN_KEY]`

    - 6. 시스템이 판매 상태 또는 판매 중지 상태로 전환한다.


    **대안/예외 흐름**

    - 5a. 배출 실패를 확인하지 않은 채 관리 모드를 종료한 경우 시스템은 다시 고장 상태로 전환한다.  `[REMOVE_ADMIN_KEY]`

    - 3a. 전원을 껐다 켜는 것만으로는 고장 표시가 해제되지 않는다.  `[POWER_ON]`


    **인수 조건**

    - 관리 모드 조회 응답에 진행 중이던 배출의 일련번호와 음료 종류가 포함된다.

    - 배출 실패 확인 후 장부의 진행 중 배출 항목이 비어 있고 고장 표시가 거짓이다.

    - 배출 실패 확인 후 관리 모드를 종료하면 상태 이름이 ''판매'' 또는 ''판매 중지''이다.

    - 배출 실패를 확인하지 않고 관리 모드를 종료하면 상태 이름이 ''고장''이다.

    - 고장 상태에서 전원 재투입만 수행한 경우 상태 이름이 ''고장''으로 유지된다.'
