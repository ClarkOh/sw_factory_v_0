    요구사항 23 에 다음을 추가할 것 — ''동전 회수는 미반환 보관액을 줄이지 않는다. 관리자가 미반환 보관액을 회수 처리했다고 별도로 지시했을
    때에만 그 금액만큼 보관액이 줄어들고, 그 지시는 어떤 건의 보관액을 처리했는지와 함께 기록된다.'' 아울러 보존 불변식 테스트가 COLLECT_COIN
