- key: SWF-15
  type: epic
  title: '[UC-15] 관리 모드를 종료하고 판매 가능 여부에 따라 상태를 정한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이고 보충·조정·회수 작업이 끝났다.

    **사후조건** 재고가 하나라도 남아 있으면 판매 상태로, 모든 음료의 재고가 0이면 판매 중지 상태로 전환된다.


    **주 흐름**

    - 1. 관리자가 전용 키를 뽑아 관리 모드 종료를 지시한다.  `[REMOVE_ADMIN_KEY]`

    - 2. 시스템이 음료 종류별 재고를 확인한다.

    - 3. 시스템이 재고가 1 이상인 음료가 존재하면 판매 상태로 전환하고 누적 투입 금액 0을 화면에 표시한다.


    **대안/예외 흐름**

    - 1a. 종료 시점에 모든 음료의 재고가 0인 경우 시스템은 판매 중지 상태로 전환한다.  `[REMOVE_ADMIN_KEY]`

    - 1b. 배출 실패를 확인하지 않은 채 종료한 경우 시스템은 고장 상태로 전환한다(UC-14).  `[REMOVE_ADMIN_KEY]`

    - 3a. 판매 중지 상태에서 코인이 투입된 경우 시스템은 코인을 받아들이지 않고 그대로 되돌려 보낸다.  `[INSERT_COIN]`

    - 3b. 판매 중 마지막 재고가 소진되어 모든 음료의 재고가 0이 된 경우 시스템은 판매 중지 상태로 전환한다.  `[DISPENSE_COMPLETE]`


    **인수 조건**

    - 재고 {A:2, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 ''판매''이다.

    - 재고 {A:0, B:0, C:0} 상태에서 관리 모드를 종료하면 상태 이름이 ''판매 중지''이다.

    - 판매 중지 상태에서 500원 투입 후 반환구 지급액이 500원이고 누적 투입 금액이 0이며 500원 보유 개수가 변하지 않는다.

    - 마지막 재고 1개가 판매 완료된 직후 상태 이름이 ''판매 중지''이다.

    - [모호] 관리 모드 종료(보충 완료) 시점의 판정 조작이 명세되어 있지 않아 전용 키 제거를 종료 조작으로 가정한다.'
