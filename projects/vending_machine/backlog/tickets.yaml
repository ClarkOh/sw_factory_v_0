- key: SWF-325
  type: bug
  title: '[검토/high] 반환 도중 전원이 끊긴 경우의 규칙이 없고, 그 목적으로 만든 payout_intent 를 아무도 읽지 않는다'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-022 · T-043 · T-050 · T-053 은 payout_intent := credit 을 먼저 저장하고(app/vending_machine.py:1208-1213
    외 3 곳) payout() 으로 동전을 물리적으로 내준 뒤 credit := 0 과 payout_intent := None 을 다시 저장한다.
    그런데 payout_intent 를 읽는 곳은 없다 — invariant_holds(247-250) 가 형식만 검사하고 adopt_ledger(348)
    가 되돌려 놓을 뿐, 기동 전이 T-001~T-004 어디에도 이 값을 보는 코드가 없다. 테스트에도 payout_intent 를 단언하는
    곳이 한 군데도 없다(tests/ 전체 검색 결과 0 건). requirements.md 는 요구사항 23 · 24 에서 코인 투입 중과 배출
    중의 전원 차단만 규정하고 반환 도중의 차단은 규정하지 않는다.


    **영향**

    반환 레버 · 무조작 30 초 · 거스름돈 구성 실패 · 관리 모드 진입으로 전액을 내주는 도중 전원이 끊기면, 동전은 물리적으로 반환구에
    나갔는데 장부는 지급 전 상태로 복원되고 그 금액이 다시 미반환 보관액으로 잡힌다. 같은 돈이 두 번 세어져 보유량 합계 등식(REQ-29)이
    깨지고, 관리자는 기계 안에 없는 동전을 회수하려 한다. 배출 실패나 정전이 아니라 정상 반환 경로에서 일어나므로 발생 빈도가 가장 높다.


    **제안**

    requirements.md 의 정전·재기동 절에 다음 요구사항을 추가할 것 — ''반환 금액이나 거스름돈을 지급하는 도중에 전원이 끊긴 경우,
    자판기는 지급하려던 금액을 저장해 두고 재기동 시 그 금액이 이미 나간 것으로 보아 해당 액면가별 보유 개수를 차감한 장부로 복원한다. 그
    금액은 미반환 보관액으로 잡지 않는다.'' 그 뒤 기동 전이가 payout_intent 를 소비하도록 하고, 반환 직전 전원 차단 후 재기동에서
    coins 와 deposit 이 이중 계상되지 않는지 단언하는 테스트를 추가한다.


    **참조** REQ-27, REQ-29, REQ-73, REQ-90, REQ-91, T-022, T-043, T-050, T-053


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
