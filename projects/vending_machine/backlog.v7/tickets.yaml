- key: SWF-326
  type: bug
  title: '[검토/high] 배출 실패 시 이미 확정된 음료 대금이 손님에게 돌아가지 않는다'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-025(_action_t025, app/vending_machine.py:1192)가 배출 개시 시점에 거스름돈만 지급하고 credit
    을 0 으로 만들므로 음료 가격은 이미 동전통에 남는다. 그 뒤 T-048(_action_t048, 2772행)과 T-049(2821행)는
    pay_change(vm.credit) 만 부르는데 이 시점의 credit 에는 배출 중 투입분밖에 없다. tests/e2e/test_scenarios.py:477
    test_uc05 가 1000원 투입 후 cola(500) 선택, 100원 추가 투입, 타임아웃 순서를 흘린 뒤 refunded[-1] ==
    100, sales == 0, stock 불변을 단언한다 — 손님이 낸 500원의 행방은 어느 단언도 묻지 않는다.


    **영향**

    배출 기구가 고장난 첫 손님은 음료도 못 받고 음료값도 돌려받지 못한다. 요구사항 26의 "누적 투입 금액 전액"이 그 시점에 이미 0이라
    규칙상으로도 돌려줄 근거가 없어, 구현을 고쳐도 명세가 그대로면 다시 같은 자리로 돌아온다.


    **제안**

    요구사항에 다음 문장을 추가한다 — "배출 실패로 처리할 때 자판기는 그 배출을 위해 이미 확정한 음료 가격도 함께 반환한다. 반환 금액은
    버튼을 누른 시점의 누적 투입 금액과 배출 중 투입된 금액의 합이다." 반환할 동전을 구성할 수 없는 경우에 그 금액을 어떻게 기록할지(미반환
    보관액으로 접는지)도 같이 정한다.


    **참조** REQ-26, REQ-18, T-025, T-048, T-049, tests/e2e/test_scenarios.py::test_uc05_dispense_timeout_faults_without_deducting_stock


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
