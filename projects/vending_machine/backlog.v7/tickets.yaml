- key: SWF-354
  type: bug
  title: '[검토/medium] 10 초 · 2 초 규정은 어떤 코드도 구현하지 않고 어떤 테스트도 확인하지 않는다 — 값은 죽은 상수로만
    남아 있다'
  description: "**분류** untraced-req\n**심각도** medium\n\n**근거**\n`DISPENSE_TIMER_SECONDS\
    \ = 10`(app/vending_machine.py:15)과 `self.dispense_timer`\n(app/vending_machine.py:224)는\
    \ 정의된 뒤 코드 어디에서도 읽히거나 갱신되지 않는다(전수 검색 결과).\n`idle_timer` 도 `reset_idle_timer()`\
    \ 로 30 이 대입될 뿐 줄어드는 코드가 없고 어떤 guard 도 읽지 않는다.\nT-048 · T-049 의 guard 는 `admin_reserved`\
    \ 하나만 보므로 개시 0.1 초 뒤에 온 DISPENSE_TIMEOUT 도\n그대로 고장 처리가 되고, T-036 · T-079 의 guard\
    \ 는 `credit > 0` 하나만 보므로 30 초가 지났는지와 무관하게\n자동 반환이 일어난다. 즉 REQ-24 의 10 초와 REQ-22\
    \ 의 30 초는 이 소프트웨어 안에서 아무것도 규정하지 않는다.\ntests/test_timing.py:414-424 는 이 사실을 스스로\
    \ 인정한다 — \"이 상수 비교가 값에 대해 할 수 있는 전부다.\n이 단언 하나로는 10 초가 지켜진다는 것이 보장되지 않는다\". REQ-67(2\
    \ 초)에 대해서는\ntests/test_timing.py:430 이 \"버튼 이벤트 하나로 개시가 끝난다\" 만 보고 경과 시간은 재지 않는다.\n\
    그런데 어느 문서에도 \"10 초·2 초의 초읽기는 하드웨어가 책임지고 소프트웨어는 만료 통보만 받는다\" 가\n요구사항이나 인터페이스 계약으로\
    \ 적혀 있지 않다 — UC-05 는 \"개시 후 10 초가 경과했다\" 를 선행 조건으로,\nUC-02 는 \"버튼 누름부터 배출 시작까지\
    \ <= 2000ms\" 를 인수 조건으로 소프트웨어 쪽에 적어 두었다.\n\n**영향**\n실제 기기에서 배출 시한이 3 초든 3 분이든,\
    \ 무조작 시한이 5 초든 5 분이든 이 소프트웨어는 구분하지 못하고 통과한다. 시한을 세는 쪽이 하드웨어라면 그 계약이 어디에도 없어, 하드웨어\
    \ 팀이 다른 값을 쓰거나 아예 통보를 보내지 않아도 아무도 모른다 — 통보가 오지 않으면 손님 돈이 배출 대기 자리에 무기한 갇힌다.\n\n\
    **제안**\n요구사항에 시한의 책임 소재를 명시한다 —\n\"10 초 배출 시한과 30 초 무조작 시한의 초읽기는 자판기 제어 소프트웨어가\
    \ 수행한다.\n 소프트웨어는 배출 개시 시각과 마지막 고객 조작 시각을 기록하고, 시간 입력을 받아 시한 만료를 스스로 판정한다.\"\n\
    (하드웨어에 맡기기로 결정했다면 그 결정을 요구사항으로 적고, 만료 통보가 오지 않을 때의 처리를 함께 규정한다.)\n그 뒤 시각을 주입할\
    \ 수 있는 입력(예: tick(seconds))을 두고, 9.9 초에는 만료가 없고 10.0 초에 만료가\n일어나는 것을 확인하는 테스트를\
    \ 붙인다.\n\n**참조** REQ-22, REQ-24, REQ-67, UC-02, UC-05, T-036, T-048, T-079, tests/test_timing.py::test_the_deadline_values_handed_to_the_machine_are_the_ones_the_spec_names\n\
    \n_자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._"
