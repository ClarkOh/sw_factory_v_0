- key: SWF-14
  type: epic
  title: '[UC-14] 동전을 회수한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드다

    **사후조건** 회수한 개수만큼 액면가별 보유 개수가 차감되고 보유량 합계가 미반환 보관액 이상으로 유지된다


    **주 흐름**

    - 1. 관리자가 액면가와 회수 개수를 지정해 동전 회수를 지시한다  `[COLLECT_COINS]`

    - 2. 시스템이 대상이 100원/500원/1000원이고 회수 개수가 1 이상의 정수인지 검증한다

    - 3. 시스템이 회수 후 보유량 합계가 미반환 보관액 이상으로 남는지 검증한다

    - 4. 시스템이 지정된 액면가의 보유 개수를 회수 개수만큼 차감하고 동전을 배출한다

    - 5. 시스템이 갱신된 액면가별 보유량을 관리자에게 표시한다


    **대안/예외 흐름**

    - 2a. 등록되지 않은 액면가나 0 이하의 개수가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게
    알린다  `[COLLECT_COINS]`

    - 3a. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우, 시스템은 지시를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다  `[COLLECT_COINS]`

    - 2b. 회수 개수가 해당 액면가의 현재 보유 개수를 초과하는 경우, 시스템은 지시를 거부하고 보유량을 변경하지 않는다  `[COLLECT_COINS]`


    **인수 조건**

    - 유효한 회수 지시 후 해당 액면가 보유 개수 감소량 == 회수 개수

    - 회수 완료 후 보유량 합계 >= 미반환 보관액

    - 보유량 합계를 미반환 보관액 아래로 낮추는 지시 처리 후 모든 액면가 보유 개수의 변화량 = 0

    - 회수 후에도 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 이 성립한다'
