- key: SWF-355
  type: bug
  title: '[검토/high] 배출 실패 시 손님이 낸 음료값이 어느 장부에도 남지 않고 기계 안에 갇힌다'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-025(_action_t025, app/vending_machine.py:3020 부근)는 `change = credit - price`
    만

    지급하고 `pay_change()` 안에서 `credit = 0` 으로 만든다. 즉 버튼을 누른 순간 음료값

    만큼은 credit 에서 빠지지만 sales 에는 아직 계상되지 않는다(계상은

    complete_pending_dispense() 의 몫, app/vending_machine.py:497).

    이후 배출이 실패하면 T-048/T-049(_action_t048:2827, _action_t049:2873)는

    `pay_change(vm.credit)` 만 하고 stock 도 sales 도 건드리지 않는다.

    결과: 500 원짜리를 사려고 600 원을 넣고 배출이 실패하면 거스름돈 100 원만 이미

    나갔고, 손님은 음료도 못 받고 500 원도 못 돌려받는다. 그 500 원은 coins 안에

    남지만 sales 도 credit 도 deposit 도 아니다.

    테스트가 이 결과를 그대로 기대값으로 못박고 있다 —

    tests/test_timing.py:386 `assert total(vm.coins) == coins_before - credit_before`,

    :390 `assert vm.sales == sales_before`, tests/test_fsm.py:1136 `total(vm.coins)
    == 0`

    (credit 300 만 나가고 앞서 낸 음료값은 셈에 없다).

    원본 문서 §14 도 "누적 투입 금액 전액을 반환한다" 라고만 적어 두었고, 그 시점의

    누적 투입 금액에는 이미 음료값이 들어 있지 않다.


    **영향**

    배출 기구가 고장난 자판기는 고장 상태로 넘어가기 전에 마지막 손님의 음료값을

    말없이 삼킨다. 손님에게는 환불 근거가 남지 않고(refunded 에 그 금액이 없다),

    관리자에게도 "얼마를 누구에게 돌려줘야 하는지" 가 기록되지 않는다. 그 금액은

    REQ-18 의 어느 항에도 속하지 않으므로 보유량 합계 항등식이 그 순간부터 영구히

    깨지고, 나중에 회수할 때 관리자는 그 돈을 매출로 착각해 걷어 간다.


    **제안**

    요구사항에 다음을 추가한다 — "배출 실패로 처리한 경우, 자판기는 그 배출의 음료

    가격을 판매로 계상하지 않으며 그 금액을 손님에게 반환한다. 반환할 수 없으면

    ''미반환 보관액'' 에 더해 관리자가 확인하고 회수할 수 있게 한다."

    그리고 REQ-18 의 항등식에 ''개시되었으나 아직 정산되지 않은 배출의 음료 가격''

    항을 명시하거나, 그 항이 생기지 않도록 위 규칙으로 닫는다.


    **참조** REQ-18, REQ-25, REQ-26, T-025, T-048, T-049, tests/test_fsm.py::test_t_048,
    tests/test_timing.py::test_the_dispense_deadline_has_somewhere_to_land_all_through_the_wait


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
