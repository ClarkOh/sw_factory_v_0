- key: SWF-2
  type: epic
  title: '[UC-02] 음료를 선택하여 구매한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고 선택하려는 음료의 선택 버튼이 활성화되어 있다(누적 투입 금액 >= 가격 이고 재고 >= 1)

    **사후조건** 배출이 개시되고 일련번호가 부여되며, 거스름돈이 0보다 크면 거스름돈이 반환된다


    **주 흐름**

    - 1. 고객이 활성화된 음료 선택 버튼을 누른다  `[SELECT_DRINK]`

    - 2. 시스템이 버튼을 누른 시점의 누적 투입 금액에서 음료 가격을 뺀 값을 거스름돈으로 계산한다

    - 3. 시스템이 거스름돈을 구성할 동전 보유량이 충분한지 확인한다

    - 4. 시스템이 그 배출에 새 일련번호를 부여하고 배출을 개시한다

    - 5. 시스템이 거스름돈이 0보다 크면 거스름돈을 반환하고 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다

    - 6. 시스템이 누적 투입 금액을 갱신하고 화면에 표시한다


    **대안/예외 흐름**

    - 1a. 고객이 비활성 상태의 선택 버튼을 누른 경우, 시스템은 배출을 개시하지 않고 누적 투입 금액·재고·동전 보유량을 변경하지 않는다  `[SELECT_DRINK]`

    - 3a. 거스름돈을 구성할 동전이 부족한 경우, 시스템은 음료를 배출하지 않고 누적 투입 금액 전액을 반환한 뒤 누적 투입 금액을 0으로
    만들고 재고를 차감하지 않는다  `[SELECT_DRINK]`


    **인수 조건**

    - 취급 음료는 정확히 3종이며 3종의 가격이 서로 모두 다르다

    - 거스름돈 == (버튼을 누른 시점의 누적 투입 금액) − (선택한 음료 가격)

    - 선택 버튼 누름 시각부터 배출 시작 시각까지 경과 시간 <= 2000ms

    - 배출 개시마다 부여된 일련번호가 직전 값보다 1 크다

    - 거스름돈 지급 후 액면가별 보유 개수 감소량 합계 금액 == 지급한 거스름돈 금액

    - 동전 부족 케이스에서 재고 변화량 = 0 이고 반환 금액 == 버튼을 누른 시점의 누적 투입 금액이며 종료 후 누적 투입 금액 == 0

    - 비활성 버튼 누름 후 상태·재고·누적 투입 금액·동전 보유량이 모두 불변이다

    - 거스름돈 동전 조합 선택 규칙은 요구사항에 미정의(REQ-93)이므로 조합 자체가 아니라 지급 총액과 보유량 감소액의 일치만 판정한다

    - 구체적 음료 가격과 초기 재고 수량은 요구사항에 미정의(REQ-92)이므로 생성 시 주입된 값으로 판정한다

    - 제어 대상은 소프트웨어이며 코인 투입구·버튼·배출구·반환 레버는 외부 인터페이스로만 호출된다'
