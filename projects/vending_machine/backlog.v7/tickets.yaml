    - 배출 중 정전 시 해당 음료 재고 감소량 == 1, 판매 금액 증가분 == 음료 가격, 미반환 보관액 == 정전 시점 누적 투입 금액 −
    음료 가격

    - 재기동 후 첫 배출의 일련번호 > 저장 파일에 기록되어 있던 일련번호

    - 재기동 후 상태 이름은 보존된 종류별 재고만으로 결정되며 외부 입력으로 재고가 설정되지 않는다

    - 저장 파일 부재/손상 시 재고 == 0, 동전 보유량 == 0, 미반환 보관액 == 0 이고 관리자 통지가 1건 발생한다

    - 저장된 상태가 고장이면 재기동 후 상태 이름 == 고장


