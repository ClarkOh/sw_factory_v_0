    - 동작: `refund(credit); coins -= used_coins(credit); credit = 0; pending_kept_for_admin();
    fault_pending = true; show_fault_and_call_admin(); persist()`


    유스케이스: [UC-05] 배출 실패를 처리하고 고장 상태로 전환한다


    인수 조건:

    - 배출 개시 후 10초 경과 시점까지 유효한 완료 신호가 없으면 상태 이름 == 고장

    - 배출 실패 처리 후 해당 음료 재고 변화량 == 0

    - 배출 실패 처리 시 반환 금액 == 실패 처리 직전 누적 투입 금액

    - 고장 상태 진입 시점의 누적 투입 금액 == 0


