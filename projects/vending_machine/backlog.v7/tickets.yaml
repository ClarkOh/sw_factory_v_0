- key: SWF-356
  type: bug
  title: '[검토/high] 같은 객체로 전원을 껐다 켜면 미반환 보관액이 두 배가 되고, 어떤 테스트도 그 경로를 밟지 않는다'
  description: '**분류** vacuous-test

    **심각도** high


    **근거**

    app/vending_machine.py:724 `self.deposit += data["deposit"]` — restore() 에서

    deposit 만 `=` 가 아니라 `+=` 다(stock·coins·credit·serial 등 나머지는 모두 `=`).

    handle() 은 `state == POWERED_OFF` 에서 POWER_ON 을 받으면 무조건

    _power_on_load() → restore() 를 부른다(app/vending_machine.py:737, 757).

    T-007~T-012(POWER_OFF)의 action 은 None 이라 메모리상의 deposit 이 그대로 남으므로,

    같은 객체에 POWER_OFF → POWER_ON 을 넣으면 deposit 이 D → 2D 가 되고 이어지는

    persist() 가 2D 를 저장한다. 다음 전원 주기에는 4D 다.

    테스트가 이것을 못 잡는 이유는 재기동 테스트가 전부 **새 객체**를 만들기 때문이다 —

    tests/e2e/test_durability.py::cold_boot(:69)은 새 VendingMachine 을 만들고,

    tests/e2e/test_constraints.py::grid(:281)은 자판기 한 대에 사건을 하나만 넣는다.

    같은 객체로 전원을 순환시키는 유일한 자리인 SWAP_STEPS 의 마지막 두 줄

    (tests/e2e/test_durability.py:282-283, T-007 → T-005)은 그 시점 deposit 이 0 이라

    (:391 `rebooted.deposit == 0`) 두 배가 되어도 보이지 않는다.


    **영향**

    운영 드라이버가 자판기 객체를 재사용해 전원 이벤트를 넣는 순간 — FSM 이 POWER_OFF /

    POWER_ON 을 전이로 정의한 이상 정상적인 구동 방식이다 — 미반환 보관액이 전원 주기마다

    배로 불어나 저장 파일에 굳는다. 그러면 T-070 이 모든 액면가 동전 회수를 거절하고

    (coin_total − 회수액 < deposit), T-074 가 보관액 회수도 거절해 관리자가 매출을

    영원히 걷어 갈 수 없게 된다. 손님 돈 기록이 실제 보유액보다 커져 REQ-18 도 깨진다.


    **제안**

    restore() 의 `self.deposit += data["deposit"]` 를 다른 필드와 같은 `=` 로 바꾼다.

    그리고 재기동 테스트에 **살아 있는 객체로 POWER_OFF → POWER_ON 을 도는** 케이스를

    deposit > 0 인 상태로 추가한다(새 객체로만 재기동하는 지금의 cold_boot 방식은 이

    경로를 구조적으로 밟지 못한다).


    **참조** REQ-70, REQ-72, REQ-83, T-005, T-007, tests/e2e/test_durability.py::test_uc18_ledger_is_swapped_in_whole_never_written_in_place


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
