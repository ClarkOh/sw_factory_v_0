    - 2. 시스템이 누적 투입 금액 전액을 반환한다

    - 3. 시스템이 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다

    - 4. 시스템이 누적 투입 금액을 0으로 만들고 화면에 0을 표시한다

    - 5. 시스템이 모든 선택 버튼을 비활성화한다


