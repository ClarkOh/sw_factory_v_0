  title: '[검토/medium] 판매 중지 자리의 반환 레버(T-080)는 손님 돈을 돌려주려고 만든 전이인데 돈이 나오는지 확인하는 테스트가
    없다'
  description: '**분류** untraced-req

    **심각도** medium


    **근거**

    T-080(app/vending_machine.py:5013)은 OUT_OF_STOCK 에서 PULL_RETURN_LEVER 로 남은 누적
    투입 금액

    전액을 반환하려고 SWF-328 이 추가한 전이다(REQ-21). 그런데 이 전이를 언급하는 테스트는

    tests/test_timing.py:137-138 의 NOT_ARMING_CASES 항목 하나뿐이고, 그 테스트가 단언하는 것은

    `vm.idle_timer == NO_DEADLINE` — 유휴 시한을 걸지 않는다는 것뿐이다.

    반환 금액 · `refunded` · `coins` 감소 · `credit == 0` · persist 를 확인하는 단언은 어디에도 없다.

    돈이 나오는지를 보는 테스트(tests/test_timing.py:281-307)는 T-036 과 T-079 만 다룬다.

    tests/test_fsm.py 는 test_t_078 에서 끝나 test_t_079 · test_t_080 이 존재하지 않는다.

    제시된 FSM 명세도 T-078 까지만 있어 T-079 · T-080 은 명세 문서에도 반영되지 않았다.

    즉 `_action_t080` 이 `pay_change` 대신 아무것도 하지 않도록 바뀌어도 테스트는 전부 초록이다.


    **영향**

    마지막 한 개를 사는 동안 코인을 더 넣은 손님이 판매 중지 자리에서 레버를 당겼을 때 돈이 나오는지를 보증하는 것이 아무것도 없다. SWF-328
    이 고치려던 "손님 돈이 갇힌다" 는 결함이 회귀해도 잡히지 않는다.


    **제안**

    tests/test_fsm.py 에 test_t_079 · test_t_080 을 다른 전이와 같은 형식(도착 상태 + action 효과 +
    guard 거짓)으로 추가하고, FSM 명세 문서에 T-079 · T-080 을 등재해 명세와 코드의 전이 목록을 맞춘다.


    **참조** REQ-21, REQ-22, T-079, T-080, tests/test_timing.py::test_the_idle_deadline_is_not_armed_where_the_spec_forbids_it,
    tests/test_timing.py::test_the_idle_deadline_returns_the_money_wherever_it_is_left


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
