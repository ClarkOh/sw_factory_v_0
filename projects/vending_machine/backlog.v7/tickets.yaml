- key: SWF-31
  type: story
  title: '[T-013] SELLING_IDLE --INSERT_COIN--> SELLING_WITH_CREDIT'
  description: 'FSM 전이 `T-013` 구현


    - 출발: `SELLING_IDLE`

    - 이벤트: `INSERT_COIN`

    - 도착: `SELLING_WITH_CREDIT`

    - 가드: `recognized && denom in [100, 500, 1000]`

    - 동작: `coins[denom] += 1; credit += denom; display(credit); enable_buttons(credit,
    stock); reset_idle_timer(); persist()`


    유스케이스: [UC-01] 코인을 투입하여 누적 투입 금액을 늘린다


    인수 조건:

    - 100원/500원/1000원 코인 투입 시 누적 투입 금액이 정확히 그 액면가만큼 증가한다

    - 100원/500원/1000원 코인 투입 시 해당 액면가의 보유 개수가 정확히 1 증가한다

    - 비액면가 코인 또는 인식 실패 코인 투입 후 누적 투입 금액 변화량 = 0 이고 액면가별 보유 개수 변화량 = 0 이며, 투입된 코인과
    동일한 코인이 반환구에 나온다

    - 코인 투입 처리 후 화면 표시 금액 == 누적 투입 금액

    - 동전 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 (그 밖의 항 없음)

    - 한 거래가 진행 중인 동안 두 번째 고객 세션이 동시에 생성되지 않는다


    **완료 조건: `test_t_013` 통과**'
