- key: SWF-376
  type: bug
  title: '[검토/medium] REQ-18 의 보유량 합계 항등식을 항등식으로 확인하는 테스트가 하나도 없다'
  description: '**분류** untraced-req

    **심각도** medium


    **근거**

    REQ-18 은 세 유스케이스(UC-01 · UC-14 · UC-18)에 인수 조건으로 그대로 실려 있다 — "동전 보유량 합계 == 초기
    보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 (그 밖의 항 없음)". 그러나 저장소 전체에서
    이 등식을 계산해 보는 테스트는 없다. tests/ 를 "REQ-18 · 보유량 합계 · coin_total" 로 훑으면 나오는 것은 개별
    전이의 증감 단언 (tests/test_fsm.py:1670 `total(vm.coins) == 0`)과 시나리오 한 지점의 값 확인 (tests/e2e/test_durability.py:660,
    :685-686, :693)뿐이다. 항 하나하나(coins · sales · credit · deposit · 보충 · 회수)를 모아 등식이
    성립하는지 사건 격자 위에서 보는 확인은 없다. tests/e2e/test_constraints.py 의 격자는 재고를 바꾸는 계기(REQ-77)는
    같은 방식으로 전수 확인하면서 돈에는 같은 자를 대지 않는다. 참고로 이 항등식을 격자 위에서 확인했다면 F-01 의 음수 보관액은 정산 직후
    바로 걸린다(보유량 합계는 그대로인데 우변만 음료 가격만큼 줄어든다).


    **영향**

    돈이 새는 자리를 잡아내라고 문서가 명시적으로 적어 둔 유일한 불변식이 검증에 도달하지 못했다. 개별 전이의 증감만 보는 지금 구조에서는,
    전이 하나하나는 맞는데 조합하면 어긋나는 결함 (F-01 이 그 예다)이 전부 초록을 통과한다. 자판기의 돈 장부가 조용히 어긋난 채 출고되고,
    관리자가 실물과 장부를 맞춰 볼 때에야 드러난다.


    **제안**

    tests/e2e 에 항등식 전용 테스트를 추가할 것 — 자판기 한 대의 생애(기동 → 보충 → 여러 형태의 구매 · 반환 · 거스름돈 부족
    · 배출 실패 · 지연 배출 · 회수 · 정전 재기동)를 돌면서 매 사건 뒤에 `coin_total() == 초기 보유액 + 보충액 − 회수액
    + sales + credit + deposit` 를 단언하고, 보충액 · 회수액은 테스트가 제 손으로 지시한 금액을 세어 만들 것(구현에서
    읽어 오면 다시 거울이 된다). tests/e2e/test_constraints.py 의 자리 × 사건 격자에도 같은 단언을 얹으면 밟지 않은
    갈래까지 덮인다.


    **참조** REQ-18, UC-01, UC-14, UC-15, UC-18, tests/e2e/test_durability.py:685, tests/e2e/test_constraints.py


