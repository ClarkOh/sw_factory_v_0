- key: SWF-13
  type: epic
  title: '[UC-13] 재고를 실물에 맞춰 하향 조정한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이고 장부 재고와 실물 재고가 다를 수 있다

    **사후조건** 지정한 음료의 장부 재고가 조정값으로 낮아지고 지연 배출 기록이 확인 완료로 표시된다


    **주 흐름**

    - 1. 관리자가 지연 배출 기록을 조회한다  `[ADJUST_STOCK]`

    - 2. 시스템이 지연 배출 기록을 음료 종류와 함께 표시한다

    - 3. 관리자가 음료 종류와 조정값을 지정해 재고 조정을 지시한다  `[ADJUST_STOCK]`

    - 4. 시스템이 조정값이 0 이상이고 현재 장부 재고 이하인지 검증한다

    - 5. 시스템이 해당 음료의 재고를 조정값으로 설정한다

    - 6. 시스템이 지연 배출 기록을 관리자가 확인한 것으로 표시한다


    **대안/예외 흐름**

    - 4a. 조정값이 음수인 경우, 시스템은 지시를 거부하고 재고를 변경하지 않으며 관리자에게 알린다  `[ADJUST_STOCK]`

    - 4b. 조정값이 현재 장부 재고보다 큰 경우, 시스템은 지시를 거부하고 재고를 변경하지 않으며 관리자에게 알린다  `[ADJUST_STOCK]`


    **인수 조건**

    - 0 <= 조정값 <= 현재 장부 재고 인 지시 처리 후 해당 음료 재고 == 조정값

    - 조정값 < 0 또는 조정값 > 현재 장부 재고 인 지시 처리 후 재고 변화량 = 0 이고 거부 통지가 발생한다

    - 정상 조정 완료 후 해당 지연 배출 기록의 확인 여부 == 확인됨'
