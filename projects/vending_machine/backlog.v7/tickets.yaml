- key: SWF-30
  type: story
  title: '[T-012] ADMIN_MODE --POWER_OFF--> POWERED_OFF'
  description: 'FSM 전이 `T-012` 구현


    - 출발: `ADMIN_MODE`

    - 이벤트: `POWER_OFF`

    - 도착: `POWERED_OFF`

    - 가드: `없음`

    - 동작: `없음`


    유스케이스: [UC-18] 상태 전이마다 상태를 원자적으로 저장한다


    인수 조건:

    - 모든 상태 전이 완료 직후 저장 파일의 내용이 메모리상 현재 상태와 일치한다

    - 저장 파일에 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인 배출의 일련번호와
    음료, 관리 모드 진입 예약 여부가 모두 존재한다

    - 저장 호출 순서가 임시 파일 write → fsync → 원자적 rename → 디렉터리 fsync 이다

    - 쓰기 중 임의 시점에 전원 차단을 주입해도 읽어들인 파일은 항상 완전한 상태이며 파싱 오류가 발생하지 않는다

    - 생성자에 지정한 경로에만 저장 파일이 만들어지고, 테스트에서 임시 파일 경로를 지정하면 그 경로에 기록된다

    - 저장·복원 처리 중 외부 네트워크 연결이 1건도 발생하지 않는다


    **완료 조건: `test_t_012` 통과**'
