- key: SWF-352
  type: bug
  title: '[검토/medium] 재고 하향 조정 지시의 잘못된 payload 가 어느 갈래에도 걸리지 않아 통지 없이 조용히 무시된다'
  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    (ADMIN_MODE, ADJUST_STOCK) 자리의 네 갈래는 T-063(op==''view''),

    T-064(`_guard_adjust_stock_set_valid`, app/vending_machine.py:1878-1886),

    T-065(`_guard_adjust_stock_set_negative`, :1911-1916),

    T-066(`_guard_adjust_stock_set_above_stock`, :1945-1953)뿐이다.

    T-064 와 T-066 은 `vm.price(drink) is None or drink not in vm.stock` 이면 거짓이고,

    T-065 는 `value < 0` 만 잡으며 셋 다 `is_int(value)` 가 거짓이면 거짓이다.

    따라서 `op=''set'', drink=''soda''(미등록), value=0` 이나 `op=''set'', drink=''cola'',
    value=''3''`(정수 아님),

    `op=''refill''` 같은 지시는 네 갈래 어디에도 안 걸려 `handle()` 이 None 을 돌려주고 아무 일도 일어나지 않는다
    —

    재고도 안 바뀌고 `notifications` 도 비어 있다. 같은 자리의 REFILL_STOCK · REFILL_COINS · COLLECT_COINS
    는

    전부 거부 통지 전이를 갖추고 있는데(T-058·T-059·T-061·T-062·T-068~T-070·T-074) ADJUST_STOCK 만
    비어 있다.

    tests/test_fsm.py 의 test_t_063~test_t_066 은 등록된 음료와 정수 value 만 넣어 이 구멍을 지나간다.


    **영향**

    관리자가 음료 이름을 잘못 치거나 값을 문자열로 넣으면 자판기가 아무 반응도 하지 않는다. 관리자는 조정이 반영된 것으로 믿고 관리 모드를
    나가므로 장부 재고와 실물이 어긋난 채 판매가 재개된다 — 재고 조정(REQ-61)의 목적 자체가 조용히 실패한다.


    **제안**

    요구사항 19-1 에 "등록되지 않은 음료나 정수가 아닌 조정값이 포함된 지시는 거부하고 관리자에게 알린다" 를

    추가하고, (ADMIN_MODE, ADJUST_STOCK) 에 나머지 payload 를 전부 받는 거부 전이를 등록한다.

    네 갈래가 payload 전체를 덮는지(어느 지시든 정확히 한 갈래에 걸리는지)를 확인하는 전수 테스트를 붙인다.


