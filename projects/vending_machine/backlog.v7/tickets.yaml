- key: SWF-371
  type: bug
  title: '[검토/high] 배출 중 정전 정산이 미반환 보관액을 음수로 만들고, 그 파일은 다음 기동에서 ''손상'' 으로 판정되어 재고·동전
    장부가 통째로'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-025 는 `_action_t025`(app/vending_machine.py:1285)에서 `pay_change()` 로 `credit
    = 0` 을 만든다 — 버튼을 누른 순간 음료값과 거스름돈이 모두 누적 투입 금액에서 빠져나간다. 그래서 AWAITING_DISPENSE_COMPLETE
    자리의 `credit` 은 배출 중에 추가로 들어온 코인(T-019)뿐이고 보통은 0 이다. 그런데 재기동 정산 `settle_pending_dispense()`(app/vending_machine.py:491)는
    REQ-75 의 문장을 글자 그대로 `self.deposit += self.credit - price` 로 옮겼다. 배출 중에 코인을 더 넣지
    않은 평범한 경우 (credit == 0, 가격 500)에는 `deposit == -500` 이 된다. T-003/T-004 의 action
    은 곧바로 `persist()`(app/vending_machine.py:919-920) 하므로 이 음수가 저장 파일에 기록되고, `load_save()`
    는 `_nonneg_int(restored["deposit"])` 가 거짓이면 `None` 을 돌려주므로 (app/vending_machine.py:136)
    **그 다음 기동은 T-001 로 떨어져** `reset_all()` 이 재고 0 · 동전 0 · 보관액 0 으로 지우고 `fault_pending`
    까지 내린다. 뿌리는 요구사항 쪽에 있다 — 문서는 버튼을 누른 시점에 음료값이 누적 투입 금액에서 빠진다는 규칙을 어디에도 적지 않았고,
    REQ-18 의 항목 목록에도 ''배출을 개시했으나 아직 확정되지 않은 판매 대금'' 항이 없다. 그래서 AWAITING 자리에서는 REQ-18
    항등식이 이미 음료 가격만큼 어긋나 있고, REQ-75 는 그 어긋남을 보관액에서 한 번 더 빼는 식으로 적혀 있다. 이 갈래를 확인하는 테스트는
    전부 저장된 credit 이 음료 가격보다 큰 값만 쓴다 — tests/test_fsm.py::test_t_003(credit=600, 가격
    500 → deposit 100), ::test_t_004(credit=600 → deposit 150), tests/e2e/test_constraints.py
    의 SEATS "off-awaiting-left"/"off-awaiting-empty"(credit=700), tests/e2e/test_durability.py::
    test_e2e_ledger_survives_a_cold_reboot_after_every_step(배출 중 1000 원 추가 투입 → deposit
    400). 실제로 압도적으로 흔한 credit == 0 인 경우는 어느 테스트도 밟지 않는다.


    **영향**

    손님이 500 원을 넣고 콜라를 고른 직후 정전이 나면, 재기동에서 보관액이 -500 이 되어 저장된다. 그 상태로 한 번 더 전원을 껐다
    켜면 자판기는 저장 파일을 손상으로 보고 재고·동전·보관액을 전부 0 으로 지운 뒤 판매 중지로 기동한다. 실제 통 안의 음료와 동전은 그대로인데
    장부만 사라지므로 관리자가 전부 다시 세어 넣어야 하고, 걸려 있던 고장(`fault_pending`)까지 풀려 배출 기구가 죽은 자판기가
    다시 팔기 시작한다. 그 사이에도 음수 보관액은 T-067 의 회수 하한(`coin_total - denom*count >= deposit`)을
    무력화해 관리자가 보유 동전을 남김없이 걷어 갈 수 있게 만든다.


    **제안**

    요구사항에 두 문장을 추가하고 REQ-75 를 그에 맞춰 고칠 것. (추가) "선택 버튼을 누른 시점에 그 음료의 가격과 거스름돈은 누적 투입
    금액에서 빠져나가며, 음료 가격은 배출이 확정되기 전까지 ''개시된 배출의 미확정 대금'' 으로 자판기가 보관한다. REQ-18 의 보유량
    합계에는 이 미확정 대금 항이 포함된다." (수정 REQ-75) "배출 중 정전이 발생한 경우 미반환 보관액은 정전 시점의 누적 투입 금액(=
    배출 개시 후 추가로 투입된 금액)을 그대로 잡는다. 음료 가격은 이미 누적 투입 금액에서 빠져나간 뒤이므로 다시 빼지 않는다." 그리고 T-003/T-004
    테스트에 credit == 0 인 갈래와 `deposit >= 0` 단언을 넣을 것.


    **참조** REQ-13, REQ-18, REQ-75, T-025, T-003, T-004, tests/test_fsm.py::test_t_003,
    tests/test_fsm.py::test_t_004, app/vending_machine.py:491


