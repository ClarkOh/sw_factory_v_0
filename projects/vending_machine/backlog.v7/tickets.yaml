- key: SWF-11
  type: epic
  title: '[UC-11] 전용 키로 관리 모드에 진입한다'
  description: '**액터** 관리자

    **사전조건** 관리자가 전용 키를 소지하고 있다

    **사후조건** 누적 투입 금액이 0으로 정리된 상태에서 자판기가 관리 모드가 된다


    **주 흐름**

    - 1. 관리자가 전용 키를 꽂는다  `[INSERT_ADMIN_KEY]`

    - 2. 시스템이 누적 투입 금액이 0보다 큰지 확인한다

    - 3. 시스템이 누적 투입 금액 전액을 반환하고 누적 투입 금액을 0으로 만든다

    - 4. 시스템이 관리 모드로 전환하고 관리 메뉴를 표시한다


    **대안/예외 흐름**

    - 2a. 자판기가 고장 상태인 경우에도, 시스템은 관리 모드 진입을 허용한다  `[INSERT_ADMIN_KEY]`

    - 2b. 배출 완료를 기다리는 중인 경우, 시스템은 관리 모드 진입을 예약해 두고 배출 완료 직후 관리 모드로 전환하며, 이미 개시된 배출의
    음료 가격은 판매로 확정하고 배출 중 투입된 금액만 반환한다  `[INSERT_ADMIN_KEY]`

    - 2c. 진입이 예약된 배출이 배출 실패로 처리된 경우, 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다  `[DISPENSE_TIMEOUT]`

    - 2d. 관리 모드에서 코인이 투입된 경우, 시스템은 그 코인을 받아들이지 않고 그대로 반환한다  `[INSERT_COIN]`


    **인수 조건**

    - 관리 모드 진입 완료 시점의 누적 투입 금액 == 0

    - 진입 전 누적 투입 금액 > 0 이면 반환 금액 == 진입 요청 시점의 누적 투입 금액

    - 상태 이름 == 고장 인 상태에서 키 삽입 후 상태 이름 == 관리 모드

    - 배출 대기 중 키 삽입 시 즉시 상태가 바뀌지 않고 관리 모드 진입 예약 == 참 이며, 배출 완료 직후 상태 이름 == 관리 모드

    - 예약 진입 시 반환 금액 == 배출 중 투입된 금액이고 개시된 배출의 음료 가격은 판매 금액에 계상된다

    - 예약 진입 중 배출 실패 시 상태 전이 순서가 고장 → 관리 모드 이다'
