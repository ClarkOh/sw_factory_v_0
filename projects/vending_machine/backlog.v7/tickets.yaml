- key: SWF-18
  type: epic
  title: '[UC-18] 상태 전이마다 상태를 원자적으로 저장한다'
  description: '**액터** 고객

    **사전조건** 자판기가 기동되어 있고 저장 파일 위치가 생성 시 지정되어 있다

    **사후조건** 전이 완료 시점의 상태 전체가 저장 파일에 원자적으로 기록된다


    **주 흐름**

    - 1. 고객이 상태 전이를 일으키는 조작을 한다  `[INSERT_COIN]`

    - 2. 시스템이 전이를 완료한다

    - 3. 시스템이 상태 전체(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인
    배출의 일련번호와 음료, 관리 모드 진입 예약 여부)를 임시 파일에 기록한다

    - 4. 시스템이 임시 파일 내용을 fsync로 디스크에 강제 동기화한다

    - 5. 시스템이 원자적 교체로 본 파일을 갈아치운다

    - 6. 시스템이 디렉터리 항목을 동기화한다


    **대안/예외 흐름**

    - 3a. 기록 도중 전원이 끊긴 경우, 시스템은 다음 기동에서 직전에 완전히 기록된 상태를 읽으며 절반만 쓰인 파일을 읽지 않는다  `[POWER_OFF]`

    - 5a. 원자적 교체 직전에 전원이 끊긴 경우, 시스템은 다음 기동에서 교체 이전의 완전한 본 파일을 읽는다  `[POWER_OFF]`

    - 1a. 관리자 조작으로 전이가 발생한 경우에도, 시스템은 동일한 저장 절차를 수행한다  `[REFILL_STOCK]`


    **인수 조건**

    - 모든 상태 전이 완료 직후 저장 파일의 내용이 메모리상 현재 상태와 일치한다

    - 저장 파일에 상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 동전 보유량, 미반환 보관액, 지연 배출 기록, 진행 중인 배출의 일련번호와
    음료, 관리 모드 진입 예약 여부가 모두 존재한다

    - 저장 호출 순서가 임시 파일 write → fsync → 원자적 rename → 디렉터리 fsync 이다

    - 쓰기 중 임의 시점에 전원 차단을 주입해도 읽어들인 파일은 항상 완전한 상태이며 파싱 오류가 발생하지 않는다

    - 생성자에 지정한 경로에만 저장 파일이 만들어지고, 테스트에서 임시 파일 경로를 지정하면 그 경로에 기록된다

    - 저장·복원 처리 중 외부 네트워크 연결이 1건도 발생하지 않는다'
