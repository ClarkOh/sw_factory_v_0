- key: SWF-12
  type: epic
  title: '[UC-12] 재고와 동전을 보충한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드다

    **사후조건** 지시한 음료 재고와 액면가별 동전 보유 개수가 증가하고 자판기가 판매 상태 또는 판매 중지 상태로 돌아간다


    **주 흐름**

    - 1. 관리자가 음료 종류와 수량을 지정해 재고 보충을 지시한다  `[REFILL_STOCK]`

    - 2. 시스템이 대상이 등록된 3종 음료이고 수량이 1 이상의 정수인지 검증한다

    - 3. 시스템이 지시한 수량만큼 해당 음료의 재고를 증가시킨다

    - 4. 관리자가 액면가와 개수를 지정해 동전 보충을 지시한다  `[REFILL_COINS]`

    - 5. 시스템이 대상이 100원/500원/1000원이고 개수가 1 이상의 정수인지 검증한다

    - 6. 시스템이 지시한 개수만큼 해당 액면가의 보유 개수를 증가시킨다

    - 7. 관리자가 관리 모드를 종료한다  `[EXIT_ADMIN_MODE]`

    - 8. 시스템이 판매 상태로 돌아간다


    **대안/예외 흐름**

    - 2a. 등록되지 않은 음료가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 거부 사실을 알린다  `[REFILL_STOCK]`

    - 2b. 0 이하의 수량이 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 알린다  `[REFILL_STOCK]`

    - 5a. 100원/500원/1000원 이외의 액면가나 0 이하의 개수가 하나라도 포함된 경우, 시스템은 지시 전체를 거부하고 보유량을 변경하지
    않으며 관리자에게 알린다  `[REFILL_COINS]`

    - 8a. 종료 시점에 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 돌아간다


    **인수 조건**

    - 유효한 보충 지시 후 대상 재고 증가량 == 지시 수량, 대상 액면가 보유 개수 증가량 == 지시 개수

    - 무효 항목이 1개라도 포함된 지시 처리 후 모든 재고와 모든 액면가 보유 개수의 변화량 = 0 (부분 반영 없음)

    - 거부된 지시마다 관리자에게 거부 통지가 1건 발생한다

    - 보충 종료 후 모든 종류 재고 > 0 이면 상태 이름 == 판매, 모든 종류 재고 == 0 이면 상태 이름 == 판매 중지'
