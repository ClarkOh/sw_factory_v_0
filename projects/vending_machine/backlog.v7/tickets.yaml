- key: SWF-4
  type: epic
  title: '[UC-04] 배출 완료 신호를 처리한다'
  description: '**액터** 배출 기구(하드웨어)

    **사전조건** 배출이 개시되어 특정 일련번호의 배출 완료를 기다리는 중이다

    **사후조건** 해당 음료 재고가 1 차감되고 음료 가격이 판매 금액으로 확정되며 거래가 종료된다


    **주 흐름**

    - 1. 배출 기구가 일련번호를 포함한 배출 완료 신호를 보낸다  `[DISPENSE_COMPLETE]`

    - 2. 시스템이 신호의 일련번호가 현재 기다리는 일련번호와 일치하는지 확인한다

    - 3. 시스템이 해당 음료의 재고를 1 차감하고 음료 가격을 판매 금액으로 계상한다

    - 4. 시스템이 판매 상태로 돌아가 남은 누적 투입 금액을 화면에 표시한다


    **대안/예외 흐름**

    - 2a. 일련번호가 일치하지 않는 경우, 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다  `[DISPENSE_COMPLETE]`

    - 4a. 차감 결과 모든 음료의 재고가 0인 경우, 시스템은 판매 중지 상태로 전환한다

    - 4b. 관리 모드 진입이 예약되어 있는 경우, 시스템은 배출 완료 직후 관리 모드로 전환한다


    **인수 조건**

    - 일련번호 일치 신호 1건당 해당 음료 재고 감소량 == 1

    - 일련번호 불일치 신호 처리 후 상태 이름·재고·누적 투입 금액·동전 보유량이 모두 불변이다

    - 배출 완료 후 모든 종류 재고 == 0 이면 상태 이름 == 판매 중지'
