- key: SWF-5
  type: epic
  title: '[UC-05] 배출 실패를 처리하고 고장 상태로 전환한다'
  description: '**액터** 배출 기구(하드웨어)

    **사전조건** 배출이 개시되어 배출 완료를 기다리는 중이고 개시 후 10초가 경과했다

    **사후조건** 재고가 차감되지 않고 누적 투입 금액 전액이 반환되며 자판기가 고장 상태가 된다


    **주 흐름**

    - 1. 배출 기구가 배출 개시 후 10초 안에 배출 완료 신호를 보내지 않는다  `[DISPENSE_TIMEOUT]`

    - 2. 시스템이 해당 배출을 배출 실패로 처리하고 재고를 차감하지 않는다

    - 3. 시스템이 누적 투입 금액 전액을 반환하고 지급에 사용한 동전 개수만큼 액면가별 보유 개수를 차감한다

    - 4. 시스템이 누적 투입 금액을 0으로 만든다

    - 5. 시스템이 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를 표시한다


    **대안/예외 흐름**

    - 1a. 10초 이내에 일련번호가 일치하는 배출 완료 신호가 도착한 경우, 시스템은 배출 실패로 처리하지 않고 정상 완료(UC-04)로 진행한다  `[DISPENSE_COMPLETE]`

    - 5a. 그 배출에 관리 모드 진입이 예약되어 있던 경우, 시스템은 고장 상태로 전환한 뒤 관리 모드로 진입한다  `[INSERT_ADMIN_KEY]`


    **인수 조건**

    - 배출 개시 후 10초 경과 시점까지 유효한 완료 신호가 없으면 상태 이름 == 고장

    - 배출 실패 처리 후 해당 음료 재고 변화량 == 0

    - 배출 실패 처리 시 반환 금액 == 실패 처리 직전 누적 투입 금액

    - 고장 상태 진입 시점의 누적 투입 금액 == 0'
