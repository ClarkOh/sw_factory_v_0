  title: '[검토/medium] 배출 10 초는 어떤 코드도 걸지 않는 값이고, dispense_timer 에 대한 단언은 실패할 수 없다'
  description: '**분류** vacuous-test

    **심각도** medium


    **근거**

    `self.dispense_timer = 0` 은 app/vending_machine.py:225 의 __init__ 한 곳에서만

    대입되고 다시 쓰이는 자리가 없다(전수 grep 결과 나머지는 전부 주석·문서).

    `DISPENSE_TIMER_SECONDS = 10`(:15)도 app/ 안에서 읽는 코드가 없다.

    그래서 tests/test_timing.py 의 `assert vm.dispense_timer in (0, 10)`(check_deadlines:269)

    과 `assert vm.dispense_timer == NO_DEADLINE`(:395, :486, :493, :501)은 이 구현에서

    결코 거짓이 될 수 없다. :537 의 `DISPENSE_TIMER_SECONDS == DISPENSE_DEADLINE_SECONDS`

    는 아무도 읽지 않는 상수와 테스트 상수를 견주는 단언이다.

    비교: idle_timer 는 reset_idle_timer() 가 실제로 30 을 걸므로 같은 형태의 단언이

    의미를 가진다 — 두 시한의 처지가 다르다.


    **영향**

    REQ-24 의 "10 초" 는 이 인도물 어디에도 구현되어 있지 않다. 배출 실패 판정의 기준

    시간이 3 초든 300 초든 이 소프트웨어와 테스트는 똑같이 초록이다. 기기 쪽이 초읽기를

    맡는다는 설계라면 기기에 ''언제부터 몇 초'' 를 알릴 수단이 있어야 하는데, 배출을

    개시하는 T-025 가 dispense_timer 를 걸지 않으므로 그 수단조차 없다 — 기기는 배출이

    시작된 시각을 이 계층에서 받을 수 없다.


    **제안**

    T-025 의 action 에 배출 시한을 거는 동작(dispense_timer = DISPENSE_TIMER_SECONDS)을

    넣고, 배출이 끝나는 모든 전이(T-038~T-041 · T-048 · T-049)에서 0 으로 내리도록 명세와

    구현을 함께 채운다. 그러면 기존 dispense_timer 단언이 비로소 실패할 수 있는 단언이 된다.

    기기가 초읽기를 맡는다는 경계를 유지하겠다면, 그 경계를 요구사항/INTERFACE 에 명시하고

