- key: SWF-347
  type: bug
  title: '[검토/high] 원자적 저장 요구사항(fsync · 디렉터리 fsync · 반쪽 파일 금지)이 코드에도 테스트에도 전혀 없다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    `persist()`(app/vending_machine.py:709-716)는 임시 파일에 `json.dump` 하고 `os.replace`
    만 한다.

    저장소 전체에서 `fsync` 를 찾으면 한 건도 나오지 않는다(app/ · tests/ 모두).

    REQ-80(write → fsync → rename), REQ-81(교체 후 디렉터리 fsync), REQ-82(반쪽 파일이 읽히면 안 된다)는

    UC-18 의 인수 조건("저장 호출 순서가 임시 파일 write → fsync → 원자적 rename → 디렉터리 fsync 이다",

    "쓰기 중 임의 시점에 전원 차단을 주입해도 읽어들인 파일은 항상 완전한 상태")에까지 올라와 있는데

    tests/ 에서 UC-18·REQ-80·REQ-81·REQ-82·''.tmp''·''원자'' 를 검색해도 한 건도 걸리지 않는다.

    이 요구사항을 다루던 테스트 파일은 tests/__pycache__/test_durability.pyc ·

    test_uc18_durability.pyc 로 흔적만 남아 있고 소스는 저장소에 없다.


    **영향**

    이 자판기의 요구사항 절반(REQ-22~28, 39, 68~85)이 "정전이 나도 직전 상태가 남는다" 를 전제하는데, 그 전제를 지탱하는
