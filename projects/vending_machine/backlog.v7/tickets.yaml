    REQ-82 가 요구하는 "기록 도중 전원이 끊겨도 직전에 완전히 기록된 상태가 남는다" 가 실제로는 보장되지 않는다. 커널이 rename
    을 데이터보다 먼저 디스크에 반영하면 재기동이 읽는 본 파일은 내용이 0 바이트이거나 반쪽이고, load_save() 가 None 을 돌려
    T-001 이 재고 · 동전 · 보관 중이던 손님 돈을 전부 0 으로 지운 뒤 걸려 있던 고장까지 풀어 버린다. REQ-22~REQ-28 ·
