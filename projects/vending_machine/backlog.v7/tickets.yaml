- key: SWF-15
  type: epic
  title: '[UC-15] 미반환 보관액을 확인하고 회수한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이고 미반환 보관액이 0보다 크다

    **사후조건** 관리자가 미반환 보관액을 확인하고 회수하며 회수 후에도 보유량 합계 제약이 유지된다


    **주 흐름**

    - 1. 관리자가 미반환 보관액 조회를 요청한다  `[COLLECT_COINS]`

    - 2. 시스템이 기록된 미반환 보관액 금액을 표시한다

    - 3. 관리자가 미반환 보관액 회수를 지시한다  `[COLLECT_COINS]`

    - 4. 시스템이 해당 금액에 상당하는 동전을 배출하고 액면가별 보유 개수를 그만큼 차감한다

    - 5. 시스템이 갱신된 미반환 보관액과 보유량을 표시한다


    **대안/예외 흐름**

    - 2a. 미반환 보관액이 0인 경우, 시스템은 회수를 수행하지 않고 보유량을 변경하지 않는다  `[COLLECT_COINS]`

    - 4a. 보유량 합계가 미반환 보관액보다 적은 경우, 시스템은 회수 지시를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다  `[COLLECT_COINS]`


    **인수 조건**

    - 관리 모드에서 미반환 보관액 값이 조회 가능하다

    - 미반환 보관액 회수 시 액면가별 보유 개수 감소량의 합계 금액 == 회수한 금액

    - 회수 후 보유량 합계 >= 갱신된 미반환 보관액

    - 회수 후 미반환 보관액 갱신 규칙은 요구사항에 미정의(REQ-94)이므로 보유량 합계 항등식 성립 여부로만 판정한다'
