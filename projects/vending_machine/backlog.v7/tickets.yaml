- key: SWF-357
  type: bug
  title: '[검토/high] REQ-18 보유량 합계 항등식을 계산해 보는 테스트가 저장소에 하나도 없다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    REQ-18 은 UC-01 · UC-14 · UC-18 세 유스케이스의 인수 조건에 그대로 적혀 있다

    ("동전 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 +

    누적 투입 금액 + 미반환 보관액"). 그런데 tests/ 전체에서 이 식을 세우는 코드가 없다 —

    `sales` 를 쓰는 단언은 전부 "이 전이 하나가 sales 를 얼마 올렸나" 이고

    (tests/test_fsm.py:212, 239, …), coin_total() 을 쓰는 자리는

    tests/e2e/test_durability.py:660·685·693 의 특정 시나리오 총액 네 줄뿐이다.

    항등식의 좌우변을 함께 계산하는 헬퍼도, 격자를 돌며 매 전이 뒤에 항등식을 확인하는

    테스트도 없다. (git 이력상 tests/test_ledger.py 가 있었으나 현재 트리에는 없다.)


    **영향**

    이 파이프라인이 과거에 놓친 결함(코인을 받고 거스름돈을 내주는데 보유량이 변하지

    않는다)이 정확히 이 항등식으로만 잡히는 종류다. 지금은 개별 전이가 coins 를 얼마나

    바꾸는지만 보므로, 두 전이 사이에서 돈이 새는 형태 — F-01 의 배출 실패, F-02 의

    보관액 이중 계상 — 는 전부 초록으로 통과한다. 실제로 두 결함 모두 이 공백에 그대로

    들어가 있다.


    **제안**

    tests/e2e/test_constraints.py 의 grid(자리 × 사건) 위에 항등식 확인을 얹는다 —

    기동 직후의 (coin_total − deposit) 을 ''초기 보유액'' 으로 잡고, 이후 모든 전이 뒤에

    coin_total() == 초기 보유액 + 보충액 − 회수액 + sales + credit + deposit

    이 성립하는지 단언한다. 성립하지 않는 자리가 나오면 그것이 REQ-18 이 말하는

    "이 밖의 항" 이므로 요구사항 쪽을 고칠지 구현을 고칠지 정한다.


    **참조** REQ-18, UC-01, UC-14, UC-18


