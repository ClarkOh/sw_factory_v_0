- key: SWF-1
  type: epic
  title: '[UC-01] 코인을 투입하여 누적 투입 금액을 늘린다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고, 다른 고객의 거래가 진행 중이지 않다

    **사후조건** 투입된 코인의 액면가만큼 누적 투입 금액과 해당 액면가 동전 보유 개수가 증가하고, 누적 투입 금액이 화면에 표시된다


    **주 흐름**

    - 1. 고객이 코인 투입구에 코인을 넣는다  `[INSERT_COIN]`

    - 2. 시스템이 코인의 액면가를 판정한다

    - 3. 시스템이 코인을 수납하고 해당 액면가의 동전 보유 개수를 1 증가시킨다

    - 4. 시스템이 누적 투입 금액에 그 액면가를 더한다

    - 5. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다

    - 6. 시스템이 누적 투입 금액 이상 가격이면서 재고가 1개 이상인 음료의 선택 버튼을 활성화한다


    **대안/예외 흐름**

    - 2a. 투입액이 100원/500원/1000원이 아닌 경우, 시스템은 그 코인을 수납하지 않고 즉시 그대로 반환하며 누적 투입 금액과 동전
    보유량을 변경하지 않는다  `[INSERT_COIN]`

    - 2b. 코인 인식에 실패한 경우, 시스템은 그 코인을 수납하지 않고 그대로 반환하며 누적 투입 금액과 동전 보유량을 변경하지 않는다 (인식
    실패 판정 기준은 요구사항에 미정의: REQ-91)  `[INSERT_COIN]`

    - 6a. 누적 투입 금액이 모든 음료 가격보다 작거나 해당 음료 재고가 0인 경우, 시스템은 그 음료의 선택 버튼을 비활성 상태로 유지한다


    **인수 조건**

    - 100원/500원/1000원 코인 투입 시 누적 투입 금액이 정확히 그 액면가만큼 증가한다

    - 100원/500원/1000원 코인 투입 시 해당 액면가의 보유 개수가 정확히 1 증가한다

    - 비액면가 코인 또는 인식 실패 코인 투입 후 누적 투입 금액 변화량 = 0 이고 액면가별 보유 개수 변화량 = 0 이며, 투입된 코인과
    동일한 코인이 반환구에 나온다

    - 코인 투입 처리 후 화면 표시 금액 == 누적 투입 금액

    - 동전 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 음료 가격 합 + 누적 투입 금액 + 미반환 보관액 (그 밖의 항 없음)

    - 한 거래가 진행 중인 동안 두 번째 고객 세션이 동시에 생성되지 않는다'
