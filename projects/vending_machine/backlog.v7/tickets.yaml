    REQ-88(외부 네트워크 금지)과 REQ-89(동시에 한 명)는 UC-18 의 인수 조건

    "저장·복원 처리 중 외부 네트워크 연결이 1 건도 발생하지 않는다" 와 UC-01 의 인수 조건

    "한 거래가 진행 중인 동안 두 번째 고객 세션이 동시에 생성되지 않는다" 로 검증 항목까지 적혀 있다.

