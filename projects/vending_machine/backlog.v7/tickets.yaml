  title: '[검토/high] fsync 와 디렉터리 동기화가 구현에도 테스트에도 전혀 없다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    persist()(app/vending_machine.py:709-716)는 임시 파일에 json.dump 한 뒤 os.replace 만 부른다.
    저장소 전체(app 과 tests 모두)에서 fsync 라는 문자열이 한 번도 나오지 않는다. UC-18 의 인수 조건 "저장 호출 순서가
    임시 파일 write 다음 fsync 다음 원자적 rename 다음 디렉터리 fsync 이다" 를 판정하는 테스트가 없고, tests/e2e/test_scenarios.py:1283
    test_uc18_saved_state_is_always_completely_parsable 은 전이가 완전히 끝난 정지 시점에만 파일을 읽으므로
    절반만 쓰인 파일을 볼 수 없다. 같은 UC 의 "쓰기 중 임의 시점에 전원 차단을 주입해도" 라는 인수 조건에 해당하는 주입 테스트도 없다.


    **영향**

    임시 파일 내용이 디스크에 닿기 전에 rename 만 반영될 수 있어, 정전 후 길이 0이거나 잘린 저장 파일이 남는다. 그러면 다음 기동은
    REQ-84 경로로 빠져 재고 0·동전 0·보관액 0 으로 초기화되므로 실물 재고와 동전이 장부에서 통째로 사라진다. REQ-82 가 막으려던
    바로 그 결과다.


    **제안**

    persist() 에서 임시 파일 fd 에 os.fsync 를 부르고 os.replace 이후 저장 디렉터리 fd 에도 os.fsync 를
    부르도록 고친다. 두 호출이 write, fsync, rename, dir fsync 순서로 정확히 일어나는지 감시하는 테스트를 추가한다.


