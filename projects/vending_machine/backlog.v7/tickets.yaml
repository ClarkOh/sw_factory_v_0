- key: SWF-375
  type: bug
  title: '[검토/medium] dispense_timer 는 값이 절대 바뀌지 않는 죽은 관측값이라 배출 10 초에 관한 단언이 전부 반증
    불가능하다'
  description: '**분류** vacuous-test

    **심각도** medium


    **근거**

    `dispense_timer` 는 `__init__` 에서 0 으로 놓인 뒤(app/vending_machine.py:225) 어디에서도 대입되지
    않는다. `DISPENSE_TIMER_SECONDS`(:15)도 구현 코드의 어느 줄도 참조하지 않는다(grep 결과 상수 정의와 테스트 import
    뿐). 그런데 tests/test_timing.py 는 이 값을 붙드는 것을 파일의 세 축 중 하나로 내세우고 (:20-32) `check_deadlines()`(:269)에서
    `vm.dispense_timer in (0, 10)` 을, 여러 곳에서 `vm.dispense_timer == NO_DEADLINE`(:395,
    :486, :493, :501)을 단언한다. 값이 언제나 0 이므로 이 단언들은 구현이 무엇을 하든 참이다 — 실패시킬 수 있는 구현이 존재하지
    않는다. 남는 것은 `test_the_deadline_values_handed_to_the_machine_are_the_ones_the_spec_names`(:516)의
    `DISPENSE_TIMER_SECONDS == 10` 인데, 이는 아무도 읽지 않는 상수를 테스트가 적어 둔 리터럴과 비교하는 거울이다.
    함께 짚어 둘 것: `idle_timer` 도 `reset_idle_timer()` 로 30 이 되기만 할 뿐 어떤 guard 도 읽지 않는다.
    T-036/T-079 의 guard 는 `credit > 0` 하나뿐이라, 코인 투입 1 초 뒤에 도착한 `NO_ACTION_TIMEOUT`
    도 그대로 받아들여 전액을 반환한다.


    **영향**

    REQ-24 의 10 초와 REQ-22 의 30 초 중 어느 것도 이 소프트웨어가 재거나 검사하지 않는다. 기기가 배출 시한을 3 초나 60
    초로 세도, 만료 통보를 아무 때나 보내도 자판기는 그대로 받아들이고 테스트는 전부 초록이다. 3 초로 세는 기기와 짝이 되면 정상 배출이
    매번 실패로 처리되어 자판기가 고장으로 잠기고, 60 초로 세는 기기와 짝이 되면 손님이 1 분간 돈을 물린 채 서 있게 된다. 그 계약이
    지금 어디에도 적혀 있지 않다.


    **제안**

    둘 중 하나를 택할 것. (가) 시한을 이 계층이 지도록 한다 — T-025 의 action 에 `start_dispense_timer(DISPENSE_TIMER_SECONDS)`
    를 넣어 `dispense_timer` 를 실제로 걸고, 배출이 끝나는 모든 전이에서 0 으로 내리며, 시간을 흘리는 입력(`TICK(seconds)`
    등)을 인터페이스에 추가해 "9.9 초에는 만료 없음 · 10.0 초에 만료" 를 실제로 재는 테스트를 쓴다. (나) 기기가 지도록 남긴다면
    `dispense_timer` 와 `DISPENSE_TIMER_SECONDS` 를 코드와 INTERFACE.md 의 관측 속성에서 지우고(죽은
    값을 붙드는 단언도 함께 걷고), 요구사항에 경계 문장을 명시한다 — "배출 10 초와 무조작 30 초의 초읽기는 기기가 담당하며, 제어 소프트웨어는
    기기가 보내는 DISPENSE_TIMEOUT · NO_ACTION_TIMEOUT 통보를 신뢰한다. 통보가 규정된 초 수에 맞게 오는지는 이
    소프트웨어의 검증 범위 밖이다."


