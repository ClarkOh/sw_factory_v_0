- key: SWF-372
  type: bug
  title: '[검토/high] 소진되지 않은 관리 모드 진입 예약이 재기동과 고장 경로를 넘어 살아남아, 무관한 다음 손님의 구매가 자판기를
    관리 모드로 떨'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    `admin_reserved` 를 내리는 곳은 `_action_t038`(app/vending_machine.py:2519) · `_action_t050`(:2952)
    · `reset_all()`(:691) 셋뿐이다. 그런데 예약을 세운 배출이 끝나는 경로 중 둘이 예약을 남긴 채 다른 자리로 빠진다. (1)
    T-049(예약된 배출의 시한 만료)는 의도적으로 `admin_reserved` 를 참으로 남기고 FAULTED 로 간다 (:2916-2919,
    주석: "예약은 T-050 이 이어받는다"). 그러나 `RESERVED_ADMIN_ENTRY` 를 발화시키는 코드가 `app/` 안에 한 줄도
    없다(grep: app 전체에서 이 이벤트는 전이표 등록과 주석에만 나온다). FSM 사양은 이 이벤트를 "고장 전이 직후 즉시 발화하는 내부
    이벤트" 라고 적었지만 자판기는 스스로 발화하지 않는다. 그래서 관리자는 키를 다시 꽂게 되고 그것은 T-055 로 들어가는데, `_action_t055`(:3117)는
    `admin_reserved` 를 손대지 않는다 — 그 docstring 은 "예약을 거치지 않고 곧바로 들어온 진입이라 볼 것도 내릴 것도
    없으며" 라고 전제하지만, T-049 를 거쳐 온 FAULTED 자리에서는 그 전제가 거짓이다. (2) T-056 으로 예약이 걸린 채 전원이
    끊기면 `restore()`(:730)가 저장된 `admin_reserved = True` 를 되살리고, `_action_settle_pending`(:919)은
    그 값을 건드리지 않은 채 SELLING_IDLE/OUT_OF_STOCK 로 간다. 어느 쪽이든 그 뒤 예약이 참인 채로 판매가 재개되고,
    다음 손님의 정상 구매가 완료되는 순간 `_guard_dispense_matches_admin_reserved`(:1460)가 참이 되어 T-038
    이 발화한다. tests/test_fsm.py::test_t_049 는 `assert vm.admin_reserved is True` 로 남는
    것을 오히려 확정하고, ::test_t_050 은 `RESERVED_ADMIN_ENTRY` 를 테스트가 직접 주입해 이어 붙인다. 두 전이를
    실제로 잇거나 예약이 다음 거래까지 살아남는지 보는 테스트는 없다.


    **영향**

    배출이 실패해 관리자가 와서 확인·보충을 마치고 나간 자판기, 또는 관리 키를 꽂은 채 정전을 겪은 자판기는 겉보기에 정상으로 판매를 재개한다.
    그러다 다음 손님이 음료를 사고 배출이 완료되는 순간 T-038 이 발화해 자판기가 스스로 관리 모드로 들어간다 — 관리자는 그 자리에 없다.
    손님이 넣어 둔 남은 금액은 반환구로 쏟아지고, 이후 코인은 전부 되돌아 나가며(T-024) 누군가 EXIT_ADMIN_MODE 를 넣기 전까지
    자판기는 팔지 않는다. 사실상 정비 한 번에 그다음 한 대 분량의 영업이 조용히 멈춘다.


    **제안**

    요구사항에 예약의 수명 규칙을 명시할 것 — "관리 모드 진입 예약은 그 예약을 건 배출이 끝나는 시점(완료 · 실패 · 정전 정산)에 반드시
    소진된다. 예약된 배출이 실패로 처리된 경우 자판기는 고장 상태로 전환한 직후 스스로 관리 모드로 들어가며, 그 진입이 예약을 소진한다. 재기동
    시 진행 중이던 배출이 정산되면 그 배출에 걸려 있던 예약도 함께 해제한다." 구현 쪽에서는 T-049 가 고장 전이 후 RESERVED_ADMIN_ENTRY
    를 자체 발화하도록 하거나, 최소한 T-055 와 T-003/T-004/T-006 의 action 이 `admin_reserved = False`
    를 포함해야 한다. 테스트에는 T-049 → T-055 → T-075 → T-077 → 다음 구매까지 이어지는 시나리오와, T-056 → POWER_OFF
