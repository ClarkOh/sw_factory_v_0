  title: '[UC-09] 고장 상태에서 고객 조작을 거부한다'
  description: '**액터** 고객

    **사전조건** 자판기가 고장 상태이고 누적 투입 금액이 0이다

    **사후조건** 코인이 수납되지 않고 그대로 반환되며 자판기는 고장 상태를 유지한다


    **주 흐름**

    - 1. 시스템이 화면에 고장임을 표시하고 관리자 호출 안내를 표시한다

    - 2. 고객이 코인 투입구에 코인을 넣는다  `[INSERT_COIN]`

    - 3. 시스템이 코인을 받아들이지 않고 그대로 되돌려 보낸다

    - 4. 시스템이 모든 음료 선택 버튼을 비활성 상태로 유지한다


    **대안/예외 흐름**

    - 2a. 고객이 음료 선택 버튼을 누른 경우, 시스템은 배출을 개시하지 않고 상태·재고·금액을 변경하지 않는다  `[SELECT_DRINK]`

    - 2b. 고객이 반환 레버를 조작한 경우, 시스템은 반환할 누적 투입 금액이 0이므로 아무것도 반환하지 않는다  `[PULL_RETURN_LEVER]`

    - 2c. 전원이 껐다 켜진 경우, 시스템은 고장 상태로 복원되며 고장이 해제되지 않는다  `[POWER_ON]`


    **인수 조건**

    - 고장 상태에서 화면에 고장 표시와 관리자 호출 안내가 동시에 표시된다

    - 고장 상태 코인 투입 후 누적 투입 금액 변화량 = 0, 액면가별 보유 개수 변화량 = 0, 투입된 코인이 그대로 반환된다

    - 고장 상태에서 3종 모든 선택 버튼의 활성 여부 == 비활성

    - 고장 상태에서 전원 재투입 후 상태 이름 == 고장'
