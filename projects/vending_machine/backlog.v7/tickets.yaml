- key: SWF-6
  type: epic
  title: '[UC-06] 무효한 배출 완료 신호를 지연 배출로 기록한다'
  description: '**액터** 배출 기구(하드웨어)

    **사전조건** 자판기가 해당 일련번호의 배출 완료를 더 이상 기다리지 않는다(실패 처리 완료 또는 다른 일련번호 대기 중)

    **사후조건** 상태·재고·금액이 변경되지 않고 지연 배출 기록이 음료 종류와 함께 남는다


    **주 흐름**

    - 1. 배출 기구가 일련번호를 포함한 배출 완료 신호를 보낸다  `[DISPENSE_COMPLETE]`

    - 2. 시스템이 그 일련번호가 현재 기다리는 일련번호와 일치하지 않음을 판정한다

    - 3. 시스템이 상태·재고·누적 투입 금액·동전 보유량을 변경하지 않는다

    - 4. 시스템이 그 신호를 어느 음료였는지와 함께 지연 배출로 기록한다


    **대안/예외 흐름**

    - 2a. 배출 실패로 처리한 뒤에 도착한 신호인 경우에도, 시스템은 상태·재고·금액을 변경하지 않고 지연 배출로 기록한다  `[DISPENSE_COMPLETE]`

    - 4a. 동일 일련번호의 신호가 중복 도착한 경우, 시스템은 상태·재고·금액을 변경하지 않는다  `[DISPENSE_COMPLETE]`


    **인수 조건**

    - 무효 신호 처리 전후 상태 이름·종류별 재고·누적 투입 금액·액면가별 보유량이 모두 동일하다

    - 무효 신호 1건당 지연 배출 기록이 1건 추가되고 그 기록에 음료 종류가 포함된다

    - 지연 배출 기록은 관리자 확인 전까지 미확인 상태로 조회된다'
