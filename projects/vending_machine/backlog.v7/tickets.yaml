- key: SWF-17
  type: epic
  title: '[UC-17] 정전 후 재기동하여 상태를 복원한다'
  description: '**액터** 전원 공급 장치

    **사전조건** 저장 파일에 직전에 완전히 기록된 상태가 존재하거나 저장 파일이 없다

    **사후조건** 저장된 상태가 복원되고 정전·재기동 규칙이 적용된 상태로 자판기가 기동한다


    **주 흐름**

    - 1. 전원이 끊긴다  `[POWER_OFF]`

    - 2. 전원이 다시 공급된다  `[POWER_ON]`

    - 3. 시스템이 저장 파일에서 상태를 복원한다

    - 4. 시스템이 누적 투입 금액을 0으로 설정하고 정전 시점에 투입 중이던 금액을 물리적으로 반환하지 않는다

    - 5. 시스템이 그 금액을 미반환 보관액으로 기록하고 동전 보유량에 그대로 남긴다

    - 6. 시스템이 배출 일련번호를 저장된 값에 이어서 증가하도록 설정한다

    - 7. 시스템이 보존된 음료 종류별 재고만으로 판매 상태 또는 판매 중지 상태를 판정한다


    **대안/예외 흐름**

    - 3a. 저장된 상태가 고장 상태인 경우, 시스템은 고장 상태로 기동하고 고장을 해제하지 않는다  `[POWER_ON]`

    - 4a. 배출을 개시한 뒤 완료 전에 전원이 끊긴 경우, 시스템은 해당 음료의 재고를 1 차감하고 그 음료 가격을 판매된 금액으로 계상하며,
    미반환 보관액을 (정전 시점 누적 투입 금액 − 음료 가격)으로 계상한다  `[POWER_ON]`

    - 3b. 저장 파일이 없거나 손상된 경우, 시스템은 초기 상태(재고 0, 동전 0, 보관액 0)로 기동하고 관리자에게 알린다  `[POWER_ON]`


    **인수 조건**

    - 재기동 직후 누적 투입 금액 == 0

    - 정전 시점 투입 금액에 대한 물리적 반환이 발생하지 않고 미반환 보관액 == 정전 시점 누적 투입 금액(배출 중 정전이 아닌 경우)

    - 배출 중 정전 시 해당 음료 재고 감소량 == 1, 판매 금액 증가분 == 음료 가격, 미반환 보관액 == 정전 시점 누적 투입 금액 −
    음료 가격

    - 재기동 후 첫 배출의 일련번호 > 저장 파일에 기록되어 있던 일련번호

    - 재기동 후 상태 이름은 보존된 종류별 재고만으로 결정되며 외부 입력으로 재고가 설정되지 않는다

    - 저장 파일 부재/손상 시 재고 == 0, 동전 보유량 == 0, 미반환 보관액 == 0 이고 관리자 통지가 1건 발생한다

    - 저장된 상태가 고장이면 재기동 후 상태 이름 == 고장'
