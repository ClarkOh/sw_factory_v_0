- key: SWF-363
  type: bug
  title: '[검토/high] 배출 중 정전 정산이 이미 정산된 음료 가격을 미반환 보관액에서 한 번 더 빼서 보관액이 음수가 되고, 그 파일이
    다음 기동에'
  description: '**분류** missing-rule

    **심각도** high


    **근거**

    app/vending_machine.py:479 settle_pending_dispense() 가 `self.deposit += self.credit
    - price` 를 실행한다(REQ-75 문구 그대로). 그런데 배출 개시 전이 T-025(_action_t025, app/vending_machine.py:1265)는
    pay_change() 로 거스름돈을 내주며 credit 을 0 으로 만든 뒤 persist() 한다. 즉 AWAITING_DISPENSE_COMPLETE
    로 저장되는 credit 에는 음료 가격이 이미 들어 있지 않다. 가장 흔한 경로 — 손님이 500 원을 넣고 500 원 음료를 고른 뒤 배출
    중 정전 — 에서 저장된 credit 은 0 이므로 재기동 T-003 의 정산은 deposit = 0 - 500 = -500 을 만들고 _action_settle_pending
    이 그 값을 그대로 persist() 한다. 그 다음 기동에서는 load_save()(app/vending_machine.py:136)의 `_nonneg_int(restored["deposit"])`
    이 거짓이 되어 파일이 손상으로 판정되고 T-001 이 reset_all() 로 재고 · 동전 · 보관액을 전부 0 으로 지운 뒤 save_file_missing_or_corrupt
    만 남긴다. 배출 중에 다른 손님이 코인을 넣은 경우도 같은 뺄셈으로 새어 나간다 — tests/e2e/test_durability.py:663-686
    의 실제 흐름에서 보유 동전 2100 원 · 판매 600 원 · 보관액 400 원 · 초기 500 원이 되어 REQ-18 항등식이 정확히 음료
    가격 600 원만큼 어긋난다(2100 != 500 + 600 + 0 + 400)


    **영향**

    평범한 배출 실패(정전) 한 번이 미반환 보관액을 음수로 만든다. 음수 보관액은 T-072 · T-073 · T-074 의 어느 guard
    에도 걸리지 않으므로 관리자의 보관액 회수 지시가 통지 없이 조용히 무시되고, T-067 의 회수 하한(coin_total - denom*count
    >= deposit)이 음수 기준으로 느슨해져 남겨 두어야 할 손님 돈까지 걷어 갈 수 있다. 그리고 그 다음 전원 재투입에서 저장 파일이
    손상으로 읽혀 재고 장부 · 동전 보유량 · 보관 중이던 손님 돈의 기록이 전부 0 으로 지워진다 — 걸려 있던 고장(fault_pending)도
