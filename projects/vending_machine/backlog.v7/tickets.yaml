  title: '[T-038] AWAITING_DISPENSE_COMPLETE --DISPENSE_COMPLETE--> ADMIN_MODE'
  description: 'FSM 전이 `T-038` 구현


    - 출발: `AWAITING_DISPENSE_COMPLETE`

    - 이벤트: `DISPENSE_COMPLETE`

    - 도착: `ADMIN_MODE`

    - 가드: `serial == pending_serial && admin_reserved`

    - 동작: `stock[pending_drink] -= 1; sales += price(pending_drink); refund(credit);
    coins -= used_coins(credit); credit = 0; pending = none; admin_reserved = false;
    show_admin_menu(); persist()`


    유스케이스: [UC-11] 전용 키로 관리 모드에 진입한다


    인수 조건:

    - 관리 모드 진입 완료 시점의 누적 투입 금액 == 0

    - 진입 전 누적 투입 금액 > 0 이면 반환 금액 == 진입 요청 시점의 누적 투입 금액

    - 상태 이름 == 고장 인 상태에서 키 삽입 후 상태 이름 == 관리 모드

    - 배출 대기 중 키 삽입 시 즉시 상태가 바뀌지 않고 관리 모드 진입 예약 == 참 이며, 배출 완료 직후 상태 이름 == 관리 모드

    - 예약 진입 시 반환 금액 == 배출 중 투입된 금액이고 개시된 배출의 음료 가격은 판매 금액에 계상된다

    - 예약 진입 중 배출 실패 시 상태 전이 순서가 고장 → 관리 모드 이다


