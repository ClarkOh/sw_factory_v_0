    배출 중 정전이면 coins 합계는 500, sales 500, credit 0, deposit -500 이다. 이어 T-003 이 persist()
    하고, 다음 기동에서 load_save(app/vending_machine.py:135)의 `_nonneg_int(deposit)` 검사가
