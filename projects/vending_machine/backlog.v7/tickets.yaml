    - 1b. 배출 완료를 기다리는 중에 반환 레버가 조작된 경우, 시스템은 진행 중인 배출의 거스름돈과 섞지 않고 그 시점의 누적 투입 금액만
    반환한다  `[PULL_RETURN_LEVER]`


    **인수 조건**

    - 반환 금액 == 레버 조작 직전의 누적 투입 금액

    - 반환 후 누적 투입 금액 == 0 이고 화면 표시 금액 == 0

    - 액면가별 보유 개수 감소량의 합계 금액 == 반환 금액'
