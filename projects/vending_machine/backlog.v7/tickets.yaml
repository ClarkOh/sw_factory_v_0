- key: SWF-351
  type: bug
  title: '[검토/medium] 미반환 보관액 회수가 액면가 구성 실패로 아무 일도 하지 않고, 관리자에게 알리지도 않는다'
  description: '**분류** incomplete-guard

    **심각도** medium


    **근거**

    T-072 의 guard(`_guard_collect_coins_collect_deposit`, app/vending_machine.py:2185)는

    `deposit > 0 && coin_total >= deposit` 만 본다 — 그 금액을 실제로 만들 수 있는지는 보지 않는다.

    action(`_action_t072`, app/vending_machine.py:3577)은 `collect_deposit(vm.deposit)`
    을 부르는데,

    `collect_deposit()`(app/vending_machine.py:411-413)은 `used_coins()` 가 None 이면

    "장부를 한 칸도 건드리지 않고" 그냥 돌아간다. 통지도 없다.

    예: deposit=200, coins={1000:1} → coin_total 1000 >= 200 이라 guard 는 참,

    그러나 200 을 1000 원짜리로는 만들 수 없어 아무것도 나오지 않는다. 그런데 전이는 성립했으므로

    `persist()` 까지 부르고 화면에는 줄지 않은 보관액이 그대로 표시된다.

    tests/test_fsm.py:1664-1684(test_t_072)은 deposit 600 · coins 600 처럼 정확히 떨어지는 경우만
    본다.

    T-074 가 잡는 것은 `coin_total < deposit` 뿐이라 이 구멍을 덮지 못한다.


    **영향**

    관리자가 미반환 보관액 회수를 지시했는데 동전이 나오지 않고 화면도 그대로이며 거부 통지도 없다. 지시가 먹혔는지 안 먹혔는지 알 수 없어
    같은 지시를 반복하게 되고, REQ-71("관리자가 확인하고 회수할 수 있다")이 특정 보유 구성에서 성립하지 않는다.


    **제안**

    T-072 의 guard 에 `can_compose(coins, deposit)` 를 추가하고, 그 부정을 받는 거부 전이(보유 동전 구성으로
    그 금액을 만들 수 없다는 통지)를 하나 더 등록한다. 요구사항 19/23 에 "회수 금액을 보유 액면가로 정확히 구성할 수 없으면 지시를
    거부하고 관리자에게 알린다" 를 명시한다.


    **참조** REQ-71, REQ-72, REQ-94, T-072, T-074, tests/test_fsm.py::test_t_072


