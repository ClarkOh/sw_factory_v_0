    - 배출 실패 확인 후 진행 중인 배출의 일련번호와 음료 필드가 비어 있다

    - 배출 실패 확인 후 관리 모드를 종료하면 상태 이름 != 고장

    - 배출 실패 미확인 상태로 관리 모드를 종료하면 상태 이름 == 고장

    - 관리자 확인 없이 전원 재투입만으로는 상태 이름이 고장에서 바뀌지 않는다


