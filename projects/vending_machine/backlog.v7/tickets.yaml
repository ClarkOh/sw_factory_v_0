- key: SWF-373
  type: bug
  title: '[검토/high] REQ-80 · REQ-81(fsync → 원자적 교체 → 디렉터리 fsync)은 구현이 없고, 그것을 확인하는
    유일한 테스트'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    `persist()`(app/vending_machine.py:712-719)는 임시 파일에 json 을 쓰고 곧바로 `os.replace`
    를 부른다. 저장소 전체에 `fsync` 도 `flush` 도 한 줄이 없다(grep "fsync|flush" app/ → 결과 없음). REQ-80
    의 "그 내용을 디스크에 강제로 동기화한 뒤(fsync)" 와 REQ-81 의 "교체 후 디렉터리 항목도 동기화한다" 는 어느 코드에도 도달하지
    못했다. 이를 검사하는 tests/e2e/test_durability.py::test_uc18_save_syscall_order_is_write_fsync_replace_dir_fsync
    는 `@pytest.mark.xfail(strict=True)`(:518-526)로 표시되어 있어, 요구사항이 구현되지 않은 상태가 ''초록''
    으로 보고된다. 같은 파일의 다른 테스트들이 확인하는 것은 파이썬 수준의 원자적 교체(반쪽 파일이 본 파일 자리에 오지 않는 것)까지이고,
    커널 캐시에 남은 데이터 블록 문제는 그 자로 잴 수 없다.


    **영향**

    실제 기기에서는 rename 이 먼저 디스크에 반영되고 데이터 블록은 캐시에 남을 수 있다. 그 순간 정전이 나면 본 파일 자리에 길이 0
    이거나 잘린 JSON 이 남고, `load_save()` 가 `None` 을 돌려 T-001 이 재고 · 동전 · 미반환 보관액을 전부 0
    으로 지우고 `fault_pending` 까지 푼다. 디렉터리 fsync 가 없으면 이름 바꾸기 자체가 디스크에 닿지 않아 한 세대 뒤처진
    장부로 기동한다. 요구사항 22~28 · 39 · 68~85 가 전부 "정전이 나도 직전 상태가 남는다" 를 전제하는데, 그 전제를 지탱하는
    유일한 장치가 없는 채로 출고된다.


    **제안**

    `persist()` 를 임시 파일 write → `fp.flush()` → `os.fsync(fp.fileno())` → `os.replace`
    → 디렉터리 fd 를 열어 `os.fsync`(불가능한 플랫폼에서는 교체된 본 파일 fsync) 순서로 채우고, tests/e2e/test_durability.py
    의 xfail 표시를 걷을 것. 구현 전이라면 이 요구사항이 미구현이라는 사실이 릴리스 판단에 올라가야 하며, xfail 로 초록에 묻히게
    두어서는 안 된다.


    **참조** REQ-27, REQ-80, REQ-81, REQ-82, UC-18, app/vending_machine.py:712, tests/e2e/test_durability.py::test_uc18_save_syscall_order_is_write_fsync_replace_dir_fsync


    _자동 검토 단계가 생성했습니다. 사람이 판단해 주세요._'
