    **심각도** medium


    **근거**

    app/vending_machine.py:712-719 persist() 는 임시 파일에 json.dump 한 뒤 곧바로

    os.replace 를 부른다 — fp.flush() 도 os.fsync() 도 디렉터리 동기화도 없다.

    저장소 전체에 os.fsync 호출은 테스트의 monkeypatch 말고는 존재하지 않는다.

    이 요구를 확인하는 테스트

    tests/e2e/test_durability.py::test_uc18_save_syscall_order_is_write_fsync_replace_dir_fsync

    는 :518 에서 `@pytest.mark.xfail(strict=True)` 로 꺼져 있다. 즉 "테스트 전부 통과"

    상태는 이 요구가 **깨져 있음을 확인한 결과**다.


    **영향**

    원자적 rename 만으로는 데이터 블록이 캐시에 남은 채 이름 바꾸기만 디스크에 반영될 수

    있어, 정전 후 길이 0 이거나 잘린 JSON 이 본 파일 자리에 남는다. 그러면 load_save() 가

    None 을 돌려 T-001 이 재고·동전·미반환 보관액을 전부 0 으로 지우고 fault_pending

    까지 풀어 버린다 — 배출 기구가 고장난 자판기가 다시 팔기 시작하고, 관리자가 보관 중이던

    손님 돈의 기록이 사라진다. REQ-22~28 · REQ-39 · REQ-68~85 가 전부 이 저장의 내구성에

    기대고 있다.


    **제안**

    persist() 를 write → fp.flush() → os.fsync(fp.fileno()) → os.replace →

    디렉터리 fd fsync(불가 플랫폼에서는 교체된 본 파일 fsync) 순서로 채우고,

    해당 테스트의 xfail 표시를 걷는다(strict=True 이므로 구현이 채워지면 XPASS 로 강제된다).


    **참조** REQ-80, REQ-81, REQ-82, UC-18, tests/e2e/test_durability.py::test_uc18_save_syscall_order_is_write_fsync_replace_dir_fsync


