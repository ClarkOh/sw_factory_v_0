- key: SWF-337
  type: bug
  title: '[검토/high] fsync 가 한 줄도 없다 — 저장 내구성 요구사항이 구현에도 테스트에도 도달하지 못했다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    persist()(app/vending_machine.py:709-716)는 임시 파일에 json.dump 하고 os.replace 할 뿐,
    임시 파일의 fsync 도 디렉터리 항목 동기화도 하지 않는다. INTERFACE.md:134 도 "임시 파일 후 os.replace" 까지만
    적고 있다. 저장소 전체에서 ''fsync'' 문자열은 소스 파일 어디에도 없다. UC-18 인수 조건 "저장 호출 순서가 임시 파일 write
    → fsync → 원자적 rename → 디렉터리 fsync 이다" 와 "쓰기 중 임의 시점에 전원 차단을 주입해도 읽어들인 파일은 항상 완전한
    상태" 를 확인하는 테스트는 존재하지 않는다(tests/ 의 소스 3개 어디에도 없고, 예전에 있던 tests/test_uc18_durability.py
    와 tests/e2e/test_scenarios.py 는 .pyc 만 남고 사라졌다). 같은 지적이 v6 에서 이미 SWF-294 로 제기됐고
    v7 재생성으로 되돌아갔다.


    **영향**

    정전이 이 제품의 1급 시나리오인데(요구사항 22~28), 직전 전이의 저장이 디스크에 닿았다는 보장이 없다. 커밋되지 않은 rename 이
    데이터보다 먼저 내려앉는 파일 시스템에서는 재기동 시 빈 내용의 본 파일을 읽어 ''손상'' 판정 → 재고·동전 전량 0 초기화(T-001)로
    이어진다. 결과가 F-01 과 같다.


    **제안**

    persist() 를 write → fp.flush() → os.fsync(fp.fileno()) → os.replace → 디렉터리 fd
    에 대한 os.fsync 순서로 고치고, 그 호출 순서를 관측하는 테스트(예: os.fsync 를 감싸 호출 순서를 기록)와 임의 시점 중단
    후 파일이 항상 파싱 가능한지 확인하는 테스트를 tests/ 에 되살린다.


