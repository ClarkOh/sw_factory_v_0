    **근거**

    app/vending_machine.py:712-719 persist() 는 임시 파일에 json.dump 한 뒤 곧바로 os.replace
    를 부른다 — 임시 파일 fsync 도, 교체 후 디렉터리 fsync 도 없다. 저장소 전체에서 os.fsync 호출은 tests/e2e/test_durability.py
    의 감시 래퍼에만 있고 app/ 아래에는 0 건이다. 이를 확인하는 test_uc18_save_syscall_order_is_write_fsync_replace_dir_fsync
    는 tests/e2e/test_durability.py:518 의 @pytest.mark.xfail(strict=True) 로 표시되어 있고,
    그 사유란에 "fsync 하지 않은 채 os.replace 를 부르고 교체 뒤에도 아무것도 못박지 않는다" 라고 적혀 있다. 즉 요구사항이
    구현되지 않았음을 저장소가 스스로 기록해 둔 채 초록으로 통과하고 있다


