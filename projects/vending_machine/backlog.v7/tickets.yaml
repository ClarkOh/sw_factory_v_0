- key: SWF-368
  type: bug
  title: '[검토/medium] REQ-52 의 "고장 상태로 전환한 뒤 관리 모드로 들어간다" 에서 뒷부분을 아무도 발화시키지 않는다'
  description: '**분류** untraced-req

    **심각도** medium


    **근거**

    FSM 은 RESERVED_ADMIN_ENTRY 를 "예약된 관리 모드 진입이 고장 전이 직후 즉시 발화하는 내부 이벤트" 로 정의한다. 그러나
    _action_t049(app/vending_machine.py:2916-2919)는 pay_change · fault_pending · show_fault_and_call_admin
    · persist 네 줄뿐이고 그 이벤트를 발화시키지 않으며, handle()(app/vending_machine.py:737)에도 내부 이벤트를
    이어 돌리는 자리가 없다. 저장소 전체에서 RESERVED_ADMIN_ENTRY 를 주입하는 곳은 tests/test_fsm.py:1184
    의 수동 호출과 격자 테스트의 이벤트 목록뿐이다. test_t_049(tests/test_fsm.py:1152-1176)는 state ==
    FAULTED 에서 단언을 끝내고, test_t_050(:1179)은 이미 FAULTED 인 자판기를 생성자로 찍어 시작한다 — 배출 실패가
    실제로 관리 모드까지 이어지는 한 흐름을 확인하는 테스트가 없다


    **영향**

    UC-11 의 인수 조건 "예약 진입 중 배출 실패 시 상태 전이 순서가 고장 → 관리 모드 이다" 는 두 조각으로 나뉘어 각각 통과할 뿐
    이어 붙지 않는다. 실제 기기에서는 배출 대기 중 키를 꽂아 둔 관리자가 배출 실패 후 고장 화면 앞에 그대로 남는다 — 키를 뽑았다 다시
    꽂아야(T-055) 들어갈 수 있으므로 못 들어가는 것은 아니지만, 예약해 둔 진입이 조용히 무시되는 것이라 REQ-48 · REQ-52 가
    약속한 동작이 아니다


    **제안**

    _action_t049 마지막에 예약이 남아 있으면 RESERVED_ADMIN_ENTRY 를 이어 돌리도록 하거나, 그 발화를 기기 쪽 책임으로
