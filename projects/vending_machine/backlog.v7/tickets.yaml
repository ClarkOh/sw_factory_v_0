- key: SWF-3
  type: epic
  title: '[UC-03] 배출 진행 중에 코인을 투입한다'
  description: '**액터** 고객

    **사전조건** 배출이 개시되어 배출 완료를 기다리는 중이다

    **사후조건** 투입된 코인이 수납되어 누적 투입 금액에 더해지고, 그 금액은 진행 중인 배출의 거스름돈에 포함되지 않는다


    **주 흐름**

    - 1. 고객이 배출 진행 중에 코인 투입구에 코인을 넣는다  `[INSERT_COIN]`

    - 2. 시스템이 코인을 정상 수납하고 해당 액면가의 보유 개수를 1 증가시킨다

    - 3. 시스템이 누적 투입 금액에 그 액면가를 더한다

    - 4. 시스템이 갱신된 누적 투입 금액을 화면에 표시한다

    - 5. 시스템이 배출 완료 후에도 그 금액을 누적 투입 금액으로 유지한다


    **대안/예외 흐름**

    - 2a. 비액면가 또는 인식 실패 코인인 경우, 시스템은 수납하지 않고 그대로 반환하며 누적 투입 금액과 보유량을 변경하지 않는다  `[INSERT_COIN]`

    - 5a. 진행 중인 배출이 배출 실패로 처리된 경우, 시스템은 배출 중 투입된 금액을 포함한 누적 투입 금액 전액을 반환한다  `[DISPENSE_TIMEOUT]`


    **인수 조건**

    - 배출 중 투입 금액은 진행 중인 배출에서 지급된 거스름돈에 포함되지 않는다(지급 거스름돈 == 버튼 누름 시점 누적 금액 − 음료 가격)

    - 배출 완료 직후 누적 투입 금액 == 배출 중 투입된 금액의 합

    - 배출 완료 후 남은 누적 투입 금액으로 다음 구매가 가능하다'
