- key: SWF-16
  type: epic
  title: '[UC-16] 배출 실패를 확인하여 고장 표시를 해제한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 고장 상태에서 관리 모드로 진입해 있고 진행 중이던 배출 기록이 남아 있다

    **사후조건** 진행 중이던 배출 기록이 정리되고 고장 표시가 해제된다


    **주 흐름**

    - 1. 시스템이 진행 중이던 배출의 일련번호와 음료를 관리자에게 표시한다

    - 2. 관리자가 배출 실패를 확인한다  `[CONFIRM_DISPENSE_FAILURE]`

    - 3. 시스템이 진행 중이던 배출 기록을 정리한다

    - 4. 시스템이 고장 표시를 해제한다

    - 5. 관리자가 관리 모드를 종료한다  `[EXIT_ADMIN_MODE]`

    - 6. 시스템이 재고에 따라 판매 상태 또는 판매 중지 상태로 전환한다


    **대안/예외 흐름**

    - 5a. 배출 실패를 확인하지 않은 채 관리 모드를 나간 경우, 시스템은 다시 고장 상태로 전환하고 화면에 고장 표시와 관리자 호출 안내를
    표시한다  `[EXIT_ADMIN_MODE]`

    - 5b. 관리 모드 종료 조작 방법이 요구사항에 미정의(REQ-95)이므로 키 제거를 종료 이벤트로 간주한다  `[EXIT_ADMIN_MODE]`

    - 6a. 전원을 껐다 켜기만 한 경우, 시스템은 고장 상태를 유지하며 고장을 해제하지 않는다  `[POWER_ON]`


    **인수 조건**

    - 배출 실패 확인 후 진행 중인 배출의 일련번호와 음료 필드가 비어 있다

    - 배출 실패 확인 후 관리 모드를 종료하면 상태 이름 != 고장

    - 배출 실패 미확인 상태로 관리 모드를 종료하면 상태 이름 == 고장

    - 관리자 확인 없이 전원 재투입만으로는 상태 이름이 고장에서 바뀌지 않는다'
