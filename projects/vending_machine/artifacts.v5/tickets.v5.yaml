- key: SWF-1
  type: epic
  title: '[UC-01] 코인을 투입한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이고 관리 모드가 아니다.

    **사후조건** 유효 코인의 액면가가 누적 투입 금액과 해당 액면가 보유 개수에 각각 더해지고, 화면에 갱신된 누적 투입 금액이 표시된다.


    **주 흐름**

    - 1. 고객이 코인 투입구에 코인을 넣는다.

    - 2. 시스템이 코인을 100원/500원/1000원 중 하나로 인식하고 수납한다.

    - 3. 시스템이 누적 투입 금액에 액면가를 더하고 해당 액면가 보유 개수를 1 증가시킨다.

    - 4. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.

    - 5. 시스템이 누적 투입 금액과 재고에 따라 각 음료 선택 버튼의 활성/비활성을 갱신한다.

    - 6. 시스템이 변경된 상태 전체를 저장 파일에 기록한다.


    **대안/예외 흐름**

    - 2a. 코인이 100원/500원/1000원 이외의 액면가이거나 인식에 실패한 경우 시스템은 그 코인 자체를 즉시 그대로 반환하고 누적 투입
    금액과 보유량을 변경하지 않는다.

    - 2b. 자판기가 판매 중지 상태인 경우 시스템은 코인을 받지 않고 그 코인 자체를 그대로 반환하며 보유량을 변경하지 않는다.

    - 2c. 자판기가 관리 모드인 경우 시스템은 코인을 받지 않고 그 코인 자체를 그대로 반환하며 보유량을 변경하지 않는다.

    - 2d. 배출 진행 중에 코인이 투입된 경우 시스템은 정상 수납하여 누적 투입 금액과 보유량에 더하되, 진행 중인 배출의 거스름돈에는 포함하지
    않는다(UC-05 참조).


    **인수 조건**

    - 판매 상태에서 100원 투입 → 누적 투입 금액이 이전 값 + 100이고, 100원 보유 개수가 이전 값 + 1이다.

    - 판매 상태에서 500원, 1000원 투입 각각에 대해 동일 규칙이 성립한다.

    - 50원(비액면가) 투입 → 동일 코인이 즉시 반환되고 누적 투입 금액·보유량 모두 변화 없음.

    - 인식 실패 코인 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 모두 변화 없음.

    - 판매 중지 상태에서 500원 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 변화 없음.

    - 관리 모드에서 500원 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 변화 없음.

    - 코인 투입 직후 화면 표시값 == 누적 투입 금액.

    - 코인 투입 직후 저장 파일의 누적 투입 금액·보유량이 메모리 상태와 일치한다.'
