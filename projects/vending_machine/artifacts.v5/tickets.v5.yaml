- key: SWF-17
  type: epic
  title: '[UC-17] 상태를 원자적으로 저장한다'
  description: '**액터** 운영 전원(전원 공급)

    **사전조건** 자판기가 상태 전이를 완료하여 저장 파일에 기록을 시작한다.

    **사후조건** 저장 파일에는 완전히 기록된 상태만 존재하며, 기록 도중 전원이 끊겨도 직전에 완전히 기록된 상태가 남는다.


    **주 흐름**

    - 1. 시스템이 상태 전이를 마치고 현재 상태 전체를 저장 파일에 기록한다.

    - 2. 시스템이 기록이 완전히 끝난 뒤에만 그 내용을 유효한 저장 파일로 확정한다.

    - 3. 재기동 시 시스템이 저장 파일을 읽어 완전히 기록된 상태를 복원한다.


    **대안/예외 흐름**

    - 1a. 기록 도중 전원이 끊긴 경우 시스템은 재기동 시 직전에 완전히 기록된 상태를 복원하고, 절반만 쓰인 내용은 상태로 읽지 않는다.

    - 2a. 완전히 기록된 상태가 한 번도 없는 경우(첫 기록 중 정전) 시스템은 UC-16 2b에 따라 초기 상태로 기동하고 관리자에게 알린다.


    **인수 조건**

    - 상태 S1 저장 완료 후 S2 기록 도중 강제 종료 → 재기동 시 복원된 상태 == S1.

    - 상태 S2 기록 완료 후 강제 종료 → 재기동 시 복원된 상태 == S2.

    - 저장 파일에 절반만 쓰인 바이트열을 주입 → 재기동 시 그 내용이 상태로 읽히지 않고 초기 상태 + 관리자 알림.

    - 모든 상태 전이(코인 투입, 배출 개시, 배출 완료, 배출 실패, 반환, 자동 반환, 관리 모드 진입/종료, 보충, 회수, 조정, 지연
    배출 기록, 판매 중지 전환) 직후 저장 파일 내용이 메모리 상태 전체와 일치한다.'
