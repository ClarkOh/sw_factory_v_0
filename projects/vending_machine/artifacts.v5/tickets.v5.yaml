- key: SWF-5
  type: epic
  title: '[UC-05] 배출 진행 중 코인을 투입한다'
  description: '**액터** 고객

    **사전조건** 배출이 개시되어 시스템이 배출 완료 신호를 대기 중이고, 자판기가 관리 모드가 아니다.

    **사후조건** 투입 코인이 수납되어 보유량에 더해지고, 배출 완료 후 누적 투입 금액에 그 금액이 남아 있으며, 진행 중 배출의 거스름돈은
    버튼 누른 시점 기준으로만 계산된다.


    **주 흐름**

    - 1. 고객이 배출 완료 대기 중에 유효 코인을 투입한다.

    - 2. 시스템이 코인을 정상 수납하여 해당 액면가 보유 개수를 1 증가시키고 누적 투입 금액에 더한다.

    - 3. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.

    - 4. 시스템이 배출 완료 신호를 받으면 버튼 누른 시점의 (누적 − 가격)만큼만 거스름돈을 반환한다.

    - 5. 시스템이 배출 중 투입된 금액을 누적 투입 금액으로 유지한 채 판매 상태로 돌아가고 상태를 저장 파일에 기록한다.

    - 6. 고객이 남은 누적 투입 금액으로 다음 구매를 진행하거나 반환 레버를 조작한다.


    **대안/예외 흐름**

    - 1a. 투입 코인이 비액면가 또는 인식 실패인 경우 시스템은 그 코인 자체를 즉시 반환하고 금액·보유량을 변경하지 않는다.

    - 4a. 배출이 실패로 처리된 경우 시스템은 배출 중 투입 금액을 포함한 누적 투입 금액 전액을 반환한다(UC-04).

    - 4b. 관리 모드 진입이 예약된 경우 시스템은 배출 완료/실패 직후 배출 중 투입된 금액만 반환하고 관리 모드로 전환한다(UC-10).


    **인수 조건**

    - 가격 500, 누적 700에서 버튼 누름 후 대기 중 1000원 투입 → 완료 시 거스름돈 200 반환, 완료 후 누적 투입 금액 ==
    1000.

    - 대기 중 투입된 1000원에 대해 1000원 보유 개수 +1.

    - 완료 후 화면 표시값 == 1000.

    - 완료 후 누적 1000, 재고 ≥ 1인 가격 ≤ 1000 음료 버튼이 활성화된다.'
