  type: bug
  title: '[검토/high] REQ-65(미반환 보관액 회수)는 어떤 전이에도 도달하지 못하고, 이전 지적은 그 결함을 고정하는 테스트로 닫혔다'
  description: '**분류** untraced-req

    **심각도** high


    **근거**

    retained 를 줄이는 코드가 전 저장소에 없다. app/vending_machine.py 에서 retained 는

    _restore_idle:415 와 _restore_pending:426 의 `+=`, reset_state:288 의 0 초기화뿐이다.

    T-051 의 가드(_collect_ok:477)는 `coin_total() - sum(d*v) >= retained` 이므로 보관액에

    해당하는 금액은 정의상 절대 회수할 수 없다. REQ-64(확인)는 T-050 으로 구현되어 있지만

    REQ-65(회수)에 대응하는 이벤트·전이·테스트가 하나도 없다.

    tests/e2e/test_scenarios.py::test_uc14_collect_coins_respects_retained 는 이를 결함이
    아니라

    명세로 적어 두었다(841~852행 docstring: "기록을 줄이는 이벤트도 FSM T-001~T-057 에 없다 ...

    보관액 기록은 그대로라는 것 — 까지만 고정한다"). git show 862c1f7 을 보면 SWF-186

    "[검토/high] 미반환 보관액은 기록만 늘고 회수할 수단이 없어 동전이 영구히 잠긴다" 커밋이

    tests/e2e/test_scenarios.py 만 110줄 고쳤고 app/ 은 한 줄도 바뀌지 않았다.


    **영향**

    정전이 거래 도중 날 때마다 retained 는 늘기만 하고 절대 줄지 않는다. 그만큼의 동전이 회수 불가로

    잠기고, 회수 가능액(coin_total − retained)은 계속 줄어든다. 정전이 반복되면 보관액이 보유

    합계에 육박해 관리자가 매출을 회수할 수 없게 되고, 결국 거스름돈 구성이 실패해 모든 구매가

    T-014(전액 반환)로 거부되는 사실상 고장 상태가 된다. 저장 파일을 지우는 것 말고는 복구 수단이 없다.


    **제안**

    REQ-65 의 [모호]를 다음 문장으로 확정한다. "관리자가 미반환 보관액을 회수하면 회수한 금액만큼

    미반환 보관액 기록을 줄인다. 미반환 보관액이 0이 될 때까지만 회수할 수 있다."

    그에 대응하는 이벤트(예: COLLECT_RETAINED amount:int)와 전이를 ADMIN 에 추가하고,

    "보관액 회수 → retained 감소 → 그만큼 다시 일반 회수 가능"을 확인하는 테스트를 넣는다.

    테스트로 현 동작을 고정한 SWF-186 은 미해결로 되돌린다.


    **참조** REQ-23, REQ-64, REQ-65, REQ-66, T-050, T-051, UC-14, tests/e2e/test_scenarios.py::test_uc14_collect_coins_respects_retained


