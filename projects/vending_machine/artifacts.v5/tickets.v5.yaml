    **심각도** high


    **근거**

    retained 를 줄이는 코드가 어디에도 없다. app/vending_machine.py 에서 retained 는 생성자, reset_state(0으로
    초기화), _restore_idle/_restore_pending 의 += 에서만 바뀐다. 동전 회수 T-051 의 가드(_collect_ok,
    app/vending_machine.py:420)는 coin_total() - 회수액 >= retained 를 요구하므로, 보관액에 해당하는
    금액은 어떤 회수 지시로도 꺼낼 수 없다. tests/e2e/test_scenarios.py::test_uc14_collect_coins_respects_retained
    는 경계에서 거부되는 것까지만 확인하고, 보관액이 줄어드는 경로는 한 번도 시험하지 않는다.


    **영향**

    정전이 날 때마다 그 시점의 누적 투입 금액만큼 동전이 영구 동결된다. 정전이 반복되면 잠긴 금액이 계속 쌓여 거스름돈으로 쓸 수 있는 동전이
    말라붙고, 자판기는 T-014(거스름돈 부족 → 전액 반환)만 반복하며 사실상 아무것도 팔지 못하게 된다. 관리자는 그 돈을 꺼낼 방법이 없다.


    **제안**

    REQ-65 의 [모호]를 없애는 문장을 원본 요구사항에 확정한다. ''관리자가 미반환 보관액을 회수하면 회수한 금액만큼 미반환 보관액 기록을
    줄인다. 미반환 보관액 회수는 동전 회수와 별도의 지시로 하며, 회수 후 보유량 합계는 남은 미반환 보관액 이상이어야 한다.'' 그에 맞춰
    ADMIN 에 보관액 회수 이벤트/전이를 추가한다.


    **참조** REQ-63, REQ-64, REQ-65, REQ-66, T-050, T-051, tests/e2e/test_scenarios.py::test_uc14_collect_coins_respects_retained


