- key: SWF-2
  type: epic
  title: '[UC-02] 음료 선택 버튼 활성 상태를 확인한다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이다.

    **사후조건** 각 음료 버튼의 활성 여부가 (누적 투입 금액 ≥ 가격) AND (재고 ≥ 1) 조건과 일치한다.


    **주 흐름**

    - 1. 고객이 화면에서 3종 음료의 선택 버튼과 누적 투입 금액을 본다.

    - 2. 시스템이 각 음료에 대해 누적 투입 금액이 가격 이상이고 재고가 1 이상인 경우에만 버튼을 활성화하여 표시한다.


    **대안/예외 흐름**

    - 2a. 누적 투입 금액이 음료 가격 미만인 경우 시스템은 해당 버튼을 비활성 상태로 표시한다.

    - 2b. 해당 음료 재고가 0인 경우 시스템은 누적 투입 금액과 무관하게 해당 버튼을 비활성 상태로 표시한다.

    - 2c. 고객이 비활성 버튼을 누른 경우 시스템은 아무 배출도 하지 않고 상태·재고·금액을 변경하지 않는다.


    **인수 조건**

    - 3종 음료의 가격이 서로 다르다.

    - 재고가 음료 종류별로 정수 개수로 조회된다.

    - 누적 = 가격 − 100, 재고 ≥ 1 → 버튼 비활성.

    - 누적 = 가격, 재고 ≥ 1 → 버튼 활성.

    - 누적 ≥ 가격, 재고 = 0 → 버튼 비활성.

    - 비활성 버튼 누름 → 배출 개시 없음, 재고·누적 투입 금액·보유량 변화 없음.'
