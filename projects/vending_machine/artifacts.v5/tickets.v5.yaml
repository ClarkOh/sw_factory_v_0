- key: SWF-188
  type: bug
  title: '[검토/medium] 30초·10초·2초를 실제로 재는 주체가 어디에도 없고 어떤 테스트도 시간을 확인하지 않는다'
  description: '**분류** untraced-req

    **심각도** medium


    **근거**

    idle_timer 와 dispense_timer 는 상수를 대입만 하는 관측용 필드다(app/vending_machine.py:260-270).
    이 값을 줄이거나 만료 시 IDLE_TIMEOUT/DISPENSE_TIMEOUT 을 발생시키는 코드는 app/ 어디에도 없고, app/__main__.py
    도 시간을 다루지 않는다. 모든 테스트는 타임아웃 이벤트를 직접 주입한 뒤 idle_timer == 30, dispense_timer ==
    10 같은 대입값만 확인한다. 버튼 누름부터 배출 개시까지 2초(REQ-59, UC-03 acceptance)를 재는 단언은 저장소 전체에
    하나도 없다.


    **영향**

    요구사항 13·14·21이 지정한 시간 규칙 전체가 검증되지 않은 채 하드웨어/외부 호출자에게 암묵적으로 떠넘겨져 있다. 실제 기기에서 30초
    자동 반환이 영영 오지 않거나 배출 타임아웃이 10초가 아니어도 이 테스트 묶음은 전부 초록이다.


    **제안**

    시간 판정의 책임 소재를 요구사항에 명시한다. ''자판기는 자체 시계로 무조작 30초와 배출 대기 10초를 측정해 각각 자동 반환과 배출 실패를
    개시한다.'' 그리고 주입 가능한 시계(clock)를 인터페이스에 두어 경과 시간으로 IDLE_TIMEOUT/DISPENSE_TIMEOUT
    이 발생하는지, 버튼 누름부터 start_dispense 까지가 2초 이하인지 테스트에서 확인한다.


