    - 2a. 100/500/1000 이외의 액면가가 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.

    - 2b. 0 이하 또는 정수가 아닌 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.


    **인수 조건**

    - 보유 (100:0, 500:0, 1000:0)에 {100:10, 500:4} 보충 → 보유 (100:10, 500:4, 1000:0),
    보유량 합계 3000.

    - {100:10, 50:1} 보충 → 거부, 보유량 변화 없음, 관리자 알림 발생.

    - {500:0} 보충 → 거부, 보유량 변화 없음, 관리자 알림 발생.

    - 보충 후 보유량 합계 == 초기 보유액 + 보충된 금액 − 회수된 금액 + 판매된 가격 합 + 누적 투입 금액 + 미반환 보관액.

    - 성공 시 저장 파일의 액면가별 보유 개수가 메모리와 일치한다.'
