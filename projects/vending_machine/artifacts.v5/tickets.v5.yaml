- key: SWF-18
  type: epic
  title: '[UC-18] 저장 파일 위치를 지정하여 자판기를 생성한다'
  description: '**액터** 테스트 또는 운영 설치자

    **사전조건** 자판기 인스턴스가 아직 생성되지 않았다.

    **사후조건** 지정한 경로를 저장 파일로 사용하는 자판기가 생성되어 있고, 해당 경로의 상태로 기동되어 있다.


    **주 흐름**

    - 1. 액터가 저장 파일 경로를 지정하여 자판기 생성을 요청한다.

    - 2. 시스템이 지정된 경로를 저장 파일로 설정한다.

    - 3. 시스템이 그 경로에서 상태를 복원하거나(UC-16) 파일이 없으면 초기 상태로 기동하고 관리자에게 알린다.

    - 4. 시스템이 이후 모든 상태 전이를 그 경로에 기록한다.


    **대안/예외 흐름**

    - 1a. 테스트가 임시 파일 경로를 지정한 경우 시스템은 동일하게 그 경로를 사용하며, 테스트 간 상태가 섞이지 않는다.

    - 2a. 지정된 경로에 기록할 수 없는 경우(디렉터리 없음, 권한 없음) 시스템은 생성을 실패로 보고하고 기동하지 않는다.

    - 3a. 지정된 경로의 파일이 손상된 경우 시스템은 초기 상태로 기동하고 관리자에게 알린다.


    **인수 조건**

    - 임시 파일 P1로 생성 후 코인 투입 → P1에 상태가 기록되고 다른 경로에는 기록되지 않는다.

    - 임시 파일 P1로 생성한 자판기의 상태가 임시 파일 P2로 생성한 자판기에 영향을 주지 않는다.

    - 존재하지 않는 경로 P1로 생성 → 초기 상태(재고 0, 동전 0, 보관액 0) 기동, 관리자 알림 발생.

    - 쓰기 불가 경로로 생성 → 생성 실패가 보고된다.

    - 생성·기동 과정에서 외부 네트워크 접근이 0회이다.'
