    **근거**

    T-028(app/vending_machine.py:671, _to_admin_after_dispense(deduct_stock=False))은
    배출 실패인데도 sold_total 에 음료 가격을 더하고 그 금액은 반환하지 않는다. FSM 표의 T-028 notes 스스로 ''[미규정
    REQ-41] 실패 시 ... 본 모델은 반환''이라고 적어 미규정 구간임을 인정한다. 요구사항 14는 배출 실패 시 전액 반환(REQ-29)을,
    요구사항 16은 예약 진입 시 가격의 판매 확정(REQ-41)을 지시하는데, 두 규칙이 겹치는 경우가 문서에 없다. tests/test_fsm.py::test_t_028
