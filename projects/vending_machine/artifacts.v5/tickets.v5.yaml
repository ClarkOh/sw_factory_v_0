    없다(app/_fsm_spec.py 의 T-035~T-041). 게다가 T-013 이 stop_idle_timer() 를 부른 뒤 T-029/T-024
    중 어느 쪽도 타이머를 다시 걸지 않으므로 SOLD_OUT 진입 시 idle_timer 는 None 이다. 유일한 출구는 T-037(관리자
    키 삽입)뿐이다. 테스트는 이 상태를 만들어 놓고도(tests/test_fsm.py::test_t_024 는 `vm.credit == 100`
    유지를 단언) 그 돈을 어떻게 돌려받는지 묻지 않고, 불변식 테스트 test_invariant_timers_are_armed_whenever_they_must_expire
    는 `state == SELLING` 인 경우만 본다.


    **영향**

    마지막 재고의 배출을 기다리는 동안 코인을 넣은 손님은 그 돈을 반환 레버로도, 30초 무조작 자동 반환으로도 돌려받지 못한다. 화면에는 그
    금액이 계속 표시되지만(display == credit) 자판기는 판매도 반환도 하지 않는다. 관리자가 키를 꽂는 순간(T-037) 그 돈이
    반환구로 나오는데, 그때 손님은 이미 없다. 복도 자판기에서 가장 흔한 민원이 되고, 실제로 돈이 없어진다.


    **제안**

    요구사항 15(REQ-36) 아래에 다음 문장을 추가한다. "판매 중지 상태로 전환할 때 누적 투입 금액이 0보다 크면 자판기는 그 금액 전액을
    먼저 반환하고 누적 투입 금액을 0으로 만든 뒤 판매 중지 상태가 된다." (반환하지 않고 보관하기로 정한다면, 판매 중지 상태에서도 반환
    레버와 30초 무조작 자동 반환이 동작한다는 규칙을 대신 명시하고 SOLD_OUT 에 해당 전이를 추가해야 한다.)


