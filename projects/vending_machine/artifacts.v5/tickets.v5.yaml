- key: SWF-7
  type: epic
  title: '[UC-07] 투입 금액을 반환받는다'
  description: '**액터** 고객

    **사전조건** 자판기가 판매 상태이다.

    **사후조건** 누적 투입 금액 전액이 반환되어 0이 되고, 사용한 동전이 보유량에서 차감되며, 화면에 0이 표시된다.


    **주 흐름**

    - 1. 고객이 반환 레버를 조작한다.

    - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 반환한다.

    - 3. 시스템이 사용한 동전을 액면가별로 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든다.

    - 4. 시스템이 화면에 0을 표시하고 모든 선택 버튼을 비활성화하며 상태를 저장 파일에 기록한다.


    **대안/예외 흐름**

    - 1a. 누적 투입 금액이 0인 상태에서 레버를 조작한 경우 시스템은 아무것도 반환하지 않고 상태를 변경하지 않는다.

    - 1b. 누적 투입 금액이 0보다 큰 상태에서 코인 투입·음료 선택·반환 레버 조작이 30초 동안 없는 경우 시스템은 누적 투입 금액 전액을
    자동 반환하고 거래를 종료하며 2~4단계와 동일하게 처리한다.

    - 1c. 배출 완료 대기 중에 레버를 조작한 경우의 처리는 [모호 — 요구사항 미명시]로 남기되, 판매 상태가 아니므로 즉시 반환하지 않는다.


    **인수 조건**

    - 판매 상태, 누적 1500에서 레버 조작 → 반환 1500, 누적 투입 금액 0, 보유량 합계 −1500, 화면 표시 0.

    - 누적 0에서 레버 조작 → 반환 0, 보유량·상태 변화 없음.

    - 누적 300에서 30초 무조작 → 30초 경과 시점에 300 자동 반환, 누적 투입 금액 0, 상태 판매 상태.

    - 누적 300에서 29초에 코인 투입 → 자동 반환 없음, 타이머가 재시작되어 이후 30초 무조작 시 반환.

    - 반환 후 저장 파일의 누적 투입 금액 == 0.'
