- key: SWF-15
  type: epic
  title: '[UC-15] 관리 모드를 종료한다'
  description: '**액터** 관리자

    **사전조건** 자판기가 관리 모드이다.

    **사후조건** 자판기가 판매 상태이거나, 모든 음료 재고가 0이면 판매 중지 상태이며, 그 상태가 저장 파일에 기록되어 있다.


    **주 흐름**

    - 1. 관리자가 보충을 마치고 관리 모드 종료를 지시한다. [모호] 종료 판정 조건(전용 키 제거 등)이 요구사항에 명시되지 않음 — 본
    유스케이스는 전용 키 제거를 종료 지시로 가정한다.

    - 2. 시스템이 음료 종류별 재고를 확인한다.

    - 3. 시스템이 재고가 1 이상인 음료가 하나라도 있으면 판매 상태로 전환한다.

    - 4. 시스템이 누적 투입 금액 0을 화면에 표시하고 상태를 저장 파일에 기록한다.


    **대안/예외 흐름**

    - 3a. 모든 음료 재고가 0인 경우 시스템은 판매 중지 상태로 전환한다.

    - 1a. 보충·회수 지시가 거부된 직후 종료를 지시한 경우에도 시스템은 2~4단계와 동일하게 처리한다.


    **인수 조건**

    - 재고 (5,0,0)에서 종료 → 상태 이름 == 판매 상태.

    - 재고 (0,0,0)에서 종료 → 상태 이름 == 판매 중지.

    - 종료 후 누적 투입 금액 == 0, 화면 표시 0.

    - 종료 후 저장 파일의 상태 이름이 메모리 상태와 일치한다.'
