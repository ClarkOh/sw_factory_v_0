  description: '**분류** missing-rule

    **심각도** high


    **근거**

    T-024(DISPENSING --DISPENSE_DONE--> SOLD_OUT, vending_machine.py:490 _t024 → _complete_dispense)는
    credit 을 0으로 만들지 않는다. SOLD_OUT 에서 고객이 쓸 수 있는 이벤트는 T-035(코인 즉시 반환), T-040(버튼 무시),
    T-041(레버 무시, action 없음)뿐이고, SOLD_OUT + IDLE_TIMEOUT 전이는 아예 없다. 남은 credit 을 돌려주는
    유일한 경로는 관리자 키(T-037)다. FSM T-024 note 가 이 공백을 ''[미규정 REQ-36] ... 문서 범위대로 credit
    은 유지''라고 스스로 적고 있고, T-037 note 는 ''credit > 0 은 T-024 경로에서만 발생 가능''이라고 적어 이 상태가
    실재함을 인정한다. tests/test_fsm.py::test_t_024 는 ''assert vm.credit == 100'' 으로 이 갇힘을
    기대값으로 못박았다


    **영향**

    고객이 배출을 기다리는 동안 1000원을 넣었는데 그 구매가 마지막 재고였다면, 자판기는 판매 중지가 되고 그 1000원은 반환 레버로도,
    30초 자동 반환으로도 돌아오지 않는다. 관리자가 다음에 키를 꽂을 때까지 화면에는 1000이 계속 떠 있고 코인은 자판기 안에 있다. 사무실
    복도 자판기에서 가장 자주 들어올 민원이다


    **제안**

    요구사항에 다음 문장을 추가하십시오. ''자판기가 판매 중지 상태로 전환될 때 누적 투입 금액이 0보다 크면 그 전액을 반환하고 누적 투입
    금액을 0으로 만든다. 판매 중지 상태에서는 누적 투입 금액이 항상 0이다.'' (또는 대안으로 ''판매 중지 상태에서도 반환 레버와 30초
    무조작 자동 반환은 동작한다.'') 어느 쪽이든 UC-08 2a 의 [모호] 표시를 지우고 T-024 와 SOLD_OUT 의 PULL_LEVER/IDLE_TIMEOUT
    전이를 그에 맞게 고쳐야 합니다


