    인수 조건:

    - 가격 500 음료, 누적 700에서 버튼 누름 → 음료 배출, 재고 −1, 200원 반환, 보유량 합계 −200, 누적 투입 금액 0.

    - 가격 500 음료, 누적 500에서 버튼 누름 → 음료 배출, 재고 −1, 반환 0원.

    - 버튼 누름 시각부터 배출 개시 시각까지 ≤ 2초.

    - 배출 개시마다 부여된 일련번호가 직전 일련번호와 다르다.

    - 거스름돈 200 필요, 100원 보유 0개·500원 보유 0개 → 배출 없음, 재고 변화 없음, 누적 투입 금액 전액 반환, 누적 투입
    금액 0, 판매 상태.

    - 거스름돈 반환 후 액면가별 보유 개수 감소량 == 지급에 사용한 액면가별 동전 수.

    - 거래 종료 후 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 가격 합 + 누적 투입 금액 + 미반환 보관액.

    - 배출 개시 직후와 완료 직후 각각 저장 파일이 현재 상태(진행 중 배출 일련번호·음료 포함)와 일치한다.


