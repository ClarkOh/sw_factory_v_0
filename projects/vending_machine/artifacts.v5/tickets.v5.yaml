    delayed_log 가 메모리에 그대로 남아 있으므로, 저장 파일에 없는 값이 "복원된 것처럼" 보인다. cold_machine() 으로
    진짜 새 객체를 만드는 곳은 test_uc17_atomic_save_keeps_last_complete_state 와 test_uc16_restart_with_missing_or_corrupt_save_file
