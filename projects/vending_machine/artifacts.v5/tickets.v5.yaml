    경우(T-005)와 0인 경우(T-006)만 덮는다. 음수면 어느 가드에도 걸리지 않아 handle 이 None 을 돌려주고 상태는 UNINITIALIZED
    로 남는다. load_save(app/vending_machine.py:76)는 키 존재와 stock/coins 가 dict 인지만 보므로,
    진행 중 배출의 음료 재고가 0으로 기록된 파일이나 pending 에 drink 키가 없는 파일은 손상으로 판정되지 않는다. 후자는 T-005
    가드 평가 중 KeyError 로 예외까지 난다.


    **영향**

    그런 저장 파일을 만나면 자판기는 기동도 못 하고 초기 상태 알림도 내지 않은 채 모든 이벤트를 무시한다. 요구사항 28은 손상 파일이면 초기
    상태로 기동하고 관리자에게 알리라고 했는데, 그 경로에 들어가지 못한다.


    **제안**

    요구사항 28의 ''손상''을 내용 정합성까지 포함하도록 넓힌다. ''저장 파일의 항목이 서로 모순되는 경우(예: 진행 중 배출의 음료 재고가
    0)에도 손상으로 보고 초기 상태로 기동한 뒤 관리자에게 알린다.'' 그에 맞춰 load_save 의 검증을 스키마와 정합성까지 확장한다.


    **참조** REQ-77, REQ-78, REQ-79, T-002, T-005, T-006, tests/e2e/test_scenarios.py::test_uc16_restart_with_missing_or_corrupt_save_file


