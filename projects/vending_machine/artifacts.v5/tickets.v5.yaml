- key: SWF-198
  type: bug
  title: '[검토/medium] REQ-21 합계식은 배출 중에 성립하지 않는데, 불변식 테스트가 명세에 없는 항을 더해 통과시킨다'
  description: '**분류** untraced-req

    **심각도** medium


    **근거**

    REQ-21 은 "어느 시점에나" 보유량 합계가 (초기 + 보충 − 회수 + 판매합 + 누적 투입 + 보관액)이며

    "이 밖의 항은 없다"고 못박는다. 그런데 T-013(_t013:522)은 버튼 누름 시점에 credit 을 0 으로

    만들고 pending.change 로 옮기며, 음료 가격은 배출 완료(T-023) 전까지 sold_total 에 들어가지 않는다.

    그래서 DISPENSING 동안 coin_total 은 우변보다 정확히 (pending.change + 가격)만큼 크다.

    예: 동전 보충 1000, 500 투입 → coin_total 1500. A(300) 버튼 → credit 0, sold_total 0 이므로

    REQ-21 우변은 1000, 좌변은 1500 이다.

    tests/e2e/test_scenarios.py 의 money_rhs():95 는 이 차이를 메우려고 `pending_value(vm)`

    (= change + price)를 우변에 더한다. 이 항은 요구사항이 명시적으로 배제한 항이고, 구현의 동작에서

    역산해 온 것이지 명세에서 나온 것이 아니다. 결과적으로 이 저장소에서 가장 강한 회계 보증인

    assert_money 가 REQ-21 이 아니라 "REQ-21 + 구현이 만든 항"을 검사한다.


    **영향**

