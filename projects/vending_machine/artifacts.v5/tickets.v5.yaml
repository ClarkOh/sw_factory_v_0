    REQ-04 를 다음 중 하나로 확정한다. "배출 완료를 기다리는 동안 화면에는 아직 정산되지 않은 금액(버튼 시점 누적 + 배출 중 투입
    금액)을 표시한다" 또는 "배출 완료를 기다리는 동안 화면에는 배출 중 투입된 금액만 표시하며 버튼을 누른 즉시 0을 표시한다." 정한 쪽으로
