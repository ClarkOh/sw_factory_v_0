  description: '**분류** guessed-spec

    **심각도** low


    **근거**

    _t013(app/vending_machine.py:522-530)은 credit 을 0 으로 만들면서 display 를 갱신하지 않는다 (FSM
    T-013 의 action 에도 display() 가 없다). 그래서 700 투입 후 버튼을 누르면 credit == 0, display ==
    700 이다. 이어서 _t029(:562-566)는 `display = credit` 으로 덮어써서, 배출 중 100원을 넣으면 화면이 700
    에서 100 으로 떨어진다(자판기가 물고 있는 손님 돈은 800). 즉 T-013 은 "미정산 누적도 누적이다", T-029 는 "화면 누적만
    누적이다"라는 서로 다른 해석을 쓰고 있다. 배출 대기 중 display 를 확인하는 테스트는 하나도 없다 — test_uc05_coin_during_dispensing_survives_the_transaction:622
