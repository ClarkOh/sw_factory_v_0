  title: '[검토/medium] 정전 시나리오가 살아 있는 객체를 그대로 재사용해 ''냉기동''을 모사하지 않는다'
  description: '**분류** vacuous-test

    **심각도** medium


    **근거**

    tests/e2e/test_scenarios.py 의 정전 흐름 대부분이 같은 vm 객체에 POWER_LOST 를 흘린 뒤 곧바로 POWER_ON
    을 흘린다(test_uc16_restart_moves_credit_to_retained:1361-1363, test_uc14_collect_coins_respects_retained:1117-1118/1172-1173/1189-1190,
