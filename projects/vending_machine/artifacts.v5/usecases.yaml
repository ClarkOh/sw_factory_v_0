usecases:
- id: UC-01
  title: 코인을 투입한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 관리 모드가 아니다.
  postcondition: 유효 코인의 액면가가 누적 투입 금액과 해당 액면가 보유 개수에 각각 더해지고, 화면에 갱신된 누적 투입 금액이 표시된다.
  main_flow:
  - 1. 고객이 코인 투입구에 코인을 넣는다.
  - 2. 시스템이 코인을 100원/500원/1000원 중 하나로 인식하고 수납한다.
  - 3. 시스템이 누적 투입 금액에 액면가를 더하고 해당 액면가 보유 개수를 1 증가시킨다.
  - 4. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.
  - 5. 시스템이 누적 투입 금액과 재고에 따라 각 음료 선택 버튼의 활성/비활성을 갱신한다.
  - 6. 시스템이 변경된 상태 전체를 저장 파일에 기록한다.
  alt_flows:
  - 2a. 코인이 100원/500원/1000원 이외의 액면가이거나 인식에 실패한 경우 시스템은 그 코인 자체를 즉시 그대로 반환하고 누적 투입
    금액과 보유량을 변경하지 않는다.
  - 2b. 자판기가 판매 중지 상태인 경우 시스템은 코인을 받지 않고 그 코인 자체를 그대로 반환하며 보유량을 변경하지 않는다.
  - 2c. 자판기가 관리 모드인 경우 시스템은 코인을 받지 않고 그 코인 자체를 그대로 반환하며 보유량을 변경하지 않는다.
  - 2d. 배출 진행 중에 코인이 투입된 경우 시스템은 정상 수납하여 누적 투입 금액과 보유량에 더하되, 진행 중인 배출의 거스름돈에는 포함하지
    않는다(UC-05 참조).
  acceptance:
  - 판매 상태에서 100원 투입 → 누적 투입 금액이 이전 값 + 100이고, 100원 보유 개수가 이전 값 + 1이다.
  - 판매 상태에서 500원, 1000원 투입 각각에 대해 동일 규칙이 성립한다.
  - 50원(비액면가) 투입 → 동일 코인이 즉시 반환되고 누적 투입 금액·보유량 모두 변화 없음.
  - 인식 실패 코인 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 모두 변화 없음.
  - 판매 중지 상태에서 500원 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 변화 없음.
  - 관리 모드에서 500원 투입 → 동일 코인이 반환되고 누적 투입 금액·보유량 변화 없음.
  - 코인 투입 직후 화면 표시값 == 누적 투입 금액.
  - 코인 투입 직후 저장 파일의 누적 투입 금액·보유량이 메모리 상태와 일치한다.
  requirements:
  - REQ-01
  - REQ-02
  - REQ-03
  - REQ-04
  - REQ-16
  - REQ-17
  - REQ-19
  - REQ-20
  - REQ-37
  - REQ-72
  - REQ-85
- id: UC-02
  title: 음료 선택 버튼 활성 상태를 확인한다
  actor: 고객
  precondition: 자판기가 판매 상태이다.
  postcondition: 각 음료 버튼의 활성 여부가 (누적 투입 금액 ≥ 가격) AND (재고 ≥ 1) 조건과 일치한다.
  main_flow:
  - 1. 고객이 화면에서 3종 음료의 선택 버튼과 누적 투입 금액을 본다.
  - 2. 시스템이 각 음료에 대해 누적 투입 금액이 가격 이상이고 재고가 1 이상인 경우에만 버튼을 활성화하여 표시한다.
  alt_flows:
  - 2a. 누적 투입 금액이 음료 가격 미만인 경우 시스템은 해당 버튼을 비활성 상태로 표시한다.
  - 2b. 해당 음료 재고가 0인 경우 시스템은 누적 투입 금액과 무관하게 해당 버튼을 비활성 상태로 표시한다.
  - 2c. 고객이 비활성 버튼을 누른 경우 시스템은 아무 배출도 하지 않고 상태·재고·금액을 변경하지 않는다.
  acceptance:
  - 3종 음료의 가격이 서로 다르다.
  - 재고가 음료 종류별로 정수 개수로 조회된다.
  - 누적 = 가격 − 100, 재고 ≥ 1 → 버튼 비활성.
  - 누적 = 가격, 재고 ≥ 1 → 버튼 활성.
  - 누적 ≥ 가격, 재고 = 0 → 버튼 비활성.
  - 비활성 버튼 누름 → 배출 개시 없음, 재고·누적 투입 금액·보유량 변화 없음.
  requirements:
  - REQ-04
  - REQ-05
  - REQ-06
  - REQ-07
  - REQ-08
- id: UC-03
  title: 음료를 구매한다
  actor: 고객
  precondition: 자판기가 판매 상태이고, 선택하려는 음료의 버튼이 활성화되어 있다.
  postcondition: 음료 1개가 배출되고, 해당 음료 재고가 1 감소하며, 버튼 누른 시점의 (누적 투입 금액 − 가격)만큼 거스름돈이
    반환되고 보유량에서 차감되며, 자판기가 판매 상태로 돌아간다.
  main_flow:
  - 1. 고객이 활성화된 음료 선택 버튼을 누른다.
  - 2. 시스템이 버튼을 누른 시점의 누적 투입 금액에서 음료 가격을 뺀 거스름돈을 계산한다.
  - 3. 시스템이 보유 동전으로 거스름돈을 만들 수 있는지 확인한다.
  - 4. 시스템이 새 일련번호를 부여하고 2초 이내에 배출을 개시하며, 상태를 저장 파일에 기록한다.
  - 5. 시스템이 배출 완료 신호를 받는다.
  - 6. 시스템이 해당 음료 재고를 1 차감하고 음료 가격을 판매된 금액으로 확정한다.
  - 7. 거스름돈이 0보다 크면 시스템이 거스름돈을 반환하고 사용한 동전을 액면가별로 보유 개수에서 차감한다.
  - 8. 시스템이 판매 상태로 돌아가고 상태를 저장 파일에 기록한다.
  alt_flows:
  - 3a. 거스름돈을 만들 동전이 부족한 경우 시스템은 배출하지 않고 누적 투입 금액 전액을 반환하며, 사용한 동전을 보유 개수에서 차감하고 누적
    투입 금액을 0으로 만든 뒤 판매 상태로 돌아간다.
  - 5a. 배출 개시 후 10초 안에 유효한 배출 완료 신호를 받지 못한 경우 UC-04(배출 실패)로 진행한다.
  - 5b. 배출 완료 대기 중 코인이 투입된 경우 UC-05로 진행한다.
  - 5c. 배출 완료 대기 중 관리자 키가 꽂힌 경우 UC-10으로 진행한다.
  - 5d. 도착한 배출 완료 신호의 일련번호가 현재 대기 중인 일련번호와 다른 경우 시스템은 이를 무시하고 UC-06으로 기록한 뒤 계속 대기한다.
  - 6a. 배출 완료 후 모든 음료 재고가 0이 된 경우 시스템은 거스름돈 반환 후 판매 중지 상태로 전환한다(UC-08).
  - 7a. 거스름돈이 0인 경우 시스템은 거스름돈을 반환하지 않는다.
  acceptance:
  - 가격 500 음료, 누적 700에서 버튼 누름 → 음료 배출, 재고 −1, 200원 반환, 보유량 합계 −200, 누적 투입 금액 0.
  - 가격 500 음료, 누적 500에서 버튼 누름 → 음료 배출, 재고 −1, 반환 0원.
  - 버튼 누름 시각부터 배출 개시 시각까지 ≤ 2초.
  - 배출 개시마다 부여된 일련번호가 직전 일련번호와 다르다.
  - 거스름돈 200 필요, 100원 보유 0개·500원 보유 0개 → 배출 없음, 재고 변화 없음, 누적 투입 금액 전액 반환, 누적 투입 금액
    0, 판매 상태.
  - 거스름돈 반환 후 액면가별 보유 개수 감소량 == 지급에 사용한 액면가별 동전 수.
  - 거래 종료 후 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 가격 합 + 누적 투입 금액 + 미반환 보관액.
  - 배출 개시 직후와 완료 직후 각각 저장 파일이 현재 상태(진행 중 배출 일련번호·음료 포함)와 일치한다.
  requirements:
  - REQ-09
  - REQ-10
  - REQ-14
  - REQ-18
  - REQ-21
  - REQ-22
  - REQ-23
  - REQ-31
  - REQ-32
  - REQ-59
  - REQ-72
  - REQ-73
  - REQ-84
  - REQ-85
- id: UC-04
  title: 배출 실패를 처리한다
  actor: 고객
  precondition: 배출이 개시되어 시스템이 배출 완료 신호를 대기 중이다.
  postcondition: 재고가 차감되지 않고, 누적 투입 금액 전액이 반환되어 0이 되며, 자판기가 판매 상태이다.
  main_flow:
  - 1. 시스템이 배출 개시 후 10초 동안 유효한 배출 완료 신호를 받지 못한다.
  - 2. 시스템이 배출 실패로 처리하고 해당 음료 재고를 차감하지 않는다.
  - 3. 시스템이 누적 투입 금액 전액(배출 중 투입된 금액 포함)을 반환하고 사용한 동전을 보유 개수에서 차감한다.
  - 4. 시스템이 누적 투입 금액을 0으로 만들고 판매 상태로 돌아가며 상태를 저장 파일에 기록한다.
  - 5. 고객이 반환된 금액을 수령한다.
  alt_flows:
  - 1a. 10초 이내에 현재 일련번호와 일치하는 배출 완료 신호가 도착한 경우 UC-03 6단계로 진행한다.
  - 3a. 전액 반환에 필요한 동전이 부족한 경우 시스템은 보유 동전으로 지급 가능한 조합을 우선 지급하며, 그 외 처리는 [모호 — 요구사항
    미명시]로 남긴다.
  - 4a. 관리 모드 진입이 예약된 경우 시스템은 판매 상태 대신 관리 모드로 전환한다(UC-10).
  - 4b. 배출 실패 처리 후 지연된 배출 완료 신호가 도착한 경우 시스템은 상태·재고·금액을 변경하지 않고 UC-06으로 기록한다.
  acceptance:
  - 배출 개시 후 10초 경과, 완료 신호 없음 → 상태가 판매 상태이고 해당 음료 재고 == 개시 전 재고.
  - 배출 실패 시 반환 금액 == 실패 처리 시점의 누적 투입 금액, 이후 누적 투입 금액 == 0.
  - 배출 개시 후 9.9초에 일치 신호 도착 → 배출 성공으로 처리, 재고 −1.
  - 배출 실패 처리 후 저장 파일의 진행 중 배출 항목이 비어 있다.
  requirements:
  - REQ-27
  - REQ-28
  - REQ-29
  - REQ-30
  - REQ-72
- id: UC-05
  title: 배출 진행 중 코인을 투입한다
  actor: 고객
  precondition: 배출이 개시되어 시스템이 배출 완료 신호를 대기 중이고, 자판기가 관리 모드가 아니다.
  postcondition: 투입 코인이 수납되어 보유량에 더해지고, 배출 완료 후 누적 투입 금액에 그 금액이 남아 있으며, 진행 중 배출의 거스름돈은
    버튼 누른 시점 기준으로만 계산된다.
  main_flow:
  - 1. 고객이 배출 완료 대기 중에 유효 코인을 투입한다.
  - 2. 시스템이 코인을 정상 수납하여 해당 액면가 보유 개수를 1 증가시키고 누적 투입 금액에 더한다.
  - 3. 시스템이 화면에 갱신된 누적 투입 금액을 표시한다.
  - 4. 시스템이 배출 완료 신호를 받으면 버튼 누른 시점의 (누적 − 가격)만큼만 거스름돈을 반환한다.
  - 5. 시스템이 배출 중 투입된 금액을 누적 투입 금액으로 유지한 채 판매 상태로 돌아가고 상태를 저장 파일에 기록한다.
  - 6. 고객이 남은 누적 투입 금액으로 다음 구매를 진행하거나 반환 레버를 조작한다.
  alt_flows:
  - 1a. 투입 코인이 비액면가 또는 인식 실패인 경우 시스템은 그 코인 자체를 즉시 반환하고 금액·보유량을 변경하지 않는다.
  - 4a. 배출이 실패로 처리된 경우 시스템은 배출 중 투입 금액을 포함한 누적 투입 금액 전액을 반환한다(UC-04).
  - 4b. 관리 모드 진입이 예약된 경우 시스템은 배출 완료/실패 직후 배출 중 투입된 금액만 반환하고 관리 모드로 전환한다(UC-10).
  acceptance:
  - 가격 500, 누적 700에서 버튼 누름 후 대기 중 1000원 투입 → 완료 시 거스름돈 200 반환, 완료 후 누적 투입 금액 == 1000.
  - 대기 중 투입된 1000원에 대해 1000원 보유 개수 +1.
  - 완료 후 화면 표시값 == 1000.
  - 완료 후 누적 1000, 재고 ≥ 1인 가격 ≤ 1000 음료 버튼이 활성화된다.
  requirements:
  - REQ-11
  - REQ-12
  - REQ-13
  - REQ-14
  - REQ-17
  - REQ-72
- id: UC-06
  title: 무효 배출 완료 신호를 지연 배출로 기록한다
  actor: 배출 장치
  precondition: 자판기가 기동 중이다.
  postcondition: 상태·재고·금액이 변경되지 않고, 지연 배출 기록이 1건 추가되어 저장 파일에 기록된다.
  main_flow:
  - 1. 배출 장치가 배출 완료 신호를 보낸다.
  - 2. 시스템이 신호의 일련번호를 현재 대기 중인 일련번호와 비교한다.
  - 3. 시스템이 일치하지 않음을 판정하고 상태·재고·금액을 변경하지 않는다.
  - 4. 시스템이 그 신호를 '지연 배출'로 기록하고 상태를 저장 파일에 기록한다.
  alt_flows:
  - 2a. 대기 중인 배출이 없는 상태(판매 상태·판매 중지·관리 모드)에서 신호가 도착한 경우 시스템은 3~4단계와 동일하게 처리한다.
  - 2b. 배출 실패 처리 후 원래 일련번호와 일치하는 신호가 도착한 경우에도 시스템은 대기 중이 아니므로 3~4단계와 동일하게 처리한다.
  - 2c. 일련번호가 현재 대기 중 번호와 일치하는 경우 시스템은 정상 배출 완료로 처리한다(UC-03 6단계).
  acceptance:
  - 대기 번호 7에 번호 6 신호 도착 → 재고·누적 투입 금액·보유량·상태 이름 변화 없음, 지연 배출 기록 +1.
  - 번호 7 배출 실패 처리 후 번호 7 신호 도착 → 재고·금액·상태 변화 없음, 지연 배출 기록 +1.
  - 판매 상태(대기 없음)에서 임의 신호 도착 → 변화 없음, 지연 배출 기록 +1.
  - 지연 배출 기록 추가 후 저장 파일의 지연 배출 기록 건수가 메모리와 일치한다.
  requirements:
  - REQ-32
  - REQ-33
  - REQ-34
  - REQ-72
  - REQ-73
- id: UC-07
  title: 투입 금액을 반환받는다
  actor: 고객
  precondition: 자판기가 판매 상태이다.
  postcondition: 누적 투입 금액 전액이 반환되어 0이 되고, 사용한 동전이 보유량에서 차감되며, 화면에 0이 표시된다.
  main_flow:
  - 1. 고객이 반환 레버를 조작한다.
  - 2. 시스템이 누적 투입 금액 전액을 보유 동전으로 반환한다.
  - 3. 시스템이 사용한 동전을 액면가별로 보유 개수에서 차감하고 누적 투입 금액을 0으로 만든다.
  - 4. 시스템이 화면에 0을 표시하고 모든 선택 버튼을 비활성화하며 상태를 저장 파일에 기록한다.
  alt_flows:
  - 1a. 누적 투입 금액이 0인 상태에서 레버를 조작한 경우 시스템은 아무것도 반환하지 않고 상태를 변경하지 않는다.
  - 1b. 누적 투입 금액이 0보다 큰 상태에서 코인 투입·음료 선택·반환 레버 조작이 30초 동안 없는 경우 시스템은 누적 투입 금액 전액을
    자동 반환하고 거래를 종료하며 2~4단계와 동일하게 처리한다.
  - 1c. 배출 완료 대기 중에 레버를 조작한 경우의 처리는 [모호 — 요구사항 미명시]로 남기되, 판매 상태가 아니므로 즉시 반환하지 않는다.
  acceptance:
  - 판매 상태, 누적 1500에서 레버 조작 → 반환 1500, 누적 투입 금액 0, 보유량 합계 −1500, 화면 표시 0.
  - 누적 0에서 레버 조작 → 반환 0, 보유량·상태 변화 없음.
  - 누적 300에서 30초 무조작 → 30초 경과 시점에 300 자동 반환, 누적 투입 금액 0, 상태 판매 상태.
  - 누적 300에서 29초에 코인 투입 → 자동 반환 없음, 타이머가 재시작되어 이후 30초 무조작 시 반환.
  - 반환 후 저장 파일의 누적 투입 금액 == 0.
  requirements:
  - REQ-18
  - REQ-24
  - REQ-25
  - REQ-26
  - REQ-72
  - REQ-85
- id: UC-08
  title: 판매 중지 상태로 전환한다
  actor: 고객
  precondition: 자판기가 판매 상태이고 어느 한 음료의 재고가 1이며 나머지 음료 재고가 0이다.
  postcondition: 자판기가 판매 중지 상태이고 코인을 받지 않는다.
  main_flow:
  - 1. 고객이 마지막 재고 음료의 활성 버튼을 눌러 구매한다(UC-03).
  - 2. 시스템이 배출 완료 후 재고를 차감하여 모든 음료 재고가 0임을 판정한다.
  - 3. 시스템이 거스름돈을 반환한 뒤 판매 중지 상태로 전환하고 상태를 저장 파일에 기록한다.
  - 4. 고객이 이후 코인을 투입하면 시스템은 그 코인 자체를 그대로 반환하고 보유량을 변경하지 않는다.
  alt_flows:
  - 2a. 배출 중 투입된 금액이 남아 있는 경우 시스템은 판매 중지 전환 시 그 금액을 반환하는지 여부를 [모호 — 요구사항 미명시]로 남긴다.
  - 3a. 관리자가 관리 모드에서 재고를 보충한 후 종료하면 시스템은 판매 상태로 돌아간다(UC-15).
  - 3b. 관리자가 관리 모드에서 재고 보충 없이 종료한 경우 시스템은 판매 중지 상태로 돌아간다(UC-15).
  acceptance:
  - 재고 (1,0,0)에서 첫 음료 구매 완료 → 상태 이름 == 판매 중지.
  - 판매 중지 상태에서 500원 투입 → 동일 코인 반환, 보유량 변화 없음, 누적 투입 금액 0.
  - 재고 (2,0,0)에서 첫 음료 구매 완료 → 상태 이름 == 판매 상태.
  - 판매 중지 전환 후 저장 파일의 상태 이름 == 판매 중지.
  requirements:
  - REQ-36
  - REQ-37
  - REQ-19
  - REQ-20
  - REQ-72
- id: UC-09
  title: 관리 모드에 진입한다
  actor: 관리자
  precondition: 자판기가 판매 상태 또는 판매 중지 상태이고, 배출 완료 대기 중이 아니다.
  postcondition: 누적 투입 금액이 0이고, 자판기가 관리 모드이며, 코인을 받지 않는다.
  main_flow:
  - 1. 관리자가 전용 키를 꽂는다.
  - 2. 시스템이 누적 투입 금액이 0임을 확인한다.
  - 3. 시스템이 관리 모드로 전환하고 상태를 저장 파일에 기록한다.
  - 4. 시스템이 관리 기능(재고 보충, 동전 보충, 재고 조정, 동전 회수, 지연 배출 기록 확인, 미반환 보관액 확인·회수)을 제공한다.
  alt_flows:
  - 1a. 전용 키가 아닌 키가 사용된 경우 시스템은 관리 모드로 전환하지 않고 상태를 변경하지 않는다.
  - 2a. 누적 투입 금액이 0보다 큰 경우 시스템은 먼저 그 금액 전액을 반환하고 사용 동전을 보유량에서 차감하며 누적 투입 금액을 0으로 만든
    뒤 3단계로 진행한다.
  - 1b. 배출 완료 대기 중에 키가 꽂힌 경우 UC-10으로 진행한다.
  - 4a. 관리 모드 중 코인이 투입된 경우 시스템은 그 코인 자체를 그대로 반환하고 보유량을 변경하지 않는다.
  acceptance:
  - 판매 상태, 누적 0에서 전용 키 삽입 → 상태 이름 == 관리 모드.
  - 판매 상태, 누적 700에서 전용 키 삽입 → 700 반환, 누적 투입 금액 0, 그 후 상태 이름 == 관리 모드.
  - 판매 중지 상태에서 전용 키 삽입 → 상태 이름 == 관리 모드.
  - 관리 모드에서 100원 투입 → 동일 코인 반환, 보유량 변화 없음.
  - 관리 모드 전환 후 저장 파일의 상태 이름 == 관리 모드, 누적 투입 금액 == 0.
  requirements:
  - REQ-38
  - REQ-43
  - REQ-44
  - REQ-19
  - REQ-20
  - REQ-72
- id: UC-10
  title: 배출 대기 중 관리 모드 진입을 예약한다
  actor: 관리자
  precondition: 배출이 개시되어 시스템이 배출 완료 신호를 대기 중이다.
  postcondition: 배출 완료 또는 실패 처리 직후 자판기가 관리 모드이며, 개시된 배출의 음료 가격은 판매로 확정되고, 배출 중 투입된
    금액만 반환되어 누적 투입 금액이 0이다.
  main_flow:
  - 1. 관리자가 배출 완료 대기 중에 전용 키를 꽂는다.
  - 2. 시스템이 관리 모드 진입을 예약하고 예약 여부를 저장 파일에 기록한다.
  - 3. 시스템이 배출 완료 신호를 받아 재고를 1 차감하고 음료 가격을 판매로 확정한다.
  - 4. 시스템이 버튼 누른 시점 기준 거스름돈을 반환한다.
  - 5. 시스템이 배출 중 투입된 금액만 반환하고 누적 투입 금액을 0으로 만든다.
  - 6. 시스템이 관리 모드로 전환하고 예약을 해제하며 상태를 저장 파일에 기록한다.
  alt_flows:
  - 3a. 10초 안에 유효한 완료 신호가 없어 배출 실패로 처리된 경우에도 시스템은 그 배출의 음료 가격을 판매로 확정하고, 재고는 차감하지
    않으며, 배출 중 투입된 금액만 반환한 뒤 관리 모드로 전환한다.
  - 5a. 배출 중 투입된 금액이 0인 경우 시스템은 아무것도 반환하지 않고 6단계로 진행한다.
  - 6a. 예약 후 관리 모드 전환 전에 전원이 끊긴 경우 시스템은 재기동 시 UC-16의 규칙을 따른다.
  acceptance:
  - 가격 500, 누적 700에서 버튼 누름, 대기 중 키 삽입, 대기 중 1000 투입, 완료 신호 도착 → 거스름돈 200 반환, 추가로 1000
    반환, 누적 투입 금액 0, 재고 −1, 판매된 금액 +500, 상태 이름 == 관리 모드.
  - 키 삽입 직후 저장 파일의 관리 모드 진입 예약 여부 == true.
  - 가격 500, 누적 500에서 버튼 누름, 대기 중 키 삽입, 10초 무신호 → 판매된 금액 +500, 재고 변화 없음, 반환 0, 상태 이름
    == 관리 모드.
  - 관리 모드 전환 후 저장 파일의 예약 여부 == false, 진행 중 배출 항목 비어 있음.
  requirements:
  - REQ-39
  - REQ-40
  - REQ-41
  - REQ-42
  - REQ-72
  - REQ-73
- id: UC-11
  title: 음료 재고를 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시한 각 음료의 재고가 지시 수량만큼 증가한다.
  main_flow:
  - 1. 관리자가 음료 종류와 수량(1 이상의 정수)의 목록으로 보충을 지시한다.
  - 2. 시스템이 모든 항목의 대상이 등록된 3종 음료이고 수량이 1 이상의 정수인지 검증한다.
  - 3. 시스템이 각 음료 재고에 수량을 더하고 상태를 저장 파일에 기록한다.
  - 4. 시스템이 갱신된 종류별 재고를 관리자에게 표시한다.
  alt_flows:
  - 2a. 등록되지 않은 음료가 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 거부 사유를 알린다.
  - 2b. 0 이하 또는 정수가 아닌 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 재고를 변경하지 않으며 관리자에게 거부 사유를
    알린다.
  acceptance:
  - 재고 (0,2,3)에 {A:5, B:1} 보충 → 재고 (5,3,3).
  - '{A:5, D:1} 보충(D 미등록) → 거부, 재고 변화 없음, 관리자 알림 발생.'
  - '{A:5, B:0} 보충 → 거부, 재고 변화 없음, 관리자 알림 발생.'
  - '{A:-1} 보충 → 거부, 재고 변화 없음, 관리자 알림 발생.'
  - 성공 시 저장 파일의 종류별 재고가 메모리와 일치한다.
  requirements:
  - REQ-45
  - REQ-47
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-72
- id: UC-12
  title: 동전을 보충한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시한 각 액면가의 보유 개수가 지시 수량만큼 증가하고 보충된 금액이 합계식에 반영된다.
  main_flow:
  - 1. 관리자가 액면가와 수량(1 이상의 정수)의 목록으로 보충을 지시한다.
  - 2. 시스템이 모든 항목의 액면가가 100/500/1000이고 수량이 1 이상의 정수인지 검증한다.
  - 3. 시스템이 각 액면가 보유 개수에 수량을 더하고 상태를 저장 파일에 기록한다.
  - 4. 시스템이 갱신된 액면가별 보유 개수를 관리자에게 표시한다.
  alt_flows:
  - 2a. 100/500/1000 이외의 액면가가 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.
  - 2b. 0 이하 또는 정수가 아닌 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.
  acceptance:
  - 보유 (100:0, 500:0, 1000:0)에 {100:10, 500:4} 보충 → 보유 (100:10, 500:4, 1000:0), 보유량
    합계 3000.
  - '{100:10, 50:1} 보충 → 거부, 보유량 변화 없음, 관리자 알림 발생.'
  - '{500:0} 보충 → 거부, 보유량 변화 없음, 관리자 알림 발생.'
  - 보충 후 보유량 합계 == 초기 보유액 + 보충된 금액 − 회수된 금액 + 판매된 가격 합 + 누적 투입 금액 + 미반환 보관액.
  - 성공 시 저장 파일의 액면가별 보유 개수가 메모리와 일치한다.
  requirements:
  - REQ-15
  - REQ-16
  - REQ-21
  - REQ-46
  - REQ-48
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-72
- id: UC-13
  title: 지연 배출 기록을 확인하고 재고를 조정한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시한 음료의 재고가 조정값으로 설정되고, 지연 배출 기록이 관리자 확인 완료로 표시된다.
  main_flow:
  - 1. 관리자가 지연 배출 기록 확인을 요청한다.
  - 2. 시스템이 지연 배출 기록 목록(각 건의 일련번호, 음료, 확인 여부)을 표시한다.
  - 3. 관리자가 실제 개수에 맞춰 음료 종류와 조정값을 지시한다.
  - 4. 시스템이 조정값이 0 이상 현재 장부 재고 이하인지 검증한다.
  - 5. 시스템이 해당 음료 재고를 조정값으로 설정한다.
  - 6. 시스템이 지연 배출 기록을 관리자 확인 완료로 표시하고 상태를 저장 파일에 기록한다.
  alt_flows:
  - 2a. 지연 배출 기록이 없는 경우 시스템은 빈 목록을 표시한다.
  - 4a. 조정값이 현재 장부 재고보다 큰 경우 시스템은 거부하고 재고를 변경하지 않으며 관리자에게 알린다.
  - 4b. 조정값이 0 미만인 경우 시스템은 거부하고 재고를 변경하지 않으며 관리자에게 알린다.
  - 4c. 대상이 등록된 3종 음료가 아닌 경우 시스템은 거부하고 재고를 변경하지 않으며 관리자에게 알린다.
  acceptance:
  - 지연 배출 기록 2건 존재 시 확인 요청 → 2건이 표시된다.
  - 재고 A=5에서 A를 3으로 조정 → 재고 A == 3.
  - 재고 A=5에서 A를 0으로 조정 → 재고 A == 0.
  - 재고 A=5에서 A를 6으로 조정 → 거부, 재고 A == 5.
  - 재고 A=5에서 A를 -1로 조정 → 거부, 재고 A == 5.
  - 조정 성공 후 모든 지연 배출 기록의 확인 여부 == true, 저장 파일에도 동일하게 반영.
  requirements:
  - REQ-35
  - REQ-52
  - REQ-53
  - REQ-54
  - REQ-72
  - REQ-73
- id: UC-14
  title: 동전과 미반환 보관액을 회수한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 지시한 액면가별 보유 개수가 회수 수량만큼 감소하고, 회수 후 보유량 합계가 미반환 보관액 이상이다.
  main_flow:
  - 1. 관리자가 미반환 보관액 확인을 요청한다.
  - 2. 시스템이 현재 미반환 보관액과 액면가별 보유 개수를 표시한다.
  - 3. 관리자가 액면가와 회수 수량(1 이상의 정수)의 목록으로 회수를 지시한다.
  - 4. 시스템이 모든 항목의 액면가가 100/500/1000이고 수량이 1 이상의 정수이며, 회수 후 보유량 합계가 미반환 보관액 이상인지 검증한다.
  - 5. 시스템이 각 액면가 보유 개수에서 수량을 차감하고 회수된 금액에 반영하며 상태를 저장 파일에 기록한다.
  - 6. 관리자가 미반환 보관액을 회수하는 경우 시스템은 해당 금액만큼 동전 회수를 처리한다. [모호] 회수 후 미반환 보관액 기록 감소 여부는
    요구사항에 명시되지 않음.
  alt_flows:
  - 4a. 100/500/1000 이외 액면가 또는 0 이하 수량이 하나라도 포함된 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며
    관리자에게 알린다.
  - 4b. 회수 수량이 해당 액면가 보유 개수를 초과하는 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.
  - 4c. 회수 후 보유량 합계가 미반환 보관액 미만이 되는 경우 시스템은 지시 전체를 거부하고 보유량을 변경하지 않으며 관리자에게 알린다.
  acceptance:
  - 보유 (100:10, 500:4, 1000:2), 보관액 0에서 {1000:2} 회수 → 보유 (100:10, 500:4, 1000:0),
    회수된 금액 +2000.
  - 보유 합계 3000, 보관액 1500에서 합계 1000이 되는 회수 지시 → 거부, 보유량 변화 없음, 관리자 알림 발생.
  - 보유 합계 3000, 보관액 1500에서 합계 1500이 되는 회수 지시 → 허용.
  - '{50:1} 회수 → 거부, 보유량 변화 없음, 관리자 알림 발생.'
  - '{100:0} 회수 → 거부, 보유량 변화 없음, 관리자 알림 발생.'
  - 1000원 보유 2개에서 {1000:3} 회수 → 거부, 보유량 변화 없음.
  - 미반환 보관액 확인 요청 → 표시값 == 저장 파일의 미반환 보관액.
  - 회수 후 보유량 합계 == 초기 보유액 + 보충된 금액 − 회수된 금액 + 판매된 가격 합 + 누적 투입 금액 + 미반환 보관액.
  requirements:
  - REQ-16
  - REQ-21
  - REQ-49
  - REQ-50
  - REQ-51
  - REQ-55
  - REQ-56
  - REQ-64
  - REQ-65
  - REQ-66
  - REQ-72
- id: UC-15
  title: 관리 모드를 종료한다
  actor: 관리자
  precondition: 자판기가 관리 모드이다.
  postcondition: 자판기가 판매 상태이거나, 모든 음료 재고가 0이면 판매 중지 상태이며, 그 상태가 저장 파일에 기록되어 있다.
  main_flow:
  - 1. 관리자가 보충을 마치고 관리 모드 종료를 지시한다. [모호] 종료 판정 조건(전용 키 제거 등)이 요구사항에 명시되지 않음 — 본 유스케이스는
    전용 키 제거를 종료 지시로 가정한다.
  - 2. 시스템이 음료 종류별 재고를 확인한다.
  - 3. 시스템이 재고가 1 이상인 음료가 하나라도 있으면 판매 상태로 전환한다.
  - 4. 시스템이 누적 투입 금액 0을 화면에 표시하고 상태를 저장 파일에 기록한다.
  alt_flows:
  - 3a. 모든 음료 재고가 0인 경우 시스템은 판매 중지 상태로 전환한다.
  - 1a. 보충·회수 지시가 거부된 직후 종료를 지시한 경우에도 시스템은 2~4단계와 동일하게 처리한다.
  acceptance:
  - 재고 (5,0,0)에서 종료 → 상태 이름 == 판매 상태.
  - 재고 (0,0,0)에서 종료 → 상태 이름 == 판매 중지.
  - 종료 후 누적 투입 금액 == 0, 화면 표시 0.
  - 종료 후 저장 파일의 상태 이름이 메모리 상태와 일치한다.
  requirements:
  - REQ-57
  - REQ-58
  - REQ-72
- id: UC-16
  title: 정전 후 재기동한다
  actor: 운영 전원(전원 공급)
  precondition: 자판기가 정전으로 정지했다가 전원이 재공급된다.
  postcondition: 저장 파일에서 복원된 상태에 정전·재기동 규칙이 적용되어 누적 투입 금액이 0이고, 미반환 보관액과 재고·보유량이 규칙대로
    갱신되며, 재고만으로 판정된 판매/판매 중지 상태로 기동한다.
  main_flow:
  - 1. 전원이 재공급되어 시스템이 기동한다.
  - 2. 시스템이 저장 파일을 읽어 완전히 기록된 직전 상태(상태 이름, 누적 투입 금액, 종류별 재고, 액면가별 보유량, 미반환 보관액, 지연
    배출 기록, 진행 중 배출의 일련번호와 음료, 관리 모드 진입 예약 여부)를 복원한다.
  - 3. 시스템이 복원된 누적 투입 금액을 미반환 보관액에 더하고 해당 동전을 보유량에 그대로 남긴 채 누적 투입 금액을 0으로 만든다(물리적
    반환 없음).
  - 4. 시스템이 외부 재고 정보 없이 보존된 종류별 재고만으로 판매 상태(재고 1 이상 존재) 또는 판매 중지 상태(전부 0)를 판정한다.
  - 5. 시스템이 판정된 상태로 전환하고 화면에 0을 표시하며 상태를 저장 파일에 기록한다.
  alt_flows:
  - 2a. 저장 파일이 없는 경우 시스템은 재고 0, 동전 0, 보관액 0인 초기 상태로 기동하고 관리자에게 알린 뒤 판매 중지 상태가 된다.
  - 2b. 저장 파일이 손상되었거나 절반만 쓰인 경우 시스템은 이를 상태로 읽지 않고 2a와 동일하게 초기 상태로 기동하고 관리자에게 알린다.
  - 2c. 복원된 상태에 진행 중인 배출(일련번호와 음료)이 있는 경우 시스템은 해당 음료 재고를 1 차감하고 그 음료 가격을 판매된 금액으로
    계상하며, 미반환 보관액은 (정전 시점 누적 투입 금액 − 음료 가격)으로만 계상한 뒤 4단계로 진행한다.
  - 2d. 복원된 상태가 관리 모드인 경우 시스템은 4단계의 재고 판정에 따라 판매 또는 판매 중지 상태로 기동한다.
  - 5a. 재기동 후 지연된 배출 완료 신호가 도착한 경우 시스템은 UC-06에 따라 지연 배출로 기록한다.
  acceptance:
  - '저장 상태: 판매 상태, 누적 700, 보관액 0, 보유 합계 S → 재기동 후 누적 0, 보관액 700, 보유 합계 S, 물리 반환 0.'
  - '저장 상태: 재고 (3,0,0) → 재기동 후 상태 이름 == 판매 상태; 재고 (0,0,0) → 판매 중지.'
  - '저장 상태: 진행 중 배출(음료 A 가격 500), 누적 700, 재고 A=3 → 재기동 후 재고 A == 2, 판매된 금액 +500, 보관액
    == 200, 누적 0.'
  - '저장 상태: 진행 중 배출(음료 A 가격 500), 누적 500 → 재기동 후 보관액 == 0.'
  - 저장 파일 없음 → 재고 (0,0,0), 보유 (0,0,0), 보관액 0, 관리자 알림 발생, 상태 이름 == 판매 중지.
  - 저장 파일이 절반만 쓰인 경우 → 초기 상태로 기동, 관리자 알림 발생.
  - 재기동 시 외부 입력 없이 기동이 완료되고 네트워크 호출이 0회이다.
  - 재기동 완료 후 보유량 합계 == 초기 보유액 + 보충액 − 회수액 + 판매된 가격 합 + 0 + 미반환 보관액.
  requirements:
  - REQ-21
  - REQ-60
  - REQ-61
  - REQ-62
  - REQ-63
  - REQ-67
  - REQ-68
  - REQ-69
  - REQ-70
  - REQ-71
  - REQ-72
  - REQ-73
  - REQ-77
  - REQ-78
  - REQ-79
  - REQ-82
  - REQ-83
- id: UC-17
  title: 상태를 원자적으로 저장한다
  actor: 운영 전원(전원 공급)
  precondition: 자판기가 상태 전이를 완료하여 저장 파일에 기록을 시작한다.
  postcondition: 저장 파일에는 완전히 기록된 상태만 존재하며, 기록 도중 전원이 끊겨도 직전에 완전히 기록된 상태가 남는다.
  main_flow:
  - 1. 시스템이 상태 전이를 마치고 현재 상태 전체를 저장 파일에 기록한다.
  - 2. 시스템이 기록이 완전히 끝난 뒤에만 그 내용을 유효한 저장 파일로 확정한다.
  - 3. 재기동 시 시스템이 저장 파일을 읽어 완전히 기록된 상태를 복원한다.
  alt_flows:
  - 1a. 기록 도중 전원이 끊긴 경우 시스템은 재기동 시 직전에 완전히 기록된 상태를 복원하고, 절반만 쓰인 내용은 상태로 읽지 않는다.
  - 2a. 완전히 기록된 상태가 한 번도 없는 경우(첫 기록 중 정전) 시스템은 UC-16 2b에 따라 초기 상태로 기동하고 관리자에게 알린다.
  acceptance:
  - 상태 S1 저장 완료 후 S2 기록 도중 강제 종료 → 재기동 시 복원된 상태 == S1.
  - 상태 S2 기록 완료 후 강제 종료 → 재기동 시 복원된 상태 == S2.
  - 저장 파일에 절반만 쓰인 바이트열을 주입 → 재기동 시 그 내용이 상태로 읽히지 않고 초기 상태 + 관리자 알림.
  - 모든 상태 전이(코인 투입, 배출 개시, 배출 완료, 배출 실패, 반환, 자동 반환, 관리 모드 진입/종료, 보충, 회수, 조정, 지연 배출
    기록, 판매 중지 전환) 직후 저장 파일 내용이 메모리 상태 전체와 일치한다.
  requirements:
  - REQ-72
  - REQ-73
  - REQ-74
  - REQ-75
  - REQ-76
- id: UC-18
  title: 저장 파일 위치를 지정하여 자판기를 생성한다
  actor: 테스트 또는 운영 설치자
  precondition: 자판기 인스턴스가 아직 생성되지 않았다.
  postcondition: 지정한 경로를 저장 파일로 사용하는 자판기가 생성되어 있고, 해당 경로의 상태로 기동되어 있다.
  main_flow:
  - 1. 액터가 저장 파일 경로를 지정하여 자판기 생성을 요청한다.
  - 2. 시스템이 지정된 경로를 저장 파일로 설정한다.
  - 3. 시스템이 그 경로에서 상태를 복원하거나(UC-16) 파일이 없으면 초기 상태로 기동하고 관리자에게 알린다.
  - 4. 시스템이 이후 모든 상태 전이를 그 경로에 기록한다.
  alt_flows:
  - 1a. 테스트가 임시 파일 경로를 지정한 경우 시스템은 동일하게 그 경로를 사용하며, 테스트 간 상태가 섞이지 않는다.
  - 2a. 지정된 경로에 기록할 수 없는 경우(디렉터리 없음, 권한 없음) 시스템은 생성을 실패로 보고하고 기동하지 않는다.
  - 3a. 지정된 경로의 파일이 손상된 경우 시스템은 초기 상태로 기동하고 관리자에게 알린다.
  acceptance:
  - 임시 파일 P1로 생성 후 코인 투입 → P1에 상태가 기록되고 다른 경로에는 기록되지 않는다.
  - 임시 파일 P1로 생성한 자판기의 상태가 임시 파일 P2로 생성한 자판기에 영향을 주지 않는다.
  - 존재하지 않는 경로 P1로 생성 → 초기 상태(재고 0, 동전 0, 보관액 0) 기동, 관리자 알림 발생.
  - 쓰기 불가 경로로 생성 → 생성 실패가 보고된다.
