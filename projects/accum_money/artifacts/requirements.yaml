requirements:
- id: REQ-001
  text: 시스템은 Binance BTCUSDT 선물 거래를 사용자의 수동 명령으로 실행할 수 있어야 한다.
  kind: functional
  source: Binance의 BTCUSDT 선물 거래를 수동 명령과 자동화된 거래 전략을 통해 실행하고 관리하는 프로그램이다
- id: REQ-002
  text: 시스템은 자동화된 거래 전략을 통해 거래를 실행할 수 있어야 한다.
  kind: functional
  source: 수동 명령과 자동화된 거래 전략을 통해 실행하고 관리하는 프로그램이다
- id: REQ-003
  text: 시스템은 로컬 또는 서버에서 동작하는 명령어 창(Command Console) 인터페이스를 제공해야 한다.
  kind: functional
  source: 1. 로컬 또는 서버의 명령어 창(Command Console)
- id: REQ-004
  text: 시스템은 웹 기반 관리 화면(Web Dashboard) 인터페이스를 제공해야 한다.
  kind: functional
  source: 2. 웹 기반 관리 화면(Web Dashboard)
- id: REQ-005
  text: 시스템은 Binance API를 통해 주문을 실행해야 한다.
  kind: functional
  source: 시스템은 Binance API를 통해 주문 실행, 주문 상태 확인, 포지션 관리, 손절·익절 설정, 시장 데이터 수집을 수행한다
- id: REQ-006
  text: 시스템은 Binance API를 통해 주문 상태를 확인해야 한다.
  kind: functional
  source: Binance API를 통해 주문 실행, 주문 상태 확인
- id: REQ-007
  text: 시스템은 Binance API를 통해 포지션을 관리해야 한다.
  kind: functional
  source: Binance API를 통해 ... 포지션 관리
- id: REQ-008
  text: 시스템은 Binance API를 통해 손절·익절을 설정해야 한다.
  kind: functional
  source: Binance API를 통해 ... 손절·익절 설정
- id: REQ-009
  text: 시스템은 Binance API를 통해 시장 데이터를 수집해야 한다.
  kind: functional
  source: Binance API를 통해 ... 시장 데이터 수집을 수행한다
- id: REQ-010
  text: 지표 계산 방식은 다른 구현으로 교체 가능한 모듈로 설계해야 한다.
  kind: constraint
  source: 지표, 전략, 리스크 계산 방식, 예산 관리 정책, 알림 채널은 아직 확정되지 않았으므로 교체 가능한 모듈로 설계한다
- id: REQ-011
  text: 전략은 다른 구현으로 교체 가능한 모듈로 설계해야 한다.
  kind: constraint
  source: 지표, 전략, 리스크 계산 방식, 예산 관리 정책, 알림 채널은 ... 교체 가능한 모듈로 설계한다
- id: REQ-012
  text: 리스크 계산 방식은 다른 구현으로 교체 가능한 모듈로 설계해야 한다.
  kind: constraint
  source: 지표, 전략, 리스크 계산 방식, 예산 관리 정책, 알림 채널은 ... 교체 가능한 모듈로 설계한다
- id: REQ-013
  text: 예산 관리 정책은 다른 구현으로 교체 가능한 모듈로 설계해야 한다.
  kind: constraint
  source: 지표, 전략, 리스크 계산 방식, 예산 관리 정책, 알림 채널은 ... 교체 가능한 모듈로 설계한다
- id: REQ-014
  text: 알림 채널은 다른 구현으로 교체 가능한 모듈로 설계해야 한다.
  kind: constraint
  source: 지표, 전략, 리스크 계산 방식, 예산 관리 정책, 알림 채널은 ... 교체 가능한 모듈로 설계한다
- id: REQ-015
  text: 처리되지 않은 예외 하나가 전체 프로세스를 종료시키지 않아야 한다.
  kind: nonfunctional
  source: 처리되지 않은 예외 하나가 전체 프로세스를 종료시키지 않아야 한다
- id: REQ-016
  text: 한 주요 모듈의 장애가 다른 주요 모듈의 동작을 중단시키지 않아야 한다.
  kind: nonfunctional
  source: 각 주요 모듈은 서로 장애가 격리되어야 한다
- id: REQ-017
  text: 장애가 발생한 작업은 재시도 정책에 따라 자동으로 재시도해야 한다. [모호] 재시도 정책의 구체 내용 미정
  kind: constraint
  source: 장애가 발생한 작업은 정책에 따라 자동으로 재시도해야 한다
- id: REQ-018
  text: WebSocket 연결이 끊어지면 사용자 개입 없이 자동으로 재연결해야 한다.
  kind: functional
  source: WebSocket 연결이 끊어지면 자동으로 재연결해야 한다
- id: REQ-019
  text: Binance API 장애 또는 네트워크 단절 시 제한된 횟수와 간격으로 재시도해야 한다. [모호] 최대 횟수와 간격 값 미정
  kind: constraint
  source: Binance API 장애나 네트워크 단절 시 제한된 횟수와 간격으로 재시도해야 한다
- id: REQ-020
  text: 재시도 간격에 exponential backoff를 적용해야 한다.
  kind: nonfunctional
  source: 재시도 간격에는 exponential backoff와 jitter를 적용한다
- id: REQ-021
  text: 재시도 간격에 jitter를 적용해야 한다.
  kind: nonfunctional
  source: 재시도 간격에는 exponential backoff와 jitter를 적용한다
- id: REQ-022
  text: 시스템 재시작 후 기존 주문 상태를 복구해야 한다.
  kind: functional
  source: 시스템 재시작 후에도 기존 주문, 포지션, 처리 중이던 명령을 복구해야 한다
- id: REQ-023
  text: 시스템 재시작 후 기존 포지션 상태를 복구해야 한다.
  kind: functional
  source: 시스템 재시작 후에도 기존 주문, 포지션, 처리 중이던 명령을 복구해야 한다
- id: REQ-024
  text: 시스템 재시작 후 처리 중이던 명령을 복구해야 한다.
  kind: functional
  source: 시스템 재시작 후에도 기존 주문, 포지션, 처리 중이던 명령을 복구해야 한다
- id: REQ-025
  text: 복구 시 로컬 상태를 Binance의 실제 주문 및 포지션 상태와 대조해야 한다.
  kind: functional
  source: 복구 시 로컬 상태만 신뢰하지 않고 Binance의 실제 주문 및 포지션 상태와 대조해야 한다
- id: REQ-026
  text: 반복적으로 실패하는 작업은 별도의 실패 상태로 격리해야 한다. [모호] 반복 실패 판정 횟수 미정
  kind: constraint
  source: 반복적으로 실패하는 작업은 별도의 실패 상태로 격리하고 운영자에게 알려야 한다
- id: REQ-027
  text: 실패 상태로 격리된 작업은 운영자에게 알려야 한다.
  kind: functional
  source: 반복적으로 실패하는 작업은 별도의 실패 상태로 격리하고 운영자에게 알려야 한다
- id: REQ-028
  text: 장애 발생 중에도 명령어 창 기능은 유지되어야 한다. [모호] 「가능한 한」의 기준 미정
  kind: constraint
  source: 장애가 발생해도 명령어 창, 상태 조회 및 긴급 정지 기능은 가능한 한 유지되어야 한다
- id: REQ-029
  text: 장애 발생 중에도 상태 조회 기능은 유지되어야 한다. [모호] 「가능한 한」의 기준 미정
  kind: constraint
  source: 장애가 발생해도 명령어 창, 상태 조회 및 긴급 정지 기능은 가능한 한 유지되어야 한다
- id: REQ-030
  text: 장애 발생 중에도 긴급 정지 기능은 유지되어야 한다. [모호] 「가능한 한」의 기준 미정
  kind: constraint
  source: 장애가 발생해도 명령어 창, 상태 조회 및 긴급 정지 기능은 가능한 한 유지되어야 한다
- id: REQ-031
  text: 시스템 상태를 최소 `HEALTHY`, `DEGRADED`, `TRADING_PAUSED`, `RECOVERING`, `FAILED`
    다섯 값 중 하나로 표시해야 한다.
  kind: functional
  source: 시스템 상태를 `HEALTHY`, `DEGRADED`, `TRADING_PAUSED`, `RECOVERING`, `FAILED`
    등으로 명확히 표시해야 한다
- id: REQ-032
  text: 상태가 불확실하거나 안전을 보장할 수 없으면 신규 거래를 중단하고 안전 모드로 전환해야 한다.
  kind: functional
  source: 상태가 불확실하거나 안전을 보장할 수 없으면 신규 거래를 중단하고 기존 포지션과 주문 상태를 확인할 수 있는 안전 모드로 전환한다
- id: REQ-033
  text: 안전 모드에서 기존 포지션과 주문 상태를 확인할 수 있어야 한다.
  kind: functional
  source: 기존 포지션과 주문 상태를 확인할 수 있는 안전 모드로 전환한다
- id: REQ-034
  text: 각 거래 명령은 RECEIVED → VALIDATED → APPROVED → SUBMITTED → ACKNOWLEDGED → (FILLED
    | PARTIALLY_FILLED | CANCELED | REJECTED | EXPIRED) 상태 흐름을 따라야 한다.
  kind: functional
  source: RECEIVED → VALIDATED → APPROVED → SUBMITTED → ACKNOWLEDGED → FILLED/PARTIALLY_FILLED/CANCELED/REJECTED/EXPIRED
- id: REQ-035
  text: 모든 거래 명령에 시스템 내부에서 고유한 `command_id`를 부여해야 한다.
  kind: functional
  source: 모든 거래 명령에는 시스템 내부의 고유한 `command_id`를 부여한다
- id: REQ-036
  text: Binance에 전송하는 모든 주문에 고유한 `client_order_id`를 사용해야 한다.
  kind: functional
  source: Binance 주문에는 고유한 `client_order_id`를 사용한다
- id: REQ-037
  text: 동일한 명령을 재시도해도 Binance에 중복 주문이 생성되지 않아야 한다.
  kind: functional
  source: 동일한 명령을 재시도하더라도 중복 주문이 발생하지 않아야 한다
- id: REQ-038
  text: 주문 요청 응답이 유실되거나 타임아웃된 경우 즉시 같은 주문을 다시 생성하지 않아야 한다.
  kind: functional
  source: 주문 요청의 응답이 유실되거나 타임아웃이 발생했다고 해서 즉시 같은 주문을 다시 생성하면 안 된다
- id: REQ-039
  text: 결과가 불명확한 주문은 재전송 전에 `client_order_id`로 Binance의 실제 주문 상태를 먼저 조회해야 한다.
  kind: functional
  source: 결과가 불명확한 주문은 `client_order_id`를 이용하여 Binance에서 실제 상태를 먼저 조회한다
- id: REQ-040
  text: 주문 전송 전 상태를 영구 저장소에 기록해야 한다.
  kind: functional
  source: 주문 전송 전과 전송 후의 상태를 영구 저장소에 기록한다
- id: REQ-041
  text: 주문 전송 후 상태를 영구 저장소에 기록해야 한다.
  kind: functional
  source: 주문 전송 전과 전송 후의 상태를 영구 저장소에 기록한다
- id: REQ-042
  text: 시스템 내부 상태와 Binance 상태가 다르면 reconciliation 절차를 수행해야 한다.
  kind: functional
  source: 시스템 내부 상태와 Binance 상태가 다르면 reconciliation 절차를 수행한다
- id: REQ-043
  text: 부분 체결을 완전 체결과 구분되는 독립적인 상태로 처리해야 한다.
  kind: functional
  source: 부분 체결을 독립적인 상태로 처리해야 한다
- id: REQ-044
  text: 진입 주문과 그에 대응하는 손절·익절 주문 사이의 관계를 기록해야 한다.
  kind: functional
  source: 진입 주문과 손절·익절 주문 사이의 관계를 기록해야 한다
- id: REQ-045
  text: 진입 주문이 실패하거나 체결되지 않은 경우 대응되는 손절·익절 주문을 생성하지 않아야 한다.
  kind: functional
  source: 진입 주문이 실패하거나 체결되지 않았다면 대응되는 손절·익절 주문을 잘못 생성해서는 안 된다
- id: REQ-046
  text: 현재 포지션 수량보다 큰 reduce-only 청산 주문은 생성 전 검증에서 차단해야 한다.
  kind: functional
  source: 포지션 수량보다 큰 reduce-only 청산 주문이 생성되지 않도록 검증해야 한다
- id: REQ-047
  text: 모든 금액과 수량 계산에 부동소수점이 아닌 decimal 연산을 사용해야 한다.
  kind: constraint
  source: 모든 금액과 수량 계산에는 부동소수점이 아닌 정확한 decimal 연산을 사용한다
- id: REQ-048
  text: 주문 가격에 Binance의 tick size 규칙을 적용해야 한다.
  kind: functional
  source: Binance의 tick size, step size, 최소 주문 수량 및 최소 명목금액 규칙을 적용해야 한다
- id: REQ-049
  text: 주문 수량에 Binance의 step size 규칙을 적용해야 한다.
  kind: functional
  source: Binance의 tick size, step size, 최소 주문 수량 및 최소 명목금액 규칙을 적용해야 한다
- id: REQ-050
  text: 주문에 Binance의 최소 주문 수량 규칙을 적용해야 한다.
  kind: functional
  source: Binance의 tick size, step size, 최소 주문 수량 및 최소 명목금액 규칙을 적용해야 한다
- id: REQ-051
  text: 주문에 Binance의 최소 명목금액 규칙을 적용해야 한다.
  kind: functional
  source: Binance의 tick size, step size, 최소 주문 수량 및 최소 명목금액 규칙을 적용해야 한다
- id: REQ-052
  text: 저장된 로그만으로 명령 접수부터 최종 결과까지의 전 과정을 재구성할 수 있어야 한다.
  kind: nonfunctional
  source: 저장된 로그만으로 명령 접수부터 최종 결과까지 재구성할 수 있어야 한다
- id: REQ-053
  text: 거래 정합성은 영속 상태 머신, 멱등성, 재시도, 보상 처리, reconciliation 조합으로 보장해야 한다.
  kind: constraint
  source: 영속 상태 머신, 멱등성, 재시도, 보상 처리 및 reconciliation을 통해 거래 정합성을 보장한다
- id: REQ-054
  text: Binance 계정 상태를 확인할 수 없는 경우 신규 자동 거래를 중단해야 한다.
  kind: functional
  source: Binance 계정 상태를 확인할 수 없는 경우
- id: REQ-055
  text: 현재 포지션을 확정할 수 없는 경우 신규 자동 거래를 중단해야 한다.
  kind: functional
  source: 현재 포지션을 확정할 수 없는 경우
- id: REQ-056
  text: 주문 결과가 장시간 불명확한 경우 신규 자동 거래를 중단해야 한다. [모호] 「장시간」 기준값 미정
  kind: constraint
  source: 주문 결과가 장시간 불명확한 경우
- id: REQ-057
  text: 시장 데이터가 오래되었거나 정합성이 깨진 경우 신규 자동 거래를 중단해야 한다. [모호] stale 기준 시간 미정
  kind: constraint
