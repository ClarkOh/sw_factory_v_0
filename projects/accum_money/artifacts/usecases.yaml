- id: UC-11
  title: 시스템을 시작하고 상태를 복구한다
  actor: 프로세스 관리자
  precondition: 영구 저장소에 접근 가능하고 Binance API 자격 증명이 secret 저장소에 있다
  postcondition: 로컬 상태가 Binance 상태와 대조·조정되어 있고, 운영자 보고가 제공되었으며, 자동 거래는 안전 조건 충족과 재개
    정책에 따라만 재개되어 있다
  main_flow:
  - step: 1. 프로세스 관리자가 Core Trading Service를 시작한다
    event: SYSTEM_START
  - step: 2. 시스템이 시작 이벤트를 감사 기록으로 남기고 상태를 RECOVERING으로 표시하며 DB에서 마지막 시스템 상태와 처리 중·결과
      불명확 명령을 읽는다
  - step: 3. 시스템이 Binance 서버 시간, 계정 잔고, 실제 포지션, 미체결 주문, 최근 체결 내역을 조회한다
  - step: 4. Binance가 조회 결과를 반환한다
    event: ACCOUNT_STATE_RETURNED
  - step: 5. 시스템이 로컬 주문·포지션·명령 상태를 Binance 상태와 비교해 차이를 reconciliation 기록으로 남기고 로컬
      상태를 조정한다
  - step: 6. 시스템이 보호 주문의 존재와 수량을 검증하고 시장 데이터를 다시 동기화한다
  - step: 7. 시스템이 복구 결과 보고(Operator Report)를 운영자에게 표시·알림하고 상태를 HEALTHY 또는 TRADING_PAUSED로
      전환한다
  - step: 8. 운영자가 자동 거래 재개를 확인한다
    event: RESUME_TRADING_AFTER_RECOVERY
  - step: 9. 시스템이 안전 조건을 모두 재확인한 뒤 자동 거래를 재개한다
  alt_flows:
  - step: 3a. 시스템 시간과 Binance 서버 시간의 차이가 허용 범위를 초과한 경우 시스템은 신규 자동 거래를 중단하고 운영자 보고에
      포함한다
    event: ACCOUNT_STATE_RETURNED
  - step: 4a. Binance 조회가 실패한 경우 시스템은 RECOVERING 상태를 유지하며 재시도 정책으로 재시도하고, 명령어 창·상태
      조회·긴급 정지는 계속 제공한다
    event: ACCOUNT_QUERY_FAILED
  - step: 4b. 재시도가 모두 실패한 경우 시스템은 FAILED 상태로 표시하고 운영자에게 알리며 신규 거래를 차단한다
    event: ACCOUNT_QUERY_FAILED
  - step: 5a. 결과 불명확 명령이 있는 경우 시스템은 각 명령에 대해 UC-02 절차를 수행한다
  - step: 5b. 로컬에 없는 주문·포지션이 Binance에 있는 경우 시스템은 이를 로컬에 등록하고 reconciliation 기록으로 남기며
      운영자 보고에 포함한다
  - step: 6a. 포지션은 있으나 보호 주문이 없거나 수량이 다른 경우 시스템은 이를 운영자 보고에 포함하고 정책에 따라 조정한다
  - step: 8a. 자동 재개 설정이 켜져 있는 경우 시스템은 운영자 확인 없이 안전 조건 충족 시 자동 거래를 재개한다
  - step: 8b. 재개 정책이 기본값(수동 확인)인데 운영자 확인이 없는 경우 시스템은 자동 거래를 재개하지 않고 TRADING_PAUSED를
      유지한다
  acceptance:
  - 재시작 후 로컬 주문·포지션 상태가 Binance 조회 결과와 일치한다 (불일치 0건 또는 각 불일치마다 reconciliation 레코드
    존재)
  - 재시작 전 처리 중이던 모든 명령이 재시작 후 최종 상태 또는 추적 중 상태로 존재한다
  - 재개 정책 기본값이 수동 확인이며, 확인 이벤트 없이 자동 거래가 재개된 경우가 0건이다
  - 복구 완료 시 운영자 보고 레코드와 복구 결과 알림 레코드가 각각 1건 존재한다
  - 시스템 시작·종료·재시작마다 감사 레코드가 존재한다
