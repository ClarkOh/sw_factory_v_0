- id: UC-17
  title: 이벤트 알림을 전달한다
  actor: 알림 채널 서버
  precondition: 알림 수신자와 채널(초기 Email)이 설정되어 있고 알림 큐가 동작 중이다
  postcondition: 알림이 전달되었거나 실패 내역이 기록되어 있으며 거래 실행 결과는 알림 결과에 영향받지 않았다
  main_flow:
  - step: 1. 시스템이 알림 대상 이벤트(주문 접수, 체결·부분 체결, 거절·실패, 포지션 진입·종료, 손절·익절 실행, 리스크 한도 초과,
      자동 거래 중단, 데이터 수집 장애, Binance 연결 장애, 복구 결과, 일간·주간 요약)를 거래 실행과 분리된 알림 큐에 넣는다
  - step: 2. 시스템이 중복 알림 키를 확인하고 템플릿으로 메시지를 생성해 교체 가능한 채널 어댑터를 통해 비동기 전송한다
  - step: 3. 알림 채널 서버가 전송을 수락한다
    event: NOTIFICATION_DELIVERED
  - step: 4. 시스템이 전송 결과를 기록하고 웹 Activity and Logs에 표시한다
  alt_flows:
  - step: 3a. 알림 채널 서버가 전송을 거부하거나 응답하지 않는 경우 시스템은 실패 내역을 기록하고 알림 큐에서 재시도 정책으로 재시도한다
    event: NOTIFICATION_DELIVERY_FAILED
  - step: 3b. 재시도가 모두 실패한 경우 시스템은 최종 실패로 기록하되 관련 거래 명령의 상태는 변경하지 않는다
    event: NOTIFICATION_DELIVERY_FAILED
  - step: 2a. 동일 이벤트에 대한 알림이 이미 전송된 경우 시스템은 중복 전송하지 않는다
  - step: 1a. 타이머가 일간·주간 요약 시각에 도달한 경우 시스템은 거래 요약 알림을 생성한다
    event: REPORT_TICK
  acceptance:
  - 알림 채널 서버를 차단해도 해당 기간 거래 명령의 최종 상태 분포가 차단 전과 동일하다
  - 동일 이벤트 ID에 대한 전송 레코드가 최대 1건이다
