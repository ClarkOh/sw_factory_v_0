- id: UC-24
  title: 사용자를 인증하고 권한을 확인한다
  actor: 사용자
  precondition: 교체 가능한 인증·권한 인터페이스가 설정되어 있다
  postcondition: 사용자가 인증되어 조회·거래·설정 변경·긴급 청산 권한 집합이 세션에 부여되어 있다
  main_flow:
  - step: 1. 사용자가 CLI 또는 웹에서 자격 증명으로 로그인한다
    event: LOGIN
  - step: 2. 시스템이 암호화된 연결로 자격 증명을 검증하고 권한 집합을 세션에 부여하며 로그인 이벤트를 기록한다
  - step: 3. 사용자가 명령을 요청한다
    event: SUBMIT_ORDER_COMMAND
  - step: 4. 시스템이 Command/API Gateway에서 명령에 필요한 권한(조회/거래/설정 변경/긴급 청산)을 확인하고 통과시킨다
  alt_flows:
  - step: 2a. 자격 증명이 잘못된 경우 시스템은 로그인을 거부하고 실패를 기록하며 자격 증명 값을 로그에 남기지 않는다
    event: LOGIN
  - step: 4a. 필요한 권한이 없는 경우 시스템은 명령을 거부하고 부족한 권한을 표시한다
  - step: 4b. 중요한 거래 또는 설정 변경으로 분류된 명령인 경우 시스템은 추가 확인 또는 재인증을 요구한다
    event: REAUTHENTICATE
  - step: 3a. 사용자가 로그아웃한 경우 시스템은 세션을 종료한다
    event: LOGOUT
  - step: 1a. 암호화되지 않은 연결로 접근한 경우 시스템은 연결을 거부한다
    event: LOGIN
  acceptance:
  - 미인증 요청에 대한 Command API 응답은 모두 거부다
  - 조회 권한만 가진 사용자의 주문·설정·긴급 청산 명령이 모두 거부된다
  - 4개 권한이 서로 독립적으로 부여·회수 가능하다
  - 외부 통신(Binance, 웹, CLI-엔진) 연결의 평문 프로토콜 사용이 0건이다
  - 중요 명령으로 분류된 명령이 재인증 이벤트 없이 실행된 경우가 0건이다
  - 인증 구현을 교체해도 Gateway 코드 변경 없이 설정만으로 동작한다
  requirements:
  - REQ-296
  - REQ-297
  - REQ-365
  - REQ-366
  - REQ-367
  - REQ-369
  - REQ-380
- id: UC-25
  title: 운영자가 시스템 설정을 변경한다
  actor: 운영자
  precondition: 운영자가 설정 변경 권한으로 인증되어 있다
  postcondition: 변경된 설정이 영구 저장되어 적용되고 변경 내역이 감사 기록으로 남아 있다
  main_flow:
  - step: 1. 운영자가 설정 항목(리스크 한도, 예산 정책, 긴급 정지 동작, 재시작 후 자동 재개, 데이터 보존 기간·수집 주기·interval,
      order book 저장 수준, 포지션 모드, 마진 모드, 자동화 주기, 전략·지표 파라미터, 알림 채널)과 값을 입력한다
    event: CHANGE_SETTING
  - step: 2. 시스템이 권한과 값의 형식·범위를 검증한다
  - step: 3. 시스템이 중요 설정인 경우 추가 확인을 요구한다
  - step: 4. 운영자가 확인한다
    event: CONFIRM_SETTING_CHANGE
  - step: 5. 시스템이 설정을 영구 저장소에 기록하고 변경 전후 값을 감사 기록으로 남기며 새 설정을 적용한다
  alt_flows:
  - step: 2a. 값이 형식 또는 범위를 벗어난 경우 시스템은 거부하고 허용 범위를 표시한다
  - step: 2b. 미정 사항(마진 모드, 포지션 모드, 한도값)이 설정되지 않은 경우 시스템은 임의 기본 규칙을 적용하지 않고 해당 기능을
      비활성 또는 거래 중단으로 유지하며 필요한 설정을 안내한다
  - step: 4a. 운영자가 확인하지 않은 경우 시스템은 변경을 폐기한다
    event: REJECT_SETTING_CHANGE
  - step: 1a. 운영자에게 설정 변경 권한이 없는 경우 시스템은 거부한다
    event: CHANGE_SETTING
  acceptance:
  - 모든 설정 변경마다 변경 전·후 값을 포함한 감사 레코드가 존재한다
  - 리스크 정책 11개 항목, 긴급 정지 동작, 자동 재개 여부, 보존 기간, order book 저장 수준, 마진 모드, 포지션 모드가 코드
    수정 없이 설정으로 변경 가능하다
  - 시스템 설정이 Transaction DB에 저장된다
  - 미설정 상태의 한도값에 대해 하드코딩된 기본 거래 규칙이 적용된 경우가 0건이다
  requirements:
  - REQ-112
  - REQ-188
  - REQ-195
  - REQ-201
  - REQ-220
  - REQ-228
  - REQ-290
  - REQ-328
  - REQ-337
  - REQ-342
  - REQ-367
  - REQ-371
  - REQ-378
  - REQ-379
  - REQ-382
- id: UC-26
  title: 모듈을 교체하고 파이프라인 단계를 비활성화한다
  actor: 개발자
  precondition: 지표·전략·리스크·예산·알림·거래소 어댑터가 인터페이스 뒤에 있고 모듈 경계가 분리되어 있다
  postcondition: 교체된 구현이 다른 모듈 수정 없이 동작하고, 비활성화된 단계는 건너뛰기로 기록된다
  main_flow:
  - step: '1. 개발자가 인터페이스를 구현한 새 모듈(예: 전략 플러그인)을 설정에 등록한다'
    event: REPLACE_MODULE
  - step: 2. 시스템이 인터페이스 적합성(필수 메서드, 입력·출력 데이터 모델)을 검사한다
  - step: 3. 시스템이 새 모듈을 로드해 기존 모듈을 대체하고 교체 사실을 감사 기록으로 남긴다
  - step: 4. 개발자가 특정 파이프라인 단계를 비활성화한다
    event: DISABLE_PIPELINE_STAGE
  - step: 5. 시스템이 이후 실행에서 해당 단계를 건너뛰고 건너뜀을 기록한다
  alt_flows:
  - step: 2a. 새 모듈이 인터페이스에 맞지 않는 경우 시스템은 로드를 거부하고 불일치 항목을 표시하며 기존 모듈을 유지한다
  - step: 3a. 새 모듈이 초기화 중 예외를 던진 경우 시스템은 해당 모듈만 격리하고 기존 모듈로 되돌리며 프로세스를 종료하지 않는다
  - step: 2b. 전략 모듈이 Binance 주문 API 또는 Trading Engine을 직접 참조하는 경우 시스템은 로드를 거부한다
  - step: 4a. 개발자가 단계를 다시 활성화한 경우 시스템은 다음 실행부터 해당 단계를 수행한다
    event: ENABLE_PIPELINE_STAGE
  - step: 1a. 구현 중 거래 정합성이나 안전성에 영향을 주는 모호한 사항을 발견한 경우 개발자는 임의 결정 대신 질문 목록으로 보고하고
      시스템은 해당 규칙을 설정 가능 항목으로 남긴다
    event: REPORT_OPEN_QUESTION
  acceptance:
  - 지표, 전략, 리스크, 예산, 알림 채널, 거래소 어댑터 각각에 인터페이스 정의가 존재하고 구현체는 인터페이스를 통해서만 참조된다 (정적 검사)
  - 각 모듈을 대체 구현으로 교체한 테스트에서 다른 모듈의 코드 변경이 0건이다
  - 파이프라인 10단계 각각을 비활성화한 실행에서 건너뜀 기록이 존재한다
  - 전략 모듈에서 거래소 API·Trading Engine 참조가 0건이다 (정적 검사)
  - 모든 외부 연동(Binance REST/WS, 알림 채널, secret 저장소)이 어댑터 인터페이스 뒤에 있다 (정적 검사)
  - User Interface, Command/API, Trading, Market Data, Strategy, Risk and Budget,
    Notification, Persistence, Binance Adapter 경계가 별도 패키지로 존재한다
  - 각 구현 단계 산출물에 acceptance criteria 문서가 함께 존재한다
  - 거래 상태 머신과 멱등성 테스트가 다른 기능 테스트보다 먼저 존재한다
  - 미정 사항이 코드 상수로 확정된 경우가 0건이며 질문 목록 문서가 존재한다
