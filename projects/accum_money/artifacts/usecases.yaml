- id: UC-19
  title: 불확실한 상태에서 안전 모드로 전환한다
  actor: Binance
  precondition: 시스템이 HEALTHY 상태이고 자동 거래가 활성화되어 있다
  postcondition: 신규 거래가 중단되어 있고 상태가 TRADING_PAUSED 또는 DEGRADED로 표시되며 조회·재동기화·허용 범위
    취소·긴급 정리·오류 로그 조회는 가능하다
  main_flow:
  - step: 1. Binance가 계정 상태 조회에 실패를 반환한다
    event: ACCOUNT_QUERY_FAILED
  - step: 2. 시스템이 계정 상태를 확인할 수 없음을 판정하고 신규 자동 거래를 중단하며 상태를 TRADING_PAUSED로 전환하고 감사
      기록과 자동 거래 중단 알림을 생성한다
  - step: 3. 시스템이 안전 모드에서 기존 포지션과 주문 상태 조회, Binance 재동기화, 허용 범위 주문 취소, 긴급 포지션 정리,
      시스템 상태·오류 로그 조회를 계속 제공한다
  - step: 4. Binance가 이후 계정 조회에 정상 응답한다
    event: ACCOUNT_STATE_RETURNED
  - step: 5. 시스템이 안전 조건을 모두 재확인하고 재개 정책에 따라 자동 거래를 재개하거나 운영자 확인을 기다린다
  alt_flows:
  - step: 1a. 포지션 조회 결과가 불일치하여 현재 포지션을 확정할 수 없는 경우 시스템은 2단계와 동일하게 전환한다
    event: ACCOUNT_STATE_RETURNED
  - step: 1b. 주문 결과가 설정된 시간 이상 불명확한 경우 시스템은 2단계와 동일하게 전환한다
    event: UNCERTAIN_ORDER_TIMEOUT
  - step: 1c. 시장 데이터가 stale 기준을 초과하거나 정합성이 깨진 경우 시스템은 2단계와 동일하게 전환한다
  - step: 1d. 시스템 시간과 거래소 시간의 차이가 허용 범위를 초과한 경우 시스템은 2단계와 동일하게 전환한다
    event: SERVER_TIME_RETURNED
  - step: 1e. 리스크 한도 또는 예산 한도를 계산할 수 없는 경우 시스템은 2단계와 동일하게 전환한다
  - step: 1f. 데이터베이스에 거래 상태를 기록할 수 없는 경우 시스템은 2단계와 동일하게 전환한다
  - step: 3a. 안전 모드 중 사용자가 신규 주문을 입력한 경우 시스템은 거래 중단 상태를 이유로 거부한다
    event: SUBMIT_ORDER_COMMAND
  - step: 3b. 안전 모드 중 사용자가 긴급 포지션 정리를 요청한 경우 시스템은 UC-06/UC-10 절차로 처리한다
    event: CLOSE_POSITION
  acceptance:
  - 각 트리거 조건(계정 확인 불가, 포지션 미확정, 주문 장시간 불명확, 데이터 stale, 시간차 초과, 한도 계산 불가, DB 기록 불가)
    발생 후 신규 자동 주문 건수가 0이다
  - 전환 후 시스템 상태 값이 TRADING_PAUSED 또는 DEGRADED다
  - 안전 모드에서 상태 조회, 재동기화, 주문·포지션 조회, 허용 범위 취소, 긴급 정리, 오류 로그 조회 명령이 모두 성공 응답을 반환한다
  - 안전 모드 전환마다 감사 레코드와 자동 거래 중단 알림이 존재한다
  - 안전 조건 미충족 상태에서 자동 거래가 재개된 경우가 0건이다
