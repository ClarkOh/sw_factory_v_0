usecases:
- id: UC-01
  title: 수동 신규 포지션 주문을 실행한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 인증되어 있고, 시스템 상태가 거래 중단·긴급 정지가 아니며, 실행 모드(PAPER/TESTNET/LIVE)가
    표시되어 있다
  postcondition: 명령이 command_id와 함께 영구 저장되어 최종 상태(ACKNOWLEDGED 이후 체결 추적 중 또는 REJECTED/CANCELED)에
    있고, 모든 단계가 감사 로그에 남아 있다
  main_flow:
  - step: 1. 사용자가 명령어 창에 신규 포지션 명령(symbol, LONG/SHORT, 주문 방식, 수량 또는 USDT 금액, 레버리지,
      가격 또는 가격 계산 방식, 선택적 손절·익절 조건)을 입력한다
    event: SUBMIT_ORDER_COMMAND
  - step: 2. 시스템이 명령 원문·사용자·인터페이스·접수 시각을 감사 기록으로 남기고, 고유 command_id를 발급해 RECEIVED
      상태로 영구 저장한 뒤 command_id를 표시한다
  - step: 3. 시스템이 문법·필수 항목·중복 명령 여부를 확인하고, 검증 규칙(지원 심볼, LONG/SHORT, 지원 주문 유형, 가격·수량,
      레버리지 범위, 잔고·증거금, 현재 포지션·주문 상태, tick/step size, 최소·최대 주문 조건, 최대 포지션·레버리지·일일 손실,
      시장 데이터 최신성, 거래 중단 여부)을 통과시켜 VALIDATED로 전이하고 검증 결과를 기록한다
  - step: 4. 시스템이 리스크 서비스와 예산 서비스의 규칙을 적용하고, 현재 bid/ask를 참고해 Binance 규칙(tick size,
      step size, 최소 수량, 최소 명목금액)에 맞게 가격·수량을 decimal로 보정한 뒤 APPROVED로 전이한다
  - step: 5. 시스템이 예상 주문 내용(보정된 가격·수량, 예상 명목금액, 레버리지, 손절·익절)을 사용자에게 제시한다
  - step: 6. 사용자가 예상 주문 내용을 승인한다
    event: CONFIRM_ORDER
  - step: 7. 시스템이 고유 client_order_id를 부여하고 전송 전 상태를 영구 저장한 뒤, Trading Engine이 Adapter를
      통해 내부 주문을 Binance Futures 주문 타입으로 변환·서명해 전송하고 SUBMITTED로 전이한다
  - step: 8. Binance가 주문 접수 응답을 반환한다
    event: ORDER_ACKNOWLEDGED
  - step: 9. 시스템이 ACKNOWLEDGED로 전이하고 전송 후 상태와 Binance 요청·응답을 영구 저장하며, 주문 접수 알림을 큐에
      넣고 결과를 CLI와 웹에 표시한다
  alt_flows:
  - step: 1a. 명령 문법이 틀리거나 필수 항목이 빠진 경우 시스템은 명령을 REJECTED로 기록하고 누락 항목을 포함한 실패 이유를 표시하며
      Binance로 전송하지 않는다
    event: SUBMIT_ORDER_COMMAND
  - step: 1b. 동일한 명령이 중복 접수된 경우 시스템은 새 command_id를 만들지 않고 기존 command_id와 상태를 반환하며
      Binance 주문을 생성하지 않는다
    event: SUBMIT_ORDER_COMMAND
  - step: 1c. 사용자에게 거래 권한이 없는 경우 시스템은 명령을 거부하고 권한 부족을 표시한다
    event: SUBMIT_ORDER_COMMAND
  - step: 3a. 검증 규칙 중 하나라도 실패한 경우 시스템은 명령을 REJECTED로 전이하고 실패한 규칙과 값을 사용자에게 표시하며 Binance로
      전송하지 않는다
  - step: 3b. 거래 중단 또는 긴급 정지 상태인 경우 시스템은 신규 주문 명령을 REJECTED로 전이하고 현재 시스템 상태를 이유로 표시한다
  - step: 4a. Risk Service가 거부한 경우 시스템은 사용자 입력이나 전략 판단과 관계없이 명령을 REJECTED로 전이하고 거부
      사유를 표시한다
  - step: 4b. 예산 서비스가 예산 초과로 판정한 경우 시스템은 명령을 REJECTED로 전이하고 배정 예산과 요청 금액을 표시한다
  - step: 6a. 사용자가 예상 주문을 거부한 경우 시스템은 명령을 CANCELED로 전이하고 Binance로 전송하지 않는다
    event: REJECT_ORDER_PREVIEW
  - step: 6b. 확인이 필요하지 않은 모드로 설정된 경우 시스템은 5~6단계를 생략하고 7단계로 진행한다
  - step: 8a. Binance가 주문을 거절한 경우 시스템은 REJECTED로 전이하고 Binance 오류 코드를 내부 오류 모델로 변환해
      사용자에게 표시한다
    event: ORDER_REJECTED
  - step: 8b. Binance 응답이 유실되거나 타임아웃된 경우 시스템은 같은 주문을 즉시 다시 생성하지 않고 UC-02 절차로 진입한다
    event: ORDER_RESPONSE_TIMEOUT
  - step: 9a. 명령에 손절·익절 조건이 포함된 경우 시스템은 진입 주문이 체결되기 전에는 보호 주문을 생성하지 않고 진입 주문과의 관계만
      기록한다
  acceptance:
  - 접수된 모든 명령은 시스템 내에서 유일한 command_id를 가진다 (중복 0건)
  - Binance로 전송된 모든 주문은 유일한 client_order_id를 가진다 (중복 0건)
  - 명령 상태 전이는 RECEIVED→VALIDATED→APPROVED→SUBMITTED→ACKNOWLEDGED→(FILLED|PARTIALLY_FILLED|CANCELED|REJECTED|EXPIRED)
    외의 전이가 0건이다
  - 검증에 실패한 명령에 대한 Binance 주문 요청 기록은 0건이고, 실패 이유 메시지가 사용자 응답에 포함된다
  - 동일 명령을 2회 이상 입력해도 Binance 주문 수는 1건이다
  - 전송 전 상태(SUBMITTED 직전)와 전송 후 상태 레코드가 영구 저장소에 모두 존재한다
  - 금액·수량 계산 코드에 부동소수점 타입 사용이 0건이다 (정적 검사)
  - 보정된 가격은 tick size의 정수배, 수량은 step size의 정수배이며 최소 수량·최소 명목금액 이상이다
  - Market, Limit, Stop Market, Stop Limit, Take Profit Market, Take Profit Limit,
    Trailing Stop, Post-only Limit, Reduce-only 주문 유형이 명령 입력에서 수용된다
  - quantity 또는 notional 중 하나만으로도 명령이 수용된다
  - Trading Engine 외 모듈에서 Binance 주문 API 호출이 0건이다 (정적 검사)
  - 명령어 창 코드는 Command API 외의 거래 엔진 내부 함수를 참조하지 않는다 (정적 검사)
  - Risk Service 거부 명령의 Binance 전송 기록은 0건이다
  requirements:
