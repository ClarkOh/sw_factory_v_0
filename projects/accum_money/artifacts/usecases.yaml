- id: UC-21
  title: 웹 대시보드에서 운영 현황을 조회한다
  actor: 사용자
  precondition: 사용자가 조회 권한으로 웹에 인증되어 있다
  postcondition: 요청한 화면이 Command/API Gateway를 통해 읽은 최신 데이터로 표시되어 있고 실행 모드가 항상 보인다
  main_flow:
  - step: 1. 사용자가 웹 대시보드에 접속한다
    event: OPEN_DASHBOARD
  - step: 2. 시스템이 Overview에 실행 모드, 시스템 실행 상태, Binance·WebSocket 연결 상태, 자동 거래 활성 상태,
      최근 데이터 수신 시각, 총자산, 투자자산, 사용 가능 잔고, 실현·미실현 손익을 표시한다
  - step: 3. 사용자가 Positions and Orders 화면을 선택한다
    event: SELECT_DASHBOARD_VIEW
  - step: 4. 시스템이 현재 포지션, 진입가·시장가·청산가, 레버리지, 손절·익절 상태, 미체결 주문, 최근 체결 내역을 표시한다
  - step: 5. 사용자가 Charts 화면을 선택한다
    event: SELECT_DASHBOARD_VIEW
  - step: 6. 시스템이 BTCUSDT 가격 차트에 주문·체결 위치와 손절·익절 가격을 표시하고 총자산·투자자산·손익 변화, 전략별 성과를
      표시한다
  - step: 7. 사용자가 Activity and Logs 화면을 선택한다
    event: SELECT_DASHBOARD_VIEW
  - step: 8. 시스템이 최근 사용자 명령, 전략 판단, 주문 상태 변화, 경고·오류, 복구 내역, 알림 전송 결과를 표시하고 Event Queue를
      통해 실시간 갱신한다
  alt_flows:
  - step: 2a. Binance 연결이 끊긴 경우 시스템은 연결 상태를 끊김으로 표시하고 마지막 알려진 값과 기준 시각을 표시한다
  - step: 1a. 미인증 사용자인 경우 시스템은 로그인 화면으로 보내고 데이터를 표시하지 않는다
    event: OPEN_DASHBOARD
  - step: 8a. 실시간 갱신 연결이 끊긴 경우 시스템은 화면에 갱신 중단을 표시하고 재연결을 시도한다
