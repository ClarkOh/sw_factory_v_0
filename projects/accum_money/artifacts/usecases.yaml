- id: UC-18
  title: Binance API 오류와 네트워크 장애를 처리한다
  actor: Binance
  precondition: 시스템이 Binance API 요청을 수행 중이다
  postcondition: 재시도 가능 오류는 정책대로 재시도되었고, 반복 실패 작업은 격리되어 운영자에게 알려졌으며, 명령어 창·상태 조회·긴급
    정지는 계속 동작한다
  main_flow:
  - step: 1. Binance가 API 오류 코드를 반환한다
    event: API_ERROR_RETURNED
  - step: 2. 시스템 Adapter가 오류 코드를 내부 오류 모델로 변환하고 재시도 가능·불가능으로 분류한다
  - step: 3. 시스템이 재시도 가능 오류에 대해 exponential backoff와 jitter로 제한된 횟수만큼 재시도하며 각 시도를
      감사 기록으로 남긴다
  - step: 4. Binance가 재시도에 정상 응답한다
    event: API_REQUEST_SUCCEEDED
  - step: 5. 시스템이 작업을 완료하고 복구 과정을 기록한다
  alt_flows:
  - step: 2a. 재시도 불가능 오류인 경우 시스템은 즉시 작업을 실패로 기록하고 사용자에게 변환된 오류를 표시하며 재시도하지 않는다
  - step: 1a. rate limit 초과 응답인 경우 시스템은 요청 속도를 제한하고 지정된 대기 시간 후 재시도한다
    event: RATE_LIMIT_EXCEEDED
  - step: 1b. 네트워크가 단절된 경우 시스템은 동일한 재시도 정책을 적용하고 Binance 연결 장애 알림을 큐에 넣으며 상태를 DEGRADED로
      표시한다
    event: NETWORK_UNREACHABLE
  - step: 4a. 재시도가 최대 횟수를 초과한 경우 시스템은 작업을 실패 격리 상태로 옮기고 운영자에게 알리며 다른 모듈은 계속 동작한다
    event: API_ERROR_RETURNED
  - step: 3a. 처리되지 않은 예외가 어느 모듈에서 발생한 경우 시스템은 해당 작업만 실패 처리하고 프로세스를 종료하지 않는다
  - step: 3b. 장애 진행 중 사용자가 명령어 창에서 상태 조회 또는 긴급 정지를 요청한 경우 시스템은 이를 정상 처리한다
    event: QUERY_SYSTEM_STATUS
  acceptance:
  - 재시도 불가능 오류에 대한 재요청 기록이 0건이다
  - 재시도 횟수가 설정 최대값을 초과한 경우가 0건이다
  - 재시도 간격은 직전 간격 이상이며 연속 동일값이 없다
  - 최대 횟수 초과 작업은 실패 격리 상태이고 운영자 알림 레코드가 존재한다
  - 한 모듈에 예외를 주입해도 프로세스가 종료되지 않고 다른 모듈의 처리 기록이 계속 생성된다
  - Binance 차단 중 명령어 창의 상태 조회와 긴급 정지 명령이 성공 응답을 반환한다
  - 각 장애 시나리오(API 오류, rate limit, 네트워크 단절)에 대한 자동화 테스트가 존재하고 통과한다
