- id: UC-20
  title: 실행 모드를 선택하고 LIVE 모드를 활성화한다
  actor: 운영자
  precondition: 운영자가 설정 변경 권한으로 인증되어 있고 API 자격 증명이 환경별 secret 저장소에 있다
  postcondition: 선택된 실행 모드가 CLI와 웹에 항상 표시되고, LIVE는 별도 설정과 명시적 확인이 모두 있을 때만 활성화되어 있다
  main_flow:
  - step: 1. 운영자가 실행 모드(PAPER/TESTNET/LIVE)를 선택한다
    event: SELECT_EXECUTION_MODE
  - step: 2. 시스템이 권한을 확인하고 선택 모드가 LIVE인 경우 별도 LIVE 활성화 설정이 켜져 있는지 확인한다
  - step: 3. 시스템이 LIVE 전환의 영향(실계좌 거래)을 표시하고 명시적 확인을 요구한다
  - step: 4. 운영자가 LIVE 활성화를 명시적으로 확인한다
    event: CONFIRM_LIVE_MODE
  - step: 5. 시스템이 secret 저장소에서 자격 증명을 읽어 실제 Binance 계정에 연결하고, 설정 변경을 감사 기록으로 남기며 CLI와
      웹에 LIVE 모드를 표시한다
  alt_flows:
  - step: 2a. LIVE 활성화 설정이 꺼져 있는 경우 시스템은 LIVE 전환을 거부하고 필요한 설정을 안내한다
  - step: 4a. 운영자가 확인하지 않은 경우 시스템은 이전 모드를 유지한다
    event: REJECT_LIVE_MODE
  - step: 1a. PAPER를 선택한 경우 시스템은 거래소 주문 없이 내부 모의 체결 엔진으로 주문을 처리하도록 전환한다
    event: SELECT_EXECUTION_MODE
  - step: 1b. TESTNET을 선택한 경우 시스템은 Binance 테스트넷 엔드포인트에 연결한다
    event: SELECT_EXECUTION_MODE
  - step: 1c. 운영자에게 설정 변경 권한이 없는 경우 시스템은 거부한다
    event: SELECT_EXECUTION_MODE
  - step: 5a. 시스템 시작 시 모드 설정이 없는 경우 시스템은 PAPER 또는 TESTNET을 기본값으로 사용한다
    event: SYSTEM_START
  acceptance:
  - 설정 없이 시작한 시스템의 실행 모드는 PAPER 또는 TESTNET이다
  - LIVE 활성화 설정 또는 확인 이벤트 중 하나라도 없이 LIVE로 전환된 경우가 0건이다
  - PAPER 모드에서 Binance 주문 API 호출 기록이 0건이고 모의 체결 레코드가 생성된다
  - TESTNET 모드의 모든 요청 호스트가 테스트넷 엔드포인트다
  - CLI 프롬프트와 웹 모든 화면에 실행 모드 문자열이 존재한다
  - 소스 코드와 설정 파일에 API Secret 평문이 0건이다 (정적 검사)
  - API Key 설정에 IP 제한이 적용되어 있고 출금 권한이 없음을 시작 시 확인·기록한다
  - PAPER/TESTNET 모드 테스트가 LIVE 기능 테스트보다 먼저 존재한다
