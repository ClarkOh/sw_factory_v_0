- id: UC-04
  title: 손절·익절을 설정하고 변경한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 인증되어 있고 대상 포지션이 존재한다
  postcondition: reduce-only 또는 close-position 보호 주문이 Binance에 존재하고 포지션·진입 주문과 연결되어
    기록되어 있으며 추적 중이다
  main_flow:
  - step: 1. 사용자가 대상 포지션과 손절·익절 조건(절대 가격, 진입가 대비 비율, 또는 예상 손익률)과 대상 수량(일부 또는 전체)을
      입력한다
    event: SET_PROTECTIVE_ORDER
  - step: 2. 시스템이 command_id를 발급하고 Binance에서 대상 포지션의 존재·방향·수량을 확인한다
  - step: 3. 시스템이 손절·익절 가격 방향이 포지션 방향에 유효한지 검증하고, 가격을 tick size에 맞게 보정하며 수량이 포지션 수량
      이하인지 확인한다
  - step: 4. 시스템이 예상 보호 주문 내용을 사용자에게 제시한다
  - step: 5. 사용자가 승인한다
    event: CONFIRM_ORDER
  - step: 6. 시스템이 reduce-only 또는 close-position 성격의 보호 주문을 고유 client_order_id로 Binance에
      전송한다
  - step: 7. Binance가 보호 주문 접수를 응답한다
    event: ORDER_ACKNOWLEDGED
  - step: 8. 시스템이 보호 주문 ID를 포지션·진입 주문과 연결해 기록하고 상태 추적을 시작하며, 손절·익절 생성을 감사 로그에 남기고
      결과를 표시한다
  alt_flows:
  - step: 2a. Binance에 대상 포지션이 없는 경우 시스템은 명령을 거부하고 이유를 표시하며 주문을 생성하지 않는다
  - step: '3a. 가격 방향이 무효한 경우(예: LONG 손절가가 현재가 이상) 시스템은 명령을 거부하고 유효 범위를 표시한다'
  - step: 3b. 요청 수량이 포지션 수량보다 큰 경우 시스템은 reduce-only 주문을 생성하지 않고 차단 이유를 표시한다
  - step: 1a. 사용자가 기존 손절·익절을 변경하는 경우 시스템은 기존 보호 주문 취소를 Binance에서 확인한 뒤 새 보호 주문을 생성하고
      관계 기록을 갱신한다
    event: MODIFY_PROTECTIVE_ORDER
  - step: 1b. 사용자가 손절·익절을 취소하는 경우 시스템은 보호 주문을 취소하고 Binance에서 취소를 확인한 뒤 감사 기록을 남긴다
    event: CANCEL_PROTECTIVE_ORDER
  - step: 7a. Binance가 보호 주문을 거절한 경우 시스템은 REJECTED로 기록하고 이유를 표시한다
    event: ORDER_REJECTED
  - step: 8a. 포지션 수량이 변경된 경우 시스템은 설정된 정책에 따라 보호 주문 수량을 조정한다
    event: POSITION_CHANGED
  - step: 8b. 포지션이 종료된 경우 시스템은 남아 있는 보호 주문을 취소한다
    event: POSITION_CLOSED
  - step: 8c. 보호 주문이 체결된 경우 시스템은 손절 또는 익절 실행 알림을 큐에 넣는다
    event: ORDER_FILLED
  acceptance:
  - 모든 보호 주문 레코드는 포지션 ID와 진입 주문 ID를 참조한다 (null 0건)
  - 생성된 보호 주문의 reduce-only 또는 close-position 플래그가 true다
  - 포지션 수량을 초과하는 보호 주문의 Binance 전송 기록은 0건이다
  - 포지션 종료 후 해당 포지션의 미체결 보호 주문 수는 0이다
  - 절대 가격·비율·손익률 세 입력 방식 모두 동일한 tick size 보정 가격으로 변환된다
  - 손절·익절 생성·변경·취소마다 감사 레코드가 1건 이상 존재한다
  requirements:
