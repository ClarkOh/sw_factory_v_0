- id: UC-09
  title: 자동 거래 파이프라인을 실행한다
  actor: 타이머
  precondition: 자동 거래가 활성화되어 있고 1개 이상의 전략 플러그인이 활성 상태다
  postcondition: 전략 판단이 감사 기록으로 남아 있고, 승인된 Trade Proposal은 수동 거래와 동일한 명령 흐름으로 처리되어
    상태가 추적되고 있다
  main_flow:
  - step: 1. 타이머가 설정된 자동화 주기에 도달했음을 알린다
    event: AUTOMATION_TICK
  - step: 2. 시스템이 정규화·검증된 시장 데이터를 읽고 최신성과 정합성을 확인한다 (Data Collection/Validation)
  - step: 3. 시스템이 교체 가능한 지표 모듈로 지표를 계산한다 (Indicator Calculation)
  - step: 4. 시스템이 활성 전략 플러그인을 실행해 전략 ID·버전, 입력 기준 시각, 사용 지표, 신호, 판단 근거, 제안 방향, 제안
      수량 또는 예산, 손절·익절 제안, 신뢰도, 만료 시각을 담은 Trade Proposal을 생성하고 감사 기록에 남긴다 (Signal Calculation)
  - step: 5. 시스템이 리스크를 계산하고 총자산·투자 가능 자산·전략별 예산을 사용 증거금, 예약 주문 금액, 실현·미실현 손익을 반영해
      배정하며 결과를 감사 기록에 남긴다 (Risk Calculation/Budget Allocation)
  - step: 6. 시스템이 Trade Proposal을 거래 명령으로 변환해 command_id를 발급하고 수동 거래와 동일한 검증·Risk
      Service 최종 검사·멱등성 규칙을 적용한다 (Trade Planning)
  - step: 7. 시스템이 Trading Engine을 통해 주문을 Binance에 전송한다 (Trade Execution)
  - step: 8. Binance가 주문 접수를 응답한다
    event: ORDER_ACKNOWLEDGED
  - step: 9. 시스템이 주문·포지션을 모니터링하고 알림을 큐에 넣으며 감사·보고 기록과 대시보드를 갱신한다 (Monitoring/Notification/Audit
      and Reporting)
  alt_flows:
  - step: 2a. 시장 데이터가 stale 기준을 초과했거나 order book이 불완전한 경우 시스템은 해당 데이터를 판단에 사용하지 않고
      신규 자동 거래를 중단해 TRADING_PAUSED로 전환하며 자동 거래 중단 알림을 큐에 넣는다
  - step: 2b. 계정 상태 확인 불가, 포지션 확정 불가, 시스템·거래소 시간차 허용 범위 초과, 리스크·예산 한도 계산 불가, DB 기록
      불가 중 하나라도 해당하면 시스템은 신규 자동 거래를 중단한다
  - step: 4a. 전략이 신호를 생성하지 않은 경우 시스템은 판단 근거만 기록하고 주문을 만들지 않는다
  - step: 4b. Trade Proposal의 만료 시각이 지난 경우 시스템은 이를 폐기하고 기록한다
  - step: 4c. 전략 플러그인이 예외를 던진 경우 시스템은 해당 전략만 격리하고 다른 전략과 모듈은 계속 실행하며 프로세스를 종료하지 않는다
  - step: 5a. Risk Service가 거부한 경우 시스템은 전략이 허용했더라도 주문을 실행하지 않고 거부 사유를 기록하며 리스크 한도
      초과 알림을 큐에 넣는다
  - step: 5b. 예산 초과인 경우 시스템은 주문을 차단하고 기록한다
  - step: 6a. 특정 파이프라인 단계가 비활성화된 경우 시스템은 해당 단계를 건너뛰고 건너뛴 사실을 기록한다
  - step: 6b. 신규 진입 중지 상태인 경우 시스템은 신규 진입 명령을 생성하지 않고 기존 포지션 관리(보호 주문 조정)만 수행한다
  - step: 8a. Binance가 거절한 경우 시스템은 REJECTED로 기록하고 거절 알림을 큐에 넣는다
    event: ORDER_REJECTED
  - step: 8b. 응답이 유실된 경우 시스템은 UC-02 절차를 수행한다
    event: ORDER_RESPONSE_TIMEOUT
  acceptance:
  - 모든 전략 출력 레코드에 전략 ID, 버전, 입력 기준 시각, 지표, 신호, 판단 근거, 제안 방향, 제안 수량 또는 예산, 손절·익절 제안,
    신뢰도, 만료 시각 필드가 존재한다
  - 전략 모듈 코드에서 Binance 주문 API 또는 Trading Engine 직접 호출이 0건이다 (정적 검사)
  - Risk Service가 거부한 Trade Proposal의 Binance 전송 기록이 0건이다
  - 자동 생성 명령의 검증·리스크·감사 레코드 구조가 수동 명령과 동일하다
  - stale 데이터 조건에서 신규 자동 주문 건수가 0이고 시스템 상태가 TRADING_PAUSED다
  - 전략 플러그인 예외 발생 후 프로세스가 살아 있고 다른 전략의 실행 기록이 계속 생성된다
  - 파이프라인 10단계 각각의 입력·출력 데이터 모델이 명시적으로 정의되어 있다 (타입 정의 존재)
  - 각 단계는 설정으로 개별 비활성화가 가능하고 비활성화 시 건너뜀 기록이 남는다
  - 지표·전략·리스크·예산·자동화 주기 값이 코드 상수가 아닌 설정 또는 인터페이스로 주입된다 (정적 검사)
