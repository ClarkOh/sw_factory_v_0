- id: UC-27
  title: 프로세스를 독립적으로 재시작한다
  actor: 프로세스 관리자
  precondition: Core Trading Service, Market Data Worker, Automation Worker, Notification
    Worker, Web API and Dashboard, Command Console가 별도 프로세스로 실행 중이다
  postcondition: 재시작된 프로세스가 복구되어 있고 다른 프로세스는 중단 없이 계속 동작했다
  main_flow:
  - step: '1. 프로세스 관리자가 한 프로세스(예: Notification Worker)를 재시작한다'
    event: RESTART_PROCESS
  - step: 2. 시스템의 다른 프로세스가 중단 없이 계속 동작하며 해당 프로세스 종료·시작을 감사 기록으로 남긴다
  - step: 3. 재시작된 프로세스가 자신의 미처리 작업을 큐에서 이어서 처리한다
  alt_flows:
  - step: 1a. 프로세스가 비정상 종료한 경우 프로세스 관리자가 자동으로 재시작하고 시스템은 재시작 사실을 기록한다
    event: PROCESS_CRASHED
  - step: 1b. Command Console(CLI)이 종료된 경우 거래 엔진은 계속 실행되고 진행 중 명령의 처리가 계속된다
    event: CLI_EXIT
  - step: 1c. Core Trading Service가 재시작된 경우 시스템은 UC-11 복구 절차를 수행하고 다른 워커는 계속 동작한다
    event: RESTART_PROCESS
  - step: 1d. Core Trading Service 인스턴스가 2개 이상 시작된 경우 시스템은 분산 락 또는 leader election으로
      하나만 주문 권한을 갖게 하고 나머지는 대기한다
    event: SYSTEM_START
  acceptance:
  - CLI 종료 후 거래 엔진 프로세스가 살아 있고 진행 중 명령이 최종 상태에 도달한다
  - 한 워커를 강제 종료해도 다른 프로세스의 처리 기록이 끊기지 않는다
  - 강제 종료된 프로세스가 설정 시간 내 자동 재시작된다
  - 2개 인스턴스 동시 실행 시 동일 command_id의 Binance 전송 기록이 1건이다
  - 프로세스 시작·종료·재시작마다 감사 레코드가 존재한다
  requirements:
  - REQ-015
  - REQ-016
  - REQ-113
  - REQ-292
  - REQ-294
  - REQ-356
  - REQ-357
  - REQ-358
  - REQ-359
  - REQ-360
