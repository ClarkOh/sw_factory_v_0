- id: UC-10
  title: 긴급 정지를 실행한다
  actor: 사용자
  precondition: 사용자가 거래 권한(포지션 청산 설정 시 긴급 청산 권한)으로 인증되어 있다
  postcondition: 신규 주문이 차단되어 있고 설정된 긴급 정지 동작(진입 주문 취소, 전체 미체결 취소, 포지션 유지 또는 청산)이 수행·기록되어
    있다
  main_flow:
  - step: 1. 사용자가 긴급 정지를 요청한다
    event: EMERGENCY_STOP
  - step: 2. 시스템이 권한을 확인하고 즉시 신규 주문 생성을 차단하며 시스템 상태를 TRADING_PAUSED로 전환하고 감사 기록을 남긴다
  - step: 3. 시스템이 설정된 긴급 정지 동작(신규 주문만 차단 / 미체결 진입 주문 취소 / 모든 미체결 주문 취소 / 기존 포지션 유지
      / 기존 포지션 시장가 청산)을 읽는다
  - step: 4. 시스템이 설정에 따라 취소 대상 주문을 Binance에 취소 요청한다
  - step: 5. Binance가 취소를 확인한다
    event: ORDER_CANCELED
  - step: 6. 시스템이 자동 거래 중단 알림을 큐에 넣고 처리 결과를 CLI와 웹에 표시한다
  alt_flows:
  - step: 3a. 설정이 기존 포지션 시장가 청산인 경우 시스템은 별도의 강한 확인을 요구하고 확인이 있을 때만 청산 주문을 전송한다
    event: CONFIRM_EMERGENCY_LIQUIDATION
  - step: 3b. 강한 확인이 없거나 긴급 청산 권한이 없는 경우 시스템은 신규 주문 차단과 주문 취소까지만 수행하고 포지션은 유지한다
  - step: 4a. Binance 장애 중인 경우 시스템은 취소 요청을 재시도 정책으로 재시도하며 긴급 정지 상태 자체는 즉시 적용한다
    event: API_ERROR_RETURNED
  - step: 5a. 취소 응답이 유실된 경우 시스템은 상태 조회로 최종 취소 여부를 확인한다
    event: ORDER_RESPONSE_TIMEOUT
  - step: 1a. 사용자에게 권한이 없는 경우 시스템은 요청을 거부한다
    event: EMERGENCY_STOP
  acceptance:
  - 긴급 정지 후 신규 주문 명령은 모두 REJECTED이고 Binance 전송 기록이 0건이다
  - 강한 확인 이벤트 없이 시장가 청산 주문이 전송된 경우가 0건이다
  - 긴급 정지 동작 설정값은 정의된 5개 옵션 조합 중 하나다
  - Binance 연결 실패 중에도 긴급 정지 명령이 접수되어 상태가 TRADING_PAUSED로 바뀐다
  - 긴급 정지 시 감사 레코드와 자동 거래 중단 알림 레코드가 각각 1건 이상 존재한다
