- id: UC-05
  title: 주문을 취소한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 인증되어 있고 미체결 주문이 1건 이상 있다
  postcondition: 취소 요청이 거래 트랜잭션으로 기록되어 있고 Binance에서 최종 취소가 확인되어 주문 상태가 CANCELED다
  main_flow:
  - step: 1. 사용자가 특정 주문 ID를 지정해 취소를 요청한다
    event: CANCEL_ORDER
  - step: 2. 시스템이 command_id를 발급해 취소 요청을 거래 트랜잭션으로 영구 저장하고 Binance에 취소를 전송한다
  - step: 3. Binance가 취소 확인을 반환한다
    event: ORDER_CANCELED
  - step: 4. 시스템이 주문을 CANCELED로 전이하고 감사 로그에 기록하며 결과를 표시한다
  alt_flows:
  - step: 1a. 사용자가 심볼의 모든 미체결 주문 취소를 요청한 경우 시스템은 각 주문에 대해 2~4단계를 수행하고 주문별 결과를 표시한다
    event: CANCEL_ALL_ORDERS
  - step: 1b. 존재하지 않는 주문 ID인 경우 시스템은 요청을 거부하고 이유를 표시한다
    event: CANCEL_ORDER
  - step: 3a. 주문이 이미 체결되어 취소가 실패한 경우 시스템은 취소 요청을 실패로 기록하고 현재 주문 상태를 표시한다
    event: ORDER_STATUS_RETURNED
  - step: 3b. 취소 응답이 유실된 경우 시스템은 client_order_id로 상태를 조회해 최종 취소 여부를 확인한 뒤 상태를 확정한다
    event: ORDER_RESPONSE_TIMEOUT
  - step: 2a. 거래 중단 상태인 경우 시스템은 설정된 허용 범위 내의 주문만 취소를 허용하고 범위 밖 주문은 거부한다
  acceptance:
  - 모든 취소 요청은 command_id를 가진 트랜잭션 레코드로 존재한다
  - Binance 취소 확인 없이 CANCELED로 전이된 주문이 0건이다
  - 일괄 취소 후 해당 심볼의 미체결 주문 수가 0이다
  - 거래 중단 상태에서 허용 범위 밖 주문 취소 요청은 거부 응답을 받는다
  requirements:
  - REQ-064
  - REQ-086
  - REQ-140
  - REQ-141
  - REQ-171
  - REQ-172
  - REQ-174
  - REQ-175
  - REQ-267
  - REQ-302
- id: UC-06
  title: 포지션을 전체 또는 일부 청산한다
  actor: 사용자
  precondition: 사용자가 거래 권한(전량 시장가 청산은 긴급 청산 권한)으로 인증되어 있고 포지션이 존재한다
  postcondition: reduce-only 청산 주문이 접수되어 추적 중이고 포지션 수량이 요청만큼 감소했으며 종료 시 남은 보호 주문이
    취소되어 있다
  main_flow:
  - step: 1. 사용자가 청산 대상 포지션, 수량(일부 또는 전체), 주문 방식(시장가/지정가)을 입력한다
    event: CLOSE_POSITION
  - step: 2. 시스템이 command_id를 발급하고 Binance에서 현재 포지션 수량을 확인해 요청 수량이 포지션 수량 이하인지 검증한다
  - step: 3. 시스템이 예상 청산 주문 내용을 제시한다
  - step: 4. 사용자가 승인한다
    event: CONFIRM_ORDER
  - step: 5. 시스템이 reduce-only 주문을 Binance에 전송한다
  - step: 6. Binance가 접수를 응답한다
    event: ORDER_ACKNOWLEDGED
  - step: 7. 시스템이 체결 추적을 시작하고 포지션 종료 시 남은 보호 주문을 취소하며 포지션 종료 알림을 큐에 넣는다
  alt_flows:
  - step: 2a. 요청 수량이 포지션 수량보다 큰 경우 시스템은 주문을 생성하지 않고 차단 이유와 현재 수량을 표시한다
  - step: 2b. 포지션이 존재하지 않는 경우 시스템은 요청을 거부한다
  - step: 3a. 전량 시장가 청산인 경우 시스템은 별도의 강한 확인 절차를 요구하고 확인이 없으면 전송하지 않는다
    event: CONFIRM_EMERGENCY_LIQUIDATION
  - step: 1a. 사용자에게 긴급 청산 권한이 없는 상태에서 전량 시장가 청산을 요청한 경우 시스템은 거부한다
    event: CLOSE_POSITION
  - step: 6a. Binance가 거절한 경우 시스템은 REJECTED로 기록하고 이유를 표시한다
    event: ORDER_REJECTED
  acceptance:
  - 포지션 수량 초과 reduce-only 주문의 Binance 전송 기록이 0건이다
  - 전량 시장가 청산은 강한 확인 이벤트 없이 전송된 경우가 0건이다
  - 포지션 종료 후 해당 포지션의 미체결 보호 주문 수가 0이다
  - 청산 주문 레코드의 reduce-only 플래그가 true다
  requirements:
  - REQ-007
  - REQ-046
  - REQ-065
  - REQ-138
  - REQ-139
  - REQ-168
  - REQ-229
  - REQ-366
- id: UC-07
  title: 계정·포지션·주문·시스템 상태를 조회한다
  actor: 사용자
  precondition: 사용자가 조회 권한으로 인증되어 있고 명령어 창이 가동 중이다
  postcondition: 요청한 정보가 기준 시각과 함께 표시되어 있다
  main_flow:
  - step: 1. 사용자가 잔고 조회를 요청한다
    event: QUERY_BALANCE
  - step: 2. 시스템이 USDT 지갑 잔고, 사용 가능 잔고, 사용 중 증거금, 계산된 총자산과 투자자산을 기준 시각과 함께 표시한다
  - step: 3. 사용자가 포지션 조회를 요청한다
    event: QUERY_POSITION
  - step: 4. 시스템이 포지션 방향·수량, 진입 평균가, 시장가·청산가, 미실현·실현 손익, 레버리지, 손절·익절 설정 상태를 표시한다
  - step: 5. 사용자가 미체결 주문 목록 또는 특정 주문을 조회한다
    event: QUERY_ORDERS
  - step: 6. 시스템이 주문 목록 또는 해당 주문의 상세와 상태를 표시한다
  - step: 7. 사용자가 command_id로 명령 처리 상태를 조회한다
    event: QUERY_COMMAND_STATUS
  - step: 8. 시스템이 명령의 현재 상태와 상태 이력을 표시한다
  - step: 9. 사용자가 시스템 상태를 조회한다
    event: QUERY_SYSTEM_STATUS
  - step: 10. 시스템이 HEALTHY/DEGRADED/TRADING_PAUSED/RECOVERING/FAILED 중 하나의 상태, 실행
      모드, Binance·WebSocket 연결 상태를 표시한다
  - step: 11. 사용자가 최근 오류 및 명령 결과를 조회한다
    event: QUERY_RECENT_ERRORS
  - step: 12. 시스템이 최근 오류 목록과 명령 결과를 표시한다
  alt_flows:
  - step: 2a. Binance 조회가 실패한 경우 시스템은 마지막으로 알려진 값과 그 기준 시각, DEGRADED 표시를 함께 반환하며 명령어
      창은 계속 동작한다
    event: QUERY_BALANCE
  - step: 4a. 거래 중단 또는 안전 모드 상태인 경우에도 시스템은 포지션·주문·상태 조회를 정상 처리한다
    event: QUERY_POSITION
  - step: 8a. 존재하지 않는 command_id인 경우 시스템은 오류를 표시한다
    event: QUERY_COMMAND_STATUS
  - step: 1a. 사용자에게 조회 권한이 없는 경우 시스템은 요청을 거부한다
    event: QUERY_BALANCE
  acceptance:
  - 시스템 상태 응답값은 HEALTHY, DEGRADED, TRADING_PAUSED, RECOVERING, FAILED 중 하나다
  - 모든 조회 응답에 실행 모드(PAPER/TESTNET/LIVE) 필드가 포함된다
  - TRADING_PAUSED 상태에서 잔고·포지션·주문·시스템 상태·오류 조회가 모두 성공 응답을 반환한다
  - Binance 연결 실패 중에도 명령어 창 조회 명령이 오류 없이 응답한다
  - 포지션 응답에 방향, 수량, 진입 평균가, 시장가, 청산가, 미실현 손익, 실현 손익, 레버리지, 손절·익절 상태 필드가 모두 존재한다
  - 잔고 응답에 지갑 잔고, 사용 가능 잔고, 사용 중 증거금, 총자산, 투자자산 필드가 모두 존재한다
