- id: UC-08
  title: 자동 거래를 시작·중지한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 인증되어 있고 시스템 상태가 FAILED가 아니다
  postcondition: 자동 거래 활성 상태가 요청대로 변경되어 표시되고 기존 손절·익절 주문은 유지되어 있다
  main_flow:
  - step: 1. 사용자가 자동 거래 시작을 요청한다
    event: START_AUTO_TRADING
  - step: 2. 시스템이 안전 조건(계정·포지션 확정, 시장 데이터 최신, 시간 동기, 리스크·예산 계산 가능, DB 기록 가능)을 확인하고
      자동 거래를 활성화해 상태를 표시하며 감사 기록을 남긴다
  - step: 3. 사용자가 자동 거래 중지를 요청한다
    event: STOP_AUTO_TRADING
  - step: 4. 시스템이 자동 거래를 비활성화하고 기존 손절·익절 주문은 유지한 채 자동 거래 중단 알림을 큐에 넣고 상태를 표시한다
  alt_flows:
  - step: 2a. 안전 조건이 하나라도 충족되지 않은 경우 시스템은 시작을 거부하고 미충족 조건을 표시한다
  - step: 1a. 사용자가 자동 거래 일시 중지를 요청한 경우 시스템은 신규 명령 생성을 멈추고 재개 전까지 상태를 유지한다
    event: PAUSE_AUTO_TRADING
  - step: 1b. 사용자가 신규 진입만 중지를 요청한 경우 시스템은 신규 진입 명령 생성을 멈추되 기존 포지션의 보호 주문 관리는 계속한다
    event: PAUSE_NEW_ENTRIES
  - step: 1c. 사용자가 신규 진입 재개를 요청한 경우 시스템은 안전 조건을 확인한 뒤 신규 진입을 재개한다
    event: RESUME_NEW_ENTRIES
  - step: 1d. 사용자가 특정 전략을 활성화 또는 비활성화한 경우 시스템은 해당 전략만 상태를 바꾸고 다른 전략에는 영향을 주지 않는다
    event: ENABLE_STRATEGY
  - step: 1e. 사용자가 특정 전략을 비활성화한 경우 시스템은 해당 전략의 Trade Proposal 생성을 멈춘다
    event: DISABLE_STRATEGY
  - step: 1f. 사용자에게 거래 권한이 없는 경우 시스템은 요청을 거부한다
    event: START_AUTO_TRADING
  acceptance:
  - 자동 거래 중지 전후 미체결 손절·익절 주문 수가 동일하다
  - 신규 진입 중지 상태에서 신규 진입 주문 생성 건수가 0이고 보호 주문 조정 건수는 0 이상이다
  - 안전 조건 미충족 시 시작 요청은 거부 응답을 반환하고 자동 거래 활성 상태는 false다
  - 비활성화된 전략의 Trade Proposal 생성 건수가 0이다
  - 시작·중지·일시 중지마다 감사 레코드가 1건 이상 존재한다
