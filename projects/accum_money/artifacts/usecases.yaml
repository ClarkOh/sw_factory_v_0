- id: UC-12
  title: Binance와 상태를 재동기화한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 인증되어 있다 (거래 중단 상태여도 가능)
  postcondition: 로컬 주문·포지션·계정 상태가 Binance 상태와 일치하고 차이는 reconciliation 기록으로 남아 있다
  main_flow:
  - step: 1. 사용자가 Binance 상태와 재동기화를 요청한다
    event: RESYNC_WITH_BINANCE
  - step: 2. 시스템이 command_id를 발급하고 Binance에 계정, 포지션, 미체결 주문, 최근 체결을 조회한다
  - step: 3. Binance가 조회 결과를 반환한다
    event: ACCOUNT_STATE_RETURNED
  - step: 4. 시스템이 로컬 상태와 비교해 차이를 reconciliation 기록으로 남기고 로컬 상태를 갱신하며 결과 요약을 표시한다
  alt_flows:
  - step: 3a. Binance 조회가 실패한 경우 시스템은 재동기화 실패와 이유를 표시하고 로컬 상태를 변경하지 않으며 신규 자동 거래를
      중단한다
    event: ACCOUNT_QUERY_FAILED
  - step: 4a. 차이가 없는 경우 시스템은 차이 0건임을 표시한다
  - step: 1a. 시스템이 TRADING_PAUSED 상태인 경우에도 시스템은 재동기화를 정상 수행한다
    event: RESYNC_WITH_BINANCE
  acceptance:
  - 재동기화 후 로컬 미체결 주문 집합과 Binance 미체결 주문 집합이 client_order_id 기준으로 동일하다
  - 차이가 있었던 항목마다 reconciliation 레코드가 1건 존재한다
  - TRADING_PAUSED 상태에서 재동기화 명령이 성공 응답을 반환한다
  - 조회 실패 시 로컬 상태 변경 레코드가 0건이다
  requirements:
  - REQ-025
  - REQ-042
  - REQ-054
  - REQ-062
  - REQ-092
  - REQ-285
  - REQ-286
- id: UC-13
  title: 끊어진 WebSocket 연결을 자동으로 재연결한다
  actor: Binance
  precondition: 시장 데이터 스트림 또는 User Data Stream이 연결되어 있다
  postcondition: 연결이 복구되어 데이터 수신이 재개되었고 끊긴 동안의 누락이 대조·보정되어 있다
  main_flow:
  - step: 1. Binance WebSocket 연결이 끊어진다
    event: WS_DISCONNECTED
  - step: 2. 시스템이 사용자 개입 없이 연결 상태를 끊김으로 표시하고 마지막 정상 수신 시각을 기록하며 exponential backoff와
      jitter로 재연결을 시도한다
  - step: 3. Binance가 재연결을 수락한다
    event: WS_CONNECTED
  - step: 4. 시스템이 구독을 복원하고 User Data Stream의 경우 REST 조회로 끊긴 동안의 주문·포지션 변화를 대조하며, order
      book은 snapshot부터 재구축하고 연결 상태를 정상으로 표시한다
  alt_flows:
  - step: 3a. 재연결이 실패한 경우 시스템은 제한된 횟수까지 간격을 늘려 재시도한다
    event: WS_CONNECT_FAILED
  - step: 3b. 재연결이 최대 횟수까지 실패한 경우 시스템은 DEGRADED로 전환하고 Binance 연결 장애·데이터 수집 장애 알림을
      큐에 넣으며 신규 자동 거래를 중단하되 계속 재시도한다
    event: WS_CONNECT_FAILED
  - step: 4a. 끊긴 시간이 데이터 stale 기준을 초과한 경우 시스템은 재연결 후 데이터가 최신이 될 때까지 자동 거래 판단에 사용하지
      않는다
  acceptance:
  - 연결 끊김 후 사용자 명령 없이 재연결 시도 기록이 존재한다
  - 재시도 간격은 직전 간격 이상이고 동일 값이 연속되지 않는다
  - 재연결 후 User Data Stream 누락 대조를 위한 REST 조회 기록이 1건 이상 존재한다
  - 재연결 최대 횟수 초과 시 시스템 상태가 DEGRADED이고 연결 장애 알림 레코드가 존재한다
  - WebSocket 재연결 시나리오 자동화 테스트가 존재하고 통과한다
  requirements:
  - REQ-018
  - REQ-019
  - REQ-020
  - REQ-021
  - REQ-213
  - REQ-237
  - REQ-238
  - REQ-248
  - REQ-309
  - REQ-396
- id: UC-14
  title: Order book을 구축하고 gap을 복구한다
  actor: Binance
  precondition: WebSocket depth 스트림 구독이 가능하고 REST snapshot 조회가 가능하다
  postcondition: 시퀀스가 연속된 최신 order book이 유지되고 있고 최신성 정보가 관리되고 있다
  main_flow:
  - step: 1. 시스템이 depth 스트림을 구독하고 REST로 초기 snapshot을 요청한다
  - step: 2. Binance가 snapshot을 반환한다
    event: DEPTH_SNAPSHOT_RETURNED
  - step: 3. Binance가 delta event를 전송한다
    event: DEPTH_DELTA_RECEIVED
  - step: 4. 시스템이 sequence 연속성을 확인하고 delta를 순서대로 적용하며 마지막 정상 수신 시각과 best bid/ask를
      갱신한다
  - step: 5. 시스템이 설정된 저장 수준에 따라 order book snapshot 또는 요약을 시계열 저장소에 기록한다
  alt_flows:
  - step: 3a. sequence gap 또는 순서 오류가 발견된 경우 시스템은 현재 order book을 폐기하고 불완전 상태로 표시한 뒤
      snapshot부터 다시 동기화한다
    event: DEPTH_DELTA_RECEIVED
  - step: 2a. snapshot 조회가 실패한 경우 시스템은 재시도 정책으로 재요청하고 그동안 order book을 불완전 상태로 표시한다
    event: DEPTH_SNAPSHOT_FAILED
  - step: 4a. 마지막 정상 수신 이후 stale 기준 시간이 지난 경우 시스템은 order book을 오래됨으로 표시하고 자동 거래 판단에서
      제외한다
  acceptance:
  - gap 주입 후 order book 상태가 불완전으로 바뀌고 새 snapshot 요청이 1건 이상 발생한다
  - 불완전 또는 오래됨 상태의 order book을 입력으로 사용한 전략 실행 기록이 0건이다
  - 적용된 모든 delta의 sequence는 직전 적용 sequence의 다음 값이다
  - order book 저장 수준이 설정으로 변경 가능하다
  - order book gap 시나리오 자동화 테스트가 존재하고 통과한다
  requirements:
  - REQ-202
  - REQ-203
  - REQ-208
  - REQ-209
  - REQ-210
  - REQ-211
  - REQ-212
  - REQ-213
  - REQ-214
  - REQ-312
  - REQ-374
  - REQ-379
  - REQ-397
- id: UC-15
  title: 실시간 시장 데이터를 수신하고 정규화한다
  actor: Binance
  precondition: WebSocket 연결이 정상이다
  postcondition: 정규화·검증된 시장 데이터가 시계열 저장소에 기록되고 최신 수신 시각이 갱신되어 있으며 전략은 정규화된 데이터만 읽는다
  main_flow:
  - step: 1. Binance가 trades/aggregate trades, mark price, kline update, best bid/ask
      메시지를 전송한다
    event: MARKET_DATA_RECEIVED
  - step: 2. 시스템이 원본 메시지를 내부 도메인 모델로 정규화하고 출처·데이터 시각·수집 시각을 붙여 검증한다
  - step: 3. 시스템이 미완성 캔들과 확정 캔들을 구분해 시계열 저장소에 기록하고 최근 데이터 수신 시각을 갱신한다
  - step: 4. 시스템이 정규화된 데이터를 Event Queue로 발행해 지표 계산·웹 실시간 갱신이 거래 실행 흐름과 분리되어 처리되게 한다
  alt_flows:
  - step: 2a. 메시지가 스키마 검증에 실패한 경우 시스템은 해당 메시지를 폐기하고 오류를 기록하며 프로세스를 종료하지 않는다
    event: MARKET_DATA_RECEIVED
  - step: 3a. 마지막 수신 이후 stale 기준 시간이 경과한 경우 시스템은 데이터를 오래됨으로 표시하고 신규 자동 거래를 중단한다
  - step: 3b. 시계열 저장소 기록이 실패한 경우 시스템은 데이터 수집 장애 알림을 큐에 넣고 재시도한다
  acceptance:
  - 전략 모듈 코드에서 Binance 원본 메시지 타입 참조가 0건이다 (정적 검사)
  - 저장된 모든 시장 데이터 레코드에 출처, 데이터 시각, 수집 시각 필드가 존재한다
  - kline 레코드에 확정 여부 필드가 존재하고 미완성 캔들이 확정 캔들로 잘못 저장된 경우가 0건이다
  - stale 기준 초과 시 신규 자동 주문 건수가 0이다
  - 잘못된 메시지 주입 후 프로세스가 살아 있고 이후 메시지가 정상 처리된다
  requirements:
  - REQ-009
  - REQ-057
  - REQ-081
  - REQ-200
  - REQ-204
  - REQ-205
  - REQ-206
  - REQ-250
  - REQ-312
  - REQ-313
  - REQ-343
  - REQ-347
- id: UC-16
  title: 과거 시장 데이터를 주기적으로 수집한다
  actor: 타이머
  precondition: 수집 주기, 대상 interval, 보존 기간이 설정되어 있다
  postcondition: 마지막 정상 수집 위치 이후의 kline·funding rate·mark price·index price·open interest
    데이터가 누락 없이 저장되어 있다
  main_flow:
  - step: 1. 타이머가 수집 주기에 도달했음을 알린다
    event: COLLECTION_TICK
  - step: 2. 시스템이 마지막 정상 수집 위치를 읽고 그 이후 구간을 Binance REST로 요청한다
  - step: 3. Binance가 kline(OHLC, volume, trade count), funding rate, mark price,
      index price, open interest 데이터를 반환한다
    event: HISTORICAL_DATA_RETURNED
  - step: 4. 시스템이 출처·데이터 시각·수집 시각을 붙여 확정 캔들과 미완성 캔들을 구분하고 동일 키는 병합해 시계열 저장소에 저장한 뒤
      마지막 정상 수집 위치를 갱신한다
  - step: 5. 시스템이 저장 구간의 누락을 탐지하고 누락 구간을 다시 요청한다
  - step: 6. 시스템이 보존 기간을 초과한 데이터를 설정에 따라 정리한다
  alt_flows:
  - step: 3a. Binance 요청이 실패한 경우 시스템은 재시도 정책으로 재시도하고 마지막 정상 수집 위치를 변경하지 않는다
    event: HISTORICAL_DATA_FAILED
  - step: 3b. 재시도가 모두 실패한 경우 시스템은 데이터 수집 장애 알림을 큐에 넣고 다음 주기에 같은 위치부터 재개한다
    event: HISTORICAL_DATA_FAILED
  - step: 4a. 이미 저장된 키와 중복된 데이터를 받은 경우 시스템은 동일 키로 병합하고 레코드 수를 늘리지 않는다
  - step: 2a. aggregate trades 수집이 설정으로 활성화된 경우 시스템은 같은 절차로 aggregate trades도 수집한다
  acceptance:
  - 동일 구간을 2회 수집해도 시계열 레코드 수가 증가하지 않는다
  - 임의로 삭제한 구간이 다음 수집 주기 후 다시 채워진다
  - 수집 실패 후 재개 시 요청 시작 위치가 마지막 정상 수집 위치와 같다
  - 설정된 각 interval마다 kline 레코드가 존재한다
  - 보존 기간 설정 변경 시 정리 대상 구간이 그에 따라 달라진다
  - 데이터 수집 실패 알림 레코드가 재시도 소진 시 1건 존재한다
  requirements:
