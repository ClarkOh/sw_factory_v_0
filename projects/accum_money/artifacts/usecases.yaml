- id: UC-02
  title: 응답이 불명확한 주문을 Binance 조회로 확정한다
  actor: Binance
  precondition: 주문이 SUBMITTED 상태로 영구 저장되어 있고 client_order_id가 부여되어 있다
  postcondition: 주문의 내부 상태가 Binance의 실제 상태와 일치하고, 차이가 있었다면 reconciliation 기록이 남아 있으며
    중복 주문이 없다
  main_flow:
  - step: 1. Binance가 주문 요청에 대한 응답을 정해진 시간 내에 반환하지 않는다
    event: ORDER_RESPONSE_TIMEOUT
  - step: 2. 시스템이 주문을 실패로 단정하지 않고 결과 불명확으로 기록하며 새 주문을 생성하지 않는다
  - step: 3. 시스템이 client_order_id로 Binance에 주문 상태 조회를 요청한다
  - step: 4. Binance가 해당 주문의 실제 상태를 반환한다
    event: ORDER_STATUS_RETURNED
  - step: 5. 시스템이 내부 상태와 Binance 상태를 대조해 차이를 reconciliation 기록으로 남기고 내부 상태를 Binance
      상태로 갱신한다
  - step: 6. 시스템이 복구 과정을 감사 로그에 기록하고 결과를 CLI와 웹에 표시한다
  alt_flows:
  - step: 4a. Binance에 해당 client_order_id 주문이 존재하지 않는 경우 시스템은 원 명령을 같은 client_order_id로
      재전송하며 새로운 client_order_id를 만들지 않는다
    event: ORDER_STATUS_RETURNED
  - step: 4b. 상태 조회 자체가 실패한 경우 시스템은 exponential backoff와 jitter를 적용해 제한된 횟수만큼 재조회한다
    event: ORDER_STATUS_QUERY_FAILED
  - step: 4c. 재조회가 최대 횟수를 초과해 실패한 경우 시스템은 주문을 실패 격리 상태로 옮기고 운영자에게 알리며 신규 자동 거래를 중단한다
    event: ORDER_STATUS_QUERY_FAILED
  - step: 2a. 결과 불명확 상태가 설정된 시간을 초과해 지속되는 경우 시스템은 신규 자동 거래를 중단하고 TRADING_PAUSED로 전환한다
    event: UNCERTAIN_ORDER_TIMEOUT
  acceptance:
  - 응답 유실 시나리오에서 Binance에 생성된 주문 수는 최대 1건이다
  - 타임아웃 직후 재전송 요청이 0건이고, 재전송 전에 client_order_id 조회 요청이 1건 이상 기록된다
  - 타임아웃된 주문의 상태가 조회 결과 없이 REJECTED 또는 FAILED로 전이된 경우가 0건이다
  - 내부 상태와 Binance 상태가 다른 경우 reconciliation 레코드가 1건 이상 생성된다
  - 재조회 간격은 직전 간격 이상이며 동일 간격이 연속 반복되지 않는다 (jitter)
  - 재조회 횟수는 설정된 최대 횟수를 초과하지 않는다
  - 설정된 불명확 지속 시간 초과 시 시스템 상태가 TRADING_PAUSED이고 신규 자동 주문이 0건이다
  requirements:
  - REQ-017
  - REQ-019
  - REQ-020
  - REQ-021
  - REQ-026
  - REQ-027
  - REQ-037
  - REQ-038
  - REQ-039
  - REQ-042
  - REQ-053
  - REQ-056
  - REQ-303
  - REQ-387
  - REQ-393
- id: UC-03
  title: 주문 체결·상태 변경 이벤트를 반영한다
  actor: Binance
  precondition: ACKNOWLEDGED 상태의 주문이 있고 User Data Stream이 연결되어 있다
  postcondition: 주문·체결·포지션 상태가 영구 저장소와 감사 로그에 반영되어 있고, 필요한 알림이 큐에 들어가 있다
  main_flow:
  - step: 1. Binance가 User Data Stream으로 주문 체결 이벤트를 전송한다
    event: ORDER_FILLED
  - step: 2. 시스템이 주문 상태를 FILLED로 전이하고 체결 내역과 포지션 변화를 영구 저장소와 감사 로그에 기록한다
  - step: 3. 시스템이 진입 주문에 연결된 손절·익절 조건이 있으면 체결 수량에 맞춰 보호 주문을 생성하고 관계를 기록한다
  - step: 4. 시스템이 체결 및 포지션 진입 알림을 큐에 넣고 결과를 CLI와 웹에 실시간 표시한다
  alt_flows:
  - step: 1a. 부분 체결 이벤트인 경우 시스템은 주문을 PARTIALLY_FILLED 상태로 두고 체결 수량과 잔량을 기록하며 계속 추적한다
    event: ORDER_PARTIALLY_FILLED
  - step: 1b. 취소 이벤트인 경우 시스템은 CANCELED로 전이하고 연결된 손절·익절 조건은 생성하지 않는다
    event: ORDER_CANCELED
  - step: 1c. 만료 이벤트인 경우 시스템은 EXPIRED로 전이하고 연결된 손절·익절 조건은 생성하지 않는다
    event: ORDER_EXPIRED
  - step: 1d. 거절 이벤트인 경우 시스템은 REJECTED로 전이하고 거절·실패 알림을 큐에 넣는다
    event: ORDER_REJECTED
  - step: 1e. 동일 이벤트를 반복 수신한 경우 시스템은 체결 내역·포지션·알림을 중복 생성하지 않는다
    event: ORDER_FILLED
  - step: 1f. 스트림 연결이 끊긴 경우 시스템은 UC-13으로 재연결하고 REST 조회로 누락 이벤트를 대조한다
    event: WS_DISCONNECTED
  - step: '2a. 이벤트가 내부 상태와 모순되는 경우(예: 내부 CANCELED인데 FILLED 수신) 시스템은 reconciliation
      절차를 수행하고 Binance 상태를 기준으로 갱신한다'
  - step: 2b. 영구 저장소 기록이 실패한 경우 시스템은 신규 자동 거래를 중단하고 이벤트를 재처리 큐에 남긴다
  acceptance:
  - 부분 체결 이벤트 후 주문 상태는 PARTIALLY_FILLED이며 FILLED가 아니다
  - 동일 이벤트를 2회 수신해도 체결 레코드 수와 알림 수는 1이다
  - 진입 주문이 REJECTED/CANCELED/EXPIRED인 경우 그에 연결된 보호 주문 생성 건수는 0이다
  - 체결 이벤트마다 체결 내역·포지션 변화·주문 상태 변경 감사 레코드가 각각 1건 이상 존재한다
  - 부분 체결 시나리오 자동화 테스트가 존재하고 통과한다
  requirements:
  - REQ-006
  - REQ-041
  - REQ-042
  - REQ-043
  - REQ-045
  - REQ-060
