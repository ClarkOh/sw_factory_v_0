- id: UC-22
  title: 웹 화면에서 거래 명령을 실행한다
  actor: 사용자
  precondition: 사용자가 거래 권한으로 웹에 인증되어 있다
  postcondition: 명령이 명령어 창과 동일한 Command API로 처리되어 처리 과정과 결과가 웹에 표시되어 있다
  main_flow:
  - step: 1. 사용자가 웹 Commands 화면에서 거래 명령을 입력한다
    event: SUBMIT_ORDER_COMMAND
  - step: 2. 시스템이 동일한 Command/API Gateway로 명령을 접수해 command_id를 발급하고 UC-01과 동일한 절차를
      수행하며 처리 과정을 단계별로 웹에 표시한다
  - step: 3. 사용자가 예상 주문을 승인한다
    event: CONFIRM_ORDER
  - step: 4. 시스템이 주문을 전송하고 최종 결과를 웹에 표시한다
  alt_flows:
  - step: 1a. 사용자가 주문 취소를 요청한 경우 시스템은 UC-05 절차로 처리한다
    event: CANCEL_ORDER
  - step: 1b. 사용자가 손절·익절 설정을 요청한 경우 시스템은 UC-04 절차로 처리한다
    event: SET_PROTECTIVE_ORDER
  - step: 1c. 사용자가 자동 거래 시작 또는 중지를 요청한 경우 시스템은 UC-08 절차로 처리한다
    event: START_AUTO_TRADING
  - step: 1d. 사용자가 긴급 정지를 요청한 경우 시스템은 UC-10 절차로 처리한다
    event: EMERGENCY_STOP
  - step: 2a. 검증에 실패한 경우 시스템은 실패 이유를 웹에 표시한다
  - step: 1e. 사용자에게 거래 권한이 없는 경우 시스템은 거부하고 이유를 표시한다
    event: SUBMIT_ORDER_COMMAND
  acceptance:
  - 웹과 CLI에서 동일 명령을 입력하면 동일한 Command API 엔드포인트가 호출된다 (호출 기록 비교)
  - 웹에서 접수된 명령의 감사 레코드에 인터페이스 값이 web으로 기록된다
  - 명령 처리 상태 변경마다 웹 표시 이벤트가 1건 이상 발생한다
  - 웹 코드에서 거래 엔진 내부 함수 직접 호출이 0건이다 (정적 검사)
  requirements:
  - REQ-004
  - REQ-097
  - REQ-100
  - REQ-153
  - REQ-266
  - REQ-267
  - REQ-268
  - REQ-269
  - REQ-270
  - REQ-271
  - REQ-295
  - REQ-296
  - REQ-301
- id: UC-23
  title: 감사 로그로 명령의 전체 흐름을 재구성한다
  actor: 운영자
  precondition: 운영자가 조회 권한으로 인증되어 있고 감사 로그 저장소에 접근 가능하다
  postcondition: 지정한 command_id 또는 correlation ID의 접수부터 최종 결과까지 전 과정이 시간순으로 제시되어 있다
  main_flow:
  - step: 1. 운영자가 command_id 또는 correlation ID로 감사 추적을 요청한다
    event: QUERY_AUDIT_TRAIL
  - step: 2. 시스템이 append-only 감사 로그에서 해당 ID의 명령 원문, 사용자·인터페이스, 접수 시각, 검증 결과, 리스크 계산,
      예산 배분, Binance 요청·응답, 주문 상태 변경, 체결, 포지션 변화, 손절·익절 변경, 전략 신호·근거, 오류·재시도·복구, 설정
      변경 이벤트를 시간순으로 조회한다
  - step: 3. 시스템이 인증 정보·개인정보 필드가 마스킹된 상태로 전체 흐름을 표시한다
  alt_flows:
  - step: 1a. 존재하지 않는 ID인 경우 시스템은 결과 없음을 표시한다
    event: QUERY_AUDIT_TRAIL
  - step: 2a. 누군가 기존 감사 레코드의 수정 또는 삭제를 시도한 경우 시스템은 이를 거부하고 시도 자체를 기록한다
    event: MODIFY_AUDIT_RECORD
  - step: 1b. 운영자에게 조회 권한이 없는 경우 시스템은 거부한다
    event: QUERY_AUDIT_TRAIL
  acceptance:
  - 무작위로 고른 완료 명령 100건에 대해 감사 로그만으로 RECEIVED부터 최종 상태까지 모든 전이가 복원된다
  - 감사 레코드 UPDATE/DELETE 시도가 오류를 반환하고 레코드 수가 변하지 않는다
  - 모든 감사 레코드에 command ID, correlation ID가 있고 Binance 관련 레코드에 client order ID가 있다
  - 로그·오류 메시지·테스트 출력 전체에서 API Key, Secret, 서명 값 문자열 검색 결과가 0건이다
  - 정의된 15종 이벤트 각각에 대해 감사 레코드 타입이 존재한다
  - Transaction DB, Time-Series Storage, Audit Log가 서로 다른 저장 영역(스키마 또는 저장소)에 있다
  - Transaction DB에 명령, 주문, 체결, 포지션, 계정 snapshot, 전략 실행, 리스크 결정, 예산 배정, 알림 상태, 시스템
    설정 테이블이 존재한다
  requirements:
